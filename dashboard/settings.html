<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Central — Settings</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1c1c1c; --mut:#6b6b6b; --line:#d9d9d4; --card:#fff; --acc:#2f6fed; --ok:#1a7f37; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141518; --fg:#e6e6e6; --mut:#9a9a9a; --line:#2c2e33; --card:#1c1e22; --acc:#6ea0ff; --ok:#56d364; --err:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; }
  header a { color:var(--acc); text-decoration:none; }
  header h1 { font-size:15px; margin:0; flex:1; }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; }
  .tab { padding:6px 12px; border:1px solid var(--line); border-radius:8px 8px 0 0; background:var(--card); color:var(--fg); cursor:pointer; }
  .tab.on { border-bottom-color:var(--bg); background:var(--bg); font-weight:600; }
  #banner { display:none; margin:10px 18px; padding:8px 12px; border:1px solid var(--err); color:var(--err); border-radius:8px; }
  #banner.show { display:block; }
  #pane { padding:10px 18px 60px; max-width:920px; }
  .cfg-note { color:var(--mut); margin:6px 0 12px; }
  .cfg-group { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 12px; }
  .cfg-group h3 { margin:0 0 6px; font-size:13px; }
  .cfg-row, .cfg-add, .conn-row, .conn-add { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .conn-main { flex:1; min-width:180px; }
  .cfg-in { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .cfg-in.sm { width:110px; } .cfg-in.md { width:200px; } .cfg-in.lg { flex:1; min-width:220px; }
  .btn { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  .btn:hover { border-color:var(--acc); } .del-btn { color:var(--err); }
  .btn:disabled { opacity:.45; cursor:not-allowed; border-color:var(--line); }
  .idtag { font:12px ui-monospace, monospace; padding:1px 6px; border:1px solid var(--line); border-radius:6px; color:var(--mut); }
  .conn-pill { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); }
  .conn-pill.on { color:var(--ok); border-color:var(--ok); } .conn-pill.off { color:var(--mut); }
  .conn-hint, .conn-user { color:var(--mut); }
  .cfg-status { color:var(--mut); font-size:12px; } .cfg-status.ok { color:var(--ok); } .cfg-status.err { color:var(--err); }
  .empty { color:var(--mut); }
  code { font:12px ui-monospace, monospace; }
</style>
</head>
<body>
<header><a href="/">← Grand Central</a><h1>Settings</h1></header>
<div class="tabs" id="tabs"></div>
<div id="banner"></div>
<div id="pane"></div>
<script>
(() => {
  'use strict';
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const rowVals = row => {
    const out = {};
    row.querySelectorAll('[data-f]').forEach(el => { out[el.dataset.f] = el.value; });
    return out;
  };
  const inp = (f, v, cls, ph) => `<input class="cfg-in ${cls||'md'}" data-f="${f}" value="${esc(v ?? '')}" placeholder="${esc(ph||f)}">`;
  function banner(msg) {
    const b = document.getElementById('banner');
    if (msg) { b.textContent = msg; b.classList.add('show'); } else b.classList.remove('show');
  }

  // E258: this device's pairing code (set on the board) rides on every write;
  // credential writes and approving agent Context need it server-side.
  function gcAuth() {
    try { const c = localStorage.getItem('gc2_dev_code'); return c ? { 'X-GC-Dev-Code': c } : {}; }
    catch (e) { return {}; }
  }

  // ---------- E51: Connections tab — sources & credentials ----------
  // The only screen that writes secrets (POST /connections -> config/.env,
  // atomic + chmod 600 + backup). Values are never shown back: each field is
  // "set / not set" with a masked hint, and editing means replacing. Live
  // Test where the service allows it (IMAP login, Anthropic/Granola).
  let CONN = null;
  async function loadConnections() {
    const res = await fetch('/connections', { cache: 'no-store' });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'failed');
    CONN = out;
    return out;
  }
  async function connPost(body, statusEl, okMsg) {
    if (statusEl) { statusEl.textContent = 'working…'; statusEl.className = 'cfg-status'; }
    try {
      const res = await fetch('/connections', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...gcAuth() },
        body: JSON.stringify(body),
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || out.message || 'rejected');
      if (statusEl) { statusEl.textContent = out.message || okMsg || 'done ✓'; statusEl.className = 'cfg-status ok'; }
      // A mutation returns fresh status — re-render so pills update.
      if (out.accounts || out.singles) { CONN = out; renderConnectionsTab(document.getElementById('pane')); }
      return out;
    } catch (err) {
      if (statusEl) { statusEl.textContent = err.message; statusEl.className = 'cfg-status err'; }
      return null;
    }
  }
  const connPill = on => on
    ? '<span class="conn-pill on">connected</span>'
    : '<span class="conn-pill off">not set</span>';

  async function renderConnectionsTab(p) {
    p.innerHTML = '<div class="empty" style="padding:16px 22px">Loading connections…</div>';
    try { await loadConnections(); }
    catch (err) { p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load connections — ${esc(err.message)}</div>`; return; }

    const gmailRows = (CONN.accounts || []).map(a => `
      <div class="conn-row">
        <div class="conn-main"><span class="idtag">${esc(a.slug)}</span> <span class="conn-user">${esc(a.user || '—')}</span></div>
        ${connPill(a.set)}
        <button class="btn del-btn" onclick="connRemoveGmail('${esc(a.slug)}', this)">Remove</button>
        <span class="cfg-status"></span>
      </div>`).join('') || '<div class="empty">No Gmail accounts configured.</div>';

    const single = (name, m) => `
      <div class="cfg-group" data-conn="${name}">
        <h3>${esc(m.label)} ${connPill(m.set)}${m.set && m.hint ? ` <span class="conn-hint">${esc(m.hint)}</span>` : ''}</h3>
        <div class="cfg-note" style="margin:2px 0 8px">${esc(m.note || '')}</div>
        <div class="cfg-add">
          <input class="cfg-in lg" data-conn-val type="password" autocomplete="off"
                 placeholder="${m.set ? 'paste a new value to replace' : (m.islist ? 'comma-separated ICS URLs' : 'paste value')}">
          ${m.testable ? `<button class="btn" onclick="connTestSingle('${name}', this)">Test</button>` : ''}
          <button class="btn" onclick="connSaveSingle('${name}', this)">Save</button>
          ${m.set ? `<button class="btn del-btn" onclick="connClearSingle('${name}', this)">Clear</button>` : ''}
          <span class="cfg-status"></span>
        </div>
      </div>`;

    const S = CONN.singles || {};
    // Known keys first in a stable order, then any other key the server
    // offers — a hardcoded list here is how the Jev key (E210) went missing.
    const known = ['anthropic', 'jev', 'granola', 'calendar'];
    const singleOrder = [...known, ...Object.keys(S).filter(n => !known.includes(n)).sort()];
    p.innerHTML = `
      <div class="cfg-note">Sources &amp; credentials. Writes go only to <code>config/.env</code> (backed up, chmod 600) and take effect on the next sweep (mail ~3 min). Values are never shown back — to change one, paste a new value. Behind Cloudflare Access.</div>

      <div class="cfg-group">
        <h3>Gmail accounts</h3>
        <div class="cfg-note" style="margin:2px 0 10px">Each account needs a Google <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">app password</a> (2-Step Verification must be on). Adding one writes two <code>.env</code> keys; the sweeper picks it up next cycle.</div>
        ${gmailRows}
        <div class="conn-add">
          <input class="cfg-in md" id="conn-gm-email" type="email" autocomplete="off" placeholder="you@gmail.com">
          <input class="cfg-in md" id="conn-gm-pw" type="password" autocomplete="off" placeholder="16-char app password">
          <input class="cfg-in sm" id="conn-gm-label" autocomplete="off" placeholder="label (optional)">
          <button class="btn" onclick="connTestGmail(this)">Test</button>
          <button class="btn" onclick="connAddGmail(this)">Add account</button>
          <span class="cfg-status"></span>
        </div>
      </div>

      ${singleOrder.filter(n => S[n]).map(n => single(n, S[n])).join('')}
    `;
  }

  function connGmailFields(btn) {
    const box = btn.closest('.conn-add');
    return {
      email: box.querySelector('#conn-gm-email').value.trim(),
      password: box.querySelector('#conn-gm-pw').value,
      label: box.querySelector('#conn-gm-label').value.trim(),
      st: box.querySelector('.cfg-status'),
    };
  }
  async function connTestGmail(btn) {
    const f = connGmailFields(btn);
    await connPost({ action: 'test_gmail', email: f.email, password: f.password }, f.st);
  }
  async function connAddGmail(btn) {
    const f = connGmailFields(btn);
    if (!f.email || !f.password) { f.st.textContent = 'email + app password required'; f.st.className = 'cfg-status err'; return; }
    await connPost({ action: 'add_gmail', email: f.email, password: f.password, label: f.label }, f.st);
  }
  async function connRemoveGmail(slug, btn) {
    if (!confirm(`Remove the '${slug}' account? Its credentials are deleted from config/.env (a backup is kept). Synced mail already on the board stays until it ages out.`)) return;
    await connPost({ action: 'remove_gmail', slug }, btn.parentNode.querySelector('.cfg-status'));
  }
  function connSingleVal(btn) {
    const box = btn.closest('.cfg-add');
    return { val: box.querySelector('[data-conn-val]').value, st: box.querySelector('.cfg-status') };
  }
  async function connTestSingle(name, btn) {
    const { val, st } = connSingleVal(btn);
    await connPost({ action: 'test_single', name, value: val }, st);
  }
  async function connSaveSingle(name, btn) {
    const { val, st } = connSingleVal(btn);
    if (!val.trim()) { st.textContent = 'paste a value first'; st.className = 'cfg-status err'; return; }
    await connPost({ action: 'set_single', name, value: val }, st);
  }
  async function connClearSingle(name, btn) {
    if (!confirm(`Clear ${name}? The source stops on the next sweep. A backup of config/.env is kept.`)) return;
    await connPost({ action: 'clear_single', name }, btn.parentNode.querySelector('.cfg-status'));
  }

  // ---------- E19: Context tab — Bart's rules/notes corpus ----------
  // The beginning of durable context: label meanings, people notes, voice
  // preferences, automation ideas. Stored in the DB; nothing consumes an
  // entry automatically — future automations / prompt grounding / reply
  // suggestions will opt in by kind, deliberately.

  let CTX = null;

  async function renderContextTab(p) {
    p.innerHTML = '<div class="empty" style="padding:16px 22px">Loading context…</div>';
    try {
      const res = await fetch('/context', { cache: 'no-store' });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'failed');
      CTX = out.context || [];
    } catch (err) {
      p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load context — ${esc(err.message)}</div>`;
      return;
    }
    const kindSel = (v, df) => `<select class="cfg-in sm" data-f="kind" ${df || ''}>${
      ['note', 'rule', 'voice', 'automation'].map(k =>
        `<option ${k === v ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
    const byScope = {};
    CTX.forEach(c => (byScope[c.scope] = byScope[c.scope] || []).push(c));
    p.innerHTML = `
      <div class="cfg-note">Context — durable statements about how your world works: what a label means,
        who a person is, how you like replies written, automations you want someday. This corpus will feed
        automations and reply suggestions as those get built — nothing acts on an entry yet. Scope
        examples: <b>global</b>, <b>account:personal</b>, <b>label:_VIPs</b>, <b>person:chris@example.com</b>.
        Older <b>project:</b> / <b>goal:</b> notes are kept as written.</div>
      <div id="docs"><div class="empty">Loading documents…</div></div>
      <div class="cfg-group"><h3>Add context</h3>
        <div class="cfg-add">
          ${inp('scope', 'global', 'md', 'scope — global, account:X, label:X, person:X')}
          ${kindSel('note')}
          ${inp('text', '', 'lg', 'the statement — e.g. label:_VIPs threads are platform-invite targets')}
          <button class="btn" onclick="ctxAdd(this)">Add</button><span class="cfg-status"></span>
        </div>
      </div>` +
      Object.entries(byScope).sort(([a], [b]) => a.localeCompare(b)).map(([scope, rows]) =>
        `<div class="cfg-group"><h3>${esc(scope)}</h3>` + rows.map(c =>
          `<div class="cfg-row" data-row data-ctxid="${c.id}">
            <span class="idtag">#${c.id} ${esc(c.kind)}</span>
            ${inp('text', c.text, 'lg')}
            ${kindSel(c.kind)}
            <button class="btn" onclick="ctxSave(${c.id}, this)">Save</button>
            <button class="btn${c.active ? '' : ' del-btn'}" onclick="ctxToggle(${c.id}, ${c.active ? 0 : 1}, this)"
              title="${c.active ? 'Pause — kept but ignored by consumers' : 'Reactivate'}">${c.active ? 'Active ✓' : 'Paused'}</button>
            <button class="btn del-btn" onclick="ctxDelete(${c.id}, this)">Delete</button>
            <span class="cfg-status"></span>
          </div>`).join('') + `</div>`).join('') +
      (CTX.length ? '' : '<div class="empty" style="padding:12px 22px">No context yet — add the first statement above.</div>');
    renderDocs(document.getElementById('docs'));
  }

  // ---------- E259: context documents — a pasted or uploaded brief per
  // account or project. Ask, project Ask and reply drafts read the ones in
  // use. The file is read here in the browser; only its text is saved.
  let DOCS = [], DOC_SCOPES = [];
  async function renderDocs(host) {
    try {
      const [d, a, pj] = await Promise.all(['/context/docs', '/accounts', '/projects']
        .map(u => fetch(u, { cache: 'no-store' }).then(r => r.json())));
      DOCS = d.docs || [];
      DOC_SCOPES = [...(a.accounts || []).map(x => ['account:' + x, 'Account · ' + x]),
                    ...(pj.projects || []).map(x => ['project:' + x.id, 'Project · ' + x.name + (x.status === 'done' ? ' (done)' : '')])];
    } catch (err) { host.innerHTML = `<div class="empty">Could not load documents — ${esc(err.message)}</div>`; return; }
    const label = sc => (DOC_SCOPES.find(x => x[0] === sc) || [sc, sc])[1];
    host.innerHTML = `<div class="cfg-group"><h3>Context documents</h3>
      <div class="cfg-note" style="margin:0 0 8px">A longer brief for one account or one project: who you work with, the rules,
        the voice. Paste it or load a Markdown/text file (up to 100k characters). Ask reads the documents of the account
        you are looking at, a project's Ask reads the project's and its accounts', and reply drafts read the account's.
        Agents (OpenClaw) never see them.</div>
      <div class="cfg-add" id="doc-form">
        <select class="cfg-in md" id="doc-scope">${DOC_SCOPES.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>
        <input class="cfg-in lg" id="doc-title" placeholder="Title — e.g. ConnectBlue context (Sep 30)">
        <input type="file" id="doc-file" accept=".md,.markdown,.txt,text/markdown,text/plain" onchange="docFile(this)">
      </div>
      <textarea class="cfg-in" id="doc-body" rows="8" style="width:100%" placeholder="Paste the context here, or load a file above"></textarea>
      <div class="cfg-add"><button class="btn" id="doc-save" onclick="docSave(this)">Add document</button>
        <button class="btn" onclick="docReset()">Clear</button><span class="cfg-status" id="doc-st"></span></div>
      ${DOCS.map(x => `<div class="cfg-row"><span class="idtag">${esc(label(x.scope))}</span>
          <span class="conn-main"><b>${esc(x.title)}</b> <span class="conn-hint">${x.chars < 1000 ? x.chars + ' chars' : (x.chars / 1000).toFixed(1) + 'k chars'}${x.filename ? ' · ' + esc(x.filename) : ''}</span></span>
          <button class="btn" onclick="docEdit(${x.id})">Edit</button>
          <button class="btn${x.active ? '' : ' del-btn'}" onclick="docPost({action:'update',id:${x.id},fields:{active:${x.active ? 0 : 1}}})">${x.active ? 'In use ✓' : 'Off'}</button>
          <button class="btn del-btn" onclick="docDel(${x.id}, this)">Delete</button></div>`).join('') ||
        '<div class="empty">No documents yet.</div>'}
    </div>`;
  }
  let DOC_EDIT = 0, DOC_FILE = null;
  function docReset() { DOC_EDIT = 0; DOC_FILE = null; ['doc-title', 'doc-body'].forEach(i => { document.getElementById(i).value = ''; });
    document.getElementById('doc-scope').disabled = false; document.getElementById('doc-save').textContent = 'Add document'; }
  function docFile(inp) {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { document.getElementById('doc-body').value = String(rd.result || ''); DOC_FILE = f.name;
      const t = document.getElementById('doc-title'); if (!t.value.trim()) t.value = f.name.replace(/\.(md|markdown|txt)$/i, '').replace(/[_-]+/g, ' '); };
    rd.readAsText(f);
  }
  async function docEdit(id) {
    try {
      const d = (await fetch('/context/docs?id=' + id).then(r => r.json())).doc;
      DOC_EDIT = id; DOC_FILE = d.filename;
      document.getElementById('doc-scope').value = d.scope; document.getElementById('doc-scope').disabled = true;
      document.getElementById('doc-title').value = d.title; document.getElementById('doc-body').value = d.body;
      document.getElementById('doc-save').textContent = 'Save changes';
      document.getElementById('doc-form').scrollIntoView({ behavior: 'smooth' });
    } catch (err) { banner('Could not open the document — ' + err.message); }
  }
  async function docPost(body) {
    try {
      const out = await fetch('/context/docs', { method: 'POST', headers: { 'Content-Type': 'application/json', ...gcAuth() },
                                                 body: JSON.stringify(body) }).then(r => r.json());
      if (!out.ok) throw new Error(out.error || 'rejected');
      DOC_EDIT = 0; renderDocs(document.getElementById('docs'));
      return out;
    } catch (err) { banner('Context document — ' + err.message); throw err; }
  }
  async function docSave(btn) {
    const title = document.getElementById('doc-title').value.trim(), body = document.getElementById('doc-body').value;
    const st = document.getElementById('doc-st');
    if (!body.trim()) { st.textContent = 'Paste or load some text first.'; return; }
    if (body.length > 100000) { st.textContent = `${body.length} characters — 100k at most.`; return; }
    btn.disabled = true;
    try {
      if (DOC_EDIT) await docPost({ action: 'update', id: DOC_EDIT, fields: { title, body } });
      else await docPost({ action: 'add', scope: document.getElementById('doc-scope').value, title, body, filename: DOC_FILE || undefined });
    } catch (err) { /* banner shown */ }
    btn.disabled = false;
  }
  function docDel(id, btn) {
    if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'Sure?';
      setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Delete'; }, 3000); return; }
    docPost({ action: 'delete', id }).catch(() => {});
  }

  async function ctxPost(body) {
    const res = await fetch('/context', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...gcAuth() },
      body: JSON.stringify(body),
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'context action failed');
    return out;
  }
  async function ctxAdd(btn) {
    const box = btn.closest('.cfg-add');
    const vals = rowVals(box);
    try {
      await ctxPost({ action: 'add', scope: vals.scope, kind: vals.kind, text: vals.text });
      renderContextTab(document.getElementById('pane'));
    } catch (err) { banner('Context add failed — ' + err.message); }
  }
  async function ctxSave(id, btn) {
    const row = btn.closest('[data-row]');
    const vals = rowVals(row);
    try {
      await ctxPost({ action: 'update', id, fields: { text: vals.text, kind: vals.kind } });
      btn.textContent = 'Saved ✓'; setTimeout(() => { btn.textContent = 'Save'; }, 1500);
    } catch (err) { banner('Context save failed — ' + err.message); }
  }
  async function ctxToggle(id, active, btn) {
    try {
      await ctxPost({ action: 'update', id, fields: { active } });
      renderContextTab(document.getElementById('pane'));
    } catch (err) { banner('Context toggle failed — ' + err.message); }
  }
  async function ctxDelete(id, btn) {
    if (btn.dataset.armed) {
      try {
        await ctxPost({ action: 'delete', id });
        renderContextTab(document.getElementById('pane'));
      } catch (err) { banner('Context delete failed — ' + err.message); }
      return;
    }
    btn.dataset.armed = '1'; btn.textContent = 'Sure?';
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Delete'; }, 3000);
  }

  // ---------- E209: Classification — team roster + per-account Jev ----------
  // Who counts as a teammate and which domains are one company decides the
  // "relationship" and "waiting on a teammate" fields. The roster is who
  // someone IS, shared by every account; no email crosses accounts. Each
  // account's Jev switch is off until turned on here (§6, 2026-09-26), and
  // can't turn on before a Jev key is saved in Connections.
  async function clsPost(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'working…'; statusEl.className = 'cfg-status'; }
    try {
      const res = await fetch('/classify', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify(body) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'rejected');
      renderClassificationTab(document.getElementById('pane'));
      return out;
    } catch (err) {
      if (statusEl) { statusEl.textContent = err.message; statusEl.className = 'cfg-status err'; }
      return null;
    }
  }
  async function renderClassificationTab(p) {
    let d;
    try {
      d = await (await fetch('/classify/settings', { cache: 'no-store' })).json();
      if (!d.ok) throw new Error(d.error || 'failed');
    } catch (err) { p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load — ${esc(err.message)}</div>`; return; }
    // E212: a group holds domains AND people — anyone in it is "company";
    // a teammate may belong to a group or stand alone.
    const groups = {};
    const g = n => (groups[n] = groups[n] || { domains: [], people: [] });
    d.groups.forEach(x => g(x.grp).domains.push(x.domain));
    // 2026-09-30 (Bart: "several people who are part of multiple accounts -
    // companies"): a person can be in several groups and is listed under each.
    const groupsOf = x => (x.groups && x.groups.length) ? x.groups : (x.grp ? [x.grp] : []);
    d.people.forEach(x => groupsOf(x).forEach(n => g(n).people.push(x)));
    const loners = d.people.filter(x => !groupsOf(x).length);
    const personRow = (x, here) => { const others = groupsOf(x).filter(n => n !== here);
      return `<div class="cfg-row"><span class="conn-main">${esc(x.name || '')} <span class="conn-user">${esc(x.email)}</span>
        ${x.teammate ? '<span class="conn-pill on">teammate</span>' : ''}
        ${others.length ? `<span class="conn-user">also in ${esc(others.join(', '))}</span>` : ''}</span>
        <input class="cfg-in sm" list="cls-grps" value="" placeholder="${here ? 'Another group…' : 'A group…'}" title="Type or pick a group, then Move or Also add"
          onkeydown="if(event.key==='Enter')this.nextElementSibling.nextElementSibling.click()">
        <button class="btn" title="${here ? 'Out of ' + esc(here) + ', into the group typed' : 'Into the group typed'}" onclick="clsMove('${esc(x.email)}', this.previousElementSibling.value, ${x.teammate}, this, '${esc(here || '')}')">Move</button>
        <button class="btn" title="Keep their current groups and add the one typed" onclick="clsAlso('${esc(x.email)}', this.previousElementSibling.previousElementSibling.value, ${x.teammate}, this)">Also add</button>
        <button class="btn" onclick="clsMate('${esc(x.email)}',${!x.teammate})">${x.teammate ? 'Not a teammate' : 'Make teammate'}</button>
        ${here && (others.length || x.teammate) ? `<button class="btn del-btn" title="Out of ${esc(here)} only" onclick="clsLeave('${esc(x.email)}','${esc(here)}')">Leave group</button>` : ''}
        <button class="btn del-btn" title="Off the roster entirely" onclick="clsDel('person','${esc(x.email)}')">Remove</button></div>`; };
    p.innerHTML = `
      <p class="cfg-note">Grand Central classifies each email: its type, who the sender is to you, whether to respond, who you're waiting on, and when to follow up. These settings decide who counts as your company and your team.</p>
      <datalist id="cls-grps">${Object.keys(groups).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      ${Object.entries(groups).map(([name, gr]) => `
      <div class="cfg-group"><h3>${esc(name)}</h3>
        <div class="cfg-row">${gr.domains.map(dm => `<span class="idtag">${esc(dm)}</span><button class="btn del-btn" onclick="clsDel('group','${esc(dm)}')" title="Remove ${esc(dm)}">✕</button>`).join(' ') || '<span class="empty">No domains — only the people below.</span>'}</div>
        ${gr.people.map(x => personRow(x, name)).join('')}
      </div>`).join('') || '<div class="cfg-group"><h3>Company groups</h3><div class="empty">No groups yet. Add a domain or a person below, e.g. ConnectBlue, Capitol Influence and Northwind Media in one group.</div></div>'}
      <div class="cfg-group"><h3>Add to a group</h3>
        <div class="cfg-note">Everyone at a domain, or one person by address, counts as your company. Teammates' threads you're waiting on follow up after 2 business days.</div>
        <div class="cfg-add" id="cls-grp">${inp('group', Object.keys(groups)[0] || '', 'md', 'Group name').replace('<input', '<input list="cls-grps"')}${inp('domain', '', 'md', 'domain.com')}
          <button class="btn" onclick="clsAdd('group-add','cls-grp')">Add domain</button><span class="cfg-status"></span></div>
        <div class="cfg-add" id="cls-ppl">${inp('group', Object.keys(groups)[0] || '', 'md', 'Group (optional)').replace('<input', '<input list="cls-grps"')}${inp('name', '', 'md', 'Name')}${inp('email', '', 'md', 'name@domain.com')}
          <label class="conn-user"><input type="checkbox" data-f="teammate" checked> teammate</label>
          <button class="btn" onclick="clsAddPerson()">Add person</button><span class="cfg-status"></span></div>
      </div>
      ${loners.length ? `<div class="cfg-group"><h3>Teammates without a group</h3>${loners.map(x => personRow(x, null)).join('')}</div>` : ''}
      ${svcHtml(d.services || {})}
      <div class="cfg-group"><h3>Jev, per account</h3>
        <div class="cfg-note">When on, Jev (TypeSafe) classifies that account's person-to-person mail. For each thread it sees the subject, who's on it, who wrote last, and up to 400 characters of the latest message. Newsletters and automated mail are never sent, and neither are full messages or attachments. TypeSafe doesn't train on it; its retention period isn't fixed (zero retention is enterprise-only). ${d.jev_key_set ? '' : '<b>Add a Jev API key in Connections to turn any of these on.</b>'}</div>
        ${d.accounts.map(a => `<div class="cfg-row"><span class="conn-main">${esc(a.account.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()))}</span>
          ${a.jev ? '<span class="conn-pill on">Jev on</span>' : '<span class="conn-pill off">Jev off</span>'}
          <button class="btn" ${!a.jev && !d.jev_key_set ? 'disabled' : ''} onclick="clsJev('${esc(a.account)}', ${!a.jev}, this)">${a.jev ? 'Turn off' : 'Turn on'}</button><span class="cfg-status"></span></div>`).join('')}
      </div>`;
  }
  function clsAdd(action, rowId) {
    const row = document.getElementById(rowId);
    clsPost({ action, ...rowVals(row) }, row.querySelector('.cfg-status'));
  }
  function clsDel(kind, key) { clsPost({ action: kind + '-remove', key }, null); }
  function clsAddPerson() {
    const row = document.getElementById('cls-ppl');
    const v = rowVals(row);
    clsPost({ action: 'person-add', email: v.email, name: v.name, group: v.group,
              teammate: row.querySelector('[data-f=teammate]').checked }, row.querySelector('.cfg-status'));
  }
  // teammate on/off keeps every group they're in ("also" with no new group is refused, so send one of theirs)
  function clsMate(email, teammate) { clsPost({ action: 'person-mate', email, teammate }, null); }
  function clsAlso(email, group, teammate, btn) {
    group = (group || '').trim();
    if (!group) { btn.textContent = 'Type a group'; setTimeout(() => { btn.textContent = 'Also add'; }, 2000); return; }
    clsPost({ action: 'person-add', email, group, teammate, also: true }, null);
  }
  function clsLeave(email, group) { clsPost({ action: 'person-leave', email, group }, null); }
  // "I need a way to move a teammate to a group or company" — same upsert,
  // new group; a blank group keeps them as a teammate with no group.
  function clsMove(email, group, teammate, btn, from) {
    group = (group || '').trim();
    if (!group) { btn.textContent = 'Type a group'; setTimeout(() => { btn.textContent = 'Move'; }, 2000); return; }
    clsPost({ action: 'person-add', email, group, teammate, from: from || undefined, also: !from || undefined }, null);
  }
  // E253: mail your own sites and tools send (Bart: "ConnectBlue
  // Notifications should be a bundle, ConnectBlue Sales inquiries (RFPs) from
  // sales@connectblue") is found automatically, one bundle per service. Here
  // Bart renames, merges or switches one off; nothing touches Gmail.
  function svcHtml(byAcct) {
    const accts = Object.keys(byAcct);
    if (!accts.length) return '';
    const nice = a => a.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<div class="cfg-group"><h3>Your services</h3>
      <div class="cfg-note">Automated mail from your own domains — your sites, tools and mailings — gets a bundle of its own in the inbox. New ones appear here by themselves. 💼 Sales inquiries are leads from your website: they stay near the top of the inbox while any is unread or unanswered, and Smart Inbox lists them with Prospects.</div>
      ${accts.map(a => { const rows = byAcct[a], others = k => rows.filter(r => r.key !== k && !r.merged_into);
        return `<div class="cfg-note" style="margin-top:10px"><b>${esc(nice(a))}</b></div>` + rows.map(r => `
        <div class="cfg-row"><span class="conn-main">${r.kind === 'sales' ? '💼 ' : ''}${esc(r.label)} <span class="conn-user">${esc(r.key)} · ${r.count}</span>
          ${r.off ? '<span class="conn-pill off">off</span>' : ''}${r.merged_into ? `<span class="conn-user">in ${esc((rows.find(x => x.key === r.merged_into) || {}).label || r.merged_into)}</span>` : ''}</span>
          <input class="cfg-in sm" value="${esc(r.name)}" placeholder="${esc(r.auto_name || '')}" title="Blank goes back to ${esc(r.auto_name || 'the found name')}"
            onkeydown="if(event.key==='Enter')this.nextElementSibling.click()">
          <button class="btn" onclick="svcPost({action:'service-rename',key:'${esc(r.key)}',name:this.previousElementSibling.value})">Rename</button>
          <select class="cfg-in sm" title="Show this service's mail in another bundle" onchange="svcPost({action:'service-merge',key:'${esc(r.key)}',into:this.value})">
            <option value="">${r.merged_into ? 'Own bundle again' : 'Merge into…'}</option>
            ${others(r.key).map(o => `<option value="${esc(o.key)}" ${o.key === r.merged_into ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
          <button class="btn" title="${r.off ? 'Bundle it again' : 'Leave its mail in the inbox as it was before'}" onclick="svcPost({action:'service-off',key:'${esc(r.key)}',off:${!r.off}})">${r.off ? 'Switch on' : 'Switch off'}</button></div>`).join(''); }).join('')}
    </div>`;
  }
  function svcPost(body) { clsPost(body, null); }
  function clsJev(account, on, btn) { clsPost({ action: 'jev', account, on }, btn.nextElementSibling); }

  // ---------- E258: Agents — what OpenClaw / Claude (the MCP) may touch ----------
  // Every write here is human-only on the server: this browser must be paired
  // (the Dev requests pairing code). Switches, approvals and the lockout reset
  // are refused to agents and to unpaired callers.
  async function agentPost(url, body) {
    const res = await fetch(url, { method: 'POST',
      headers: { 'Content-Type': 'application/json', ...gcAuth() }, body: JSON.stringify(body) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.pairing_required
      ? 'this browser is not paired — enter the pairing code on the board (Dev requests) first'
      : (out.error || 'failed'));
    return out;
  }
  async function renderAgentsTab(p) {
    p.innerHTML = '<div class="empty" style="padding:16px 22px">Loading…</div>';
    let a;
    try {
      a = await (await fetch('/agent/accounts', { cache: 'no-store' })).json();
      if (!a.ok) throw new Error(a.error || 'failed');
    } catch (err) {
      p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load — ${esc(err.message)}</div>`;
      return;
    }
    const paired = !!gcAuth()['X-GC-Dev-Code'];
    const when = t => esc(String(t || '').replace('T', ' ').replace('Z', ''));
    p.innerHTML = `
      <div class="cfg-note">Agents (OpenClaw, Claude through the MCP, the Claude desktop app) can read and act only in the accounts
        switched on here, within rate limits, and never send, trash, RSVP or send invites. Threads you
        label <b>Private</b> in Gmail do not exist in Grand Central at all. Every agent call is logged below.
        ${paired ? '' : '<br><b>This browser is not paired</b> — changes here need the pairing code (board → Dev requests).'}</div>
      ${a.lock ? `<div class="cfg-group"><h3>⛔ Agent locked out</h3><div class="cfg-row">
        <span>${when(a.lock.at)} — ${esc(a.lock.reason)}. Review the calls below first.</span>
        <button class="btn" onclick="agentReset(this)">Lift lockout</button><span class="cfg-status"></span></div></div>` : ''}
      <div class="cfg-group"><h3>Accounts agents may use</h3>
        ${a.key_set ? '' : '<div class="cfg-row"><span>No agent key yet — run <code>sweeper/agent_gate.py --new-key</code> on the Mini.</span></div>'}
        ${a.accounts.map(r => `<div class="cfg-row"><span class="idtag">${esc(r.account)}</span>
          <span>${r.enabled ? 'on' : 'off'}</span>
          <button class="btn" onclick="agentAcct('${esc(r.account)}', ${!r.enabled}, this)">${r.enabled ? 'Switch off' : 'Switch on'}</button>
          <span class="cfg-status"></span></div>`).join('')}
      </div>
      <div class="cfg-group" id="desktop-requests"><h3>✋ Claude desktop app is asking (${(a.pending_proposals || []).length})</h3>
        <div class="cfg-note" style="padding:0 0 6px">Nothing here has happened. Approve runs exactly the request shown, once,
          as an agent call checked again now. Requests expire after 24 hours.
          ${a.desktop_key_set ? '' : '<br>No desktop key yet — run <code>sweeper/agent_gate.py --new-desktop-key</code> on the Mini.'}</div>
        ${(a.pending_proposals || []).length ? a.pending_proposals.map(q => `<div class="cfg-row" style="align-items:flex-start">
          <span class="idtag">#${q.id} ${esc(q.account)}</span>
          <span><b>${esc(q.preview)}</b><br><span style="font-size:12px">${esc(q.tool)} · ${when(q.created_at)}</span>
            <br><code style="font-size:11px;word-break:break-all">POST ${esc(q.path)} ${esc(JSON.stringify(q.body))}</code></span>
          <button class="btn" onclick="agentDecide(${q.id}, 'approve', this)">Approve</button>
          <button class="btn" onclick="agentDecide(${q.id}, 'decline', this)">Decline</button><span class="cfg-status"></span></div>`).join('')
          : '<div class="empty" style="padding:8px 0">Nothing waiting.</div>'}
      </div>
      <div class="cfg-group"><h3>Context an agent wants to save (${a.pending_context.length})</h3>
        ${a.pending_context.length ? a.pending_context.map(c => `<div class="cfg-row">
          <span class="idtag">#${c.id} ${esc(c.kind)} · ${esc(c.scope)}</span><span>${esc(c.text)}</span>
          <button class="btn" onclick="agentCtx(${c.id}, true, this)">Approve</button>
          <button class="btn" onclick="agentCtx(${c.id}, false, this)">Delete</button><span class="cfg-status"></span></div>`).join('')
          : '<div class="empty" style="padding:8px 0">Nothing waiting.</div>'}
      </div>
      <div class="cfg-group"><h3>Invite drafts (${(a.invites || []).length})</h3>
        ${(a.invites || []).length ? a.invites.map(v => `<div class="cfg-row" style="align-items:flex-start">
          <span class="idtag">${esc(v.account)}</span>
          <span><b>${esc(v.summary || '')}</b> · ${when(v.start_at)}<br>Invite: ${esc(v.attendees.join(', '))}
            ${v.new_attendees.length ? `<br><b style="color:var(--bad,#c33)">New to this account: ${esc(v.new_attendees.join(', '))}</b>` : ''}
            <br><span style="font-size:12px">proposed by ${esc(v.created_by || '?')}${v.link ? ` · <a href="${esc(v.link)}" target="_blank" rel="noopener">open event</a>` : ''}</span></span>
          <button class="btn" onclick="agentInvite(${v.id}, 'send', this)">Send invites</button>
          <button class="btn" onclick="agentInvite(${v.id}, 'drop', this)">Drop</button><span class="cfg-status"></span></div>`).join('')
          : '<div class="empty" style="padding:8px 0">Nothing waiting. An agent that schedules a meeting proposes attendees here; Google invites nobody until you click Send invites.</div>'}
      </div>
      <div class="cfg-group"><h3>Private threads (${(a.private || []).length})</h3>
        <div class="cfg-row"><span>Threads labelled <b>Private</b> in Gmail are gone from Grand Central —
          only their ids are kept, so later replies stay out too. To let one back in, remove the label in
          Gmail first, then press Let back in.</span></div>
        ${(a.private || []).map(r => `<div class="cfg-row"><span class="idtag">${esc(r.acct)}</span>
          <span>${esc(r.tid)} · since ${when(r.marked_at)}</span>
          <button class="btn" onclick="agentUnprivate('${esc(r.acct)}', '${esc(r.tid)}', this)">Let back in</button>
          <span class="cfg-status"></span></div>`).join('')}
      </div>
      <div class="cfg-group"><h3>Recent agent calls</h3>
        ${a.audit.length ? a.audit.map(r => `<div class="cfg-row" style="align-items:flex-start">
          <span class="idtag">${when(r.ts)}</span>
          <span><b>${esc(r.tool || r.route)}</b> ${esc(r.method)} ${esc(r.route)} · ${esc(r.principal)}
            · ${esc((JSON.parse(r.accounts || '[]')).join(', ') || '—')} · ${r.status} · ${r.result_bytes || 0}B
            ${r.signals ? ` · <b>⚠ ${r.signals} injection signal(s)</b>` : ''}
            ${r.refusal ? `<br><span style="color:var(--bad,#c33)">refused: ${esc(r.refusal)}</span>` : ''}
            <br><code style="font-size:11px;word-break:break-all">${esc(r.args || '')}</code></span></div>`).join('')
          : '<div class="empty" style="padding:8px 0">No agent calls yet.</div>'}
      </div>`;
  }
  async function agentAcct(account, enabled, btn) {
    try { await agentPost('/agent/accounts', { account, enabled }); renderAgentsTab(document.getElementById('pane')); }
    catch (e) { btn.nextElementSibling.textContent = e.message; btn.nextElementSibling.className = 'cfg-status err'; }
  }
  async function agentCtx(id, approve, btn) {
    try {
      await agentPost('/context', approve ? { action: 'update', id, fields: { active: 1 } } : { action: 'delete', id });
      renderAgentsTab(document.getElementById('pane'));
    } catch (e) { btn.parentElement.querySelector('.cfg-status').textContent = e.message; }
  }
  // E260: Bart's click on a desktop-app request (human-only on the server).
  async function agentDecide(id, decision, btn) {
    const st = btn.parentElement.querySelector('.cfg-status');
    btn.parentElement.querySelectorAll('button').forEach(b => { b.disabled = true; });
    st.textContent = decision === 'approve' ? 'Running…' : '';
    try {
      await agentPost('/agent/proposals/decide', { id, decision });
      renderAgentsTab(document.getElementById('pane'));
    } catch (e) {
      st.textContent = e.message; st.className = 'cfg-status err';
      setTimeout(() => renderAgentsTab(document.getElementById('pane')), 4000);
    }
  }
  async function agentUnprivate(account, thread_id, btn) {
    if (!confirm('Let this thread back into Grand Central?\n\nIf it still has the Private label in Gmail, it will be removed again on the next sync.')) return;
    try { await agentPost('/private', { account, thread_id }); renderAgentsTab(document.getElementById('pane')); }
    catch (e) { btn.nextElementSibling.textContent = e.message; btn.nextElementSibling.className = 'cfg-status err'; }
  }
  async function agentInvite(id, action, btn) {
    if (action === 'send' && !confirm('Send these invites now?\n\nGoogle will email every attendee the event title and description.')) return;
    try { await agentPost('/calendar/invite', { id, action }); renderAgentsTab(document.getElementById('pane')); }
    catch (e) { const st = btn.parentElement.querySelector('.cfg-status'); st.textContent = e.message; st.className = 'cfg-status err'; }
  }
  async function agentReset(btn) {
    try { await agentPost('/agent/reset', {}); renderAgentsTab(document.getElementById('pane')); }
    catch (e) { btn.nextElementSibling.textContent = e.message; btn.nextElementSibling.className = 'cfg-status err'; }
  }

  // ---------- E269: Tracking — opens and clicks on Grand Central sends ----------
  // BUILD_SPEC §6, 2026-10-06. Bart: "make them configure-able for each email
  // account". Each signal switches per account; nothing here touches mail.
  const TRK_SIG = [['enabled', 'Track by default', 'On when anyone outside your companies is on the email. The 👁 in the composer overrides it either way.'],
                   ['clicks', 'Link clicks', 'Links pass through t.<domain> so a click is seen.'],
                   ['ping', 'Ping on first real open', 'iMessage / push the first time someone actually opens it.'],
                   ['waiting', 'Feed Waiting on', '"Opened, no reply" after 3 days moves it up in follow-ups.']];
  async function renderTrackingTab(p) {
    let d;
    try { d = await (await fetch('/tracking', { cache: 'no-store' })).json(); if (!d.ok) throw new Error(d.error || 'failed'); }
    catch (err) { p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load — ${esc(err.message)}</div>`; return; }
    const nice = a => a.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    p.innerHTML = `
      <p class="cfg-note">Grand Central can tell you when an email you sent from it is opened, and which links were clicked. It adds an invisible image (and, if you choose, passes links) through <b>t.&lt;your domain&gt;</b>. The tracker stores a random code, the time and a rough source, never the recipient's address or anything in the email. Opens by Apple Mail's prefetch and security scanners are shown as automatic and never counted.</p>
      ${d.secret_set ? '' : '<div class="cfg-group"><div class="cfg-note"><b>Not switched on yet.</b> Tracking starts once the tracker is deployed and its secret is saved in Connections → Tracking secret. Until then no email is changed.</div></div>'}
      ${d.accounts.map(a => `<div class="cfg-group"><h3>${esc(nice(a.account))} <span class="conn-user">${a.domain ? 't.' + esc(a.domain) : 'no company domain'}</span>
          ${a.domain ? (a.healthy ? '<span class="conn-pill on">live</span>' : '<span class="conn-pill off">not live</span>') : ''}</h3>
        ${a.domain ? TRK_SIG.map(([k, label, note]) => `<div class="cfg-row"><label class="conn-main" style="display:flex;gap:8px;align-items:center">
            <input type="checkbox" ${a[k] ? 'checked' : ''} ${k !== 'enabled' && !a.enabled ? 'disabled' : ''} onchange="trkSet('${esc(a.account)}','${k}',this.checked,this)"> ${label}
            <span class="conn-user">${esc(note)}</span></label><span class="cfg-status"></span></div>`).join('')
          : '<div class="cfg-note">A free-mail address (gmail.com) has no domain of its own to track from, so this account is never tracked.</div>'}
      </div>`).join('')}`;
  }
  async function trkSet(account, key, on, el) {
    const st = el.closest('.cfg-row').querySelector('.cfg-status');
    try {
      const res = await fetch('/tracking', { method: 'POST', headers: { 'Content-Type': 'application/json', ...gcAuth() }, body: JSON.stringify({ account, [key]: on }) });
      const out = await res.json(); if (!out.ok) throw new Error(out.error || 'rejected');
      if (key === 'enabled') renderTrackingTab(document.getElementById('pane'));
      else { st.textContent = 'saved'; st.className = 'cfg-status'; setTimeout(() => { st.textContent = ''; }, 1500); }
    } catch (err) { st.textContent = err.message; st.className = 'cfg-status err'; el.checked = !on; }
  }

  // ---------- shell ----------
  const TABS = [['connections', 'Connections', renderConnectionsTab], ['context', 'Context', renderContextTab],
                ['classification', 'Classification', renderClassificationTab], ['agents', 'Agents', renderAgentsTab],
                ['tracking', 'Tracking', renderTrackingTab]];
  function show(id) {
    const tab = TABS.find(t => t[0] === id) || TABS[0];
    banner('');
    document.getElementById('tabs').innerHTML = TABS.map(([tid, label]) =>
      `<button class="tab${tid === tab[0] ? ' on' : ''}" data-tab="${tid}">${label}</button>`).join('');
    document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => {
      history.replaceState(null, '', '?tab=' + b.dataset.tab); show(b.dataset.tab);
    }));
    tab[2](document.getElementById('pane'));
  }
  // Inline onclick handlers in the tab markup need these on window.
  Object.assign(window, { connTestGmail, connAddGmail, connRemoveGmail, connTestSingle,
                          connSaveSingle, connClearSingle, docFile, docEdit, docPost, docSave, docDel, docReset, ctxAdd, ctxSave, ctxToggle, ctxDelete,
                          clsAdd, clsDel, clsJev, clsAddPerson, clsMate, clsMove, clsAlso, clsLeave, svcPost,
                          agentAcct, agentCtx, agentReset, agentUnprivate, agentInvite, agentDecide, trkSet });
  show(new URLSearchParams(location.search).get('tab'));
})();
</script>
</body>
</html>
