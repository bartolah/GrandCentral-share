<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Central — Settings</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1c1c1c; --mut:#6b6b6b; --line:#d9d9d4; --card:#fff; --acc:#2f6fed; --ok:#1a7f37; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141518; --fg:#e6e6e6; --mut:#9a9a9a; --line:#2c2e33; --card:#1c1e22; --acc:#6ea0ff; --ok:#56d364; --err:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, system-ui, sans-serif; }
  header { display:flex; gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; }
  header a { color:var(--acc); text-decoration:none; }
  header h1 { font-size:15px; margin:0; flex:1; }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; }
  .tab { padding:6px 12px; border:1px solid var(--line); border-radius:8px 8px 0 0; background:var(--card); color:var(--fg); cursor:pointer; }
  .tab.on { border-bottom-color:var(--bg); background:var(--bg); font-weight:600; }
  #banner { display:none; margin:10px 18px; padding:8px 12px; border:1px solid var(--err); color:var(--err); border-radius:8px; }
  #banner.show { display:block; }
  #pane { padding:10px 18px 60px; max-width:920px; }
  .cfg-note { color:var(--mut); margin:6px 0 12px; }
  .cfg-group { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 12px; }
  .cfg-group h3 { margin:0 0 6px; font-size:13px; }
  .cfg-row, .cfg-add, .conn-row, .conn-add { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .conn-main { flex:1; min-width:180px; }
  .cfg-in { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .cfg-in.sm { width:110px; } .cfg-in.md { width:200px; } .cfg-in.lg { flex:1; min-width:220px; }
  .btn { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  .btn:hover { border-color:var(--acc); } .del-btn { color:var(--err); }
  .btn:disabled { opacity:.45; cursor:not-allowed; border-color:var(--line); }
  .idtag { font:12px ui-monospace, monospace; padding:1px 6px; border:1px solid var(--line); border-radius:6px; color:var(--mut); }
  .conn-pill { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); }
  .conn-pill.on { color:var(--ok); border-color:var(--ok); } .conn-pill.off { color:var(--mut); }
  .conn-hint, .conn-user { color:var(--mut); }
  .cfg-status { color:var(--mut); font-size:12px; } .cfg-status.ok { color:var(--ok); } .cfg-status.err { color:var(--err); }
  .empty { color:var(--mut); }
  code { font:12px ui-monospace, monospace; }
</style>
</head>
<body>
<header><a href="/">← Grand Central</a><h1>Settings</h1></header>
<div class="tabs" id="tabs"></div>
<div id="banner"></div>
<div id="pane"></div>
<script>
(() => {
  'use strict';
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const rowVals = row => {
    const out = {};
    row.querySelectorAll('[data-f]').forEach(el => { out[el.dataset.f] = el.value; });
    return out;
  };
  const inp = (f, v, cls, ph) => `<input class="cfg-in ${cls||'md'}" data-f="${f}" value="${esc(v ?? '')}" placeholder="${esc(ph||f)}">`;
  function banner(msg) {
    const b = document.getElementById('banner');
    if (msg) { b.textContent = msg; b.classList.add('show'); } else b.classList.remove('show');
  }

  // ---------- E51: Connections tab — sources & credentials ----------
  // The only screen that writes secrets (POST /connections -> config/.env,
  // atomic + chmod 600 + backup). Values are never shown back: each field is
  // "set / not set" with a masked hint, and editing means replacing. Live
  // Test where the service allows it (IMAP login, Anthropic/Granola).
  let CONN = null;
  async function loadConnections() {
    const res = await fetch('/connections', { cache: 'no-store' });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'failed');
    CONN = out;
    return out;
  }
  async function connPost(body, statusEl, okMsg) {
    if (statusEl) { statusEl.textContent = 'working…'; statusEl.className = 'cfg-status'; }
    try {
      const res = await fetch('/connections', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || out.message || 'rejected');
      if (statusEl) { statusEl.textContent = out.message || okMsg || 'done ✓'; statusEl.className = 'cfg-status ok'; }
      // A mutation returns fresh status — re-render so pills update.
      if (out.accounts || out.singles) { CONN = out; renderConnectionsTab(document.getElementById('pane')); }
      return out;
    } catch (err) {
      if (statusEl) { statusEl.textContent = err.message; statusEl.className = 'cfg-status err'; }
      return null;
    }
  }
  const connPill = on => on
    ? '<span class="conn-pill on">connected</span>'
    : '<span class="conn-pill off">not set</span>';

  async function renderConnectionsTab(p) {
    p.innerHTML = '<div class="empty" style="padding:16px 22px">Loading connections…</div>';
    try { await loadConnections(); }
    catch (err) { p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load connections — ${esc(err.message)}</div>`; return; }

    const gmailRows = (CONN.accounts || []).map(a => `
      <div class="conn-row">
        <div class="conn-main"><span class="idtag">${esc(a.slug)}</span> <span class="conn-user">${esc(a.user || '—')}</span></div>
        ${connPill(a.set)}
        <button class="btn del-btn" onclick="connRemoveGmail('${esc(a.slug)}', this)">Remove</button>
        <span class="cfg-status"></span>
      </div>`).join('') || '<div class="empty">No Gmail accounts configured.</div>';

    const single = (name, m) => `
      <div class="cfg-group" data-conn="${name}">
        <h3>${esc(m.label)} ${connPill(m.set)}${m.set && m.hint ? ` <span class="conn-hint">${esc(m.hint)}</span>` : ''}</h3>
        <div class="cfg-note" style="margin:2px 0 8px">${esc(m.note || '')}</div>
        <div class="cfg-add">
          <input class="cfg-in lg" data-conn-val type="password" autocomplete="off"
                 placeholder="${m.set ? 'paste a new value to replace' : (m.islist ? 'comma-separated ICS URLs' : 'paste value')}">
          ${m.testable ? `<button class="btn" onclick="connTestSingle('${name}', this)">Test</button>` : ''}
          <button class="btn" onclick="connSaveSingle('${name}', this)">Save</button>
          ${m.set ? `<button class="btn del-btn" onclick="connClearSingle('${name}', this)">Clear</button>` : ''}
          <span class="cfg-status"></span>
        </div>
      </div>`;

    const S = CONN.singles || {};
    // Known keys first in a stable order, then any other key the server
    // offers — a hardcoded list here is how the Jev key (E210) went missing.
    const known = ['anthropic', 'jev', 'granola', 'calendar'];
    const singleOrder = [...known, ...Object.keys(S).filter(n => !known.includes(n)).sort()];
    p.innerHTML = `
      <div class="cfg-note">Sources &amp; credentials. Writes go only to <code>config/.env</code> (backed up, chmod 600) and take effect on the next sweep (mail ~3 min). Values are never shown back — to change one, paste a new value. Behind Cloudflare Access.</div>

      <div class="cfg-group">
        <h3>Gmail accounts</h3>
        <div class="cfg-note" style="margin:2px 0 10px">Each account needs a Google <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">app password</a> (2-Step Verification must be on). Adding one writes two <code>.env</code> keys; the sweeper picks it up next cycle.</div>
        ${gmailRows}
        <div class="conn-add">
          <input class="cfg-in md" id="conn-gm-email" type="email" autocomplete="off" placeholder="you@gmail.com">
          <input class="cfg-in md" id="conn-gm-pw" type="password" autocomplete="off" placeholder="16-char app password">
          <input class="cfg-in sm" id="conn-gm-label" autocomplete="off" placeholder="label (optional)">
          <button class="btn" onclick="connTestGmail(this)">Test</button>
          <button class="btn" onclick="connAddGmail(this)">Add account</button>
          <span class="cfg-status"></span>
        </div>
      </div>

      ${singleOrder.filter(n => S[n]).map(n => single(n, S[n])).join('')}
    `;
  }

  function connGmailFields(btn) {
    const box = btn.closest('.conn-add');
    return {
      email: box.querySelector('#conn-gm-email').value.trim(),
      password: box.querySelector('#conn-gm-pw').value,
      label: box.querySelector('#conn-gm-label').value.trim(),
      st: box.querySelector('.cfg-status'),
    };
  }
  async function connTestGmail(btn) {
    const f = connGmailFields(btn);
    await connPost({ action: 'test_gmail', email: f.email, password: f.password }, f.st);
  }
  async function connAddGmail(btn) {
    const f = connGmailFields(btn);
    if (!f.email || !f.password) { f.st.textContent = 'email + app password required'; f.st.className = 'cfg-status err'; return; }
    await connPost({ action: 'add_gmail', email: f.email, password: f.password, label: f.label }, f.st);
  }
  async function connRemoveGmail(slug, btn) {
    if (!confirm(`Remove the '${slug}' account? Its credentials are deleted from config/.env (a backup is kept). Synced mail already on the board stays until it ages out.`)) return;
    await connPost({ action: 'remove_gmail', slug }, btn.parentNode.querySelector('.cfg-status'));
  }
  function connSingleVal(btn) {
    const box = btn.closest('.cfg-add');
    return { val: box.querySelector('[data-conn-val]').value, st: box.querySelector('.cfg-status') };
  }
  async function connTestSingle(name, btn) {
    const { val, st } = connSingleVal(btn);
    await connPost({ action: 'test_single', name, value: val }, st);
  }
  async function connSaveSingle(name, btn) {
    const { val, st } = connSingleVal(btn);
    if (!val.trim()) { st.textContent = 'paste a value first'; st.className = 'cfg-status err'; return; }
    await connPost({ action: 'set_single', name, value: val }, st);
  }
  async function connClearSingle(name, btn) {
    if (!confirm(`Clear ${name}? The source stops on the next sweep. A backup of config/.env is kept.`)) return;
    await connPost({ action: 'clear_single', name }, btn.parentNode.querySelector('.cfg-status'));
  }

  // ---------- E19: Context tab — Bart's rules/notes corpus ----------
  // The beginning of durable context: label meanings, people notes, voice
  // preferences, automation ideas. Stored in the DB; nothing consumes an
  // entry automatically — future automations / prompt grounding / reply
  // suggestions will opt in by kind, deliberately.

  let CTX = null;

  async function renderContextTab(p) {
    p.innerHTML = '<div class="empty" style="padding:16px 22px">Loading context…</div>';
    try {
      const res = await fetch('/context', { cache: 'no-store' });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'failed');
      CTX = out.context || [];
    } catch (err) {
      p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load context — ${esc(err.message)}</div>`;
      return;
    }
    const kindSel = (v, df) => `<select class="cfg-in sm" data-f="kind" ${df || ''}>${
      ['note', 'rule', 'voice', 'automation'].map(k =>
        `<option ${k === v ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
    const byScope = {};
    CTX.forEach(c => (byScope[c.scope] = byScope[c.scope] || []).push(c));
    p.innerHTML = `
      <div class="cfg-note">Context — durable statements about how your world works: what a label means,
        who a person is, how you like replies written, automations you want someday. This corpus will feed
        automations and reply suggestions as those get built — nothing acts on an entry yet. Scope
        examples: <b>global</b>, <b>account:personal</b>, <b>label:_VIPs</b>, <b>person:chris@example.com</b>.
        Older <b>project:</b> / <b>goal:</b> notes are kept as written.</div>
      <div class="cfg-group"><h3>Add context</h3>
        <div class="cfg-add">
          ${inp('scope', 'global', 'md', 'scope — global, account:X, label:X, person:X')}
          ${kindSel('note')}
          ${inp('text', '', 'lg', 'the statement — e.g. label:_VIPs threads are platform-invite targets')}
          <button class="btn" onclick="ctxAdd(this)">Add</button><span class="cfg-status"></span>
        </div>
      </div>` +
      Object.entries(byScope).sort(([a], [b]) => a.localeCompare(b)).map(([scope, rows]) =>
        `<div class="cfg-group"><h3>${esc(scope)}</h3>` + rows.map(c =>
          `<div class="cfg-row" data-row data-ctxid="${c.id}">
            <span class="idtag">#${c.id} ${esc(c.kind)}</span>
            ${inp('text', c.text, 'lg')}
            ${kindSel(c.kind)}
            <button class="btn" onclick="ctxSave(${c.id}, this)">Save</button>
            <button class="btn${c.active ? '' : ' del-btn'}" onclick="ctxToggle(${c.id}, ${c.active ? 0 : 1}, this)"
              title="${c.active ? 'Pause — kept but ignored by consumers' : 'Reactivate'}">${c.active ? 'Active ✓' : 'Paused'}</button>
            <button class="btn del-btn" onclick="ctxDelete(${c.id}, this)">Delete</button>
            <span class="cfg-status"></span>
          </div>`).join('') + `</div>`).join('') +
      (CTX.length ? '' : '<div class="empty" style="padding:12px 22px">No context yet — add the first statement above.</div>');
  }

  async function ctxPost(body) {
    const res = await fetch('/context', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'context action failed');
    return out;
  }
  async function ctxAdd(btn) {
    const box = btn.closest('.cfg-add');
    const vals = rowVals(box);
    try {
      await ctxPost({ action: 'add', scope: vals.scope, kind: vals.kind, text: vals.text });
      renderContextTab(document.getElementById('pane'));
    } catch (err) { banner('Context add failed — ' + err.message); }
  }
  async function ctxSave(id, btn) {
    const row = btn.closest('[data-row]');
    const vals = rowVals(row);
    try {
      await ctxPost({ action: 'update', id, fields: { text: vals.text, kind: vals.kind } });
      btn.textContent = 'Saved ✓'; setTimeout(() => { btn.textContent = 'Save'; }, 1500);
    } catch (err) { banner('Context save failed — ' + err.message); }
  }
  async function ctxToggle(id, active, btn) {
    try {
      await ctxPost({ action: 'update', id, fields: { active } });
      renderContextTab(document.getElementById('pane'));
    } catch (err) { banner('Context toggle failed — ' + err.message); }
  }
  async function ctxDelete(id, btn) {
    if (btn.dataset.armed) {
      try {
        await ctxPost({ action: 'delete', id });
        renderContextTab(document.getElementById('pane'));
      } catch (err) { banner('Context delete failed — ' + err.message); }
      return;
    }
    btn.dataset.armed = '1'; btn.textContent = 'Sure?';
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = 'Delete'; }, 3000);
  }

  // ---------- E209: Classification — team roster + per-account Jev ----------
  // Who counts as a teammate and which domains are one company decides the
  // "relationship" and "waiting on a teammate" fields. The roster is who
  // someone IS, shared by every account; no email crosses accounts. Each
  // account's Jev switch is off until turned on here (§6, 2026-09-26), and
  // can't turn on before a Jev key is saved in Connections.
  async function clsPost(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'working…'; statusEl.className = 'cfg-status'; }
    try {
      const res = await fetch('/classify', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify(body) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'rejected');
      renderClassificationTab(document.getElementById('pane'));
      return out;
    } catch (err) {
      if (statusEl) { statusEl.textContent = err.message; statusEl.className = 'cfg-status err'; }
      return null;
    }
  }
  async function renderClassificationTab(p) {
    let d;
    try {
      d = await (await fetch('/classify/settings', { cache: 'no-store' })).json();
      if (!d.ok) throw new Error(d.error || 'failed');
    } catch (err) { p.innerHTML = `<div class="empty" style="padding:16px 22px">Could not load — ${esc(err.message)}</div>`; return; }
    // E212: a group holds domains AND people — anyone in it is "company";
    // a teammate may belong to a group or stand alone.
    const groups = {};
    const g = n => (groups[n] = groups[n] || { domains: [], people: [] });
    d.groups.forEach(x => g(x.grp).domains.push(x.domain));
    d.people.filter(x => x.grp).forEach(x => g(x.grp).people.push(x));
    const loners = d.people.filter(x => !x.grp);
    const personRow = x => `<div class="cfg-row"><span class="conn-main">${esc(x.name || '')} <span class="conn-user">${esc(x.email)}</span>
        ${x.teammate ? '<span class="conn-pill on">teammate</span>' : ''}</span>
        <button class="btn" onclick="clsMate('${esc(x.email)}','${esc(x.grp || '')}',${!x.teammate})">${x.teammate ? 'Not a teammate' : 'Make teammate'}</button>
        <button class="btn del-btn" onclick="clsDel('person','${esc(x.email)}')">Remove</button></div>`;
    p.innerHTML = `
      <p class="cfg-note">Grand Central classifies each email: its type, who the sender is to you, whether to respond, who you're waiting on, and when to follow up. These settings decide who counts as your company and your team.</p>
      ${Object.entries(groups).map(([name, gr]) => `
      <div class="cfg-group"><h3>${esc(name)}</h3>
        <div class="cfg-row">${gr.domains.map(dm => `<span class="idtag">${esc(dm)}</span><button class="btn del-btn" onclick="clsDel('group','${esc(dm)}')" title="Remove ${esc(dm)}">✕</button>`).join(' ') || '<span class="empty">No domains — only the people below.</span>'}</div>
        ${gr.people.map(personRow).join('')}
      </div>`).join('') || '<div class="cfg-group"><h3>Company groups</h3><div class="empty">No groups yet. Add a domain or a person below, e.g. ConnectBlue, Capitol Influence and Northwind Media in one group.</div></div>'}
      <div class="cfg-group"><h3>Add to a group</h3>
        <div class="cfg-note">Everyone at a domain, or one person by address, counts as your company. Teammates' threads you're waiting on follow up after 2 business days.</div>
        <datalist id="cls-grps">${Object.keys(groups).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
        <div class="cfg-add" id="cls-grp">${inp('group', Object.keys(groups)[0] || '', 'md', 'Group name').replace('<input', '<input list="cls-grps"')}${inp('domain', '', 'md', 'domain.com')}
          <button class="btn" onclick="clsAdd('group-add','cls-grp')">Add domain</button><span class="cfg-status"></span></div>
        <div class="cfg-add" id="cls-ppl">${inp('group', Object.keys(groups)[0] || '', 'md', 'Group (optional)').replace('<input', '<input list="cls-grps"')}${inp('name', '', 'md', 'Name')}${inp('email', '', 'md', 'name@domain.com')}
          <label class="conn-user"><input type="checkbox" data-f="teammate" checked> teammate</label>
          <button class="btn" onclick="clsAddPerson()">Add person</button><span class="cfg-status"></span></div>
      </div>
      ${loners.length ? `<div class="cfg-group"><h3>Teammates without a group</h3>${loners.map(personRow).join('')}</div>` : ''}
      <div class="cfg-group"><h3>Jev, per account</h3>
        <div class="cfg-note">When on, Jev (TypeSafe) classifies that account's person-to-person mail. For each thread it sees the subject, who's on it, who wrote last, and up to 400 characters of the latest message. Newsletters and automated mail are never sent, and neither are full messages or attachments. TypeSafe doesn't train on it; its retention period isn't fixed (zero retention is enterprise-only). ${d.jev_key_set ? '' : '<b>Add a Jev API key in Connections to turn any of these on.</b>'}</div>
        ${d.accounts.map(a => `<div class="cfg-row"><span class="conn-main">${esc(a.account.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()))}</span>
          ${a.jev ? '<span class="conn-pill on">Jev on</span>' : '<span class="conn-pill off">Jev off</span>'}
          <button class="btn" ${!a.jev && !d.jev_key_set ? 'disabled' : ''} onclick="clsJev('${esc(a.account)}', ${!a.jev}, this)">${a.jev ? 'Turn off' : 'Turn on'}</button><span class="cfg-status"></span></div>`).join('')}
      </div>`;
  }
  function clsAdd(action, rowId) {
    const row = document.getElementById(rowId);
    clsPost({ action, ...rowVals(row) }, row.querySelector('.cfg-status'));
  }
  function clsDel(kind, key) { clsPost({ action: kind + '-remove', key }, null); }
  function clsAddPerson() {
    const row = document.getElementById('cls-ppl');
    const v = rowVals(row);
    clsPost({ action: 'person-add', email: v.email, name: v.name, group: v.group,
              teammate: row.querySelector('[data-f=teammate]').checked }, row.querySelector('.cfg-status'));
  }
  function clsMate(email, group, teammate) { clsPost({ action: 'person-add', email, group, teammate }, null); }
  function clsJev(account, on, btn) { clsPost({ action: 'jev', account, on }, btn.nextElementSibling); }

  // ---------- shell ----------
  const TABS = [['connections', 'Connections', renderConnectionsTab], ['context', 'Context', renderContextTab],
                ['classification', 'Classification', renderClassificationTab]];
  function show(id) {
    const tab = TABS.find(t => t[0] === id) || TABS[0];
    banner('');
    document.getElementById('tabs').innerHTML = TABS.map(([tid, label]) =>
      `<button class="tab${tid === tab[0] ? ' on' : ''}" data-tab="${tid}">${label}</button>`).join('');
    document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => {
      history.replaceState(null, '', '?tab=' + b.dataset.tab); show(b.dataset.tab);
    }));
    tab[2](document.getElementById('pane'));
  }
  // Inline onclick handlers in the tab markup need these on window.
  Object.assign(window, { connTestGmail, connAddGmail, connRemoveGmail, connTestSingle,
                          connSaveSingle, connClearSingle, ctxAdd, ctxSave, ctxToggle, ctxDelete,
                          clsAdd, clsDel, clsJev, clsAddPerson, clsMate });
  show(new URLSearchParams(location.search).get('tab'));
})();
</script>
</body>
</html>
