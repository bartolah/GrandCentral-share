function fmtDate(d){
  if(!d) return '';
  // Date-only values (todo dues) parse as UTC midnight = "5:00 PM" Pacific
  // the previous evening — a phantom time on things that HAVE no time.
  // Anchor them to local noon and never render a clock for them.
  const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(String(d));
  const dt=dateOnly?new Date(d+'T12:00:00'):new Date(d);
  if(isNaN(dt)) return String(d).slice(5,10);
  const today=new Date();
  if(dt.toDateString()===today.toDateString())
    return dateOnly?'Today':dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(Math.abs(today-dt)/864e5<7) return dt.toLocaleDateString([],{weekday:'short'});
  return dt.toLocaleDateString([],{month:'short',day:'numeric'});
}

/* ================= undo (E74) =================
   Actions run in the UI instantly but the SERVER call is held ~6s; Undo
   cancels it entirely — uniform undo for archive/dismiss/trash/snooze/
   done with no inverse endpoints. A newer action commits the older one;
   leaving the page commits whatever is pending (keepalive fetches). */
let PENDING=null;
function queueUndo(label, exec, restore){
  flushPending();                       // one held action at a time
  $('#undo-label').textContent=label;
  const bar=$('#undobar'); bar.hidden=false;
  const tick=$('#undo-tick'); tick.style.animation='none'; void tick.offsetWidth;
  tick.style.animation='';
  PENDING={exec,restore,timer:setTimeout(commitPending,6000)};
}
async function commitPending(){
  if(!PENDING) return;
  const p=PENDING; PENDING=null; clearTimeout(p.timer); $('#undobar').hidden=true;
  try { await p.exec(); }
  catch(e){ toast('Action failed — '+e.message+' (restored)'); p.restore(); }
}
function flushPending(){ if(PENDING) commitPending(); }
function undoPending(){
  if(!PENDING) return;
  const p=PENDING; PENDING=null; clearTimeout(p.timer); $('#undobar').hidden=true;
  p.restore(); toast('Undone');
}
window.addEventListener('pagehide', flushPending);
const STAR_PENDING=new Map();   // E93.8: key -> {v,ts} in-flight star intents
const DROPPED=new Map();   // key -> ts; E85: survives the poll's wholesale
                           // MAIL/TODOS replacement so acted-on rows can't
                           // resurrect before the server catches up
function restoreItem(i){
  return ()=>{ DROPPED.delete(i.key);
    if(i.type==='mail'){ if(!MAIL.includes(i.raw)) MAIL.push(i.raw); }
    else { if(!TODOS.includes(i.raw)) TODOS.push(i.raw); }
    rebuild(); };
}
// E62: acting on the open item advances to the NEXT one instead of dumping
// you back to the list — triage keeps moving (done/snooze/dismiss/trash all
// funnel through here).
function dropLocal(i){
  DROPPED.set(i.key, Date.now());
  const wasOpen = OPEN===i.key;
  const idx = VISIBLE.findIndex(x=>x.key===i.key);
  if(i.type==='mail') MAIL=MAIL.filter(t=>t!==i.raw); else TODOS=TODOS.filter(t=>t!==i.raw);
  rebuild();   // refreshes VISIBLE
  if(wasOpen){
    const next = (idx>=0 && (VISIBLE[idx]||VISIBLE[idx-1])) || null;
    if(next){ KB=VISIBLE.indexOf(next); openItem(next.key); }
    else closePane();
  }
}
async function archiveItem(key){
  const i=findItem(key); if(!i||i.type!=='mail') return;
  dropLocal(i);
  queueUndo('Archived in Gmail',
    async ()=>{ await post('/mail-action',{action:'archive',thread_id:i.raw.thread_id,account:i.account}); },
    restoreItem(i));
}
async function handledItem(key){
  const i=findItem(key); if(!i) return;
  if(i.type==='todo'){ doneItem(key); return; }
  dropLocal(i);
  queueUndo('Marked handled — Gmail unchanged',
    async ()=>{ await post('/mail/triage',{action:'done',thread_id:i.raw.thread_id,account:i.account}); },
    restoreItem(i));
}
async function doneItem(key){
  const i=findItem(key); if(!i) return;
  // E60: completing a todo with grouped emails treats them as a group.
  // E154: since E142 couples usually archive on filing, "0 in inbox" is the
  // norm — the dialog degenerated to one confusing option (Bart hit this).
  // Nothing left to decide → complete quietly.
  if(i.type==='todo' && i.threads.length && !i.threads.some(t=>t.in_inbox)){
    doneTodoGroup(key,false); return;
  }
  if(i.type==='todo' && i.threads.length){
    const inInbox=i.threads.filter(t=>t.in_inbox);
    dlg(`<h3>✓ Complete "${esc(i.title.slice(0,50))}"</h3>
      <div class="status" style="margin:4px 0 10px">It has <b>${i.threads.length} grouped email(s)</b>${inInbox.length?` — ${inInbox.length} still in the inbox`:''}.</div>
      <div class="foot" style="flex-wrap:wrap">
        ${inInbox.length?`<button class="btn" onclick="closeDlg();doneTodoGroup('${esc(key)}',true)">✓ Complete + archive ${inInbox.length} email(s)</button>`:''}
        <button class="btn sec2" onclick="closeDlg();doneTodoGroup('${esc(key)}',false)">Complete, leave the emails</button>
        <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
    return;
  }
  dropLocal(i);
  queueUndo(i.type==='mail'?'Done — archiving in Gmail':'Todo done',
    async ()=>{
      if(i.type==='mail'){
        try { await post('/mail-action',{action:'archive',thread_id:i.raw.thread_id,account:i.account}); }
        catch(e){ if(!/already archived|not found in (INBOX|All Mail)/i.test(e.message)) throw e; }
        await post('/mail/triage',{action:'done',thread_id:i.raw.thread_id,account:i.account});
      } else {
        const out=await post('/task',{action:'done',id:i.raw.id});
        const nxt=(out.spawned||[])[0];
        if(nxt){ await loadMailTodos(); renderList();
          toast('⟳ next one due '+new Date(nxt.due+'T12:00').toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})); }
      }
    },
    restoreItem(i));
}
async function doneTodoGroup(key, archiveMail){
  const i=findItem(key); if(!i) return;
  try {
    if(archiveMail){
      const members=i.threads.filter(t=>t.in_inbox);
      for(let at=0; at<members.length; at+=50){
        await post('/mail/bulk',{action:'archive',
          items:members.slice(at,at+50).map(t=>({thread_id:t.thread_id,account:t.account}))});
      }
      const gone=new Set(members.map(t=>'m:'+t.account+':'+t.thread_id));
      MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
    }
    await post('/task',{action:'done',id:i.raw.id});
    dropLocal(i);
    toast(archiveMail?`Todo done — ${i.threads.filter(t=>t.in_inbox).length} email(s) archived with it`:'Todo done — emails left in place');
  } catch(e){ toast('Failed — '+e.message); }
}
async function starItem(key){
  const i=findItem(key); if(!i) return;
  try {
    if(i.type==='mail'){
      await post('/mail-action',{action:i.starred?'unstar':'star',thread_id:i.raw.thread_id,account:i.account});
      i.raw.starred=i.starred=!i.starred;
      // E93.8: /mail reflects Gmail only after the ~3-min sync — remember
      // the intent so the 60s poll can't flip the star back meanwhile.
      STAR_PENDING.set(i.key,{v:i.starred,ts:Date.now()});
    } else {
      await post('/task',{action:'update',id:i.raw.id,fields:{starred:!i.starred}});
      i.raw.starred=i.starred=!i.starred;
    }
    renderList(); if(OPEN===key) openItem(key,true);
  } catch(e){ toast('Star failed — '+e.message); }
}
async function trashItem(key){
  const i=findItem(key); if(!i||i.type!=='mail') return;
  dropLocal(i);
  queueUndo(`Deleting "${i.title.slice(0,40)}" — Gmail Trash`,
    ()=>post('/mail-action',{action:'trash',thread_id:i.raw.thread_id,account:i.account}),
    restoreItem(i));
}
async function dismissItem(key){
  const i=findItem(key); if(!i||i.type!=='mail') return;
  dropLocal(i);
  queueUndo('Dismissed — board only',
    ()=>post('/dismiss',{thread_id:i.raw.thread_id,account:i.account}),
    restoreItem(i));
}

/* ------- snooze (shared mail/todo) ------- */
function snoozeWhen(kind){
  const d=new Date();
  if(kind==='evening'){ d.setHours(18,0,0,0); if(d<new Date()) d.setDate(d.getDate()+1); }
  else if(kind==='tomorrow'){ d.setDate(d.getDate()+1); d.setHours(8,0,0,0); }
  else if(kind==='weekend'){ d.setDate(d.getDate()+((6-d.getDay()+7)%7||7)); d.setHours(8,0,0,0); }
  else if(kind==='nextweek'){ d.setDate(d.getDate()+((8-d.getDay())%7||7)); d.setHours(8,0,0,0); }
  return d.toISOString();
}
/* E83: Shortwave-style natural-language snooze — type "7 days" and the
   dialog resolves it live. Durations under a day land at the exact
   offset; day-or-longer targets land at 8am (the picker convention). */
function parseSnooze(input){
  const s=String(input||'').trim().toLowerCase().replace(/^in\s+/,'').replace(/\s+/g,' ');
  if(!s) return null;
  const now=new Date();
  const at=(x,h,mi)=>{ x.setHours(h,mi||0,0,0); return x; };
  const parseTime=t=>{ const m=t&&t.replace(/ /g,'').match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
    if(!m||(!m[2]&&!m[3])) return null;               // bare number = ambiguous
    let h=+m[1]; const mi=+(m[2]||0);
    if(m[3]==='pm'&&h<12) h+=12; if(m[3]==='am'&&h===12) h=0;
    return h>23||mi>59?null:{h,mi}; };
  const later=d=>d&&d>now?d:null;
  let m;
  if(m=s.match(/^(\d+(?:\.\d+)?) ?(min(?:ute)?s?|m|h(?:ou)?rs?|hrs?|h|d(?:ay)?s?|w(?:ee)?ks?|w|mo(?:nth)?s?)$/)){
    const n=+m[1], u=m[2], d=new Date(now);
    if(/^mo/.test(u)){ d.setMonth(d.getMonth()+Math.round(n)); return later(at(d,8)); }
    if(u[0]==='w'){ d.setDate(d.getDate()+Math.round(n*7)); return later(at(d,8)); }
    if(u[0]==='d'){ d.setDate(d.getDate()+Math.round(n)); return later(at(d,8)); }
    if(u[0]==='h') return later(new Date(now.getTime()+n*3600e3));
    return later(new Date(now.getTime()+n*60e3));
  }
  if(m=s.match(/^(tomorrow|tmrw|tonight)( (.+))?$/)){
    const d=new Date(now), t=parseTime(m[3]);
    if(m[1]==='tonight') return later(t?at(d,t.h,t.mi):at(d,18));
    d.setDate(d.getDate()+1); return later(t?at(d,t.h,t.mi):at(d,8));
  }
  const wd={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  if(m=s.match(/^(next )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*( (.+))?$/)){
    const d=new Date(now), t=parseTime(m[4]);
    let delta=(wd[m[2]]-d.getDay()+7)%7||7;
    if(m[1]&&delta<7) delta+=7;
    d.setDate(d.getDate()+delta); return later(t?at(d,t.h,t.mi):at(d,8));
  }
  const mo={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  if(m=s.match(/^(?:([a-z]{3,9}) (\d{1,2})|(\d{1,2}) ([a-z]{3,9}))( (.+))?$/)){
    const key=(m[1]||m[4]||'').slice(0,3);
    if(key in mo){
      const day=+(m[2]||m[3]), t=parseTime(m[6]);
      if(day>=1&&day<=31){
        const d=new Date(now.getFullYear(),mo[key],day);
        const cand=t?at(new Date(d),t.h,t.mi):at(new Date(d),8);
        if(cand<=now) cand.setFullYear(cand.getFullYear()+1);
        return later(cand);
      }
    }
  }
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})( (.+))?$/)){
    if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){
      const t=parseTime(m[4]);
      const cand=at(new Date(now.getFullYear(),+m[1]-1,+m[2]),t?t.h:8,t?t.mi:0);
      if(cand<=now) cand.setFullYear(cand.getFullYear()+1);
      return later(cand);
    }
  }
  const t=parseTime(s);
  if(t){ const d=at(new Date(now),t.h,t.mi); if(d<=now) d.setDate(d.getDate()+1); return d; }
  return null;
}
const snzFmt=d=>d.toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function snzPreview(){
  const v=$('#snz-nl').value, p=$('#snz-prev'); if(!p) return;
  const d=parseSnooze(v);
  p.textContent=d?('→ '+snzFmt(d)):(v.trim()?'…?':'');
  p.className='status'+(d?'':(v.trim()?' err':''));
}
let SNZ_KEY=null, SNZ_MON=null;
function snzCalHtml(){
  const [y,m]=SNZ_MON.split('-').map(Number);
  const first=new Date(y,m-1,1), gs=new Date(first); gs.setDate(1-first.getDay());
  const today=dOff(0);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gs); d.setDate(gs.getDate()+i); const iso=isoLocal(d);
    const out=d.getMonth()!==m-1, past=iso<today;
    cells+=`<div class="snz-day${out?' out':''}${past?' past':''}${iso===today?' today':''}"${past?'':` data-day="${iso}"`}>${d.getDate()}</div>`;
  }
  return `<div class="snz-cal">
    <div class="snz-cal-h"><button class="qbtn" type="button" onclick="snzCalNav(-1)">‹</button>
      <span>${new Date(y,m-1,1).toLocaleDateString([],{month:'long',year:'numeric'})}</span>
      <button class="qbtn" type="button" onclick="snzCalNav(1)">›</button></div>
    <div class="snz-dow">${['S','M','T','W','T','F','S'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="snz-days" onclick="snzCalPick(event)">${cells}</div></div>`;
}
function snzCalNav(n){
  const [y,m]=SNZ_MON.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  SNZ_MON=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const w=$('#snz-calwrap'); if(w) w.innerHTML=snzCalHtml();
}
function snzCalPick(e){
  const day=e.target.closest('.snz-day')?.dataset.day; if(!day) return;
  // 8am that day; if that's already gone (today, later), this evening 6pm
  let d=new Date(day+'T08:00:00');
  if(d<=new Date()) d=new Date(day+'T18:00:00');
  if(d<=new Date()){ toast('That time is already past'); return; }
  doSnoozeAt(SNZ_KEY, d.toISOString());
}
function snoozeDlg(key){
  const i=findItem(key); if(!i) return;
  SNZ_KEY=key; SNZ_MON=dOff(0).slice(0,7);
  dlg(`<h3>Snooze ${i.type==='todo'?'todo':'thread'}</h3>
    <label>Type a time — Enter snoozes</label>
    <input type="text" id="snz-nl" autocomplete="off" spellcheck="false"

    <div class="snz-grid">

      <button class="qbtn" onclick="doSnooze('${esc(key)}','weekend')">This weekend</button>

}
async function doSnooze(key,kind){
  const nlVal=()=>parseSnooze($('#snz-nl')?.value)?.toISOString()||null;
  const customVal=()=>$('#snz-custom')?.value?new Date($('#snz-custom').value).toISOString():null;
  let until = kind==='custom' ? customVal()
            : kind==='nl' ? nlVal()
            : kind==='auto' ? (($('#snz-nl')?.value||'').trim()?nlVal():customVal())
            : snoozeWhen(kind);
  if(!until){ toast(kind==='nl'?"Couldn't read that time — try \"7 days\" or \"tue 3pm\"":'Pick a time first'); return; }
  doSnoozeAt(key, until);
}
async function doSnoozeAt(key,until){
  const i=findItem(key); if(!i) return;
  closeDlg(); dropLocal(i);
  queueUndo('Snoozed until '+new Date(until).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'}),
    ()=>i.type==='mail'
      ? post('/mail/triage',{action:'snooze',thread_id:i.raw.thread_id,account:i.account,until})
      : post('/task',{action:'snooze',id:i.raw.id,until}),
    restoreItem(i));
}

const WIZ_SEC={
  email:       {ic:'✉',  nm:'Suggested todos from your email',
                d:'Read from recent people mail — things worth doing today or tomorrow.'},
  commitment:  {ic:'🤝', nm:'Promises you made',

/* E128: suggestions render as TILES — a scannable card wall per section
   instead of one long list. Same ids, same verbs, same votes. */
const wizNew=s=>Date.parse(s.created_at||0)>=Date.now()-864e5?1:0;
function wizTile(s){
  const src = s.kind==='email'
    ? (s.account&&s.thread_id?`<a href="#" onclick="openItem('m:${esc(s.account)}:${esc(s.thread_id)}');return false">✉ open the email</a>`:'')
    : (s.meeting_title?`<span style="color:var(--faint)">🎙 ${esc(s.meeting_title.slice(0,44))}</span>`:'');
  const nw = wizNew(s)?`<span class="chip new">✨ new</span>`:'';
  return `<div class="wiz-tile" id="wiz-${s.id}">
    <div class="t">${esc(s.title)}</div>
    <div class="why">${esc(s.why||'')}</div>
    ${src?`<div class="meta">${src}</div>`:''}
    ${nw||s.due||s.project?`<div class="meta">${nw}${s.due?`<span class="chip due">📅 ${esc(s.due)}</span>`:''}${s.project?`<span class="chip">${esc(theaterName(s.project))}</span>`:''}</div>`:''}
    <div class="acts">
      <button class="qbtn add" onclick="wizVote(${s.id},'approve',this)" title="Add as a todo">✓ Add</button>
      <button class="qbtn" onclick="wizVote(${s.id},'dismiss',this)" title="Dismiss — never suggested again">✕</button></div></div>`;
}
/* E128.1 (Bart: "the wizard is getting a bit too crazy") — each block
   shows 6 tiles; "+N more" opens the rest of that block. E158 ("the Wizard
   is too much"): last-24h arrivals lead each block (✨ new), then
   overdue/soonest due, then newest; the server expires anything pending
   past 7 days. */
const WIZ_MORE=new Set();
const WIZ_CAP=6;
function wizMore(k){ WIZ_MORE.has(k)?WIZ_MORE.delete(k):WIZ_MORE.add(k); renderWizard(); }
function wizMoreBtn(key,total){
  if(total<=WIZ_CAP) return '';
  return `<div style="margin-top:9px;text-align:center"><button class="qbtn" onclick="wizMore('${key}')">
    ${WIZ_MORE.has(key)?'⌃ Show fewer':`⌄ ${total-WIZ_CAP} more`}</button></div>`;
}
function wizInAcct(x){
  return !!ACCT && x.account===ACCT;
}
function renderWizard(){
  _FS=feedSuggestions();
  const secs=Object.entries(WIZ_SEC).map(([kind,meta])=>{
    const rows=WIZ.filter(s=>s.kind===kind&&wizInAcct(s))
      .sort((a,b)=>(wizNew(b)-wizNew(a))
        ||String(a.due||'9999').localeCompare(String(b.due||'9999'))||b.id-a.id);
    if(!rows.length) return '';
    const shown=WIZ_MORE.has(kind)?rows:rows.slice(0,WIZ_CAP);
    return `<div class="wiz-sec"><h3>${meta.ic} ${esc(meta.nm)} <span class="ct">${rows.length}</span>
        <span class="sp"></span><button class="qbtn" onclick="wizAll('${kind}',this)">✓ Add all ${rows.length}</button></h3>
      <div class="status">${esc(meta.d)}</div>
      <div class="wiz-grid">${shown.map(wizTile).join('')}</div>${wizMoreBtn(kind,rows.length)}</div>`;

let REG=null;
async function ensureReg(){

  try { const r=await fetch('/registry').then(r=>r.json()); if(r.ok) REG=r.registry; }
  catch(e){ REG={rules:[],operations:[],theaters:[],objectives:[]}; }
  return REG;
}
const catchAllOf=th=>((REG?.operations)||[]).find(o=>o.catch_all&&(o.theaters||[]).includes(th));
async function addRule(match_type,value,operation){
  try {
    await post('/registry',{entity:'rule',action:'add',fields:{match_type,value,operation}});
    REG?.rules?.push({match:{type:match_type,value:String(value).toLowerCase()},operation});
    toast('Rule saved — '+match_type+' "'+value+'" files here from now on');
  } catch(e){ toast('Rule not saved — '+e.message); }
}
function fedByHtml(scopeId){
  if(!REG){ ensureReg().then(()=>renderList()); return ''; }
  const ops=(REG.operations||[]).filter(o=>(o.theaters||[]).includes(scopeId)).map(o=>o.id);
  const targets=new Set([scopeId,...ops]);
  const rules=(REG.rules||[]).filter(r=>targets.has(r.operation));
  if(!rules.length) return '';
  const ic={sender:'👤',domain:'@',label:'🏷',subject:'❝'};
  return `<div class="fedby"><span class="fb-k">fed by</span> ${rules.slice(0,10).map(r=>
    `<span class="chip" title="${esc(r.match.type)} rule → ${esc(theaterName(r.operation))}">${ic[r.match.type]||''} ${esc(r.match.value)}</span>`).join('')}${rules.length>10?` <span class="status">+${rules.length-10} more</span>`:''}</div>`;
}
/* E89 Phase 3: deterministic filing-pattern suggester — no LLM, just your
   own history: a sender/label whose filed mail concentrates ≥80% (n≥4) in
   one place, with no rule yet, is one click from becoming a rule. */
function feedSuggestions(){
  if(!REG) return [];
  const ruled=new Set((REG.rules||[]).map(r=>r.match.type+':'+String(r.match.value).toLowerCase()));
  const send={}, lab={};
  MAIL.forEach(x=>{ if(!x.project) return;
    const em=(x.last_from_email||'').toLowerCase();
    if(em) (send[em]=send[em]||{})[x.project]=((send[em][x.project]||0)+1);
    (x.labels||[]).forEach(l=>{ if(!l.startsWith('GC/')) (lab[l]=lab[l]||{})[x.project]=((lab[l][x.project]||0)+1); });
  });
  const out=[];
  const scan=(typ,table)=>Object.entries(table).forEach(([val,c])=>{
    const n=Object.values(c).reduce((a,b)=>a+b,0);
    const [op,k]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    if(n>=4 && k/n>=0.8 && !ruled.has(typ+':'+val.toLowerCase())) out.push({typ,val,op,n,pct:Math.round(100*k/n)});
  });
  scan('sender',send); scan('label',lab);
  return out.sort((a,b)=>b.n-a.n).slice(0,20);
}
let _FS=[];
function suggestDlg(){
  _FS=feedSuggestions();
  if(!_FS.length){ closeDlg(); return; }
  dlg(`<h3>🧭 Your filing patterns, as rules</h3>
    <div class="status" style="margin:2px 0 8px">Each of these consistently lands in one place — make it automatic. Rules run in the mapping pass and outrank guesses.</div>`+
    _FS.map((s,ix)=>`<div class="stw-row"><div class="info">
        <div class="em">${s.typ==='label'?'🏷':'👤'} ${esc(s.val)}</div>
        <div class="why">${s.n} filed · ${s.pct}% → <b>${esc(theaterName(s.op))}</b></div></div>
      <button class="qbtn" onclick="makeFeedRule(${ix},this)">Make rule</button></div>`).join('')+
    `<div class="foot"><button class="btn sec2" onclick="closeDlg()">Done</button></div>`);
}

  const s=_FS[ix]; btn.disabled=true;

/* ================= E204: Add to todo =================
   Shortwave's picker, Bart's favourite part: "you can create a to-do on the
   fly… and group emails into that to-do." One box — type to find a todo or
   to name a new one; the first row is always "Create", pre-filled from the
   email when there is one. Enter picks, ↑↓ move, Esc leaves. Membership
   becomes a GC/Todo/<name> Gmail label server-side (todo_labels). */
let TP={keys:[],opts:[],at:0};
function todoPick(keys){
  keys=(keys||[]).filter(k=>findItem(k)&&k.startsWith('m:'));
  if(!keys.length) return;
  const first=findItem(keys[0]);
  TP={keys,opts:[],at:0,suggest:keys.length===1?String(first.title||'').replace(/^((re|fwd?|fw):\s*)+/i,'').trim().slice(0,120):''};
  dlg(`<div class="tk-h">Add ${keys.length>1?keys.length+' emails':''} to todo</div>
    <input id="tp-q" placeholder="Create or search todo…" autocomplete="off" oninput="tpRender()" onkeydown="tpKey(event)">
    <div class="tk-list" id="tp-list"></div>
    <div class="tk-foot">↵ add · ↑↓ move · esc close — the todo becomes a <b>GC/Todo/…</b> label in Gmail</div>`,'tpick');
  tpRender(); setTimeout(()=>$('#tp-q')?.focus(),30);
}
function tpRender(){
  const q=($('#tp-q')?.value||'').trim(), ql=q.toLowerCase();
  const inTodo=new Set(TP.keys.map(k=>k.slice(2)));
  const accts=new Set(TP.keys.map(k=>findItem(k)?.account));
  if(accts.size>1){ $('#tp-list').innerHTML='<div class="tk-o" style="cursor:default;color:var(--faint)">These emails are from different accounts — a todo holds one account\'s mail. Select one account at a time.</div>'; TP.opts=[]; return; }
  const todos=ITEMS.filter(i=>i.type==='todo'&&todoFits(i.raw,[...accts][0])&&(!ql||(i.title+' '+(i.snip||'')).toLowerCase().includes(ql)))
    .sort((a,b)=>String(todoActivity(b)).localeCompare(String(todoActivity(a)))).slice(0,ql?30:40);
  const exact=todos.some(t=>t.title.toLowerCase()===ql);
  const name=q||TP.suggest;
  TP.opts=[...(name&&!exact?[{create:name}]:[]), ...todos.map(t=>({todo:t}))];
  TP.at=Math.min(TP.at,Math.max(0,TP.opts.length-1));
  $('#tp-list').innerHTML=TP.opts.map((o,ix)=>o.create
    ? `<div class="tk-o ${ix===TP.at?'on':''}" onmouseenter="TP.at=${ix};tpHi()" onclick="tpGo(${ix})">${ic('sparkle')}<span>Create "${esc(o.create)}"</span></div>`
    : `<div class="tk-o ${ix===TP.at?'on':''}" onmouseenter="TP.at=${ix};tpHi()" onclick="tpGo(${ix})">${ic('into')}<span>${esc(o.todo.title)}</span>
        <span class="n">${(o.todo.threads||[]).length?(o.todo.threads.length+' thread'+(o.todo.threads.length>1?'s':'')):''}</span></div>`).join('')
    ||'<div class="tk-o" style="cursor:default;color:var(--faint)">Type a name to create a todo</div>';
  void inTodo;
}
function tpHi(){ document.querySelectorAll('#tp-list .tk-o').forEach((el,ix)=>el.classList.toggle('on',ix===TP.at)); }
function tpKey(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
    TP.at=Math.max(0,Math.min(TP.opts.length-1,TP.at+(e.key==='ArrowDown'?1:-1))); tpHi();
    document.querySelector('#tp-list .tk-o.on')?.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ e.preventDefault(); tpGo(TP.at); }

async function tpGo(ix){

function btFind(q){

async function btLink(id){

async function doBulkToTodo(){

/* E168: recurring todos. One open occurrence at a time — completing a
   repeating todo writes the next, counted from its DUE date so a Monday
   task stays on Mondays, and rolled past today so a long-late chore
   resumes ahead instead of spawning another overdue row. */
const RECUR_LABEL={daily:'every day',weekdays:'every weekday',weekly:'every week',
  biweekly:'every 2 weeks',monthly:'every month',yearly:'every year'};
const recurOpts=sel=>'<option value="">does not repeat</option>'+
  Object.entries(RECUR_LABEL).map(([k,v])=>`<option value="${k}" ${sel===k?'selected':''}>⟳ ${v}</option>`).join('');

/* ================= pane ================= */
async function openItem(key, keepScroll){
  // E115: a todo is a PLACE now, not a pane — opening one navigates into it.
  if(key.startsWith('t:')){ const it=findItem(key); if(it) return openTodoPlace(it.raw.id); }
  // E189 (Bart: "my emails aren't loading in the Home view when I click on
  // them"): Home hides the reading pane (body.home-on .pane{display:none}),
  // so a click here has to step out of Home first. The feed used to do this
  // itself; E180 swapped in the shared row and lost it.
  if(SCOPE.kind==='home'){ const it=findItem(key);
    return homeOpen(it&&it.project?it.project:'__none', key); }
  sfx('open');
  OPEN=key; document.body.classList.add('pane-open'); renderList();
  let i=findItem(key);
  if(!i && key.startsWith('m:')){
    // E73: a thread outside the synced set (Sent view) — build a stub and
    // let the live /thread fetch fill it in.
    const parts=key.split(':');
    i={type:'mail', key, account:parts[1],
       raw:{thread_id:parts.slice(2).join(':'), account:parts[1],
            link:'https://mail.google.com/mail/?authuser='+encodeURIComponent(acctEmail(parts[1]))+'#all/'},
       who:'', title:'…', snip:'', goals:[], labels:[], needs:false,
       starred:false, note:'', threads:[]};
    ITEMS.push(i);   // temporary residency so actions can find it
  }
  if(!i) return;
  $('#pane').classList.add('open');
  if(!keepScroll) $('#pane').innerHTML=paneShell(i,'<div class="empty">Loading thread…</div>');
  try {
    const r=await fetch(`/thread?thread_id=${i.raw.thread_id}&account=${i.account}`);
    const out=await r.json();
    if(!out.ok) throw new Error(out.error||'failed');
    i._msgs=out.messages||[]; i._tlabels=out.labels||[];
    if(i.title==='…'&&i._msgs.length) i.title=i._msgs[i._msgs.length-1].subject||'(no subject)';
    renderThreadPane(i);
  } catch(e){ $('#pane').innerHTML=paneShell(i,`<div class="empty">Could not load thread — ${esc(e.message)}</div>`); }
}
/* E146: walk the list from inside the reading pane — ‹ › buttons and the
   ←/→ keys step through the visible emails without going back out. */
function paneNav(dir){
  const mails=VISIBLE.filter(x=>x.type==='mail');
  if(!mails.length) return;
  let ix=mails.findIndex(x=>x.key===OPEN);
  ix=ix<0?(dir>0?0:mails.length-1):ix+dir;
  if(ix<0){ toast('Top of the list'); return; }
  if(ix>=mails.length){ toast('End of the list'); return; }
  KB=VISIBLE.indexOf(mails[ix]);
  openItem(mails[ix].key);
}
addEventListener('keydown',e=>{
  if(!document.body.classList.contains('pane-open')) return;
  const ae=document.activeElement;
  if(ae&&(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)||ae.isContentEditable)) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); paneNav(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); paneNav(1); }
});
/* ------- E157: reply OPTIONS — 2-3 distinct drafted responses, on demand.
   Conservative by design (Bart): nothing pre-generates; the ✍️ button is
   the only trigger, and an option is just text until he edits + sends
   through the normal confirmed path. ------- */
async function replyOptions(key,btn){

      <div class="foot"><button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);

/* ================= E212: the Classified button (phase 3) =================
   Plan: "Email classification with Jev". Collapsed: one line of what the
   email is and what it needs. Expanded: every field, where it came from
   (rules / haiku / jev / you) and a picker to correct it — a correction is
   pinned for good and feeds tuning. Account-scoped like everything else. */
const CLS={};                 // key -> {date, data}
let CLS_OPEN=false;
const CLS_OPTS={
  type:['Correspondence','Team collaboration','Prospect','Cold pitch','Spam','Update','Newsletter','Receipt','Calendar','Promo','Other'],
  respond:[['yes','Reply needed'],['optional','Reply optional'],['no','No reply needed']],
  priority:[['0','0 · noise'],['1','1 · routine'],['2','2 · someone waiting'],['3','3 · urgent']],
  waiting_on:[['none','Nobody'],['teammate','A teammate'],['outside','Someone outside']],
  relationship:[['teammate','Teammate'],['company','Company group'],['frequent','Frequent contact'],['known','Known'],['new','New'],['machine','Automated']],
};
const clsLbl=(f,v)=>{ const o=(CLS_OPTS[f]||[]).find(x=>Array.isArray(x)?x[0]===String(v):x===v); return o?(Array.isArray(o)?o[1]:o):(v==null?'—':String(v)); };
const clsDay=d=>{ if(!d) return ''; const t=new Date(d+'T12:00:00'); const diff=Math.round((t-new Date(dOff(0)+'T12:00:00'))/864e5);
  return diff===0?'today':diff===1?'tomorrow':diff===-1?'yesterday':diff<0?`${-diff}d overdue`:t.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); };
function clsHtml(i){
  const c=CLS[i.key];
  if(!c||c.date!==i.date){ setTimeout(()=>clsLoad(i),0); return `<span class="cls-sum muted">🏷 Classifying…</span>`; }
  const d=c.data;
  if(!d) return `<span class="cls-sum muted" title="Only mail from the last 30 days is classified">🏷 Not classified — older than 30 days</span>`;
  const bits=[d.type];
  if(d.respond==='yes') bits.push('Reply needed'); else if(d.respond==='optional') bits.push('Reply optional');
  if(d.waiting_on&&d.waiting_on!=='none') bits.push('Waiting on '+(d.waiting_who||d.waiting_on));
  if(d.follow_up) bits.push('Follow up '+clsDay(d.follow_up));
  if(d.group) bits.push(d.group);
  if(d.value!=null) bits.unshift(`<span class="val val-${valBand(d.value)}">${d.value}</span>`);
  const k=esc(i.key);
  let h=`<button class="cls-sum" onclick="CLS_OPEN=!CLS_OPEN;clsRender('${k}')" title="How this email is classified — click to see why and correct it">
    🏷 <b>Classified:</b> ${bits.map((b,n)=>n===0&&d.value!=null?b:esc(b)).join(' · ')} <span class="cls-car">${CLS_OPEN?'▴':'▾'}</span></button>`;
  if(!CLS_OPEN) return h;
  const src=f=>{ const s=(d.source||{})[f]||'rules'; return `<span class="cls-src cls-${esc(s)}" title="${s==='you'?'Your correction — kept for good':'Decided by '+esc(s)}">${esc(s==='jev'&&d.jev_model?d.jev_model:s)}</span>`; };
  const sel=(f,v)=>`<select onchange="clsFix('${k}','${f}',this.value)">${(CLS_OPTS[f]||[]).map(o=>{ const [val,lab]=Array.isArray(o)?o:[o,o];
      return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`; }).join('')}
      ${v==null||v==='unsure'?`<option value="" selected disabled>${v==='unsure'?'Not judged yet':'—'}</option>`:''}</select>`;
  const row=(label,f,ctl)=>`<div class="cls-row"><span class="cls-k">${label}</span><span class="cls-v">${ctl}</span>${src(f)}</div>`;
  // the other person: the sender, or — when you wrote last — who you wrote to
  const sender=clsOther(i);
  h+=`<div class="cls-panel">
    ${d.summary?`<div class="cls-why">✨ ${esc(d.summary)}</div>`:''}
    ${d.value!=null?`<div class="cls-row"><span class="cls-k">Value</span><span class="cls-v"><span class="val val-${valBand(d.value)}">${d.value}</span>
      <span class="muted">${(d.value_parts||[]).map(([n,v])=>`${esc(n)} ${v>0?'+':''}${v}`).join(' · ')}</span></span><span></span></div>`:''}
    ${row('Type','type',sel('type',d.type))}
    ${row('Respond','respond',sel('respond',d.respond))}
    ${row('Priority','priority',sel('priority',d.priority))}
    ${row('Waiting on','waiting_on',sel('waiting_on',d.waiting_on)+(d.waiting_who?` <span class="muted">${esc(d.waiting_who)}</span>`:''))}
    ${row('Follow up','follow_up',`<input type="date" value="${esc(d.follow_up||'')}" onchange="clsFix('${k}','follow_up',this.value)">
       ${d.follow_up?`<span class="muted">${esc(clsDay(d.follow_up))}</span> <button class="qbtn" onclick="clsFix('${k}','follow_up','')">Clear</button>`:''}`)}
    ${row('Relationship','relationship',sel('relationship',d.relationship)+(d.group?` <span class="muted">${esc(d.group)}</span>`:''))}
    ${(d.reasons||[]).length?`<ul class="cls-reasons">${d.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
    <div class="cls-foot">
      ${sender&&!OWN.has(sender)?`<button class="qbtn" onclick="clsGroupDlg('${k}')">👥 Add ${esc(sender)} to a group…</button>`:''}
      <span class="muted">Corrections stick and tune the classifier · ${esc(d.version||'')}</span></div>
  </div>`;
  return h;
}
function clsOther(i){
  const em=(i.raw.last_from_email||'').toLowerCase();
  if(em&&!OWN.has(em)) return em;
  return ((i.raw.participants||[]).map(emOf).find(e=>e&&!OWN.has(e))||'');
}
async function clsLoad(i){
  const c=CLS[i.key]; if(c&&c.loading) return;
  CLS[i.key]={date:i.date,loading:true,data:c?.data||null};
  try{
    const out=await fetch(`/classify?account=${encodeURIComponent(i.account)}&thread_id=${encodeURIComponent(i.raw.thread_id)}`,{cache:'no-store'}).then(r=>r.json());
    CLS[i.key]={date:i.date,data:out.ok?out.classification:null};
  }catch(e){ CLS[i.key]={date:i.date,data:null}; }
  clsRender(i.key);
}
function clsRender(key){
  const el=document.getElementById('cls-bar'); const i=findItem(key);
  if(el&&i&&el.dataset.key===key) el.innerHTML=clsHtml(i);
}
async function clsFix(key,field,value){
  const i=findItem(key); if(!i) return;
  try{
    const out=await post('/classify',{action:'correct',account:i.account,thread_id:i.raw.thread_id,field,value});
    CLS[key]={date:i.date,data:out.classification}; clsRender(key); toast('Saved — this email keeps your answer');
  }catch(e){ toast('Not saved — '+e.message); clsRender(key); }
}

function paneShell(i, inner){
  const labels=(i.labels||[]);
  const k=esc(i.key);
  // E115: an attached email carries its todo — navigate / return / move.
  const owner = i.type==='mail'
    ? TODOS.find(t=>(t.threads||[]).some(th=>th.thread_id===i.raw.thread_id&&th.account===i.account)) : null;
  // E204: Shortwave's reading pane — a row of line icons (the same verbs, in
  // the same order, as the list's hover strip), a big subject with its label
  // chips, then who is on the thread on a hairline band.
  const tb=(icn,title,js,cls)=>`<button class="tool ${cls||''}" onclick="${js}" title="${esc(title)}">${ic(icn)}</button>`;
  const who=(()=>{
    if(i.type!=='mail') return '';
    const ps=(i.raw.participants||[]).map(p=>({nm:nmOf(p),em:emOf(p)}));
    const others=ps.filter(p=>!OWN.has(p.em));
    const first=nm=>{ const n=String(nm||'').trim(); return /\s/.test(n)&&!/@/.test(n)?n.split(/\s+/)[0]:n.split('@')[0]; };
    const names=[...new Set(others.map(p=>first(p.nm||p.em)).filter(Boolean))];
    if(!names.length) return '';
    const shown=names.slice(0,4), extra=names.length-shown.length;

  })();
  return `
  <div class="pane-tools">
    ${tb('x','Close (Esc)','closePane()')}

    <span class="sp"></span>

    ${tb('clock','Snooze',`snoozeDlg('${k}')`)}
    ${tb('flag',i.type==='mail'?(i.pinned?'Unpin':'Pin'):(i.starred?'Unpin':'Pin'),`pinItem('${k}')`)}

    ${i.type==='mail'?tb('todo','Create or add to account todo',`todoPick(['${k}'])`):''}
    ${i.type==='mail'?tb('trash','Trash — recoverable 30 days, with Undo',`trashItem('${k}')`,'warn'):''}
    ${i.type==='mail'?`<button class="tool" onclick="paneMore('${k}',event)" title="More — star, label, note, contacts, Gmail…">${ic('more')}</button>`:''}
  </div>
  <!-- E207: an open email shows its labels again, and can be given one. The
       bounded-triage pass took this strip out along with the project and goal
       chips that sat beside it — but those were retired concepts and these are
       real Gmail labels, so only the chips deserved to go. Its own datalist id:
       the new-todo dialog renders a #lbl-list of its own and both can be open. -->
  <div class="pane-head"><h2>${esc(i.title)}</h2>
    ${labels.map(l=>`<span class="chip lbl" style="${lblStyle(l)}">${esc(l)} <b style="cursor:pointer;font-weight:400" onclick="rmLabel('${k}','${esc(l)}')" title="Remove label">×</b></span>`).join(' ')}
    ${i.type==='mail'?`<input class="lbl-add" list="pane-lbl-list" placeholder="＋" title="Add a label"
      onkeydown="if(event.key==='Enter'){addLabel('${k}',this.value);this.value=''}">
    <datalist id="pane-lbl-list">${labelUniverse().map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`:''}</div>
  ${i.type==='mail'?`<div class="cls-bar" id="cls-bar" data-key="${k}">${clsHtml(i)}</div>`:''}
  ${owner?`<div class="todo-bar">${ic('checkcircle','sm')} In todo
    <b onclick="openTodoPlace(${owner.id})" title="Open the todo">${esc(owner.text.slice(0,52))}</b></div>`:''}

const HTML_WRAP='<base target="_blank"><style>body{margin:12px;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;color:#111;word-break:break-word}img{max-width:100%;height:auto}</style>';
/* ================= E172: HTML mail in a dark skin =================
   Bart sent a screenshot of the reading pane: a white sheet with near-black
   text dropped into a black UI. Every HTML body went through HTML_WRAP with
   color:#111 on the iframe's default white ground.

   Mail cannot simply be inverted — a newsletter's artwork, buttons and brand
   colors assume a light page, and forcing them dark makes black-on-black. So
   the decision is per email: one that carries its own design keeps its paper
   (framed, so it reads as a document); a plain one — most people mail, and
   the Outlook forward in the screenshot — is rendered in the board's palette.
   ◐ in the pane toolbar overrides the guess either way. */
const darkSkin = () => (document.documentElement.dataset.skin||'2049')!=='daylight';
const mailRender = () => localStorage.getItem('gc2_mail_render') || 'auto';
function mailBringsOwnDesign(html){
  // Outlook emits a <style> block, ~100 layout tables and a background-color
  // on nearly every cell for mail that is visibly two lines of text — and all
  // of those backgrounds are rgba(255,255,255,0). So the question is not
  // "does it declare a background" but "does any of it actually paint": an
  // opaque ground that is not white, or a bgcolor attribute that is not white.
  const h=String(html||'');
  const CLEAR=/^(transparent|none|inherit|initial|unset|currentcolor|#fff(fff)?f?f?|white|rgba?\(\s*255\s*,\s*255\s*,\s*255\s*(?:,\s*[\d.]+\s*)?\))$/i;
  const painted=[];
  for(const m of h.matchAll(/background(?:-color)?\s*:\s*([^;"'}]+)/gi)){
    const v=(m[1]||'').trim();
    if(/rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*0?\.?0*\s*\)/i.test(v)) continue;   // fully transparent
    if(/^url\(/i.test(v)) return true;                                                      // a background image is art
    if(!CLEAR.test(v)) painted.push(v);
  }
  for(const m of h.matchAll(/bgcolor\s*=\s*["']?([^"'\s>]+)/gi)){
    const v=(m[1]||'').trim();
    if(!CLEAR.test(v)) painted.push(v);
  }
  // One amber highlight inside a 121KB Outlook forward is not a design — that
  // single declaration is what kept Bart's screenshot on white paper. A real
  // template paints a ground, a header and buttons, so ask for three.
  if(painted.length < 3) return false;
  // E173: and a page whose only grounds are off-whites (#f0f2f2 receipts,
  // #d9d2e9 panels) is a light DOCUMENT, not artwork — its design is "a white
  // page", which is exactly what clashes with a dark board. Those get drawn
  // in the board's palette too; artwork needs a ground with some colour in it.
  return painted.some(v=>{ const l=cssLum(v); return l===null || l<0.86; });
}
/* Relative luminance of a CSS colour, or null when we cannot read it (a
   var(), a named colour) — unreadable counts as "might be artwork". */
function cssLum(v){
  let r,g,b;
  const hex=/^#([0-9a-f]{3}|[0-9a-f]{6})\b/i.exec(v);
  const rgb=/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(v);
  if(hex){ let x=hex[1]; if(x.length===3) x=x.split('').map(c=>c+c).join('');
    r=parseInt(x.slice(0,2),16); g=parseInt(x.slice(2,4),16); b=parseInt(x.slice(4,6),16); }
  else if(rgb){ r=+rgb[1]; g=+rgb[2]; b=+rgb[3]; }
  else return null;
  return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
}
function mailNative(html){
  if(!darkSkin()) return false;                 // Daylight: the paper IS the palette
  if(mailRender()==='original') return false;   // you asked for it as sent
  if(mailRender()==='native') return true;      // …or for it to match the board
  return !mailBringsOwnDesign(html);
}
function htmlWrapFor(html){

  // mail never reaches this branch.
  return `<base target="_blank"><style>

/* E84: HTML emails often carry URLs as bare text (Instagram, plain-ish
   marketing mail). Walk the sanitized DOM and linkify TEXT NODES only —
   existing anchors, attributes, script/style are never touched. */
function linkifyHtml(html){
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null);
    const targets=[]; let n;
    while(n=walker.nextNode()){
      if(n.parentElement&&n.parentElement.closest('a,script,style,textarea')) continue;
      if(/(https?:\/\/|(^|[\s(])www\.)/i.test(n.nodeValue||'')) targets.push(n);
    }
    targets.forEach(t=>{
      const span=doc.createElement('span');
      span.innerHTML=linkify(t.nodeValue);
      t.parentNode.replaceChild(span,t);
    });

  }catch(e){ return html; }

/* E107: trim quoted history. HTML bodies — find the first known quote
   container (Gmail/Apple/Outlook/Yahoo/Thunderbird) and hide it plus all
   following siblings; the ••• toggle lives in the PARENT (the sandboxed
   iframe can't run scripts — the parent flips display via contentDocument). */
function trimQuoteHtml(html){
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const q=doc.querySelector('div.gmail_quote, blockquote[type=cite], #divRplyFwdMsg, .yahoo_quoted, .moz-cite-prefix');
    if(!q||!q.parentNode) return {html, trimmed:false};
    const r=doc.createRange(); r.setStart(doc.body,0); r.setEndBefore(q);
    const pre=r.cloneContents();
    if(!(r.toString().trim()||pre.querySelector('img'))) return {html, trimmed:false};
    const wrap=doc.createElement('div');
    wrap.className='gc-quote'; wrap.style.display='none';
    q.parentNode.insertBefore(wrap,q);
    let n=wrap.nextSibling; const moves=[];
    while(n){ moves.push(n); n=n.nextSibling; }

/* Plain text: line index where the quoted tail starts, or -1. Never cuts
   at line 0 — a message that's ALL quote stays visible. */
function qCutText(t){
  const L=t.split('\n');
  let sawContent=false;
  for(let k=0;k<L.length;k++){
    const s=L[k].trim();
    if(sawContent){
      if(/^On .{6,160} wrote:$/.test(s)) return k;
      if(/^On \S/.test(s)&&L[k+1]&&/wrote:$/.test(L[k+1].trim())) return k;
      if(/^-{2,}\s*(Original|Forwarded) [Mm]essage\s*-{2,}/.test(s)||/^_{10,}$/.test(s)) return k;
      if(s.startsWith('>')){
        const rest=L.slice(k).filter(x=>x.trim());
        if(rest.filter(x=>x.trim().startsWith('>')).length>=rest.length*0.6)
          return (k>1&&/(wrote|écrit|schrieb):?$/.test(L[k-1].trim()))?k-1:k;
      }
    }
    if(s&&!s.startsWith('>')) sawContent=true;
  }

}

/* ================= rich body editor (E65) =================
   Bold/italic/underline/bullets/links via contenteditable. The PLAIN text
   is always what the send audits; HTML rides as the alternative part only
   when real formatting was used. */
function richBody(id){
  return `<div class="rb-bar">
      <button type="button" onclick="rbCmd('${id}','bold')" title="Bold (⌘B)"><b>B</b></button>
      <button type="button" onclick="rbCmd('${id}','italic')" title="Italic (⌘I)"><i>I</i></button>
      <button type="button" onclick="rbCmd('${id}','underline')" title="Underline"><u>U</u></button>
      <button type="button" onclick="rbCmd('${id}','insertUnorderedList')" title="Bulleted list">•</button>
      <button type="button" onclick="rbLink('${id}')" title="Insert link">🔗</button>

function rbImg(id){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=async ()=>{
    const f=inp.files[0]; if(!f) return;
    if(f.size>3.5*1024*1024){ toast('Keep images under ~3.5 MB (5 MB total per send)'); return; }
    const url=await new Promise((res,rej)=>{ const r=new FileReader();
      r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
    const el=$('#'+id); el.focus();
    document.execCommand('insertImage', false, url);
  };

/* E104: on send, data: images leave the HTML and become cid-related
   attachments — Gmail strips data: URIs but renders cid images inline. */
function extractInlineImages(html){
  if(!html||!html.includes('data:')) return {html, atts:[]};
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const atts=[]; let k=0;
    doc.querySelectorAll('img').forEach(img=>{
      const m=(img.getAttribute('src')||'').match(/^data:(image\/[a-z+.-]+);base64,(.+)$/i);
      if(!m) return;
      k++;
      const cid='gcimg'+k+'-'+Math.abs(m[2].length*2654435761%1e8).toString(36);
      atts.push({name:'image'+k+'.'+(m[1].split('/')[1]||'png').replace('+xml',''),
                 mime:m[1], data:m[2], cid});
      img.setAttribute('src','cid:'+cid);
      img.setAttribute('style','max-width:100%');
    });
    return {html:doc.body.innerHTML, atts};
  }catch(e){ return {html, atts:[]}; }
}
function rbInit(id, text){
  const el=$('#'+id); if(!el) return;
  el.innerText=text||'';
  el.focus();
  const rng=document.createRange(); rng.setStart(el,0); rng.collapse(true);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng);
}
function rbCmd(id,cmd){ $('#'+id).focus(); document.execCommand(cmd); }
function rbLink(id){

}
const rbText = id => $('#'+id)?.innerText||'';
/* E155: composer bodies snapshot to localStorage on every pause in typing,
   so a dropped tunnel (or a closed tab) can't eat a half-written reply.
   Cleared on a successful send / draft save; offered back on reopen. */
const bakKey = k => 'gc_bak_'+k;
function armBak(bodyId,k){
  const el=$('#'+bodyId); if(!el) return;
  el.addEventListener('input',()=>{
    clearTimeout(armBak._t);
    armBak._t=setTimeout(()=>{
      const txt=el.innerText;
      if(txt.trim()) localStorage.setItem(bakKey(k), JSON.stringify({ts:Date.now(),text:txt}));
    },400);
  });
}
function clearBak(k){ clearTimeout(armBak._t); localStorage.removeItem(bakKey(k)); }
function offerBak(bodyId,k){
  try {
    const raw=localStorage.getItem(bakKey(k)); if(!raw) return;
    const b=JSON.parse(raw);
    if(!b?.text?.trim() || Date.now()-b.ts>48*3600e3){ localStorage.removeItem(bakKey(k)); return; }
    const el=$('#'+bodyId); if(!el) return;
    const strip=document.createElement('div');
    strip.className='bak-strip';
    strip.innerHTML='📝 Unsent text from '+new Date(b.ts).toLocaleString()+' recovered <button class="qbtn">Restore</button> <button class="qbtn">Discard</button>';
    const [rst,dsc]=strip.querySelectorAll('button');
    rst.onclick=()=>{ el.innerText=b.text; strip.remove(); };   // plain text — formatting isn't kept
    dsc.onclick=()=>{ clearBak(k); strip.remove(); };
    el.parentNode.insertBefore(strip, el.previousElementSibling||el);
  } catch(e){}
}
function rbHtml(id){
  const el=$('#'+id); if(!el) return null;

  acct=acct||ACCT; if(!acct) return [];
  try { const r=await fetch('/contacts?account='+encodeURIComponent(acct),{cache:'no-store'}).then(r=>r.json());
    if(r.ok) CONTACTS[acct]=r.contacts||[]; } catch(e){}

const contactStr=c=>c.name&&c.name!==c.email?`${/[,"]/.test(c.name)?'"'+c.name.replace(/"/g,'')+'"':c.name} <${c.email}>`:c.email;

// A typed name with no address becomes the matching contact: exact name, else
// one contact whose name or address starts with it. Otherwise it stays as typed.
function resolveContact(raw){
  if(emOf(raw)) return raw;

  const list=contactList($('#dl-contacts')?.dataset.acct);

  if(exact.length) return contactStr(exact[0]);
  const pre=list.filter(c=>(c.name||'').toLowerCase().startsWith(q)||c.email.startsWith(q));

function chipHtml(raw){
  const em=emOf(raw), nm=nmOf(raw)||em;

function chipKey(e,id){

  if(e.key==='Enter'||e.key===','||e.key===';'){ e.preventDefault(); chipCommit(id,inp); }
  else if(e.key==='Backspace'&&!inp.value){

function chipCommit(id,inp){
  const v=(inp.value||'').trim().replace(/[,;]+$/,'');
  if(!v) return;
  // Dev #34: split on commas outside quotes and <>, so "Smith, John" <j@x>
  // stays one contact; a bare typed name resolves to its contact's address.
  const parts=(v.match(/(?:"[^"]*"|<[^>]*>|[^,;])+/g)||[]).map(s=>s.trim()).filter(Boolean).map(resolveContact);
  inp.insertAdjacentHTML('beforebegin', parts.map(chipHtml).join(''));

}

/* ================= signatures (E53) =================
   Stored server-side in the E19 context corpus (kind 'voice', active:0 so
   Ask never ingests them) so they follow Bart across devices. context text
   collapses whitespace, so newlines ride as ⏎ and decode here. */
let SIGS={}, SIG_IDS={};
async function loadSigs(){
  try {
    const out=await fetch('/context').then(r=>r.json());
    (out.context||[]).forEach(n=>{
      const m=String(n.text||'').match(/^\[signature:([a-z0-9_-]+)\]\s?([\s\S]*)$/);
      if(m){ SIGS[m[1]]=m[2].replace(/⏎/g,'\n').trim(); SIG_IDS[m[1]]=n.id; }
    });
  } catch(e){}
}
async function saveSig(acct,text){
  text=(text||'').trim();
  const enc=`[signature:${acct}] ${text.replace(/\n/g,'⏎')}`;
  try {
    if(SIG_IDS[acct] && !text){
      await post('/context',{action:'delete',id:SIG_IDS[acct]});
      delete SIGS[acct]; delete SIG_IDS[acct];
    } else if(SIG_IDS[acct]){
      await post('/context',{action:'update',id:SIG_IDS[acct],fields:{text:enc}});
      SIGS[acct]=text;
    } else if(text){
      const out=await post('/context',{action:'add',scope:'global',kind:'voice',text:enc});
      SIG_IDS[acct]=out.id; SIGS[acct]=text;
      try { await post('/context',{action:'update',id:out.id,fields:{active:0}}); } catch(e){}
    }
    toast('Signature saved');
  } catch(e){ toast('Signature save failed — '+e.message); }
}
function sigDlg(fromKey){
  const i=fromKey?findItem(fromKey):null;
  const accts=[...new Set(MAIL.map(x=>x.account))];
  dlg(`<h3>Email signatures</h3>

    accts.map(a=>`<label>${esc(a)}</label><textarea data-sig="${esc(a)}" style="min-height:70px">${esc(SIGS[a]||'')}</textarea>`).join('')+
    (i&&i.type==='mail'?`<div class="td-quick" style="margin-top:8px"><button class="qbtn" onclick="grabSig('${esc(fromKey)}')">↙ Copy my last message in this thread (trim it into a signature)</button></div>`:'')+
    `<div class="foot"><button class="btn" onclick="doSaveSigs(this)">Save</button>
     <button class="btn sec2" onclick="closeDlg()">Close</button></div>`);
}
function grabSig(key){
  const i=findItem(key);
  const mine=[...(i._msgs||[])].reverse().find(m=>OWN.has(((m.from||'').match(/[\w.+-]+@[\w.-]+/)||[''])[0].toLowerCase()));
  if(!mine){ toast('No message from you in this thread'); return; }
  const ta=document.querySelector(`[data-sig="${i.account}"]`);

async function doSaveSigs(btn){

/* ================= reply / send (the ONE send path) ================= */
async function ensureMsgs(i){
  if(i._msgs?.length) return true;
  try {
    const out=await fetch(`/thread?thread_id=${i.raw.thread_id}&account=${i.account}`).then(r=>r.json());
    if(out.ok){ i._msgs=out.messages||[]; i._tlabels=out.labels||[]; return true; }
  } catch(e){}
  return false;
}
function replyRecipients(i,mode){
  const msgs=i._msgs||[];
  if(!msgs.length){
    // Fallback: derive from the thread row itself — last sender + the other
    // participants — so Reply NEVER opens with empty recipients.
    const em=s=>((String(s).match(/[\w.+-]+@[\w.-]+/)||[''])[0]).toLowerCase();
    const parts=(i.raw.participants||[]).filter(p=>em(p)&&!OWN.has(em(p)));
    const to=i.raw.last_direction==='inbound'&&i.raw.last_from?[i.raw.last_from]:parts.slice(0,1);
    const toSet=new Set(to.map(em));
    const cc=parts.filter(p=>!toSet.has(em(p)));
    const seen=new Set(), uq=a=>{ const e=em(a); if(!e||seen.has(e))return false; seen.add(e); return true; };
    return { to:to.filter(uq).join(', '), cc:mode==='reply'?'':cc.filter(uq).join(', ') };
  }
  // Dev #26: answering one message answers ITS sender and recipients
  const last=sdMsg(i)||[...msgs].reverse().find(m=>!OWN.has(((m.from||'').match(/[\w.+-]+@[\w.-]+/)||[''])[0].toLowerCase()))||msgs[msgs.length-1];
  const addrs = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
  const em = s => ((s.match(/[\w.+-]+@[\w.-]+/)||[''])[0]).toLowerCase();
  let to=[last.from,...addrs(last.to)].filter(a=>a&&!OWN.has(em(a)));
  const cc=addrs(last.cc).filter(a=>!OWN.has(em(a)));
  if(mode==='reply'){
    const sender=[last.from].filter(a=>a&&!OWN.has(em(a)));
    to=sender.length?sender:to.slice(0,1);
  }
  const seen=new Set(), uq=a=>{ const e=em(a); if(seen.has(e))return false; seen.add(e); return true; };
  return { to:to.filter(uq).join(', '), cc:mode==='reply'?'':cc.filter(uq).join(', ') };
}
/* Inline composer — lives IN the pane below the messages (E53: "keep the
   reply window as part of the side panel"). Context carries over: reply-all
   recipients prefilled, subject threaded, signature appended, and the prior
   conversation quoted below (on by default, toggleable). */
function buildQuote(i,mode){
  const m=sdMsg(i)||(i._msgs||[]).slice(-1)[0]; if(!m) return '';
  const src=(m.body||'').trim()||'(original was an HTML message — open in Gmail to view)';
  if(mode==='fwd')
    return '\n\n---------- Forwarded message ----------\n'
      +'From: '+(m.from||'').trim()
      +'\nDate: '+(m.date||'').replace('T',' ').slice(0,16)
      +'\nSubject: '+(i.title||'')
      +(m.to?'\nTo: '+m.to:'')+'\n\n'+src;
  const head=`On ${(m.date||'').replace('T',' ').slice(0,16)}, ${(m.from||'').trim()} wrote:`;
  return '\n\n'+head+'\n'+src.split('\n').map(l=>'> '+l).join('\n');
}

  // E94.2: native confirm() is silently suppressed by Chrome in some

  // is the second click, with the recipient count in view.

    const allAtts=[...SD_ATTS.map(a=>({name:a.name,mime:a.mime,data:a.data})),...ext.atts];

    }

document.querySelectorAll('.dk').forEach(b=>b.onclick=()=>{
  DOCK=DOCK===b.dataset.dock?null:b.dataset.dock;
  document.querySelectorAll('.dk').forEach(x=>x.classList.toggle('on',DOCK===x.dataset.dock));
  $('#dock').classList.toggle('open',!!DOCK); renderDock();
});
// E90: on a phone the dock is full-screen — without this there is no
// visible way back (Bart: "the tabs in the mobile view trap you").
function closeDock(){
  DOCK=null;
  document.querySelectorAll('.dk').forEach(x=>x.classList.remove('on'));
  $('#dock').classList.remove('open');
}
const dockX='<button class="dk-x" onclick="closeDock()" title="Close">✕</button>';
let CAL_EVS=[]; const CAL_OPEN=new Set();
function calExpand(ix){ CAL_OPEN.has(ix)?CAL_OPEN.delete(ix):CAL_OPEN.add(ix); renderDock(); }
function _lnk(u,pre=''){
  let t=u;
  for(;;){ const m=t.match(/(?:[.,;:!?)\]]|&(?:quot|lt|gt|#39|amp);)$/); if(!m) break; t=t.slice(0,-m[0].length); }
  if(!t) return pre+u;
  const href=/^https?:/i.test(t)?t:'https://'+t;
  return pre+'<a href="'+href+'" target="_blank" rel="noopener">'+t+'</a>'+u.slice(t.length);
}
const linkify=s=>esc(String(s))
  .replace(/https?:\/\/[^\s]+/g,u=>_lnk(u))
  .replace(/(^|[\s(])(www\.[^\s]+)/g,(x,p,u)=>_lnk(u,p));

/* E76: the dock shows ANY day. Baked board days (7d from the last sweep)
   win because they carry project mappings; anything else comes live from
   GET /calendar, fetched a month-grid (42d) at a time and cached. Day
   notes for the fetched range ride along so the journal shows everywhere. */
let CAL_DATE=null;                     // ISO day the dock shows
const CAL_LIVE={};                     // date -> {label, events} from GET /calendar
const CAL_FETCHED=new Set(), CAL_PEND=new Set();   // month-grid starts
function calDay(iso){
  return (BOARD.calendar||[]).find(x=>x.date===iso)||CAL_LIVE[iso];
}
function calGridStart(iso){            // Sunday starting the 6-week grid
  const [y,m]=iso.split('-').map(Number);
  const first=new Date(y,m-1,1), gs=new Date(first);
  gs.setDate(1-first.getDay());
  return gs;
}
function calEnsure(iso){
  const gs=calGridStart(iso), startISO=isoLocal(gs);
  if(CAL_FETCHED.has(startISO)||CAL_PEND.has(startISO)) return;
  CAL_PEND.add(startISO);
  const end=new Date(gs); end.setDate(gs.getDate()+41);
  Promise.all([
    fetch(`/calendar?start=${startISO}&days=42`).then(r=>r.json()),
    fetch(`/daynotes?start=${startISO}&end=${isoLocal(end)}`).then(r=>r.json()),
  ]).then(([c,n])=>{
    if(c.ok){ c.calendar.forEach(d=>CAL_LIVE[d.date]=d); CAL_FETCHED.add(startISO); }
    // never clobber a note that's already cached — it may hold unsaved typing
    if(n.ok) n.notes.forEach(x=>{ if(!(x.date in DN_CACHE)) DN_CACHE[x.date]={text:x.text,updated_at:x.updated_at}; });
  }).catch(()=>{}).finally(()=>{
    CAL_PEND.delete(startISO);
    if(DOCK==='cal') renderDock();
    if(CV_MON) renderCalPage();
  });
}
function calGo(iso){ CAL_DATE=iso; CAL_OPEN.clear(); renderDock(); }
function calNav(n){ const d=new Date(CAL_DATE+'T12:00:00'); d.setDate(d.getDate()+n); calGo(isoLocal(d)); }
function calMonth(v){ const t=dOff(0); calGo(v===t.slice(0,7)?t:v+'-01'); }
function calMonthOptions(sel){
  const now=new Date(), out=[];
  for(let k=-12;k<=12;k++){
    const d=new Date(now.getFullYear(),now.getMonth()+k,1);
    const v=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    out.push(`<option value="${v}"${v===sel?' selected':''}>${d.toLocaleDateString([],{month:'short',year:'numeric'})}</option>`);
  }
  if(!out.some(o=>o.includes('selected')))
    out.push(`<option value="${sel}" selected>${sel}</option>`);
  return out.join('');
}
function calEvHtml(e,ix){
  const open=CAL_OPEN.has(ix);
  return `<div class="cal-item ${open?'open':''}">
    <div class="cal-ev clickable" onclick="calExpand(${ix})">
      <span class="tm">${esc(e.time||'')}</span>
      <span class="bar" style="background:${e.cal==='personal'?'#d8b06a':'#9db9e8'}"></span>
      <div style="flex:1;min-width:0"><div class="tt">${esc(e.title)}</div>
        ${e.location&&!open?`<div class="cal-loc">📍 ${esc(e.location.slice(0,40))}</div>`:''}</div>
      <span class="fold">${open?'⌃':'⌄'}</span></div>
    ${open?`<div class="cal-detail">
      ${e.location?`<div>📍 ${esc(e.location)}</div>`:''}
      ${e.detail?`<div>${linkify(e.detail)}</div>`:''}
      ${e.project?`<div><span class="chip" onclick="closeOvl();openOvl('project','${esc(e.project)}')">${esc(theaterName(e.project))}</span>${e.why?` <span style="color:var(--faint);font-size:10.5px">via ${esc(e.why)}</span>`:''}</div>`:''}
      <div style="color:var(--faint);font-size:10.5px">calendar: ${esc(e.cal||'?')}</div>
      ${!e.location&&!e.detail?'<div style="color:var(--faint)">No more detail on the calendar entry.</div>':''}
    </div>`:''}
  </div>`;
}
function renderDock(){
  if(!DOCK) return; const d=$('#dock');
  // A poll re-render while typing in a journal box (or the E124 quick-add)
  // would eat the caret and the keystrokes since the last autosave — skip
  // until blur.
  if(d.contains(document.activeElement)&&(document.activeElement.classList?.contains('dn-edit')
    ||document.activeElement.id==='dk-todo-in')) return;
  if(DOCK==='cal'){
    // E70/E76: any day by REAL date — ‹ › steps days, the dropdown jumps
    // months, ⤢ opens the full month page; the day's journal rides on top
    // and events expand on click with their full detail.
    const todayISO=dOff(0);
    if(!CAL_DATE) CAL_DATE=todayISO;
    const day=calDay(CAL_DATE);
    CAL_EVS=day?(day.events||[]):[];
    const dt=new Date(CAL_DATE+'T12:00:00');
    const label=CAL_DATE===todayISO?'Today':dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
    d.innerHTML=`<h3 style="gap:5px;padding-left:12px;padding-right:10px">${dockX}
        <button class="qbtn cal-nav" onclick="calNav(-1)" title="Previous day">‹</button>
        <span style="text-align:center;min-width:74px">${esc(label)}</span>
        <button class="qbtn cal-nav" onclick="calNav(1)" title="Next day">›</button>
        <span class="sp"></span>
        ${CAL_DATE!==todayISO?`<button class="qbtn cal-nav" onclick="calGo(dOff(0))" title="Back to today">⌂</button>`:''}
        <select class="cal-monsel" onchange="calMonth(this.value)">${calMonthOptions(CAL_DATE.slice(0,7))}</select>
        <button class="qbtn cal-nav" onclick="openCalPage()" title="Open the full calendar">⤢</button>
      </h3><div class="dbody">
      <div class="dock-note">
        <div class="dn-head" style="font-size:10px">📓 ${CAL_DATE===todayISO?'Notes':'Notes — '+esc(dt.toLocaleDateString([],{month:'short',day:'numeric'}))} <span class="dk-dn-status" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>
        <textarea id="dk-dn" class="dn-edit" data-date="${CAL_DATE}" placeholder="${CAL_DATE===todayISO?"today's plan / journal…":'journal for this day…'}"></textarea>
      </div>`+
      (day?(CAL_EVS.map(calEvHtml).join('')||'<div class="empty">No events this day.</div>')
          :'<div class="empty">Loading calendar…</div>')+'</div>';
    if(!day) calEnsure(CAL_DATE);
    const dk=$('#dk-dn');
    if(dk){ dk.addEventListener('input',dnInput); loadDayNote(CAL_DATE); dnFill(); }
  } else if(DOCK==='brief'){
    // E179 (Bart: "Today's brief should live in the right sidebar, not be
    // included in each view in the main pane"): the brief is context, not a
    // row in the list — it belongs beside the work, readable from any view.
    if(PLAN===undefined){ PLAN=null;
      fetch('/plan').then(r=>r.json()).then(r=>{ PLAN=r.plan||null; if(DOCK==='brief') renderDock(); }).catch(()=>{}); }
    const live=ITEMS.filter(i=>!i.snoozed&&inAcct(i));
    const todayItems=live.filter(isToday)
      .sort((a,b)=>(a.type==='todo'?0:1)-(b.type==='todo'?0:1)
        ||String(a.due||'9999').localeCompare(String(b.due||'9999')));
    const tline=i=>`<div class="hrow" data-key="${esc(i.key)}">
      <em style="cursor:pointer" title="${i.type==='todo'?'Done':'Archive'}" onclick="event.stopPropagation();doneItem('${esc(i.key)}')">${i.type==='todo'?'◯':'✉'}</em>
      <span class="ht" style="cursor:pointer" onclick="event.stopPropagation();openItem('${esc(i.key)}')">${esc(i.title.slice(0,44))}</span>
      <span class="hd">${i.my_day?'☀ ':''}${i.due?esc(String(i.due).slice(5)):''}</span></div>`;
    d.innerHTML=`<h3>${dockX}◎ Today's brief<span class="sp"></span></h3>
      <div class="dk-body">${briefCardHtml(todayItems,tline)}</div>`;
  } else if(DOCK==='wait'){
    d.innerHTML=`<h3>${dockX}Waiting on others</h3><div class="dbody">`+
      ((BOARD.waiting_on||[]).map(w=>{
        const drafted=w.nudge_state==='drafted';
        // the WHOLE row opens the thread (matching the Goals dock) — the
        // tiny "open" link alone read as a dead row
        return `<div class="dk-row clickable" onclick="openItem('m:${esc(w.account)}:${esc(w.thread_id)}')"><div class="w">${esc(w.who)}</div><div>${esc(w.what||'')}</div>
        <div class="m">${esc(theaterName(w.project)||'')} · quiet ${w.age_days}d ·
          <button class="nudge ${drafted?'sent':''}" onclick="event.stopPropagation();nudge('${esc(w.account)}','${esc(w.thread_id)}',this)">${drafted?'Drafted ✓':'Nudge'}</button>
          <span class="m" style="opacity:.7">· click to open</span></div></div>`;
      }).join('')||'<div class="empty">Nobody owes you a reply.</div>')+'</div>';
  } else if(DOCK==='todos'){
    // E124: todos in the right rail — the open list, urgency first, plus a
    // quick add that pre-files to whatever you're looking at (same rule as
    // the ◯ Todo top button).
    const open=TODOS.filter(t=>!t.snoozed_active);
    const today=dOff(0);
    const rank=t=>(t.my_day===today?0:t.due&&t.due<=today?1:t.due?2:3);
    const rows=[...open].sort((a,b)=>rank(a)-rank(b)
      ||String(a.due||'9999').localeCompare(String(b.due||'9999'))||b.id-a.id);
    const scopeHint=SCOPE.kind==='project'&&SCOPE.id!=='__none'?theaterName(SCOPE.id).slice(0,22)
      :SCOPE.kind==='goal'?goalName(SCOPE.id).slice(0,22):null;
    d.innerHTML=`<h3>${dockX}Todos <span style="font-weight:400;color:var(--faint)">${open.length}</span>
        <span class="sp"></span>
        <button class="qbtn cal-nav" onclick="setScope('inbox',null);TAB='todos';syncTabs();renderList();renderRail()" title="Open the Todos tab">⤢</button></h3>
      <div class="dbody">
      <input type="text" id="dk-todo-in" class="dk-add" autocomplete="off"
        placeholder="＋ new todo${scopeHint?' → '+esc(scopeHint):''}… ⏎"
        onkeydown="if(event.key==='Enter')dkAddTodo()">`
      +rows.slice(0,40).map(t=>{
        const overdue=t.due&&t.due<today, isToday=t.due===today||t.my_day===today;
        const meta=[
          t.due?`<span style="${overdue?'color:var(--red);font-weight:600':isToday?'color:var(--note-head);font-weight:600':''}">due ${esc(String(t.due).slice(5))}</span>`:'',
          t.priority||'', t.operation_id?esc(theaterName(t.operation_id)):'',
          (t.threads||[]).length?`✉ ${t.threads.length}`:''].filter(Boolean).join(' · ');
        return `<div class="dk-row clickable" data-key="t:${t.id}" onclick="openItem('t:${t.id}')">
          <div class="w" style="display:flex;gap:7px;align-items:flex-start">
            <button class="dk-done" title="Done" onclick="event.stopPropagation();doneItem('t:${t.id}')">◯</button>
            <span>${esc(t.text.slice(0,80))}</span></div>
          ${meta?`<div class="m" style="margin-left:20px">${meta}</div>`:''}</div>`;
      }).join('')
      +(rows.length>40?`<div class="empty">+${rows.length-40} more — ⤢ opens the full tab</div>`:'')
      +(rows.length?'':'<div class="empty">Nothing open — add one above.</div>')+'</div>';
  } else if(DOCK==='ask'){ renderAsk(); }
}
/* E124: dock quick-add — resolves the current scope to ONE operation the
   way newTodoDlg does (exact op, else the theater's catch-all/General). */
async function dkAddTodo(){
  const inp=$('#dk-todo-in'); const text=(inp?.value||'').trim(); if(!text) return;
  const account=curAcct();
  if(!account){ toast('Pick an account tab first — a todo belongs to one account'); return; }
  try {
    await post('/task',{action:'add', text, account});
    inp.value='';
    toast('Todo added to '+acctLabel(account));
    await loadMailTodos();
    $('#dk-todo-in')?.focus();
  } catch(e){ toast('Failed — '+e.message); }
}
async function nudge(account,thread_id,btn){
  if(btn.disabled) return; btn.disabled=true; const t=btn.textContent; btn.textContent='Drafting…';
  try { const out=await post('/draft',{thread_id,account});
    btn.textContent='Drafted ✓'; btn.classList.add('sent');
    toast('Nudge drafted'+(out.to?' to '+out.to:'')+' — in Gmail Drafts, never auto-sent');
  } catch(e){ btn.textContent=t; btn.disabled=false; toast('Nudge failed — '+e.message); }
}

/* ------- E76: full-page calendar — a month grid with the journal on
   every day. Events come from the same baked-first/live-fetch resolver
   the dock uses; 📓 markers show days with notes; the side panel holds
   the selected day's events and its editable journal. ------- */
let CV_MON=null, CV_SEL=null;          // 'YYYY-MM' shown; ISO day selected
/* E167: the calendar reads two ways — ▦ the month, or ◷ the day in clock
   order with its work docked under each meeting (Bart picked the timeline
   mockup for exactly this). The choice sticks per device. */
let CAL_VIEW = localStorage.getItem('gc2_cal_view') || 'month';
function setCalView(v){ CAL_VIEW=v; localStorage.setItem('gc2_cal_view',v); renderCalPage(); }
const tlMin = t => { const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m?(+m[1]*60+ +m[2]):null; };
const tlHHMM = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function openCalPage(view){
  const t=dOff(0);
  if(view){ CAL_VIEW=view; localStorage.setItem('gc2_cal_view',view); }
  CV_SEL=CAL_DATE||t;
  CV_MON=CV_SEL.slice(0,7);
  $('#ovl').classList.add('cal-wide');
  $('#ovl-back').classList.add('open');
  renderCalPage();
}
function cvSelect(iso){
  CV_SEL=iso; renderCalPage(); loadDayNote(iso);
  if(DOCK==='cal'){ CAL_DATE=iso; renderDock(); }   // the dock follows along
}
function cvMonth(v){
  CV_MON=v;
  CV_SEL=v===dOff(0).slice(0,7)?dOff(0):v+'-01';
  renderCalPage();
}
function cvNav(n){
  const [y,m]=CV_MON.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  cvMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
}
/* Work that belongs to a meeting: its project's mail awaiting a reply and its
   todos due or late — the reason you open a calendar entry in the first place. */
function tlDock(ev){
  const p=ev.project?projTheater(ev.project):null;
  if(!p) return [];
  const today=dOff(0);
  return ITEMS.filter(i=>!i.snoozed&&(projTheater(i.project)===p||i.project===p))
    .filter(i=>i.type==='todo' ? (i.due&&i.due<=today)||i.my_day : (inboxLive(i)&&(i.needs||i.unread)))
    .sort((a,b)=>(a.type==='todo'?0:1)-(b.type==='todo'?0:1)||String(a.date||'').localeCompare(String(b.date||'')));
}
function tlRow({time,strong,dotClass,title,titleClass,meta,dock,dockClass,last}){
  return `<div class="tl-row">
    <div class="tl-time${strong?' strong':''}">${esc(time||'')}</div>
    <div class="tl-rail"><span class="tl-dot ${dotClass||''}"></span>${last?'':'<span class="tl-line"></span>'}</div>
    <div class="tl-body">
      <div class="tl-title ${titleClass||''}">${title}</div>
      ${meta?`<div class="tl-meta">${meta}</div>`:''}
      ${dock&&dock.length?`<div class="tl-dock ${dockClass||''}">${dock.join('')}</div>`:''}
    </div></div>`;
}
function renderCalTime(iso){
  const day=calDay(iso), all=[...((day&&day.events)||[])];
  const evs=all;
  const elsewhere=all.length-evs.length;
  const isToday_=iso===dOff(0);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const timed=evs.filter(e=>tlMin(e.time)!=null).sort((a,b)=>tlMin(a.time)-tlMin(b.time));
  const allDay=evs.filter(e=>tlMin(e.time)==null);
  const today=dOff(0);
  const late=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&i.type==='todo'&&i.due&&i.due<today)
    .sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  let lateIx=0;
  // Back-to-back meetings on one project would otherwise each claim the SAME
  // three items and read as three separate piles of work. A thing belongs to
  // the first meeting that can act on it.
  const docked=new Set();
  const out=[];
  if(allDay.length) out.push(tlRow({time:'all day',dotClass:'',title:allDay.map(e=>esc(e.title)).join(' · ')}));
  let nowPlaced=!isToday_;
  timed.forEach((e,ix)=>{
    const mins=tlMin(e.time);
    if(!nowPlaced&&mins>nowMin){
      nowPlaced=true;
      const until=mins-nowMin;
      const pick=late[lateIx];
      out.push(tlRow({time:tlHHMM(nowMin),strong:true,dotClass:'now',
        title:`<div class="tl-now-head"><span class="lbl">Now</span><span class="ln"></span>
          <span style="color:var(--faint);font-size:11.5px">${until} min until ${esc(e.title.slice(0,30))}</span></div>`,
        meta: until>=25&&pick
          ? `<div class="tl-open fits">Enough time for <b>${esc(pick.title.slice(0,54))}</b>
              <span class="chip due">${fdAge(pick.due)}d late</span>
              <div class="fd-acts"><button class="go" onclick="homeOpen('${esc(pick.project||'__none')}','${esc(pick.key)}')">Open it</button></div></div>`
          : ''}));
      if(until>=25&&pick) lateIx++;
    }
    // A real gap between meetings is a place to put something.
    const prev=timed[ix-1];
    if(prev){
      const gap=mins-(tlMin(prev.time)+30);
      if(gap>=60&&mins<=18*60){
        const pick=late[lateIx];
        out.push(tlRow({time:'', dotClass:'', titleClass:'',
          title:`<div class="tl-open${pick?' fits':''}">Open until ${esc(e.time)} — ${Math.round(gap/60*10)/10}h
            ${pick?`· <b>${esc(pick.title.slice(0,46))}</b> <span class="chip due">${fdAge(pick.due)}d late</span>`:''}</div>`}));
        if(pick) lateIx++;
      }
    }
    const dock=tlDock(e).filter(i=>!docked.has(i.key)).slice(0,3)
      .map(i=>{ docked.add(i.key); return i; })
      .map(i=>`<div class="d-row" onclick="closeOvl();homeOpen('${esc(i.project||'__none')}','${esc(i.key)}')">
      <b style="font-weight:600">${i.type==='todo'?'◯':esc((i.who||'').split('<')[0].trim().slice(0,18))}</b>
      <span class="t">${esc(i.title.slice(0,64))}</span>
      ${i.type==='todo'&&i.due&&i.due<today?`<span class="chip due">${fdAge(i.due)}d late</span>`
        :i.needs?`<span class="chip due">${fdAge(i.date)??0}d owed</span>`:''}</div>`);
    const key=dock.length>0;
    out.push(tlRow({time:e.time,strong:key,dotClass:key?'key':'',
      title:esc(e.title),titleClass:key?'key':'',
      meta:[e.location?'📍 '+esc(e.location):'',e.cal==='personal'?'personal':''].filter(Boolean).join(' · '),
      dock,dockClass:key?'key':'',last:ix===timed.length-1&&nowPlaced}));
  });
  if(!nowPlaced&&isToday_) out.push(tlRow({time:tlHHMM(nowMin),strong:true,dotClass:'now',last:true,
    title:`<div class="tl-now-head"><span class="lbl">Now</span><span class="ln"></span>
      <span style="color:var(--faint);font-size:11.5px">nothing else on the clock today</span></div>`}));
  if(!evs.length) out.push('<div class="empty">A clear track — nothing scheduled.</div>');
  const owed=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&i.type==='mail'&&inboxLive(i)&&i.needs).length;
  return `<div class="tl">${out.join('')}
    <div class="fd-foot">${late.length} late · ${owed} replies owed${elsewhere?` · ${elsewhere} meeting(s) under other accounts`:''}</div></div>`;
}
function renderCalPage(){
  if(!CV_MON) return;
  const o=$('#ovl');
  if(o.contains(document.activeElement)&&document.activeElement.classList?.contains('dn-edit')) return;
  const todayISO=dOff(0);
  const [y,m]=CV_MON.split('-').map(Number);
  const gs=calGridStart(CV_MON+'-01');
  calEnsure(CV_MON+'-01');
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(gs); d.setDate(gs.getDate()+i);
    const iso=isoLocal(d);
    const day=calDay(iso), evs=day?(day.events||[]):[];
    const note=((DN_CACHE[iso]||{}).text||'').trim();
    cells.push(`<div class="cv-cell${d.getMonth()===m-1?'':' out'}${iso===CV_SEL?' sel':''}" onclick="cvSelect('${iso}')">
      <div class="cv-d${iso===todayISO?' today':''}">${d.getDate()}</div>
      ${evs.slice(0,3).map(e=>`<div class="cv-ev"><span>${e.time==='all-day'?'•':esc(e.time)}</span> ${esc(e.title)}</div>`).join('')}
      ${evs.length>3?`<div class="cv-more">+${evs.length-3} more</div>`:''}
      ${note?`<div class="cv-note" title="${esc(note.slice(0,300))}">📓 ${esc(note.split('\n')[0].slice(0,42))}</div>`:''}
    </div>`);
  }
  const sd=calDay(CV_SEL), sevs=sd?(sd.events||[]):[];
  const sdt=new Date(CV_SEL+'T12:00:00');

let ASK_LOG=[], ASK_CHAT=null, ASK_BUSY=false;
function renderAsk(){
  const d=$('#dock');
  d.innerHTML=`<h3>${dockX}Ask Grand Central<span class="sp"></span>
      <button class="qbtn" onclick="askHistory()" title="Past conversations">🕘</button>
      <button class="qbtn" onclick="ASK_LOG=[];ASK_CHAT=null;renderAsk()" title="New chat">＋</button></h3>
    <div class="ask-log" id="ask-log">${ASK_LOG.map(t=>`<div class="ask-turn ${t.role==='user'?'you':''}"><span class="bub">${esc(t.text)}</span></div>`).join('')||'<div class="empty" style="padding:20px 0">Ask about your mail, todos, deals, calendar…</div>'}</div>
    <div class="ask-opts">
      <select id="ask-model"><option value="claude-sonnet-5">Sonnet 5</option>
        <option value="claude-opus-4-8">Opus 4.8</option><option value="claude-fable-5">Fable 5</option></select>
      <select id="ask-effort"><option value="">effort: default</option><option>low</option><option>medium</option><option>high</option></select>
      <span id="ask-busy"></span></div>
    <div class="ask-form"><textarea id="ask-in" placeholder="Ask… (Enter to send)"></textarea>
      <button class="btn" onclick="askSend()">→</button></div>`;
  $('#ask-model').value=localStorage.getItem('gc2_ask_model')||'claude-sonnet-5';
  $('#ask-effort').value=localStorage.getItem('gc2_ask_effort')||'';
  $('#ask-in').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); askSend(); } };
  const log=$('#ask-log'); log.scrollTop=log.scrollHeight;
}
async function askSend(){
  if(ASK_BUSY) return;
  const text=$('#ask-in').value.trim(); if(!text) return;
  const model=$('#ask-model').value, effort=$('#ask-effort').value;
  localStorage.setItem('gc2_ask_model',model); localStorage.setItem('gc2_ask_effort',effort);
  ASK_LOG.push({role:'user',text}); ASK_BUSY=true; renderAsk();
  $('#ask-busy').textContent='thinking…'; const t0=Date.now();
  const tick=setInterval(()=>{ const el=$('#ask-busy'); if(el) el.textContent=`thinking… ${Math.round((Date.now()-t0)/1000)}s`; },1000);
  try {
    const out=await post('/command',{text,model,effort:effort||undefined,chat_id:ASK_CHAT,
      history:ASK_LOG.slice(0,-1).map(t=>({role:t.role,text:t.text}))});
    ASK_CHAT=out.chat_id||ASK_CHAT;
    ASK_LOG.push({role:'assistant',text:out.reply||'(no reply)'});
  } catch(e){
    // E136: through the tunnel, Cloudflare cuts responses at ~100s while the
    // server keeps working and still persists the answer — say so.
    ASK_LOG.push({role:'assistant',
      text:'Error — '+e.message+'\n\nIf this was a long-running ask, the answer may still have completed server-side — check 🕘 History in a minute.'});
  }
  clearInterval(tick); ASK_BUSY=false; renderAsk();
}
async function askHistory(){
  try {
    const out=await fetch('/ask').then(r=>r.json());
    dlg(`<h3>Ask history</h3>`+((out.chats||[]).slice(0,20).map(c=>
      `<div class="dk-row" style="cursor:pointer" onclick="askOpen(${c.id})"><div class="w">${esc((c.title||'chat').slice(0,70))}</div>
       <div class="m">${esc((c.created_at||'').slice(0,16))} · ${c.turns||0} turns</div></div>`).join('')||'<div class="empty">No past chats.</div>')+
      `<div class="foot"><button class="btn sec2" onclick="closeDlg()">Close</button></div>`);
  } catch(e){ toast('History failed — '+e.message); }
}
async function askOpen(id){
  try {
    const out=await fetch('/ask?id='+id).then(r=>r.json());
    ASK_CHAT=id;
    ASK_LOG=(out.chat?.messages||out.chat||[]).map(m=>({role:m.role,text:m.text||m.content||''})).filter(m=>m.text);
    closeDlg(); DOCK='ask';
    document.querySelectorAll('.dk').forEach(x=>x.classList.toggle('on',DOCK===x.dataset.dock));

}
