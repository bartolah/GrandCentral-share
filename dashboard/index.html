  /* ================= E192: the phone pass =================
     Casey, on an iPhone: "the main views don't seem to fit on the screen and
     float around when I put my finger on it. The nav is too tight."
     Three causes: nothing capped horizontal overflow, so the shell panned
     under a finger and rubber-banded; the greeting was a flex row whose text
     column collapsed to ~120px and wrapped one word per line; and the top bar
     carried nine controls across 375pt. */
  /* ================= E200: the phone, in one place =================
     Every phone rule lives here once. Three separate .row rules and two
     .top rules had accumulated in this block, and the last one silently
     won — which is how the status-bar inset got "fixed" three times
     without changing anything. selftest now fails on a repeat. */
  @media (max-width: 760px) {
    /* 0 — E199: the inset lives in the SAME rule as the padding shorthand. E196 put it in its own rule earlier in this block, and the later `.top { padding: 8px; }
    ` reset it every time — which is why the clock kept sitting on the nav after two attempts to fix it. */ .acct-tabs { padding-top: 0; }
    .rail { padding-top: calc(10px + var(--safe-top)); }
    /* E200 — edge to edge, the way every other phone app does it: the list is the screen. Cards lose their side borders and radii and become full -bleed bands; the breathing room moves INSIDE the rows, where it helps reading, instead of outside them, where it just narrows the column. */
    .shell { padding: 0; }
    .main { padding: 0; }
    .list { padding: 0 0 calc(16px + var(--safe-bot)); }
    .sm-anchors { margin: 0; padding: 8px 12px; }
    /* E201 — the view switcher, on its own line. The 760px block set the
       strip to nowrap but left .crumb at `flex: 1 1 100%` from the desktop
       rule, so the breadcrumb ate the whole row and pushed Todos and Starred
       off the right edge; and because .main is a column flex, `flex: 0 1 auto`
       shrank the strip to 19px while its 32px tabs spilled over the rows
       above and below. Both gone: the strip cannot shrink, it wraps into two
       lines, and only the tab row scrolls sideways. */
    .list-head { flex: none; flex-wrap: wrap; overflow: visible; row-gap: 6px; padding: 8px 12px 8px; }
    .list-head .crumb { flex: 1 1 100%; margin: 0; }
    .ltabs {
      flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; overflow-y: visible;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 8px;
    }
    .ltabs::-webkit-scrollbar { display: none; }
    .ltab { min-height: 34px; display: inline-flex; align-items: center; padding: 7px 14px; }
    /* the preview-pane toggle is a two-column idea; a phone has one column */
    .pvbtn { display: none; }
    .list-head .group-pick { margin-left: 0; font-size: 12.5px; }
    /* E201 — on a phone the title owns line 1. Chips carry fixed content, so
       in a nowrap flex line the title was the only thing that could shrink:
       todos were arriving as "B..." and "Strate..." on a 390px screen. The
       line wraps now — title first, its overdue/label/date beneath it, the
       way every phone task list does it. */
    .row .l1 { flex-wrap: wrap; row-gap: 4px; overflow: visible; }
    .row .l1 .subj.todo-title {
      flex: 1 1 100%; white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .row .l1 .who { flex: 1 1 auto; max-width: 62%; }
    .row .meta {
      flex: 1 1 auto; margin-left: 0; padding-left: 0;
      display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .row .meta .when { margin-left: auto; }
    .ib-wrap, .fd-wrap { max-width: 100%; padding: 0 0 10px; }
    .ib-card { border-left: none; border-right: none; border-radius: 0; margin: 0 0 10px; box-shadow: none; }
    .ib-head { padding: 14px 8px 6px; }
    .ib-head .t { font-size: 13px; letter-spacing: .8px; text-transform: uppercase; }
    .row { padding: 14px 16px; min-height: 76px; align-items: center; gap: 12px; }
    .ib-nest { padding-left: 16px; }
    .fd-chips { padding-left: 10px; padding-right: 10px; }
    .hask { margin: 10px 16px; }
    .hgreet { margin: 12px 10px 4px; flex-wrap: wrap; gap: 8px; align-items: center; }
    .plan-card, .dk-body { margin-left: 0; margin-right: 0; }
    /* the day's meetings read as one swipeable row, not a stack of chips */
    .fd-chips.cal-strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; scroll-snap-type: x proximity; }
    .fd-chips.cal-strip::-webkit-scrollbar { display: none; }
    .fd-chips.cal-strip .chip { flex: 0 0 auto; scroll-snap-align: start; }
    /* 1 — the page is exactly the viewport, and never pans sideways */
    html { background: var(--bg-grad, var(--bg)); }
    html, body { overflow-x: hidden; overscroll-behavior: none; }
    .shell, .main, .list { max-width: 100vw; min-width: 0; overflow-x: hidden; }
    .hgreet .sp { display: none; }
    /* the desktop spacer would sort first and eat the row */
    .hgreet .htrain { font-size: 22px; order: 1; }
    .hgreet > div { order: 2; flex: 1 1 auto; min-width: 0; }
    /* E200: a segmented control under the greeting, full width, the way a phone app switches between two modes of the same screen. */
    .hgreet .fd-view { order: 3; flex: 1 1 100%; margin: 8px 0 0; }
    .hgreet .fd-view button { flex: 1 1 50%; padding: 9px 0; font-size: 14px; }
    .hgreet b { font-size: 19px; }
    .hgreet span:not(.htrain) { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 3 — the nav gets room: the wordmark and the ⚑ go (⚑ lives in ⚙), and what remains is a real touch target rather than a 28px dot */
    .top { gap: 6px; padding: calc(8px + var(--safe-top)) 8px 8px; }
    .brand h1 { display: none; }
    #fb-btn { display: none; }
    /* E206: ◐ joins ⚑ in the avatar menu. Seven controls in one row left the
       search box reading "Filter th"; five give it back its width. The menu
       entries that replace them are .phone-only, so the desktop bar is
       unchanged. */
    #skin-wrap { display: none; }
    .me-menu button.phone-only { display: flex; }
    .top-right { gap: 2px; }
    .tbtn { padding: 8px 9px; font-size: 15px; }
    .acct-tab { padding: 10px 12px; font-size: 13.5px; }
    .dockbar .dk { width: 42px; height: 42px; font-size: 18px; }
    /* 3b — E196/E199: bigger type, and rows tall enough to hit. A touch device has no hover, so the action tray never appears — a long press opens the same menu instead. */
    body { font-size: 15px; }
    .row .acts { display: none !important; }
    .row .selbox { top: 50%; transform: translateY(-50%); }
    .row .who { font-size: 15px; }
    .row .l2 .subj { font-size: 14.5px; }
    .row .l3 .prev { font-size: 13.5px; }
    .scope { padding: 11px 12px; font-size: 14.5px; }
    /* 4 — the reading pane is the whole screen here, so it owes the status bar and the home indicator their space. Without this its toolbar sits under the clock and the ✕ cannot be tapped at all — there was no way back out of an email. */
    .pane { padding-top: var(--safe-top); padding-bottom: var(--safe-bot); }
    .pane-tools { position: sticky; top: 0; z-index: 6; background: var(--card); gap: 3px; padding: 8px 8px 7px; row-gap: 4px; flex-wrap: nowrap; overflow: hidden; }
    .pane-tools .tool { min-width: 40px; height: 38px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
    /* the way out is a button, not a glyph lost in a row of them */
    .pane-tools .tool:first-child { border: 1px solid var(--line); border-radius: var(--r, 9px); padding: 0 12px; font-weight: 700; color: var(--ink); }
    .pane-head h2 { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pane-tools .tool.hide-sm { display: none; }
    .pane-tools .tool.only-sm { display: inline-flex; margin-left: auto; }
    .pane-note.empty-note { display: inline-flex; width: auto; padding: 4px 10px; font-size: 12.5px; opacity: .75; }
    .ai-line { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ai-line.open { -webkit-line-clamp: unset; }
    .replybar { padding-bottom: calc(8px + var(--safe-bot)); gap: 6px; }
    .replybar .qbtn { padding: 8px 12px; }
    .row .l1 .chip.lbl { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    .row .hl { gap: 4px; margin-left: 0; padding-left: 0; }
    .row .hl .chip { max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
    .row .lead, .row .selbox { width: 30px; height: 30px; }
  }


  /* ================= E204: Shortwave fidelity =================
     Casey, from a dozen Shortwave screenshots: "how tight the UI is, but how
     much information is visually conveyed… the buttons and actions aren't
     obtrusive, you don't see them until you interact… a thin line dividing
     the different sections." So: no cards inside the list, sections named in
     small capitals over a hairline, three-line rows with the chips at the
     END of the preview line, line icons that appear only on hover, groups
     that are rows among the mail, and todos that read as containers. */
  .svg-ic { width: 18px; height: 18px; flex: 0 0 auto; display: block; }
  .svg-ic.sm { width: 15px; height: 15px; }
  .svg-ic.lg { width: 22px; height: 22px; }

  /* the list head: breadcrumb left, quiet tools right, ONE row (#15) */
  .list-head { flex-wrap: nowrap; padding: 12px 16px 6px; }
  .list-head .crumb { flex: 1 1 auto; margin: 0; min-width: 0; }
  .list-head .ltabs { display: none !important; }
  .list-head .crumb { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .list-head .crumb .cr { flex: 0 0 auto; }
  .list-head .crumb .cr.on { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .grp .gw { white-space: nowrap; flex: 0 0 auto; }
  .grp .gs b { min-width: 4ch; }
  .grp .g2 > span[title] { flex: 0 0 auto; }
  .row .selbox { box-shadow: 0 0 0 2px var(--hover); }
  .tp-bar .all-done { white-space: nowrap; flex: 0 0 auto; }
  textarea.tp-title { resize: none; overflow: hidden; font: inherit; font-size: 20px; font-weight: 600; line-height: 1.3; display: block; }
  .lh-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: auto; }
  .lh-btn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-flex;
    align-items: center; justify-content: center; position: relative; }
  .lh-btn:hover { background: var(--hover); color: var(--ink); }
  .lh-btn.on { color: var(--blue); }
  .lh-btn.pvbtn { margin: 0; padding: 0; font-size: inherit; }
  .stw-badge { width: auto; padding: 0 8px; gap: 5px; font-size: 12px; font-weight: 600; color: var(--note-head); }
  .stw-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .lh-fresh { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border-radius: 8px;
    color: var(--faint); font-size: 12px; white-space: nowrap; }
  .lh-fresh:hover { background: var(--hover); color: var(--ink); }
  .lh-fresh.stale { color: var(--amber); }
  .lh-fresh.busy .svg-ic { animation: gc-spin .9s linear infinite; }
  @keyframes gc-spin { to { transform: rotate(360deg); } }
  .new-pill { position: sticky; top: 6px; z-index: 5; display: flex; justify-content: center; height: 0; overflow: visible; }
  .new-pill button { background: var(--blue); color: #fff; border-radius: 999px; padding: 5px 14px; font-size: 12.5px;
    font-weight: 600; box-shadow: 0 4px 14px rgba(20,40,120,.25); transform: translateY(0); }
  .ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; color: var(--faint);
    font-size: 12px; transition: height .15s; }

  /* sections: small capitals over a hairline, no card, no gutter */
  .ib-wrap { padding: 0 0 28px; max-width: none; }
  .ib-card, html[data-skin] .ib-card { background: none; border: none; box-shadow: none; border-radius: 0; margin: 0 0 4px; overflow: visible; }
  .ib-card .row, .ib-card .ib-row { border-bottom: none; }
  .ib-head { padding: 14px 16px 6px; gap: 8px; border-top: 1px solid var(--line); }
  .ib-wrap > .ib-head:first-child, .ib-wrap > .new-pill + .ib-head, .ib-wrap > .ptr + .ib-head { border-top: none; }
  .ib-head .t, html[data-skin] .ib-head .t { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--faint); font-weight: 650; }
  .ib-head .ib-count { background: var(--chip-bg); color: var(--muted); border-radius: 5px; padding: 0 6px; font-size: 11px; }
  .ib-head .fold, .ib-head .ib-sweep { color: var(--faint); cursor: pointer; width: 26px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 6px; padding: 0; }
  .ib-head .fold:hover, .ib-head .ib-sweep:hover { background: var(--hover); color: var(--ink); }
  .go-all { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); font-size: 13px; padding: 6px 16px 10px;
    cursor: pointer; font-weight: 500; }
  .go-all:hover { text-decoration: underline; }

  /* the row: 40px squircle, three lines, chips at the end of line three */
  .row { --row-pad: 10px; padding: var(--row-pad) 16px; gap: 14px; border-radius: 0; }
  .row .lead { width: 40px; height: 40px; border-radius: 10px; font-size: 14px; }
  .row .selbox { left: 16px; width: 40px; height: 40px; border-radius: 10px; }
  .row.open { background: var(--sel-bg, var(--blue-soft)); box-shadow: inset 3px 0 0 var(--blue); }
  .row.kb { outline: none; box-shadow: inset 3px 0 0 var(--blue); }
  .row:not(.read)::before { left: 4px; width: 5px; height: 5px; box-shadow: none; }
  .row .who { font-size: 14px; font-weight: 700; }
  .row.read .who { font-weight: 500; color: var(--ink); }
  .row .subj { font-size: 14px; font-weight: 650; }
  .row.read .subj { color: var(--ink); font-weight: 400; }
  .row .l2 { margin-top: 1px; }
  .row .l3 { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row .l3 .prev { flex: 1 1 auto; min-width: 0; font-size: 13.5px; color: var(--faint); }
  .row .when { font-size: 12.5px; }
  .row:not(.read) .when { color: var(--ink); font-weight: 650; }
  .row .meta { gap: 6px; }
  .row .l1 .meta { margin-left: auto; padding-left: 10px; }
  .row .hl { display: none; }
  .tail { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; color: var(--faint); }
  .tail .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .tail .st { color: var(--amber); display: inline-flex; }
  .tail .owed { color: var(--red); font-size: 11.5px; font-weight: 600; }
  .tail .snz { color: var(--blue); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
  body.pane-open .tail .chip { max-width: 90px; }
  /* hover: the time gives way to line icons — no box, no shadow */
  .row .acts { top: var(--row-pad); transform: none; right: 10px; background: var(--hover); border: none; box-shadow: none;
    border-radius: 8px; padding: 0 2px; gap: 0; }
  .row.open .acts { background: var(--sel-bg, var(--blue-soft)); }
  .row .acts button { width: 30px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); border-radius: 6px; }
  .row .acts button:hover { background: var(--chip-bg); color: var(--ink); }
  .row .acts button.warn:hover { background: var(--red-soft); color: var(--red); }

  /* a group is a row: icon, name + count, the senders who matter by name,
     everyone else as a face */
  .grp { display: flex; align-items: flex-start; gap: 14px; padding: 10px 16px; cursor: pointer; position: relative; }
  .grp:hover { background: var(--hover); }
  .grp.open { background: var(--sel-bg, var(--blue-soft)); box-shadow: inset 3px 0 0 var(--blue); }
  .grp .gic { width: 40px; height: 40px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .grp .gb { flex: 1 1 auto; min-width: 0; }
  .grp .g1 { display: flex; align-items: center; gap: 8px; }
  .grp .gname { font-size: 14px; font-weight: 700; }
  .grp.read .gname { font-weight: 500; }
  .grp .gn { background: var(--chip-bg); color: var(--muted); border-radius: 5px; padding: 0 6px; font-size: 11.5px; font-weight: 600; }
  .grp .gw { margin-left: auto; font-size: 12.5px; color: var(--faint); }
  .grp:not(.read) .gw { color: var(--ink); font-weight: 650; }
  .grp .g2 { display: flex; align-items: center; gap: 7px; margin-top: 3px; overflow: hidden; white-space: nowrap; font-size: 13.5px; }
  .grp .gs { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 0 1 auto; }
  .grp .gs b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; color: var(--ink); max-width: 190px; }
  .grp.read .gs b { font-weight: 500; }
  .grp .gbar { width: 1px; height: 14px; background: var(--line); flex: 0 0 auto; }
  .fav { width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; position: relative; overflow: hidden; display: inline-flex;
    align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .fav .avimg { border-radius: 5px; }
  .grp .acts { display: none; position: absolute; top: 10px; right: 10px; background: var(--hover); border-radius: 8px; }
  .grp:hover .acts { display: flex; }
  .grp:hover .gw { visibility: hidden; }
  .grp .acts button { width: 30px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 6px; }
  .grp .acts button:hover { background: var(--chip-bg); color: var(--ink); }
  /* a group opened: its own list, under a back arrow (Shortwave's split) */
  .split-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px 10px 8px; border-bottom: 1px solid var(--line); }
  .split-head .nm { font-size: 16px; font-weight: 600; }
  .split-head .sp { flex: 1; }
  .split-head button { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .split-head button:hover { background: var(--hover); color: var(--ink); }

  /* a todo is a container: blue check-circle, name, how many threads */
  .row.todo .lead.todo-ic { color: var(--blue); background: none; }
  .row.todo .subj.todo-title { font-weight: 500; font-size: 14.5px; }
  .row.todo.fresh .subj.todo-title { font-weight: 700; }
  .row.todo .tcount { font-size: 13.5px; color: var(--faint); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.todo .tcount .due { color: var(--red); }
  .row.todo .when.snz { color: var(--blue); font-weight: 650; display: inline-flex; align-items: center; gap: 4px; }

  /* the todo place — Shortwave's todo page */
  .tp { padding: 4px 0 0; }
  .tp-bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px 4px 8px; }
  /* Dev #16: the invitation bar at the top of an invite's thread */
  .rsvp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 12px 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .rsvp-bar .rsvp-q { flex: 1 1 220px; font-size: 13px; }
  .rsvp-bar .rsvp-b { display: flex; gap: 6px; flex-wrap: wrap; }
  .rsvp-bar .qbtn.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .rsvp-bar .status { flex-basis: 100%; }
  .tp-bar .sp { flex: 1; }
  .tp-bar .ib { width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
  .tp-bar .ib:hover { background: var(--hover); color: var(--ink); }
  .tp-bar .all-done { display: inline-flex; align-items: center; gap: 7px; background: var(--blue-soft); color: var(--blue);
    border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; }
  .tp-bar .all-done:hover { filter: brightness(.97); }
  .tp-title { font-size: 20px; font-weight: 600; border: none; background: none; color: var(--ink); width: 100%; padding: 6px 16px 2px;
    outline: none; }
  .tp-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 16px 0; font-size: 12px; color: var(--faint); }
  .tp-meta .chip { cursor: pointer; }
  .tp-meta .glabel { display: inline-flex; align-items: center; gap: 4px; }
  .tp-k { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); font-weight: 650; padding: 16px 16px 6px;
    display: flex; align-items: center; gap: 8px; }
  .tp-k .ib-count { background: var(--chip-bg); color: var(--muted); border-radius: 5px; padding: 0 6px; font-size: 11px; }
  .tp-desc { display: block; width: calc(100% - 32px); margin: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--input-bg, var(--card));
    color: var(--ink); padding: 9px 12px; font: inherit; font-size: 14px; resize: none; min-height: 42px; overflow: hidden; }
  .tp-desc:focus { outline: none; border-color: var(--blue); }
  .tp-empty { color: var(--faint); padding: 18px 16px; font-size: 13px; }

  /* the add-to-todo picker (Shortwave's "ADD TO TODO") */
  .tpick { padding: 0 !important; overflow: hidden; width: min(640px, 94vw); }
  .tpick .tk-h { background: var(--hover); font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint);
    font-weight: 650; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .tpick input { width: 100%; border: none; outline: none; background: none; color: var(--ink); font-size: 16px; padding: 14px 18px; }
  .tpick .tk-list { max-height: min(52vh, 420px); overflow-y: auto; border-top: 1px solid var(--line-soft); }
  .tpick .tk-o { display: flex; align-items: center; gap: 14px; padding: 11px 18px; cursor: pointer; font-size: 14px; color: var(--ink);
    border-left: 3px solid transparent; }
  .tpick .tk-o .svg-ic { color: var(--muted); }
  .tpick .tk-o .n { margin-left: auto; color: var(--faint); font-size: 12px; }
  .tpick .tk-o.on { background: var(--sel-bg, var(--blue-soft)); border-left-color: var(--blue); }
  .tpick .tk-foot { padding: 8px 18px; font-size: 11.5px; color: var(--faint); border-top: 1px solid var(--line-soft); }

  /* the reading pane: icons, a big subject, participants on a hairline band */
  .pane-tools { border-bottom: none; padding: 8px 10px; gap: 0; }
  .pane-tools .tool { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .pane-tools .tool.txt { width: auto; padding: 0 10px; font-size: 13px; }
  .pane-head { padding: 4px 20px 2px; }
  .pane-head h2 { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .pane-who { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 20px; color: var(--muted);
    font-size: 13.5px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* reply: one quiet line until you use it, then most of the pane */
  .replybar { margin: 0; border: none; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 16px; gap: 12px; color: var(--faint); }
  .replybar .rb-in { flex: 1 1 auto; text-align: left; color: var(--faint); font-size: 14px; padding: 6px 0; cursor: text; }
  .replybar .rb-in:hover { color: var(--ink); }
  .replybar .tool { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; }
  .replybar:hover { border-color: var(--line); color: var(--faint); }
  .pane.composing .msgs { flex: 0 1 40%; }
  .pane.composing #composer { position: relative; }
  .pane.composing .replybar { display: none; }
  .pane .cmp-dock { flex: 1 1 60%; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); display: none; flex-direction: column; }
  .pane.composing .cmp-dock { display: flex; }
  .cmp-dock .cmp-head { display: flex; align-items: center; gap: 8px; padding: 8px 16px; color: var(--muted); font-size: 13px; }
  .cmp-dock .cmp-head .sp { flex: 1; }
  .cmp-dock .quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 16px 6px; }
  .cmp-dock .quick button { border: 1px solid var(--blue); color: var(--blue); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
  .cmp-dock .quick button:hover { background: var(--blue-soft); }
  .cmp-dock > .cmp-body { flex: 1 1 auto; padding: 0 16px 12px; }
  .cmp-dock .cmp-body > div { border: none !important; padding: 0 !important; margin: 0 !important; }
  .cmp-dock .rb-body, .cmp-dock [contenteditable] { min-height: 180px; }

  @media (max-width: 700px) {
    .list-head { padding: 8px 10px 4px; }
    .lh-fresh .ft { display: none; }
    .row { padding: var(--row-pad) 12px; gap: 12px; }
    .row .selbox { left: 12px; }
    .grp { padding: 10px 12px; gap: 12px; }
    .tail .chip { max-width: 96px; }
    .pane.composing .msgs { flex-basis: 30%; }
    /* E204 undoes E201's wrap: the chips left line 1 (they end line 3 now),
       so the title has the whole line and one line is enough — Shortwave. */
    .row .l1 { flex-wrap: nowrap; overflow: hidden; }
    .row .l1 .subj.todo-title { flex: 1 1 auto; display: block; white-space: nowrap; text-overflow: ellipsis; -webkit-line-clamp: unset; }

  /* ============ E203: the insets have the last word ============
     This is the real reason the status bar kept sitting on the nav through
     E187, E196, E199 and E200. Every fix went into the phone media block —
     but a skin's `.top { padding: 8px 16px }` is written AFTER that block at
     equal specificity, so it reset padding-top every time. Casey runs the
     Inbox skin (#4285f4), whose rule is the very last word in the file.
     These rules come after all of them, so nothing can quietly win again,
     and uitest.py forces --safe-top/--safe-bot and asserts it per skin. */
  @media (max-width: 760px) {
    html .top, html[data-skin] .top { padding-top: calc(8px + var(--safe-top)); }
    html .dock, html[data-skin] .dock { padding-top: var(--safe-top); padding-bottom: var(--safe-bot); }
    html .rail, html[data-skin] .rail { padding-top: calc(10px + var(--safe-top)); }
  }
  /* E208: same trap, different property. Below 980px the rail is the ☰
     drawer, floating over the list — but Shortwave's `.rail { background:
     transparent }` and Daylight's 66% frosted glass are written after the
     phone block, so the drawer went see-through and the list read through
     the menu. On the desktop the rail sits on the page ground, where those
     looks are right; as an overlay it must be solid. */
  @media (max-width: 980px) {
    html .rail, html[data-skin] .rail {
      background: var(--card);
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
  }
</style>
<script>
/* E77: apply the saved skin before first paint (default: 2049). */
document.documentElement.dataset.skin = localStorage.getItem('gc2_skin') || 'neon';
/* E187: standalone (Add to Dock / Add to Home Screen) gets its own class so
   the chrome can inset itself around the notch. */
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)
  document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('app-mode'));
/* E114: apply the saved rail state (slim icon strip) before first paint. */
document.documentElement.dataset.rail = localStorage.getItem('gc2_rail') || '';
/* E203 — the app is exactly as tall as the window says it is.
   Casey's screenshot: the board painted to 100dvh and stopped ~77px short of
   the bottom, with the phone's own grey showing beneath the dock bar. iOS
   hands a standalone web app a viewport that can disagree with the screen
   after a keyboard, a rotation or a cold start, and dvh follows the wrong
   one. Measuring window.innerHeight is the only number that is always the
   truth. innerHeight, NOT visualViewport.height — the latter shrinks with
   the keyboard, which would collapse the layout mid-typing.
   scrollTo(0,0) undoes the other half of the same symptom: iOS scrolling the
   whole app up to reveal a field and never putting it back. */
function syncAppHeight(){
  const h = window.innerHeight;
  if (!h) return;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  document.documentElement.classList.add('has-apph');
  if (window.scrollY || window.pageYOffset) window.scrollTo(0, 0);
}
syncAppHeight();
['resize','orientationchange','pageshow','focusout'].forEach(
  ev => window.addEventListener(ev, () => setTimeout(syncAppHeight, 60)));
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncAppHeight(); });

/* E206 — viewport diagnostics, on demand only (?diag=1).
   The bottom gap has been fixed six times and keeps returning, because it
   only reproduces in the installed iOS app while uitest.py's headless Chrome
   passes every check. Rather than guess a seventh time, the phone reports
   what it actually measured. Reads values and draws an overlay; it never
   changes layout. Sampled repeatedly because the suspicion is that
   syncAppHeight() latches a provisional innerHeight during head parse and
   the real value only settles after first paint. */
/* The installed app always cold-starts at "/", so a ?diag=1 link can never
   reach the one environment where the bug actually happens. The flag persists
   in localStorage too, set from the avatar menu, so diagnostics can be armed
   inside the installed app and survive the relaunch that reproduces it. */
if (location.search.indexOf('diag=1') >= 0 || localStorage.getItem('gc2_diag') === '1') {
  const samples = [];
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100dvh;pointer-events:none;visibility:hidden';
  const read = (label) => {
    const cs = getComputedStyle(document.documentElement);
    const vv = window.visualViewport;
    const s = {
      at: label,
      t: Math.round(performance.now()),
      innerH: window.innerHeight,
      clientH: document.documentElement.clientHeight,
      screenH: window.screen && window.screen.height,
      availH: window.screen && window.screen.availHeight,
      vvH: vv ? Math.round(vv.height) : null,
      vvTop: vv ? Math.round(vv.offsetTop) : null,
      dvh: probe.isConnected ? Math.round(probe.getBoundingClientRect().height) : null,
      appH: cs.getPropertyValue('--app-h').trim(),
      hasApph: document.documentElement.classList.contains('has-apph'),
      safeTop: cs.getPropertyValue('--safe-top').trim(),
      safeBot: cs.getPropertyValue('--safe-bot').trim(),
      bodyH: Math.round(document.body.getBoundingClientRect().height),
      standalone: !!(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone),
      dpr: window.devicePixelRatio,
      skin: document.documentElement.dataset.skin
    };
    // the number that matters: unpainted strip under the app
    s.gapVsScreen = (s.screenH || 0) - s.bodyH;
    s.gapVsInner = s.innerH - s.bodyH;
    samples.push(s);
    return s;
  };
  const paint = () => {
    let box = document.getElementById('diag-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'diag-box';
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
        + 'background:#000;color:#0f0;font:11px/1.35 ui-monospace,Menlo,monospace;'
        + 'padding:10px;border-radius:8px;max-height:52vh;overflow:auto;white-space:pre-wrap';
      document.body.appendChild(box);
    }
    const last = samples[samples.length - 1];
    box.textContent =
      'VIEWPORT DIAG (E206)\n'
      + samples.map(s => `${s.at.padEnd(11)} t=${String(s.t).padStart(5)} inner=${s.innerH} `
          + `dvh=${s.dvh} body=${s.bodyH} --app-h=${s.appH || '-'} gap=${s.gapVsInner}`).join('\n')
      + `\n\nscreen=${last.screenH} avail=${last.availH} client=${last.clientH}`
      + `\nvisualViewport=${last.vvH} top=${last.vvTop}`
      + `\nsafe-top=${last.safeTop} safe-bot=${last.safeBot}`
      + `\nstandalone=${last.standalone} dpr=${last.dpr} skin=${last.skin}`
      + `\ngap vs screen=${last.gapVsScreen}  gap vs inner=${last.gapVsInner}`;
    let btn = document.getElementById('diag-send');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'diag-send';
      btn.textContent = 'Send to Grand Central';
      btn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#0f0;color:#000;'
        + 'border-radius:6px;font:600 12px system-ui;width:100%';
      btn.onclick = () => {
        btn.textContent = 'sending…';
        fetch('/diag', {method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({samples: samples, ua: navigator.userAgent})})
          .then(r => r.json())
          .then(j => {
            if (!j.ok) { btn.textContent = 'failed: ' + (j.error||''); return; }
            // E218: once the report is in, the overlay has done its job. It
            // sits over the dock and the menus, so it disarms itself rather
            // than leaving Casey unable to reach the switch that turns it off.
            localStorage.removeItem('gc2_diag');
            btn.textContent = '✓ sent — diagnostics off. Tell Claude to read it';
            setTimeout(() => { box.remove(); if (typeof diagState === 'function') diagState(); }, 2500);
          })
          .catch(e => { btn.textContent = 'failed: ' + e; });
      };
      box.appendChild(btn);
    } else { box.appendChild(btn); }
    // E218: the overlay covers the bottom of the phone, including the avatar
    // menu's "Viewport diagnostics" switch — so the off switch lives here too.
    let off = document.getElementById('diag-off');
    if (!off) {
      off = document.createElement('button');
      off.id = 'diag-off';
      off.textContent = '✕ Turn diagnostics off';
      off.style.cssText = 'margin-top:6px;padding:8px 12px;background:#222;color:#0f0;'
        + 'border:1px solid #0f0;border-radius:6px;font:600 12px system-ui;width:100%';
      off.onclick = () => {
        localStorage.removeItem('gc2_diag');
        box.remove();
        if (typeof diagState === 'function') diagState();
      };
    }
    box.appendChild(off);
  };
  // E218: a sample landing after the overlay was dismissed must not redraw it.
  const armed = () => location.search.indexOf('diag=1') >= 0 || localStorage.getItem('gc2_diag') === '1';
  const sample = (label) => { read(label); if (armed()) paint(); };
  document.addEventListener('DOMContentLoaded', () => {
    document.body.appendChild(probe);
    sample('domready');
  });
  window.addEventListener('load', () => sample('load'));
  [100, 400, 1000, 2500].forEach(ms => setTimeout(() => sample('t+' + ms), ms));
  window.addEventListener('orientationchange', () => setTimeout(() => sample('rotate'), 300));
}
</script>

<script>
/* ======================================================================
   E52 unified shell. All actions hit the same endpoints classic uses —
   nothing server-side changed except labels-on-todos.
   ====================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POLL_MS = 60_000, BOARD_MS = 300_000;

let MAIL = [], TODOS = [], BOARD = {}, OUTBOX = [], DRAFTS = null, SENT = null, CONN = null;
let ITEMS = [], PNAME = {}, OWN = new Set();
let SCOPE = { kind:'home', id:null }, TAB='all', GROUP='smart', Q='', OPEN=null, DOCK=null;
/* Dev #49 (Casey: "default the Inbox view to the classic … view where it's
   starred, and then the full inbox by date. Then create a new Smart Inbox in
   the left nav … with the sections … as anchors … with the number of emails
   in each"): Smart Inbox is a mode of the inbox scope, so search, tabs, keys
   and bundles all carry over. Only accounts with Jev switched on have it. */
let SMART=false;
const smartOn = () => SMART && SCOPE.kind==='inbox' && !!JEV_ON[ACCT];
/* ================= accounts (account-first, 2026-09-24) =================
   An account is a real mail account (personal, brightline, …) — the primary
   navigation and the ownership boundary. Mail and todos are only ever seen
   through the account they belong to; nothing crosses. There are no projects
   or goals: items carry `project` = their account purely so the older
   per-"project" views (Home cards, scope rows) now group by account. A todo
   with no account yet is "Unassigned" until one is picked. */
let ACCOUNTS=[];
let ACCT = localStorage.getItem('gc2_acct') || '';
const acctLabel = id => String(id||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
/* Dev #40: the account tabs can be dragged into Casey's order, and it sticks.
   Dev #42: the order is saved on the server (/accounts/order) so it follows
   Casey across browsers and sessions; localStorage is only this browser's
   cache of it. Accounts not in the saved order — a newly added one — go on
   the end. */
function acctIds(){
  let saved=[]; try { saved=JSON.parse(localStorage.getItem('gc2_acct_order')||'[]'); } catch(e){}
  const known=saved.filter(a=>ACCOUNTS.includes(a));
  return [...known, ...ACCOUNTS.filter(a=>!known.includes(a))];
}
const mailAcctInAcct = a => !!ACCT && a===ACCT;
const sentInAcct = row => mailAcctInAcct(row.account);
const inAcctId = pid => !!ACCT && pid===ACCT;
const inAcct = i => !!ACCT && i.account===ACCT;
const acctName = id => acctLabel(id);
/* E249: the ⌂ Home tab is a VIEW across accounts, never an account of its
   own: ACCT stays the last real account (so every scoped fetch and action
   keeps its one-account rule), and HOME_ALL only swaps what #list draws.
   Each account keeps one colour everywhere — tab dot, section, calendar. */
let HOME_ALL = localStorage.getItem('gc2_home_all')==='1';
const ACCT_COLORS=['#3b82f6','#e07a2f','#15998a','#8b5cf6','#a07c4a','#d6457a','#5b8c2a','#2b7f8f'];
const acctColor = id => ACCT_COLORS[Math.max(0,acctIds().indexOf(id))%ACCT_COLORS.length];
async function setAcct(id){
  if(!ACCOUNTS.includes(id)) return;
  if(PROJ){ leaveProj(); if(id===ACCT&&!HOME_ALL){ renderAcctTabs(); renderRail(); renderCrumbs(); renderList(); return; } }
  // E249: leaving the cross-account Home tab lands on the account clicked.
  if(HOME_ALL){ leaveHomeAll();
    if(id===ACCT){ renderAcctTabs(); renderRail(); renderCrumbs(); renderList(); return; } }
  else if(id===ACCT) return;
  ACCT=id; localStorage.setItem('gc2_acct',id);
  // Account changes invalidate every account-owned cache before repainting.
  DRAFTS=null; SENT=null; DEVQ=null; SEL.clear(); KB=-1; closePane();
  if(SCOPE.kind==='project') SCOPE={kind:'inbox',id:null};
  renderAcctTabs(); renderCrumbs();
  $('#list').innerHTML='<div class="empty">Loading '+esc(acctLabel(id))+'…</div>';
  await loadMailTodos();
  if(SCOPE.kind==='dev') await loadDev();
}
function acctCount(id){
  const was=ACCT; ACCT=id;
  const n=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&inboxLive(i)&&(i.type==='todo'?isToday(i):(i.needs||i.unread))).length;
  ACCT=was; return n;
}
function saveAcctOrder(order){
  try { localStorage.setItem('gc2_acct_order',JSON.stringify(order)); } catch(_){}
  post('/accounts/order',{order}).catch(e=>fbErr('http','acct order not saved: '+e.message));
}
function renderAcctTabs(){
  const el=$('#acct-tabs'); if(!el) return;
  const tab=(id,label)=>{ const n=acctCount(id);
    return `<button class="acct-tab ${ACCT===id&&!HOME_ALL&&!PROJ?'on':''}" draggable="true" data-acct="${esc(id)}" onclick="setAcct('${esc(id)}')" title="${esc(acctName(id))} — drag to reorder">
      <span class="hday-dot" style="background:${acctColor(id)}"></span><span>${esc(label)}</span>${n?`<span class="n">${n}</span>`:''}</button>`; };
  // E249: ⌂ Home — every account at once, read-only (BUILD_SPEC §6, 2026-09-29)
  // Projects: up to 3 pinned after the accounts, behind a divider, then 📁 all
  const pins=(PROJECTS||[]).filter(p=>p.pin_rank&&p.status==='open').sort((a,b)=>a.pin_rank-b.pin_rank);
  const onP=PROJ&&PROJ.view==='page'?PROJ.id:null;
  el.innerHTML = `<button class="acct-tab home-tab ${HOME_ALL&&!PROJ?'on':''}" onclick="showHomeAll()" title="Home — your day across every account">⌂ Home</button>`
    + acctIds().map(id=>tab(id,acctLabel(id).slice(0,22))).join('')
    + `<span class="pj-tsep"></span>`
    + pins.map(p=>`<button class="acct-tab pj-tab ${onP===p.id?'on':''}" onclick="openProject(${p.id})" title="Project: ${esc(p.name)}">${projDot(p.color,8)}<span>${esc(p.name.slice(0,22))}</span></button>`).join('')
    + `<button class="acct-tab pj-tab ${PROJ&&PROJ.view==='list'?'on':''}" onclick="showProjects()" title="All projects">📁${pins.length?'':' Projects'}</button>`;
  if(!el._dnd){ el._dnd=true;
    let from=null;
    el.addEventListener('dragstart',e=>{ const t=e.target.closest('.acct-tab[data-acct]'); if(!t) return;
      from=t.dataset.acct; t.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
      try { e.dataTransfer.setData('text/plain',from); } catch(_){} });
    el.addEventListener('dragover',e=>{ if(!from) return; e.preventDefault();
      const t=e.target.closest('.acct-tab[data-acct]'); const d=el.querySelector('.dragging');
      if(!t||!d||t===d) return;
      const r=t.getBoundingClientRect();
      el.insertBefore(d, e.clientX<r.left+r.width/2 ? t : t.nextSibling); });
    const done=()=>{ if(!from) return; from=null;
      el.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
      const order=[...el.querySelectorAll('.acct-tab[data-acct]')].map(x=>x.dataset.acct);
      saveAcctOrder(order);
      renderAcctTabs(); };
    el.addEventListener('drop',e=>{ e.preventDefault(); done(); });
    el.addEventListener('dragend',done);
  }
}
/* ================= E164: ⚑ flag it from the screen =================
   NewsDesk/SalesBase grammar: say what is wrong WHERE it is wrong, and let the
   report carry what a fix needs — the element, the screen state, and what
   broke just before. Reports land in the dev queue (E144) as ordinary
   requests, so one queue still holds every change Casey asks for. */
const FB_ERRS=[];
const fbErr=(kind,msg)=>{
  FB_ERRS.push({t:new Date().toTimeString().slice(0,8),kind,msg:String(msg??'').slice(0,180)});
  if(FB_ERRS.length>6) FB_ERRS.shift();
};
addEventListener('error',e=>fbErr('js',`${e.message} @${String(e.filename||'').split('/').pop()}:${e.lineno}`));
addEventListener('unhandledrejection',e=>fbErr('promise',e.reason&&e.reason.message||e.reason));
// Failed requests are the other half of "what broke just before" — a thin
// passthrough, so every existing caller sees the same response or throw.
// E195: only OUR requests count. Grand Central never fetches another origin,
// so a cross-origin failure is always something else on the page — a tracker
// an extension injected, blocked by an ad blocker. Six slots is all the ⚑
// report has, and that noise was spending every one of them.
(function(){ const _f=window.fetch;
  const ours=u=>{ try{ return new URL(u,location.href).origin===location.origin; }catch(e){ return true; } };
  window.fetch=async function(...a){
    const raw=String(a[0]&&a[0].url||a[0]||''), url=raw.replace(location.origin,'');
    try{ const r=await _f.apply(this,a); if(!r.ok&&ours(raw)) fbErr('http',r.status+' '+url); return r; }
    catch(e){ if(ours(raw)) fbErr('net',(e&&e.message||e)+' '+url); throw e; }
  };
})();
let SEL = new Set(), KB = -1, SEARCH_ROWS = null;
const FOLDS = new Set();

const ACCT_COLOR = { personal:'#4a7fd6', brightline:'#1c8a4c' };
const AV_COLORS = ['#7a5c48','#4a7fd6','#8a5cb8','#1c8a4c','#c07a2e','#b84a6c','#3a8a8a'];
const avColor = s => AV_COLORS[[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const initials = s => (String(s||'?').match(/\b[A-Za-z]/g)||['?']).slice(0,2).join('').toUpperCase();

/* E71: real avatars, Shortwave-style — Gravatar (people) → sender-domain
   favicon (brands/newsletters) → the colored initials underneath. Initials
   always render first; the image only covers them if a source loads.
   Gravatar needs SubtleCrypto (HTTPS only) — on the plain-http LAN we skip
   straight to favicons. Freemail domains never get a favicon (a Gmail logo
   on every human is worse than initials). */
const AV_URL=new Map();
const FREEMAIL=/(^|\.)(gmail|googlemail|yahoo|outlook|hotmail|icloud|aol|live|me|proton|protonmail)\.(com|net|org|me|ch)$/i;
async function gravatarUrl(em){
  if(AV_URL.has(em)) return AV_URL.get(em);
  let url=null;
  if(crypto?.subtle){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(em));
    url='https://www.gravatar.com/avatar/'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')+'?d=404&s=80';
  }
  AV_URL.set(em,url); return url;
}
const avImg = em => em?`<img class="avimg" data-em="${esc(em)}" loading="lazy" onerror="avErr(this)">`:'';
function avErr(img){
  const dom=(img.dataset.em||'').split('@')[1]||'';
  if(img.dataset.st!=='f' && dom && !FREEMAIL.test(dom)){
    img.dataset.st='f';
    img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64';
  } else img.remove();
}
function hydrateAvatars(root){
  (root||document).querySelectorAll('img.avimg:not([src])').forEach(async img=>{
    const em=(img.dataset.em||'').trim().toLowerCase(); if(!em) return img.remove();
    const g=await gravatarUrl(em);
    if(g) img.src=g;
    else {   // no HTTPS → straight to the favicon stage
      const dom=em.split('@')[1]||'';
      if(dom&&!FREEMAIL.test(dom)){ img.dataset.st='f';
        img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64'; }
      else img.remove();
    }
  });
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);
  sfx(/fail|could not|error|refused/i.test(m)?'err':'ack'); }
// Clipboard with the http://gc-host.local fallback (no clipboard API there).
function copyText(s, label){
  const done=()=>toast('Copied '+(label||s.slice(0,40)));
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(s).then(done).catch(()=>fallbackCopy(s,done)); }
  else fallbackCopy(s,done);
}
function fallbackCopy(s,done){
  const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }
  ta.remove();
}
async function post(url, body, headers, opts){
  // E155: name the two connection-loss shapes plainly. A dropped Cloudflare
  // tunnel either rejects the fetch outright or answers a 5xx HTML page that
  // used to surface as "Unexpected token '<'" — either way Casey needs to know
  // the change did NOT land, and that what he typed is still on screen.
  let r;
  const payload=JSON.stringify(body);
  // keepalive lets a held send finish if the tab closes (browsers cap it at 64 KB)
  const keepalive=!!(opts&&opts.keepalive)&&payload.length<60000;
  // E258: a paired device's code rides on every write — the server, not this
  // page, decides which actions need it (send, trash, RSVP, invites, …).
  const paired=devCode(); const auth=paired?{'X-GC-Dev-Code':paired}:{};
  try { r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json',...auth,...(headers||{})}, body: payload, keepalive }); }
  catch(e){ throw new Error('connection lost — NOT saved. Your text is still here; retry once the red bar clears'); }
  let out;
  try { out = await r.json(); }
  catch(e){ throw new Error('the server answered '+r.status+' instead of data — NOT saved; retry in a moment'); }
  if (!out.ok){
    if(out.pairing_required && url!=='/dev') pairDlg();
    throw Object.assign(new Error(out.error || 'request failed'), {data: out});
  }
  return out;
}
/* E258: sending, trashing, RSVP and the other human-only actions need this
   device's pairing code (the same one Dev requests use). */
function pairDlg(){
  dlg(`<h3>🔑 Pair this device</h3>
    <div class="status" style="text-transform:none;letter-spacing:0">Sending, trashing, RSVP and invites only work from a paired device. Enter the pairing code once; nothing you typed is lost — try the action again after.</div>
    <input id="pair-code" class="tp-notes" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" style="min-height:0;width:100%;margin:12px 0">
    <div class="foot"><button class="btn" onclick="pairSubmit()">Pair</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
  setTimeout(()=>$('#pair-code')?.focus(),50);
}
async function pairSubmit(){
  const code=($('#pair-code')?.value||'').trim(); if(!code) return;
  try {
    await post('/dev',{action:'check'},{'X-GC-Dev-Code':code});
    try{ localStorage.setItem('gc2_dev_code',code); }catch(e){ toast('This browser won’t store the code — private window?'); return; }
    closeDlg(); toast('Paired — try that again');
  } catch(e){ toast(e.data?.pairing_required?'That code didn’t match':'Failed — '+e.message); }
}

/* ================= data ================= */
async function loadAccounts(){
  const out=await fetch('/accounts').then(r=>r.json());
  if(!out.ok) throw new Error(out.error||'could not load accounts');
  ACCOUNTS=out.accounts||[];
  if(Array.isArray(out.order) && out.order.length){
    try { localStorage.setItem('gc2_acct_order',JSON.stringify(out.order)); } catch(_){}
  } else {
    // First load after #42: lift this browser's saved order to the server.
    let local=[]; try { local=JSON.parse(localStorage.getItem('gc2_acct_order')||'[]'); } catch(_){}
    if(Array.isArray(local) && local.length) saveAcctOrder(local);
  }
  if(!ACCOUNTS.length) throw new Error('no account has synced mail or todos yet');
  if(!ACCOUNTS.includes(ACCT)) ACCT=ACCOUNTS[0];
  localStorage.setItem('gc2_acct',ACCT);
}
async function loadMailTodos(){
  if(!ACCT) throw new Error('select an account first');
  const account=ACCT, q=encodeURIComponent(account);
  const [m, t] = await Promise.all([
    fetch('/mail?account='+q).then(r=>r.json()), fetch('/todos?account='+q).then(r=>r.json()),
  ]);
  if(!m.ok) throw new Error(m.error||'could not load mail');
  if(!t.ok) throw new Error(t.error||'could not load todos');
  if(account!==ACCT) return;  // a slower prior-account request lost the race
  // E108: moved threads (filed to a project + archived) stay loaded so
  // project/label scopes keep them — inboxLive keeps them out of the Inbox.
  MAIL = (m.threads||[]).filter(x=>x.account===account&&(x.in_inbox || x.moved_at) && !x.done_at);
  OUTBOX = (m.outbox||[]).filter(x=>x.account===account);
  SYNC = m.sync||SYNC||{};
  JEV_ON[account]=!!m.jev;
  SVC=m.services||{};
  TIERS=m.tiers||{};
  noteNewMail();
  TODOS = (t.todos||[]).filter(x=>x.account===account&&x.state==='open');
  rebuild();
  loadPjSug(account);
  loadTrackSum(account);
  loadWatches(account);
}

async function loadBoard(){
  BOARD = await fetch('/grand_central.json?t='+Date.now()).then(r=>r.json());
  // Account-first: the sweep's project/goal/pipeline/theater fields are ignored.
  // Waiting-on rows are re-keyed to their own account so an account view
  // never shows another account's rows.
  BOARD.operations=[]; BOARD.objectives=[]; BOARD.pipeline=[];
  (BOARD.waiting_on||[]).forEach(w=>{ w.project=w.account||null; });
  rebuild();
  // E156: a sweeper 45+ min past its slot is an alert, not a mystery.
  // generated_at is stable between sweeps, so this refreshes in place.
  const due=Date.parse(BOARD.next_sweep_at||'');
  if(due && Date.now()-due>45*60000)
    notify('warn','The sweeper is overdue — nothing since '+
      new Date(Date.parse(BOARD.generated_at)).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+
      '. Mail, Top 5 and the brief are stale.');
}
async function loadConn(){

    // E156: a dead credential is an alert, not a surprise on the next sweep

function rebuild(){
  BOARD.theaters=acctIds().map(id=>({id,name:acctLabel(id)}));
  // The server already scoped both payloads; keep the client predicate as a
  // second boundary so a malformed response still cannot cross accounts.
  MAIL=MAIL.filter(x=>x.account===ACCT);
  TODOS=TODOS.filter(x=>x.account===ACCT);
  const OWED = new Set((BOARD.reply_debt||[]).map(r=>r.account+':'+r.thread_id));
  const now = new Date().toISOString();
  // E152: my_day stores Casey's LOCAL date — comparing it against the UTC
  // date made every My Day flag vanish after 5pm Pacific (Casey hit this).
  const today = dOff(0);
  ITEMS = [
    ...MAIL.map(x=>({
      type:'mail', key:'m:'+x.account+':'+x.thread_id, raw:x,
      ...mailWho(x), title:x.subject||'(no subject)', snip:x.snippet||'',
      account:x.account, project:x.account, goals:[],
      labels:(x.labels||[]).filter(l=>!l.startsWith('GC/')),
      date:x.last_date, unread:!!x.unread, starred:!!x.starred, pinned:!!x.pinned,
      snoozed:!!(x.snoozed_until && x.snoozed_until>now), wake:x.snoozed_until||null,
      my_day:!!(x.my_day && x.my_day===today),
      attachments:!!x.attachments,
      // E58: bundled mail (newsletters/updates/promos/receipts) categorically
      // can't owe a reply, whatever the sweep said — Casey's ⊘ clicks and the
      // categorizer outrank a stale reply-debt row until the next sweep heals.
      // E217: where Jev (account switched on) or Casey's own correction has
      // judged "respond", that decides; elsewhere the hourly assessor's list.
      needs:(x.cls&&['jev','you'].includes(x.cls.respond_src))
        ? x.cls.respond==='yes' && x.last_direction!=='outbound'
        : OWED.has(x.account+':'+x.thread_id) && (x.category||'people')==='people',
      cls:x.cls||null,
      note:x.note||'',
    })),
    ...TODOS.map(x=>({
      type:'todo', key:'t:'+x.id, raw:x,
      who:'Todo', title:x.text, snip:x.notes||'',
      // A todo belongs to exactly ONE account (server-enforced); a legacy
      // todo without one is Unassigned until an account is picked.
      account:x.account||null, project:x.account||null, goals:[],
      labels:x.labels||[], date:x.due||x.created_at, due:x.due,
      starred:!!x.starred, my_day:!!(x.my_day && x.my_day===today),
      snoozed:!!x.snoozed_active, wake:x.snoozed_until||null,
      priority:x.priority||null,
      threads:x.threads||[],
    })),
  ].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  // Carry fetched thread messages across rebuilds — the poll used to mint
  // fresh item objects, dropping _msgs, so Reply on a thread open >60s got
  // EMPTY recipients (Casey hit this).
  // E93.8: overlay in-flight star intents until the DB catches up (or 10
  // min passes); a poll row that already agrees clears the memory.
  for(const [k,p] of STAR_PENDING){
    const it=ITEMS.find(x=>x.key===k);
    if(!it||Date.now()-p.ts>600e3){ STAR_PENDING.delete(k); continue; }
    if(it.starred===p.v) STAR_PENDING.delete(k);
    else { it.starred=p.v; it.raw.starred=p.v; }
  }
  // E93.5: an email grouped under a todo is SPOKEN FOR — flag it here so
  // every inbox-ish scope can hide it (E60 only hid it in Smart grouping).
  const attached=new Set();
  TODOS.forEach(t=>(t.threads||[]).forEach(th=>attached.add('m:'+th.account+':'+th.thread_id)));
  ITEMS.forEach(i=>{ if(i.type==='mail') i.attached=attached.has(i.key); });
  for(const [k,t] of DROPPED) if(Date.now()-t>600e3) DROPPED.delete(k);
  ITEMS=ITEMS.filter(i=>!DROPPED.has(i.key));
  if (rebuild._prev){
    ITEMS.forEach(i=>{ const p=rebuild._prev.get(i.key);
      if(p&&p._msgs){ i._msgs=p._msgs; i._tlabels=p._tlabels; } });
  }
  rebuild._prev = new Map(ITEMS.map(i=>[i.key,i]));
  renderAcctTabs(); renderRail(); renderList(); if (DOCK) renderDock();   // E171
}

  const rows=ITEMS.filter(i=>inScope(i)&&inQ(i)&&i.type==='mail'&&!i.attached&&!i.starred&&grpKey(i)===SPLIT.cat)
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(!rows.length){ SPLIT=null; return renderList(); }
  VISIBLE=rows.slice();
  const bulk=esc(grpBulk(SPLIT.cat));
  $('#list').innerHTML=`<div class="ib-wrap">
    <div class="split-head">
      <button onclick="closeSplit()" title="Back (Esc)">${ic('back')}</button>
      <span style="color:var(--muted)">${ic(k.icon)}</span><span class="nm">${esc(k.name)}</span>
      <span class="ib-count" style="background:var(--chip-bg);border-radius:5px;padding:0 6px;font-size:11.5px;color:var(--muted)">${rows.length}</span>
      <span class="sp"></span>
      <button onclick="bundleBulk('${bulk}','archive')" title="Archive all ${rows.length} in Gmail">${ic('check')}</button>
      ${k.sales?'':`<button onclick="bundleTrash('${bulk}')" title="Delete all — Gmail Trash, recoverable 30d">${ic('trash')}</button>`}
    </div>
    <div class="ib-card">${rows.slice(0,250).map(rowHtml).join('')}</div></div>`;
  hydrateAvatars($('#list'));
}
// Bundle sections default COLLAPSED; FOLDS stores the user's inversions.
const DEFAULT_FOLD = n => /^(📰|🔔|🧾|📅|🛍)/.test(n);
const isFolded = n => DEFAULT_FOLD(n)!==FOLDS.has(n);

let VISIBLE = [];   // flat list for keyboard nav
function renderList(){
  renderListHead();
  // E134: freeform editors inside the list (scratch pads, braindump cards,
  // todo/goal notes — anything .sp-edit) must never lose keystrokes to the
  // 60s poll — skip the re-render until blur, same deal as the dock.
  // Dev #31 (Casey: "I start typing and it erases without my doing
  // anything"): that guard only covered .sp-edit, so the Ask box on Home, the
  // Dev request box and every other field in the list lost its text to the
  // 60s poll. Now: skip while any field in the list has focus, and carry
  // unsent text in named fields across the re-render.
  const ae=document.activeElement, lst=$('#list');
  if(ae && lst.contains(ae) && (ae.matches('input,textarea,select,[contenteditable]')||ae.classList?.contains('sp-edit'))) return;
  const keep={};
  lst.querySelectorAll('input[id],textarea[id]').forEach(el=>{ if(el.type!=='checkbox'&&el.value) keep[el.id]=el.value; });
  requestAnimationFrame(()=>{ for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id);
    if(el&&!el.value&&lst.contains(el)) el.value=v; } });
  // E69: the day-notes journal lives on the Today tab, outside the list's
  // re-render cycle so typing is never clobbered by the poll.
  // E180 (Casey: "we can remove it now that it's in the sidebar"): the day's
  // journal lives in the 📅 dock and on the calendar page, not stacked on top
  // of every Today view.
  const dn=$('#daynote');
  if(dn) dn.hidden = true;
  // wizard gets its own class: full-page like Home but WITHOUT home-on's
  // .pane{display:none} — "open the email" must show the reading pane
  // E249: the ⌂ Home tab draws over whatever account scope is underneath
  document.body.classList.toggle('proj-on', !!PROJ);
  if (PROJ) { document.body.classList.remove('home-on','wiz-on','homeall-on');
    return PROJ.view==='page' ? renderProjectPage() : PROJ.view==='notes' ? renderNotesPage() : renderProjectsPage(); }
  document.body.classList.toggle('homeall-on', HOME_ALL);
  if (HOME_ALL) { document.body.classList.remove('home-on','wiz-on'); return renderHomeAll(); }
  document.body.classList.toggle('home-on', SCOPE.kind==='home');
  document.body.classList.toggle('wiz-on', SCOPE.kind==='wizard');
  if (SCOPE.kind==='home') return renderHome();
  if (SCOPE.kind==='wizard') return renderWizard();
  if (SCOPE.kind==='drafts') return renderDrafts();
  if (SCOPE.kind==='sent') return renderSent();
  if (SCOPE.kind==='outbox') return renderOutbox();
  if (SCOPE.kind==='todo') return renderTodoPlace();
  if (SCOPE.kind==='goals') return renderGoalsPage();
  if (SCOPE.kind==='braindump') return renderBraindump();
  if (SCOPE.kind==='dev') return renderDev();
  if (SCOPE.kind==='unassigned') return renderUnassigned();
  if (SCOPE.kind==='contacts') return renderContacts();
  if (SCOPE.kind==='watch') return renderWatch();
  const items = ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i));
  const vis = ITEMS.filter(i=>inScope(i)&&inQ(i));
  // E177: the tab counts are computed before any view takes over — the Inbox
  // layouts used to return early and leave the strip showing stale numbers.
  $('#n-all').textContent = vis.length;
  // Dev #39 (Casey: "I don't think we need Today — Home is better"): no Today
  // tab or rail row any more; Home's "due today" links still open the list.
  if($('#n-today')) $('#n-today').textContent = vis.filter(isToday).length;
  $('#n-mail').textContent = vis.filter(i=>i.type==='mail').length;
  $('#n-todos').textContent = vis.filter(i=>i.type==='todo').length;
  $('#n-star').textContent = vis.filter(i=>i.starred).length||'';
  // E174: ☀ Today reads in Inbox's grammar unless you ask for the plain list.
  if (TAB==='today' && TODAY_VIEW==='inbox' && !SEARCH_ROWS && SCOPE.kind==='inbox') return renderTodayInbox();
  // E204: a group opened from the list is its own view until Back / Esc.
  if (SPLIT && !SEARCH_ROWS) return renderSplit();
  const groups = groupItems(items);
  VISIBLE = [];
  const sweepable = name => ['Last 7 days','Earlier this month','Older'].includes(name);
  // Dev #48 (Casey: "keep the Starred and Todos collapsed by default in the
  // Inbox"): on the All tab those two sections start folded; a click opens
  // them (FOLDS holds the inversion, as for the bundles). Their own tabs
  // (Todos, Starred) still show them open.
  const foldsFirst = name => TAB==='all' && (name==='Todos' || name==='Starred');
  let html = groups.map(([name,rows])=>{
    const folded=FOLDS.has(name)!==foldsFirst(name);
    const rowOut = r => r.grp ? grpRowHtml(r) : rowHtml(r);
    if(!folded) rows.forEach(r=>{ if(r.grp) return; VISIBLE.push(r); });
    const more = rows._more
      ? (name==='Todos'
          ? `<div class="go-all" onclick="goTodos()">Go to all todos ${ic('right','sm')}</div>`
          : `<div class="go-all" onclick="TAB='${rows._tab||'todos'}';syncTabs();renderCrumbs();renderList()">All ${rows.length+rows._more} ${rows._word||'todos'} ${ic('right','sm')}</div>`)
      : '';
    // E204: small capitals over a hairline; the chevron folds, and a date
    // section can be swept whole (archives its mail, never its todos).
    const head = `<div class="ib-head" data-sec="${esc(name)}">
        <span class="t">${esc(name)}</span>
        ${rows._age?'':`<span class="ib-count">${rows._more?rows.length+rows._more:rows.length}</span>`}
        <span class="sp"></span>
        ${sweepable(name)&&GROUP==='smart'?`<span class="ib-sweep secsweep" data-sweep="${esc(name)}" title="Mark everything in ${esc(name)} done — archives the mail in Gmail">${ic('sweep')}</span>`:''}
        <span class="fold" title="${folded?'Open':'Close'} this section">${ic(folded?'down':'up','sm')}</span></div>`;
    const body = folded ? ''
      : rows.slice(0,250).map(rowOut).join('')
        +(rows.length>250?`<div class="more-link" style="cursor:default">…${rows.length-250} more — narrow with search, a label, or a project</div>`:'')
        +more;
    return head + (body?`<div class="ib-card">${body}</div>`:'');
  }).join('');
  if (TAB==='today' && TODAY_VIEW==='list' && !SEARCH_ROWS){
    html = `<div class="ib-head" style="padding:10px 12px 4px"><span class="sp"></span>
      <span class="ib-toggle">
        <button onclick="setTodayView('inbox')" title="Inbox layout — time buckets and bundles">▤</button>
        <button class="on" title="The plain Grand Central list">☰</button></span></div>` + html;
  }
  if (smartOn() && !SEARCH_ROWS){
    // Dev #49: the sections as jump links, with how many are in each
    const skip=new Set(['Todos','Starred','Due & My Day']);
    const chips=groups.filter(([n])=>!skip.has(n)).map(([n,rows])=>{
      const count=n==='Bundled'?rows.reduce((a,g)=>a+(g.rows?g.rows.length:1),0):rows.length;
      return `<button class="sm-a" onclick="smartJump(${esc(JSON.stringify(n))})">${esc(n)} <span class="n">${count}</span></button>`; }).join('');
    // Dev #59: "Waiting on me" filters to the threads where it's your move
    const wm=items.filter(i=>i.cls?.waiting_on==='me').length;
    const wq=/(^|\s)waiting:me\b/i.test(Q);
    const wmBtn=wm||wq?`<button class="sm-a ${wq?'on':''}" title="Only threads where someone's waiting on your reply" onclick="smWaitMe()">⏳ Waiting on me <span class="n">${wm}</span></button>`:'';
    if(chips||wmBtn) html = `<div class="sm-anchors">${chips}${wmBtn}</div>` + html;
  }
  if (SEARCH_ROWS){
    const others=acctIds().filter(a=>a!==ACCT);
    html = `<div class="sec">Gmail search in ${esc(acctLabel(ACCT))} · ${SEARCH_ROWS.length} <span class="fold" onclick="SEARCH_ROWS=null;renderList()">✕ clear</span></div>`
      + (others.length?`<div class="srch-accts"><span>Search instead in</span>${others.map(a=>`<button class="chip" onclick="searchIn('${esc(a)}')"><i style="background:${acctColor(a)}"></i>${esc(acctLabel(a))}</button>`).join('')}</div>`:'') +
      SEARCH_ROWS.map(rowHtml).join('') + html;
    SEARCH_ROWS.forEach(r=>VISIBLE.unshift(r));
  }
  // E89 Phase 3: filing-pattern suggestions live where the filing work is.
  if (SCOPE.kind==='project' && SCOPE.id==='__none' && !SEARCH_ROWS){
    if(!REG) ensureReg().then(()=>renderList());
    else { const fs=feedSuggestions();
      if(fs.length) html = `<div class="steward-card" onclick="suggestDlg()">🧭 <span><span class="n">${fs.length}</span> filing pattern${fs.length>1?'s':''} could become automatic rules</span>
        <span style="margin-left:auto;color:var(--blue);font-weight:600">Review →</span></div>` + html; }
  }
  // E59 → E204 (#15): the steward's suggestions are a quiet badge on the
  // breadcrumb row now (renderListHead), counted for this account only.
  // E75: the filter only sees what's loaded — when it comes up dry (or
  // thin), offer the deep search over all of Gmail explicitly.
  if(Q.trim() && !SEARCH_ROWS){
    const more=`<div class="search-more" onclick="runGmailSearch()">🔍 Search ${esc(acctName(ACCT))} Gmail for “${esc(Q.trim())}” — beyond what's loaded <b>⏎</b></div>`;
    html = items.length ? html + more
      : `<div class="empty" style="padding:30px 0 6px">Nothing here matches “${esc(Q.trim())}”.</div>` + more;
    // E138: the filter reaches past mail+todos — matching goals and parked
    // braindump ideas surface as a strip of doors above the results.
    const ql=Q.trim().toLowerCase();
    const gm=(BOARD.objectives||[]).filter(o=>o.status==='active'
      &&((o.statement||'')+' '+(o.description||'')).toLowerCase().includes(ql)).slice(0,4);
    const bm=(BRAIN||[]).filter(b=>b.status==='idea'&&b.text.toLowerCase().includes(ql)).slice(0,3);
    if(gm.length||bm.length)
      html=`<div class="also-hits">also:
        ${gm.map(o=>`<span class="chip" onclick="setScope('goal','${esc(o.id)}')">🎯 ${esc(o.statement.slice(0,34))}</span>`).join('')}
        ${bm.map(b=>`<span class="chip" onclick="setScope('braindump',null)">💡 ${esc(b.text.split('\n')[0].slice(0,34))}</span>`).join('')}</div>`+html;
  }
  // Account cards reuse the old internal `project` scope name, but active
  // triage never renders the retired project/goal management headers.
  // E204: mail that arrived while you were scrolled down announces itself
  if(NEW_COUNT&&$('#list').scrollTop>120)
    html=`<div class="new-pill"><button onclick="$('#list').scrollTo({top:0,behavior:'smooth'});NEW_COUNT=0;renderList()">↑ ${NEW_COUNT} new</button></div>`+html;
  // E178: the plain lists get the Inbox view's measure and gutter too.
  $('#list').innerHTML = html ? `<div class="ib-wrap">${html}</div>` : '<div class="empty">Nothing here.</div>';
  hydrateAvatars($('#list'));
}
function toggleFold(n){ FOLDS.has(n)?FOLDS.delete(n):FOLDS.add(n); renderList(); }

/* ------- E102 (#5): drift sentinels — what's quietly going stale.
   Computed live from data already in memory; shows on Home only when
   something is actually drifting. Uncategorized growth tracked against
   a rolling local snapshot. ------- */
/* E159: drift is a section of the brief now, not its own card — this
   returns the lines (and still owns the uncat-history snapshot). */
function driftLines(){
  const L=[];
  const gz=(BOARD.objectives||[]).filter(o=>{const i=o.insights||{};return !(i.mail7d||i.tasks||i.meetings);});
  if(gz.length) L.push({t:`🎯 ${gz.length} goal${gz.length>1?'s':''} with zero activity this week`,
    d:gz.slice(0,3).map(o=>esc(o.statement.slice(0,30))).join(' · '), go:`openOvl('goal','${esc(gz[0].id)}')`});
  const wo=(BOARD.waiting_on||[]).filter(w=>(w.age_days||0)>=7);
  if(wo.length) L.push({t:`⏳ ${wo.length} waiting-on quiet ≥7 days`,
    d:wo.slice(0,3).map(w=>esc(w.who)).join(' · '), go:`document.querySelector('.dk[data-dock=wait]')?.click()`});
  const deals=(BOARD.pipeline||[]).filter(x=>(x.stale_days||0)>=14);
  if(deals.length) L.push({t:`💼 ${deals.length} deal${deals.length>1?'s':''} silent ≥14 days`,
    d:deals.sort((a,b)=>b.stale_days-a.stale_days).slice(0,3).map(x=>esc((x.deal||'').split(' - ')[0].slice(0,22))+` (${x.stale_days}d)`).join(' · '),
    go:`homeAsk('Which stale pipeline deals are worth reviving, and why?')`});
  const un=ITEMS.filter(i=>!i.snoozed&&!i.project&&inboxLive(i)).length;
  let hist={}; try{ hist=JSON.parse(localStorage.getItem('gc2_uncat_hist')||'{}'); }catch(e){}
  const past=Object.entries(hist).filter(([d])=>d<=dOff(-6)).sort().pop();
  const growth=past&&un>past[1]?` — ▲${un-past[1]} vs last week`:'';
  hist[dOff(0)]=un;
  Object.keys(hist).filter(d=>d<dOff(-30)).forEach(d=>delete hist[d]);
  localStorage.setItem('gc2_uncat_hist',JSON.stringify(hist));
  if(un>15||growth) L.push({t:`◌ ${un} uncategorized${growth}`,
    d:'file them, or let the 🧭 suggestions write the rules', go:`setScope('project','__none')`});
  return L;
}

/* ------- E100: the day plan card (Sonnet, generated each morning) ------- */

// E112: the card collapses (remembered) and the plan is EDITABLE — your
// words replace Sonnet's, stored server-side so the brief reads the same.
function planTools(fold){
  return `<span class="plan-tools" style="float:right;display:inline-flex;gap:12px;cursor:pointer">
    <span title="Edit the plan" onclick="event.stopPropagation();planEditDlg()">✎</span>
    <span title="Rethink the plan now" onclick="event.stopPropagation();PLAN=undefined;fetch('/plan?refresh=1').then(r=>r.json()).then(r=>{PLAN=r.plan;renderList();})">↻</span>
    <span title="${fold?'Expand':'Collapse'}" onclick="event.stopPropagation();planFold()">${fold?'▸':'▾'}</span></span>`;

/* E159 (Casey: "it doesn't need to show everything, just the stuff I need
   to know today"): the plan card grew into TODAY'S BRIEF — plan + ☀ due &
   flagged + 🛰 drift in one card, the single thing to read with coffee.
   The standalone ☀ Today tile and drift card are gone. */
function briefCardHtml(todayItems,tline){
  const p=PLAN;
  const drifts=driftLines();
  const fold=localStorage.getItem('gc2_plan_fold')==='1';
  if(fold) return `<div class="plan-card brief" onclick="planFold()" style="cursor:pointer">
    <div class="hw-k">◎ today's brief ${planTools(true)}</div>
    <div class="plan-theme" style="margin-bottom:0">${esc(p?.theme||'')}${todayItems.length?` · ☀ ${todayItems.length}`:''}${drifts.length?` · 🛰 ${drifts.length}`:''}</div></div>`;
  return `<div class="plan-card brief">
    <div class="hw-k">◎ today's brief${p&&p.edited?' <span style="opacity:.6">(edited)</span>':''} ${planTools(false)}</div>
    <div class="bf-col">
    ${p?`<div class="plan-theme">${esc(p.theme||'')}</div>
    ${(p.must||[]).map((m,i)=>`<div class="plan-must"><b>${i+1}.</b> <span>${esc(m.title||'')}</span>
      <em>${esc(m.why||'')}</em></div>`).join('')}
    ${(p.should||[]).length?`<div class="plan-then">then: ${p.should.map(s=>esc(s.title||'')).join(' · ')}</div>`:''}
    ${(p.wait||[]).length?`<div class="plan-wait">can wait: ${p.wait.map(esc).join(' · ')}</div>`:''}`
    :`<div class="plan-then">no plan yet — ↻ writes one from today's board</div>`}
    </div>
    <div class="bf-col">
    <div class="hc-sec" style="cursor:pointer" onclick="goToday()">☀ due &amp; flagged today</div>
    ${todayItems.slice(0,6).map(tline).join('')||'<div class="hcal-ev">nothing flagged — pull things in with ☀</div>'}
    ${todayItems.length>6?`<div class="hcal-ev" style="cursor:pointer" onclick="goToday()">+${todayItems.length-6} more in Today ⤢</div>`:''}
    </div>
    ${drifts.length?`<div class="bf-col"><div class="hc-sec">🛰 watch</div>${drifts.map(x=>`<div class="hd-line" onclick="event.stopPropagation();${x.go}">
      <span>${x.t}</span><em>${x.d}</em></div>`).join('')}</div>`:''}
  </div>`;
}
function planFold(){
  localStorage.setItem('gc2_plan_fold', localStorage.getItem('gc2_plan_fold')==='1'?'0':'1');
  renderList();
}
function planEditDlg(){
  const p=PLAN||{theme:'',must:[],should:[],wait:[]};
  dlg(`<h3>✎ Edit the plan</h3>
    <label>Theme</label><input type="text" id="pe-theme" value="${esc(p.theme||'')}">
    <label>Must-dos <span class="status" style="text-transform:none;letter-spacing:0">(one per line, "title — why")</span></label>
    <textarea id="pe-must" rows="4" style="width:100%">${esc((p.must||[]).map(m=>m.title+(m.why?' — '+m.why:'')).join('\n'))}</textarea>
    <label>Then</label>
    <textarea id="pe-should" rows="3" style="width:100%">${esc((p.should||[]).map(s=>s.title).join('\n'))}</textarea>
    <label>Can wait</label>
    <textarea id="pe-wait" rows="2" style="width:100%">${esc((p.wait||[]).join('\n'))}</textarea>
    <div class="foot"><button class="btn" onclick="planSave()">Save</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button><span class="status" id="pe-status"></span></div>`);
}
async function planSave(){
  const lines=id=>$('#'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const splitWhy=l=>{ const ix=l.indexOf(' — ')>=0?l.indexOf(' — '):l.indexOf(' -- ');
    return ix>0?{title:l.slice(0,ix).trim(),why:l.slice(ix+3).trim()}:{title:l,why:''}; };
  const plan={theme:$('#pe-theme').value.trim(),
    must:lines('pe-must').map(splitWhy),
    should:lines('pe-should').map(t=>({title:t})),
    wait:lines('pe-wait')};
  try { const out=await post('/plan',{plan}); PLAN=out.plan; closeDlg(); renderList(); toast('Plan updated — the brief reads your version'); }
  catch(e){ const st=$('#pe-status'); if(st){ st.textContent=e.message; st.className='status err'; } }
}
