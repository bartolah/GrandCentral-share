/* E84: HTML emails often carry URLs as bare text (Instagram, plain-ish
   marketing mail). Walk the sanitized DOM and linkify TEXT NODES only —
   existing anchors, attributes, script/style are never touched. */
function linkifyHtml(html){
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,null);
    const targets=[]; let n;
    while(n=walker.nextNode()){
      if(n.parentElement&&n.parentElement.closest('a,script,style,textarea')) continue;
      if(/(https?:\/\/|(^|[\s(])www\.)/i.test(n.nodeValue||'')) targets.push(n);
    }
    targets.forEach(t=>{
      const span=doc.createElement('span');
      span.innerHTML=linkify(t.nodeValue);
      t.parentNode.replaceChild(span,t);
    });
    return doc.body.innerHTML;
  }catch(e){ return html; }
}
/* E107: trim quoted history. HTML bodies — find the first known quote
   container (Gmail/Apple/Outlook/Yahoo/Thunderbird) and hide it plus all
   following siblings; the ••• toggle lives in the PARENT (the sandboxed
   iframe can't run scripts — the parent flips display via contentDocument). */
function trimQuoteHtml(html){
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const q=doc.querySelector('div.gmail_quote, blockquote[type=cite], #divRplyFwdMsg, .yahoo_quoted, .moz-cite-prefix');
    if(!q||!q.parentNode) return {html, trimmed:false};
    const r=doc.createRange(); r.setStart(doc.body,0); r.setEndBefore(q);
    const pre=r.cloneContents();
    if(!(r.toString().trim()||pre.querySelector('img'))) return {html, trimmed:false};
    const wrap=doc.createElement('div');
    wrap.className='gc-quote'; wrap.style.display='none';
    q.parentNode.insertBefore(wrap,q);
    let n=wrap.nextSibling; const moves=[];
    while(n){ moves.push(n); n=n.nextSibling; }
    moves.forEach(x=>wrap.appendChild(x));
    return {html:doc.body.innerHTML, trimmed:true};
  }catch(e){ return {html, trimmed:false}; }
}
/* Plain text: line index where the quoted tail starts, or -1. Never cuts
   at line 0 — a message that's ALL quote stays visible. */
function qCutText(t){
  const L=t.split('\n');
  let sawContent=false;
  for(let k=0;k<L.length;k++){
    const s=L[k].trim();
    if(sawContent){
      if(/^On .{6,160} wrote:$/.test(s)) return k;
      if(/^On \S/.test(s)&&L[k+1]&&/wrote:$/.test(L[k+1].trim())) return k;
      if(/^-{2,}\s*(Original|Forwarded) [Mm]essage\s*-{2,}/.test(s)||/^_{10,}$/.test(s)) return k;
      if(s.startsWith('>')){
        const rest=L.slice(k).filter(x=>x.trim());
        if(rest.filter(x=>x.trim().startsWith('>')).length>=rest.length*0.6)
          return (k>1&&/(wrote|écrit|schrieb):?$/.test(L[k-1].trim()))?k-1:k;
      }
    }
    if(s&&!s.startsWith('>')) sawContent=true;
  }
  return -1;
}

const attUrl=(m,k)=>`/attachment?account=${encodeURIComponent(MSG_CTX.account)}&thread_id=${encodeURIComponent(MSG_CTX.thread_id)}&uid=${encodeURIComponent(m.uid)}&idx=${k}`;
// E267 (Casey: "I'm not seeing inline images in my emails render"): an image
// pasted into an email is a part of the message, referenced as cid:…. Point
// each reference at that part's read-only /attachment link (Private-guarded,
// never stored; an <img> ignores its download disposition) and leave the
// ones shown in place out of the 📎 list.
function cidInline(m,html){
  const shown=new Set();
  if(!html||!m.uid||!MSG_CTX) return {html,shown};
  const byCid={};
  (m.attachments||[]).forEach((a,k)=>{ if(a.cid) byCid[a.cid.toLowerCase()]=k; });
  html=html.replace(/(src\s*=\s*["']?)cid:([^"'\s>]+)/gi,(all,pre,id)=>{
    let key=id; try{ key=decodeURIComponent(id); }catch(e){}
    const k=byCid[key.toLowerCase()];
    if(k==null) return all;
    shown.add(k); return pre+attUrl(m,k).replace(/&/g,'&amp;');
  });
  return {html,shown};
}
function msgHtml(m,gi){
  const frm=(m.from||'').split('<')[0].trim()||m.from||'?';
  const ci=cidInline(m,m.body_html);
  const listed=(m.attachments||[]).map((a,k)=>[a,k]).filter(([a,k])=>!ci.shown.has(k));
  // 2026-10-07 (Casey: "preview PDFs and image attachments, before
  // downloading them or with a separate download icon"): a PDF or image opens
  // in the viewer; ⬇ always downloads; anything else downloads on click.
  const atts=listed.length&&m.uid&&MSG_CTX
    ?`<div class="matts">${attChipsHtml(listed.map(([a,k])=>({a,m,k})))}</div>`
    :'';
  let body;
  if(m.body_html){
    const tq=trimQuoteHtml(ci.html);   // E107: history behind •••
    const native=mailNative(tq.html);
    body=`<iframe class="htmlbody ${native?'native':'paper'}" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
        onload="sizeFrame(this)" srcdoc="${esc(htmlWrapFor(tq.html)+linkifyHtml(tq.html))}"></iframe>`
      +(tq.trimmed?`<div class="qdots" onclick="qToggle(this)" title="Show quoted history">•••</div>`:'');
  } else {
    const raw=(m.body||'').trim().slice(0,20000), cut=qCutText(raw);
    body=cut>0
      ? `<div class="mb">${linkify(raw.split('\n').slice(0,cut).join('\n').trimEnd())}</div>
         <div class="qdots" onclick="qToggle(this)" title="Show quoted history">•••</div>
         <div class="mb mb-quote" hidden>${linkify(raw.split('\n').slice(cut).join('\n'))}</div>`
      : `<div class="mb">${linkify(raw)}</div>`;
  }
  // Every message shows its full recipient list; every name is a hoverable
  // person (card: copy contact / their mail / email them) — E62.
  const names=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean)
    .map(personSpan).join(', ');
  const rcpt=[m.to?`to ${names(m.to)}`:'', m.cc?`cc ${names(m.cc)}`:''].filter(Boolean).join(' · ');
  return `<div class="msg"${gi!=null?` data-mi="${gi}"`:''}><div class="mh" title="Collapse this message"><span class="mav" style="background:${avColor(frm)}">${initials(frm)}${avImg(emOf(m.from))}</span>
    ${personSpan(m.from||frm).replace('class="person"','class="person" style="font-weight:700;font-size:13.5px"')}<span class="t">${esc((m.date||'').replace('T',' ').slice(0,16))}</span>
    ${gi!=null&&MSG_CTX?.key?`<span class="mact">${[['reply','Reply to this message','reply'],['reply','Reply all to this message','all'],['forward','Forward this message','fwd']].map(([icn,t,md])=>
      `<button title="${t}" onclick="event.stopPropagation();openComposer('${esc(MSG_CTX.key)}','${md}',${gi})">${md==='all'?ic('reply')+ic('reply'):ic(icn)}</button>`).join('')}</span>`:''}</div>
    ${rcpt?`<div class="mrcpt">${rcpt}</div>`:''}
    ${body}${atts}</div>`;
}

/* Dev #16 (§6 Calendar RSVP, Casey 2026-09-27): an invitation answers from its
   email — Yes / Maybe / No, i.e. Google's accepted / tentative / declined.
   The server finds the event by the invite's iCalUID; one click, audited. */
const RSVP={};   // key -> {at, r}
async function loadRsvp(i, force){
  const k=i.key, c=RSVP[k];
  if(!force&&c&&Date.now()-c.at<120e3) return paintRsvp(i,c.r);
  try {
    const r=await fetch('/calendar/invite?'+new URLSearchParams({account:i.account,thread_id:i.raw.thread_id}),{cache:'no-store'}).then(r=>r.json());
    RSVP[k]={at:Date.now(),r}; paintRsvp(i,r);
  } catch(e){}
}
function paintRsvp(i,r){
  const bar=$('#rsvp-bar'); if(!bar||MSG_CTX?.key!==i.key||!r||!r.invite) return;
  const cur={accepted:'yes',tentative:'maybe',declined:'no'}[r.my_status]||'';
  const b=(v,label)=>`<button class="qbtn ${cur===v?'on':''}" ${r.can_rsvp?'':'disabled'} onclick="doRsvp('${esc(i.key)}','${v}',this)">${label}</button>`;
  bar.className='rsvp-bar';
  bar.innerHTML=`<span class="rsvp-q">📅 <b>${esc(r.summary||'Invitation')}</b>${r.start?' · '+esc(fmtDate(r.start)):''} — going?</span>
    <span class="rsvp-b">${b('yes','✓ Yes')}${b('maybe','? Maybe')}${b('no','✕ No')}
    ${r.link?`<a class="qbtn" href="${esc(r.link)}" target="_blank" rel="noopener">Calendar ↗</a>`:''}</span>
    ${r.can_rsvp?'':`<div class="status">${esc(r.reason||'')}</div>`}`;
}
async function doRsvp(key,v,btn){
  const i=findItem(key); if(!i) return;
  btn.closest('.rsvp-b').querySelectorAll('button').forEach(x=>x.disabled=true);
  try {
    await post('/calendar/rsvp',{account:i.account,thread_id:i.raw.thread_id,response:v});
    toast({yes:'Going ✓',maybe:'Maybe',no:'Declined'}[v]+' — Google has let the organizer know');

  } catch(e){ toast('RSVP failed — '+e.message); loadRsvp(i,true); }
}

async function tpSave(){

    recur:v('td-recur',t.recur||'')};
  const acct=v('td-acct',t.account||'');
  if(acct&&acct!==(t.account||'')) f.account=acct;
  if(!f.text.trim()) f.text=t.text;
  try {
    await post('/task',{action:'update',id:i.raw.id,fields:f});
    const renamed=f.text!==t.text;
    Object.assign(i.raw,{text:f.text,notes:f.notes,due:f.due||null,
      account:f.account||t.account||null,recur:f.recur||null});
    i.title=f.text; i.snip=i.raw.notes||''; i.due=i.raw.due;
    i.account=i.project=i.raw.account||null; i.goals=[];

      setTimeout(()=>{ if(st.textContent==='saved') st.textContent=''; },1500); }
    if(renamed&&t.gmail_label) toast('Renamed — its Gmail label follows');
    renderRail(); renderCrumbs();
    if(!$('#dlg-back').classList.contains('open')) renderList();
  } catch(e){ const st=$('#td-status'); if(st){ st.textContent=e.message; st.className='status err'; } else toast('Save failed — '+e.message); }
}

    if(!$('#composer')){ toast('Could not reopen that thread — here’s your text as a new email');
      return draftReopen({...snap, kind:'cp', acct:snap.account, subject:snap.subject||('Re: '+(snap.title||''))}); }
    await openComposer(snap.key, snap.mode, snap.msg);
    setChips('sd-to',snap.to); setChips('sd-cc',snap.cc); setChips('sd-bcc',snap.bcc);
    const sj=$('#sd-subject'); if(sj&&snap.subject) sj.value=snap.subject;
    $('#sd-body').innerHTML=snap.html;
  }
}
function offerBak(bodyId,k){
  try {
    const raw=localStorage.getItem(bakKey(k)); if(!raw) return;
    const b=JSON.parse(raw);
    if(!b?.text?.trim() || Date.now()-b.ts>48*3600e3){ localStorage.removeItem(bakKey(k)); return; }
    const el=$('#'+bodyId); if(!el) return;
    const strip=document.createElement('div');
    strip.className='bak-strip';
    strip.innerHTML='📝 Unsent text from '+new Date(b.ts).toLocaleString()+' recovered <button class="qbtn">Restore</button> <button class="qbtn">Discard</button>';
    const [rst,dsc]=strip.querySelectorAll('button');
    rst.onclick=()=>{ el.innerText=b.text; strip.remove(); };   // plain text — formatting isn't kept
    dsc.onclick=()=>{ clearBak(k); strip.remove(); };
    el.parentNode.insertBefore(strip, el.previousElementSibling||el);
  } catch(e){}
}
function rbHtml(id){
  const el=$('#'+id); if(!el) return null;
  // Only ship HTML when actual formatting exists — plain typing stays plain.
  if(!/<(b|i|u|s|ul|ol|li|a|img|strong|em|strike|code|blockquote|pre)\b|class="gc-sig"/i.test(el.innerHTML)) return null;
  // 2026-10-09 (Casey: "This email showed up without formatting"): the
  // composer shows raw line breaks (white-space: pre-wrap), so pasted text,
  // ✨ and snippets looked right here — but email HTML ignores them, and
  // Gmail and Outlook ran every paragraph together. They become <br>s.
  const c=el.cloneNode(true), w=document.createTreeWalker(c, NodeFilter.SHOW_TEXT), hits=[];
  while(w.nextNode()){ const n=w.currentNode; if(/\n/.test(n.nodeValue)&&!n.parentNode.closest('pre')) hits.push(n); }
  hits.forEach(n=>{ const f=document.createDocumentFragment();
    n.nodeValue.split(/\r?\n/).forEach((part,k)=>{ if(k) f.appendChild(document.createElement('br')); if(part) f.appendChild(document.createTextNode(part)); });
    n.parentNode.replaceChild(f,n); });
  return c.innerHTML;
}
function acctEmail(a){ return (CONN?.accounts||[]).find(x=>x.slug===a||x.user===a)?.user||''; }

/* ================= recipient chip fields (E63) =================
   To/Cc/Bcc as real chips: one per person (name shown, address on hover,
   × removes, wraps over lines so everyone is visible), an inline input
   with type-ahead from everyone the board has seen. */
function contactsUniverse(){
  const m=new Map();
  MAIL.forEach(t=>{
    const add=p=>{ const em=emOf(p); if(em&&!OWN.has(em)&&!m.has(em)) m.set(em,nmOf(p)); };
    if(t.last_from) add(t.last_from);
    (t.participants||[]).forEach(add);
  });

}
/* Dev #32-#34: the address book is per account and comes from the server —
   every thread that account ever had, archived and sent included, plus
   Casey's edits. contactsUniverse() (this inbox only) is the fallback. */
const CONTACTS={};           // account -> [{email,name,threads,...}]
async function loadContacts(acct){
  acct=acct||ACCT; if(!acct) return [];
  try { const r=await fetch('/contacts?account='+encodeURIComponent(acct),{cache:'no-store'}).then(r=>r.json());
    if(r.ok) CONTACTS[acct]=r.contacts||[]; } catch(e){}
  return CONTACTS[acct]||[];
}
const contactStr=c=>c.name&&c.name!==c.email?`${/[,"]/.test(c.name)?'"'+c.name.replace(/"/g,'')+'"':c.name} <${c.email}>`:c.email;
function contactList(acct){
  acct=acct||ACCT;
  if(CONTACTS[acct]) return CONTACTS[acct];
  return [...contactsUniverse().entries()].map(([email,name])=>({email,name,threads:0}));
}
function ensureContactsDl(acct){
  acct=acct||ACCT;
  let dl=$('#dl-contacts');
  if(!dl){ dl=document.createElement('datalist'); dl.id='dl-contacts'; document.body.appendChild(dl); }
  const fill=()=>{ dl.innerHTML=contactList(acct).slice(0,800).map(c=>`<option value="${esc(contactStr(c))}">`).join(''); dl.dataset.acct=acct; };
  fill();

}
// A typed name with no address becomes the matching contact: exact name, else
// the contact whose name or address starts with it — the most-emailed one when
// several do (the list is ranked by threads). Dev #40: a name should always
// land with an address; the chip now shows which one, so a wrong pick is
// visible. Only a name that matches nobody stays as typed (a red chip).
function resolveContact(raw){
  if(emOf(raw)) return raw;
  const q=raw.trim().toLowerCase(); if(!q) return raw;
  const list=contactList($('#dl-contacts')?.dataset.acct);
  const exact=list.filter(c=>(c.name||'').toLowerCase()===q);
  if(exact.length) return contactStr(exact[0]);
  const pre=list.filter(c=>(c.name||'').toLowerCase().startsWith(q)||c.email.startsWith(q));
  const word=list.filter(c=>(c.name||'').toLowerCase().split(/\s+/).some(w=>w.startsWith(q)));
  const hit=pre[0]||word[0];
  return hit?contactStr(hit):raw;
}
/* E104: compact recipient block — To on one line, Cc/Bcc folded behind
   toggles unless already populated (Gmail grammar). */
function rcptRows(pre,to,cc,bcc){
  return `<div class="rcpt"><span class="rl">To</span>${chipField(pre+'-to',to)}
      <span class="rtog"><a id="tog-${pre}-cc" ${cc?'hidden':''} onclick="rcptShow('${pre}','cc')">Cc</a><a id="tog-${pre}-bcc" ${bcc?'hidden':''} onclick="rcptShow('${pre}','bcc')">Bcc</a></span></div>
    <div class="rcpt" id="row-${pre}-cc" ${cc?'':'hidden'}><span class="rl">Cc</span>${chipField(pre+'-cc',cc)}</div>
    <div class="rcpt" id="row-${pre}-bcc" ${bcc?'':'hidden'}><span class="rl">Bcc</span>${chipField(pre+'-bcc',bcc)}</div>`;
}
function rcptShow(pre,kind){
  $('#row-'+pre+'-'+kind).hidden=false; $('#tog-'+pre+'-'+kind).hidden=true;
  $('#'+pre+'-'+kind).querySelector('input').focus();
}
// Split a recipient list on commas outside quotes and <> — "Smith, John" <j@x> is one person.
const splitRcpts=v=>(String(v||'').match(/(?:"[^"]*"|<[^>]*>|[^,;])+/g)||[]).map(s=>s.trim()).filter(Boolean);
function chipField(id, csv){
  const parts=splitRcpts(csv);
  return `<div class="chipfield" id="${id}" onclick="this.querySelector('input').focus()"
      ondragover="chipDragOver(event,this)" ondragleave="this.classList.remove('chip-drop')" ondrop="chipDrop(event,this)">
    ${parts.map(chipHtml).join('')}
    <input class="chip-in" list="dl-contacts" placeholder="add…"
      onkeydown="chipKey(event,'${id}')" oninput="chipInput('${id}',this)" onblur="chipCommit('${id}',this)" onchange="chipCommit('${id}',this)">
  </div>`;
}
function chipHtml(raw){
  const em=emOf(raw), nm=nmOf(raw)||em;
  const bad=!em;
  // Dev #40: the address is always on the chip, not just in a tooltip, so a
  // picked name visibly carries the email it will go to.

  return `<span class="rchip ${bad?'bad':''} person" draggable="true" ondragstart="chipDragStart(event,this)" ondragend="chipDragEnd()" data-em="${esc(em)}" data-nm="${esc(nm)}" data-raw="${esc(raw)}"
    title="${esc(raw)}">${esc(nm)}${addr}<b onclick="event.stopPropagation();this.parentNode.remove()">×</b></span>`;

/* Dev #71 ("move an Addressee by dragging them between the fields"): drag a
   recipient chip from To, Cc or Bcc and drop it on another. While you drag,
   a hidden Cc or Bcc row opens so there's somewhere to drop it. */
let CHIP_DRAG=null;
function chipDragStart(e,el){
  CHIP_DRAG=el;
  e.dataTransfer.effectAllowed='move';
  try { e.dataTransfer.setData('text/plain', el.dataset.raw||''); } catch(_){}
  const pre=(el.closest('.chipfield')?.id||'').split('-')[0];
  ['cc','bcc'].forEach(f=>{ const row=$('#row-'+pre+'-'+f); if(row&&row.hidden){ row.hidden=false; row.dataset.dragOpened='1'; } });
}
function chipDragOver(e,field){
  if(!CHIP_DRAG) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; field.classList.add('chip-drop');
}
function chipDrop(e,field){
  if(!CHIP_DRAG) return;
  e.preventDefault(); field.classList.remove('chip-drop');
  const inp=field.querySelector('input');
  if(CHIP_DRAG.closest('.chipfield')!==field){
    const em=CHIP_DRAG.dataset.em;
    if(em&&[...field.querySelectorAll('.rchip')].some(c=>c.dataset.em===em)) CHIP_DRAG.remove();   // already there
    else field.insertBefore(CHIP_DRAG, inp);
    const fid=field.id; const tog=$('#tog-'+fid); if(tog) tog.hidden=true;
    delete (field.closest('.rcpt')||{dataset:{}}).dataset.dragOpened;
  }
  CHIP_DRAG=null;
}
function chipDragEnd(){
  // close a Cc/Bcc row the drag opened if it's still empty
  document.querySelectorAll('.rcpt[data-drag-opened]').forEach(r=>{
    if(!r.querySelector('.rchip')) r.hidden=true; delete r.dataset.dragOpened; });
  document.querySelectorAll('.chip-drop').forEach(x=>x.classList.remove('chip-drop'));
  CHIP_DRAG=null;
}
function chipKey(e,id){
  const inp=e.target;
  if(e.key==='Enter'||e.key===','||e.key===';'){ e.preventDefault(); chipCommit(id,inp); }
  else if(e.key==='Backspace'&&!inp.value){
    const chips=$('#'+id).querySelectorAll('.rchip');
    if(chips.length) chips[chips.length-1].remove();
  }
}
function chipCommit(id,inp){
  const v=(inp.value||'').trim().replace(/[,;]+$/,'');
  if(!v) return;
  // Dev #34: split on commas outside quotes and <>, so "Smith, John" <j@x>
  // stays one contact; a bare typed name resolves to its contact's address.
  const parts=splitRcpts(v).map(resolveContact);
  inp.insertAdjacentHTML('beforebegin', parts.map(chipHtml).join(''));
  inp.value='';
}
// Picking a suggestion commits it at once, so it can't be half-typed over.
function chipInput(id,inp){
  const v=inp.value; if(!v||!emOf(v)) return;
  const dl=$('#dl-contacts'); if(dl&&[...dl.options].some(o=>o.value===v)) chipCommit(id,inp);
}
function chipVal(id){
  const f=$('#'+id); if(!f) return '';

}
function chipAdd(id,raw){ const inp=$('#'+id)?.querySelector('input'); if(inp){ inp.value=raw; chipCommit(id,inp); } }

/* ================= signatures (E53) =================
   Stored server-side in the E19 context corpus (kind 'voice', active:0 so
   Ask never ingests them) so they follow Casey across devices. context text
   collapses whitespace, so newlines ride as ⏎ and decode here. */
let SIGS={}, SIG_IDS={};
/* 2026-10-08 (Casey: "fix the HTML signature"): each account's signature is
   HTML — logo, links, bold — kept in its own table that only a paired
   browser writes. In the composer it sits in one <div class="gc-sig"> block
   under what you type, so it goes out as HTML and survives ✨ rewrites. */
let SIGS_HTML={};
async function loadSigsTable(){
  try { const r=await fetch('/signatures',{cache:'no-store'}).then(r=>r.json());
    if(r.ok){ SIGS={}; SIGS_HTML={};
      Object.entries(r.signatures||{}).forEach(([a,x])=>{ SIGS[a]=x.text; SIGS_HTML[a]=x.html; }); } } catch(e){}
}
// a fresh composer body: two empty lines to type in, then the signature
function sigMine(id){
  const el=$('#'+id); if(!el) return '';
  const c=el.cloneNode(true); c.querySelectorAll('.gc-sig').forEach(x=>x.remove());
  return rbPlain(c);
}
function sigFill(id, acct, before){
  const el=$('#'+id); if(!el) return;
  el.innerHTML='';
  if(before){ el.innerText=before.replace(/\s+$/,''); el.insertAdjacentHTML('beforeend','<div><br></div>'); }
  else el.innerHTML='<div><br></div><div><br></div>';
  if(SIGS_HTML[acct]) el.insertAdjacentHTML('beforeend',`<div class="gc-sig">${SIGS_HTML[acct]}</div>`);
  el.focus();
  const rng=document.createRange(); rng.setStart(el.firstChild||el,0); rng.collapse(true);

async function loadSigs(){
  loadSigsTable();

    const out=await fetch('/context').then(r=>r.json());
    (out.context||[]).forEach(n=>{
      // 2026-10-08: signatures moved to their own table (loadSigsTable);
      // a Context note that looks like one is no longer used as one
      const sn=String(n.text||'').match(/^\[snippet:([^\]]{1,60})\]\s?([\s\S]*)$/);
      if(sn&&!SNIPS.some(x=>x.id===n.id)) SNIPS.push({id:n.id,name:sn[1],text:sn[2].replace(/⏎/g,'\n').trim()});
    });
  } catch(e){}
}
async function saveSig(acct,text){
  text=(text||'').trim();
  const enc=`[signature:${acct}] ${text.replace(/\n/g,'⏎')}`;
  try {
    if(SIG_IDS[acct] && !text){
      await post('/context',{action:'delete',id:SIG_IDS[acct]});
      delete SIGS[acct]; delete SIG_IDS[acct];
    } else if(SIG_IDS[acct]){
      await post('/context',{action:'update',id:SIG_IDS[acct],fields:{text:enc}});
      SIGS[acct]=text;
    } else if(text){
      const out=await post('/context',{action:'add',scope:'global',kind:'voice',text:enc});
      SIG_IDS[acct]=out.id; SIGS[acct]=text;
      try { await post('/context',{action:'update',id:out.id,fields:{active:0}}); } catch(e){}
    }

  } catch(e){ toast('Signature save failed — '+e.message); }
}
function sigDlg(fromKey){

/* ================= reply / send (the ONE send path) ================= */
/* 2026-10-08 (Casey: "I responded to an email, it was sent, but I'm not
   seeing it appear in the thread after a minute or so"): the pane read the
   stored copy until the next mail sync. Your reply shows at once, and the
   real thread is read fresh from Gmail a few seconds later. */
function threadShowSent(i,p){
  if(!i) return;
  i._msgs=[...(i._msgs||[]), {from:`Your Name <${acctEmail(i.account)||''}>`, to:p.to||'', cc:p.cc||'',
    date:new Date().toISOString(), subject:p.subject||'', body:p.body||'', body_html:p.body_html||null,
    attachments:[], inline_images:0, uid:null, _local:true}];
  if(OPEN===i.key&&!$('#pane').classList.contains('composing')) renderThreadPane(i);
  const n=i._msgs.length;
  const fresh=async tries=>{
    try { const out=await fetch(`/thread?thread_id=${i.raw.thread_id}&account=${i.account}&fresh=1`,{cache:'no-store'}).then(r=>r.json());
      if(out.ok&&(out.messages||[]).length>=n){ i._msgs=out.messages; i._tlabels=out.labels||i._tlabels;
        if(OPEN===i.key&&!$('#pane').classList.contains('composing')) renderThreadPane(i); return; } } catch(e){}
    if(tries>0) setTimeout(()=>fresh(tries-1),10000);
  };
  setTimeout(()=>fresh(2),4000);
}
async function ensureMsgs(i){
  if(i._msgs?.length) return true;
  try {
    const out=await fetch(`/thread?thread_id=${i.raw.thread_id}&account=${i.account}`).then(r=>r.json());
    if(out.ok){ i._msgs=out.messages||[]; i._tlabels=out.labels||[]; return true; }
  } catch(e){}
  return false;
}
function replyRecipients(i,mode){
  const msgs=i._msgs||[];
  if(!msgs.length){
    // Fallback: derive from the thread row itself — last sender + the other
    // participants — so Reply NEVER opens with empty recipients.
    const em=s=>((String(s).match(/[\w.+-]+@[\w.-]+/)||[''])[0]).toLowerCase();
    const parts=(i.raw.participants||[]).filter(p=>em(p)&&!OWN.has(em(p)));
    const to=i.raw.last_direction==='inbound'&&i.raw.last_from?[i.raw.last_from]:parts.slice(0,1);
    const toSet=new Set(to.map(em));
    const cc=parts.filter(p=>!toSet.has(em(p)));
    const seen=new Set(), uq=a=>{ const e=em(a); if(!e||seen.has(e))return false; seen.add(e); return true; };
    return { to:to.filter(uq).join(', '), cc:mode==='reply'?'':cc.filter(uq).join(', ') };
  }
  // Dev #26: answering one message answers ITS sender and recipients
  const last=sdMsg(i)||[...msgs].reverse().find(m=>!OWN.has(((m.from||'').match(/[\w.+-]+@[\w.-]+/)||[''])[0].toLowerCase()))||msgs[msgs.length-1];
  const addrs = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
  const em = s => ((s.match(/[\w.+-]+@[\w.-]+/)||[''])[0]).toLowerCase();
  let to=[last.from,...addrs(last.to)].filter(a=>a&&!OWN.has(em(a)));
  const cc=addrs(last.cc).filter(a=>!OWN.has(em(a)));
  if(mode==='reply'){
    const sender=[last.from].filter(a=>a&&!OWN.has(em(a)));
    to=sender.length?sender:to.slice(0,1);
  }
  const seen=new Set(), uq=a=>{ const e=em(a); if(seen.has(e))return false; seen.add(e); return true; };
  return { to:to.filter(uq).join(', '), cc:mode==='reply'?'':cc.filter(uq).join(', ') };
}
/* Inline composer — lives IN the pane below the messages (E53: "keep the
   reply window as part of the side panel"). Context carries over: reply-all
   recipients prefilled, subject threaded, signature appended, and the prior
   conversation quoted below (on by default, toggleable). */
function buildQuote(i,mode){
  const m=sdMsg(i)||(i._msgs||[]).slice(-1)[0]; if(!m) return '';
  const src=(m.body||'').trim()||'(original was an HTML message — open in Gmail to view)';
  if(mode==='fwd')
    return '\n\n---------- Forwarded message ----------\n'
      +'From: '+(m.from||'').trim()
      +'\nDate: '+(m.date||'').replace('T',' ').slice(0,16)
      +'\nSubject: '+(i.title||'')
      +(m.to?'\nTo: '+m.to:'')+'\n\n'+src;
  const head=`On ${(m.date||'').replace('T',' ').slice(0,16)}, ${(m.from||'').trim()} wrote:`;
  return '\n\n'+head+'\n'+src.split('\n').map(l=>'> '+l).join('\n');
}
let SD_MODE='all';   // 'reply' | 'all' | 'fwd' — set per composer open
let SD_MSG=null;     // Dev #26: index of the one message being answered; null = the thread
const sdMsg=i=>SD_MSG!=null?(i._msgs||[])[SD_MSG]||null:null;
async function openComposer(key,mode,mi){
  SD_MODE=mode||'all'; ATTS.sd=[]; SD_MSG=Number.isInteger(mi)?mi:null;
  const i=findItem(key); if(!i||i.type!=='mail') return;
  const box=$('#composer'); if(!box) return;
  // E204: the reply takes most of the pane (Shortwave) — the thread shrinks
  // above it and stays scrollable.
  $('#pane').classList.add('composing');
  const cm=$('#cmp-mode'); if(cm){ const tm=sdMsg(i);
    cm.textContent={reply:'Reply',all:'Reply all',fwd:'Forward'}[mode||'all']
      +(tm?(mode==='fwd'?' ':' to ')+((tm.from||'').split('<')[0].trim()||'this message')+"'s message of "+(tm.date||'').replace('T',' ').slice(5,16):'')
      +' · as '+(i.account||''); }
  if(!i._msgs?.length){
    box.innerHTML='<div class="empty" style="padding:12px">Loading recipients…</div>';
    await ensureMsgs(i);   // fallback recipients still work if this fails

function composedBody(i){

function composedHtml(i){

    const q=buildQuote(i,SD_MODE).trim();
    if(q) out+='<br><br><blockquote style="border-left:2px solid #ccc;margin:0;padding-left:10px;color:#555">'+
      q.split('\n').map(l=>esc(l)).join('<br>')+'</blockquote>';

/* §6 amendment (Casey, 2026-09-29, Dev #50: "I also like that I don't have
   to click confirm on send"): one click on Send is the human's decision; the
   email is held for SEND_UNDO_MS behind an Undo bar and only then goes to
   POST /send with confirm:true and the recipients shown as chips. Same caps
   (≤10 recipients, one thread) and the same mail_sends log. Undo — or a
   failed send — puts the composer back exactly as it was. */
const SEND_UNDO_MS=10000;
function setChips(id,csv){
  const f=$('#'+id); if(!f) return;
  f.querySelectorAll('.rchip').forEach(c=>c.remove());
  splitRcpts(csv).forEach(r=>chipAdd(id,r));
  if(csv&&id.match(/-(cc|bcc)$/)){ const pre=id.split('-')[0], k=id.split('-')[1];
    const row=$('#row-'+pre+'-'+k), tog=$('#tog-'+pre+'-'+k); if(row) row.hidden=false; if(tog) tog.hidden=true; }
}
async function doSend(key,btn){
  const i=findItem(key);
  const to=chipVal('sd-to');
  if(!to&&!chipVal('sd-cc')&&!chipVal('sd-bcc')){ sdErr('Add someone to To, Cc or Bcc'); return; }   // dev #73
  if(!rbText('sd-body').trim()){ sdErr('Write a message first'); return; }
  const cc=chipVal('sd-cc'), bcc=chipVal('sd-bcc');
  const nRec=(to+','+cc+','+bcc).split(',').filter(s=>s.trim()).length;
  let send_at=null; const w=$('#sd-when')?.value||'';
  if(w==='4h') send_at=new Date(Date.now()+4*3600e3).toISOString();
  else if(w==='tomorrow') send_at=snoozeWhen('tomorrow');
  else if(w==='custom'){ if(!$('#sd-custom').value){ sdErr('Pick the custom time'); return; } send_at=new Date($('#sd-custom').value).toISOString(); }
  if(ATTS.sd.length&&send_at){ sdErr('Attachments send now only — remove them or send unscheduled'); return; }
  const payload=trkPayload('sd',{confirm:true,account:i.account,to,cc,bcc,
    subject:$('#sd-subject').value.trim(),body:composedBody(i)});
  const ext=extractInlineImages(composedHtml(i));
  if(send_at&&ext.atts.length){ sdErr('Inline images send now only — remove them or send unscheduled'); return; }
  const allAtts=[...ATTS.sd.map(a=>({name:a.name,mime:a.mime,data:a.data})),...ext.atts];
  if(allAtts.length) payload.attachments=allAtts;
  if(SD_MODE==='fwd'){
    payload.new=true; payload.body_html=ext.html;
    const fa=[...document.querySelectorAll('.sd-fwdatt:checked')].map(c=>({uid:c.dataset.uid,idx:+c.dataset.idx}));
    if(fa.length){ payload.forward_of=i.raw.thread_id; payload.forward_atts=fa; }
  }
  else { payload.thread_id=i.raw.thread_id; payload.body_html=send_at?null:ext.html; payload.send_at=send_at; }
  const then=$('#sd-then').value;
  const finish=async out=>{
    clearBak('r:'+i.raw.thread_id);   // E155: it landed — drop the snapshot
    if(!send_at) sentStale();
    toast(send_at?('Scheduled for '+new Date(out.scheduled).toLocaleString()):'Sent ✓');
    if(then==='archive') await doneItem(key);
    else if(then==='dismiss') await dismissItem(key);
    else if(then==='snooze-tomorrow'){ await post('/mail/triage',{action:'snooze',thread_id:i.raw.thread_id,account:i.account,until:snoozeWhen('tomorrow')}); dropLocal(i); }
    else if(OPEN===key&&!$('#pane').classList.contains('composing')) renderThreadPane(i);
    if(!send_at&&SD_MODE!=='fwd') threadShowSent(i,payload);
    if(!send_at) sendCard({key:then===''&&SD_MODE!=='fwd'?key:null, ctx:{account:i.account, thread_id:SD_MODE==='fwd'?'':i.raw.thread_id,
      message_id:out.message_id||null, to:payload.to, cc:payload.cc, subject:payload.subject}});
    loadMailTodos();
  };
  if(send_at){                        // scheduled: cancellable in Scheduled, no hold
    btn.disabled=true; $('#sd-status').textContent='Scheduling…';
    try { await finish(await post('/send',payload)); } catch(e){ btn.disabled=false; sdErr(e.message); }
    return;
  }
  // hold, then send; Undo or failure restores the composer
  const snap={mode:SD_MODE, msg:SD_MSG, to, cc, bcc, subject:payload.subject, html:$('#sd-body').innerHTML,
    atts:ATTS.sd.slice(), quote:$('#sd-quote')?.checked, then};
  const restore=async err=>{
    if(OPEN!==key) await openItem(key);
    await openComposer(key,snap.mode,snap.msg);
    setChips('sd-to',snap.to); setChips('sd-cc',snap.cc); setChips('sd-bcc',snap.bcc);
    const sj=$('#sd-subject'); if(sj) sj.value=snap.subject;
    $('#sd-body').innerHTML=snap.html; ATTS.sd=snap.atts; sdAttRender('sd');
    if($('#sd-quote')) $('#sd-quote').checked=snap.quote; if($('#sd-then')) $('#sd-then').value=snap.then;
    if(err) sdErr(err);
  };
  closeComposer(key);
  queueUndo(`Sending to ${nRec} ${nRec===1?'person':'people'} — “${(payload.subject||'').slice(0,40)}”`,
    async()=>{ try { await finish(await post('/send',payload,null,{keepalive:true})); }
      catch(e){ await restore('Not sent — '+e.message); } },   // restored here, not again by commitPending
    ()=>restore(), SEND_UNDO_MS);
}

function sendCard({key,ctx}){
  let host=$('#send-cards');
  if(!host){ host=document.createElement('div'); host.id='send-cards'; document.body.appendChild(host); }
  while(host.children.length>=3) host.firstElementChild.remove();
  const i=key&&findItem(key), c=document.createElement('div');
  c.className='send-card';
  c.innerHTML=`<div class="sc-h"><b>Sent ✓</b><span class="sc-s">${esc(String(ctx.subject||'').slice(0,60))}</span><span class="sp"></span>
      <button class="tool" title="Dismiss" onclick="cardClose(this)">${ic('x')}</button></div>
    ${i?`<div class="sc-acts"><button class="qbtn" onclick="cardClose(this);doneItem('${esc(key)}')">✓ Archive</button>
      <button class="qbtn" onclick="cardClose(this);snoozeDlg('${esc(key)}')">⏰ Snooze…</button></div>`:''}
    <div class="watch-host"></div>`;
  host.appendChild(c);
  requestAnimationFrame(()=>c.classList.add('in'));
  watchRow(c.querySelector('.watch-host'),ctx).then(()=>{ if(!i&&!c.querySelector('.watch-ask')) c.remove(); });
  let t=setTimeout(()=>cardFade(c),60000), sticky=false;
  c.addEventListener('mouseenter',()=>clearTimeout(t));
  c.addEventListener('mouseleave',()=>{ if(!sticky){ clearTimeout(t); t=setTimeout(()=>cardFade(c),20000); } });
  c.addEventListener('pointerdown',()=>{ sticky=true; clearTimeout(t); });
}

async function doComposeSend(btn){

      closeCompose(); toast('⏰ Scheduled for '+new Date(out.scheduled).toLocaleString()+' — cancel it from Scheduled');
      loadMailTodos(); if(SCOPE.kind==='drafts') renderList();
    } catch(e){ err(e.message); }
    return;
  }

  if(reply) payload.thread_id=d.thread_id; else payload.new=true;
  // §6 amendment (2026-09-29): held SEND_UNDO_MS behind Undo, then sent.
  const snap={acct, to, cc, bcc, subject, html:$('#cp-body').innerHTML, atts:ATTS.cp.slice(), draft:d};

    composeDlg(snap.draft);

  queueUndo(`Sending to ${nRec} ${nRec===1?'person':'people'} — “${subject.slice(0,40)}”`, async()=>{
    try { window._lastSend=await post('/send',payload,null,{keepalive:true}); }
    catch(e){ restore('Not sent — '+e.message); return; }   // restored here, not again by commitPending
    clearBak(d?'d:'+d.account+':'+d.draft_uid:'new');   // E155
    sentStale();
    sendCard({key:reply?'m:'+acct+':'+d.thread_id:null, ctx:{account:acct, thread_id:reply?d.thread_id:'', message_id:(window._lastSend||{}).message_id||null, to, cc, subject}});
    if(d){
      DRAFTS=null;
      try { await post('/draft/discard',{account:d.account,draft_uid:d.draft_uid,gm_msgid:d.gm_msgid});
        toast('Sent ✓ — and removed from Drafts'); }
      catch(e){ toast('Sent ✓ — but the draft copy is still in Gmail Drafts ('+e.message+')'); }
      if(SCOPE.kind==='drafts') setScope('drafts');

  }, ()=>restore(), SEND_UNDO_MS);
}

function _lnk(u,pre=''){

/* E76: the dock shows ANY day. Baked board days (7d from the last sweep)
   win because they carry project mappings; anything else comes live from
   GET /calendar, fetched a month-grid (42d) at a time and cached. Day
   notes for the fetched range ride along so the journal shows everywhere. */
let CAL_DATE=null;                     // ISO day the dock shows
const CAL_LIVE={};                     // date -> {label, events} from GET /calendar
const CAL_FETCHED=new Set(), CAL_PEND=new Set();   // month-grid starts
function calDay(iso){
  return (BOARD.calendar||[]).find(x=>x.date===iso)||CAL_LIVE[iso];
}
function calGridStart(iso){            // Sunday starting the 6-week grid
  const [y,m]=iso.split('-').map(Number);
  const first=new Date(y,m-1,1), gs=new Date(first);
  gs.setDate(1-first.getDay());
  return gs;

function calEnsure(iso){
  const gs=calGridStart(iso), startISO=isoLocal(gs);
  if(CAL_FETCHED.has(startISO)||CAL_PEND.has(startISO)) return;
  CAL_PEND.add(startISO);
  const end=new Date(gs); end.setDate(gs.getDate()+41);
  Promise.all([
    fetch(`/calendar?start=${startISO}&days=42`).then(r=>r.json()),
    fetch(`/daynotes?start=${startISO}&end=${isoLocal(end)}`).then(r=>r.json()),
  ]).then(([c,n])=>{
    if(c.ok){ c.calendar.forEach(d=>CAL_LIVE[d.date]=d); CAL_FETCHED.add(startISO); if(c.cal_account) CAL_ACCT=c.cal_account; }
    // never clobber a note that's already cached — it may hold unsaved typing
    if(n.ok) n.notes.forEach(x=>{ if(!(x.date in DN_CACHE)) DN_CACHE[x.date]={text:x.text,updated_at:x.updated_at}; });
  }).catch(()=>{}).finally(()=>{
    CAL_PEND.delete(startISO);
    if(DOCK==='cal') renderDock();
    if(CV_MON) renderCalPage();
  });
}

/* E124: dock quick-add — resolves the current scope to ONE operation the

async function dkAddTodo(){

async function nudge(account,thread_id,btn){

/* ------- E76: full-page calendar — a month grid with the journal on
   every day. Events come from the same baked-first/live-fetch resolver
   the dock uses; 📓 markers show days with notes; the side panel holds
   the selected day's events and its editable journal. ------- */
let CV_MON=null, CV_SEL=null;          // 'YYYY-MM' shown; ISO day selected
/* E167: the calendar reads two ways — ▦ the month, or ◷ the day in clock
   order with its work docked under each meeting (Casey picked the timeline
   mockup for exactly this). The choice sticks per device. */
let CAL_VIEW = localStorage.getItem('gc2_cal_view') || 'month';
function setCalView(v){ CAL_VIEW=v; localStorage.setItem('gc2_cal_view',v); renderCalPage(); }
const tlMin = t => { const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m?(+m[1]*60+ +m[2]):null; };
const tlHHMM = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function openCalPage(view){
  const t=dOff(0);
  if(view){ CAL_VIEW=view; localStorage.setItem('gc2_cal_view',view); }
  CV_SEL=CAL_DATE||t;
  CV_MON=CV_SEL.slice(0,7);
  $('#ovl').classList.add('cal-wide');
  $('#ovl-back').classList.add('open');
  renderCalPage();
}
function cvSelect(iso){
  CV_SEL=iso; renderCalPage(); loadDayNote(iso);
  if(DOCK==='cal'){ CAL_DATE=iso; renderDock(); }   // the dock follows along
}
function cvMonth(v){
  CV_MON=v;
  CV_SEL=v===dOff(0).slice(0,7)?dOff(0):v+'-01';
  renderCalPage();
}
function cvNav(n){
  const [y,m]=CV_MON.split('-').map(Number);

/* Work that belongs to a meeting: its project's mail awaiting a reply and its
   todos due or late — the reason you open a calendar entry in the first place. */
function tlDock(ev){
  const p=ev.project?projTheater(ev.project):null;
  if(!p) return [];
  const today=dOff(0);
  return ITEMS.filter(i=>!i.snoozed&&(projTheater(i.project)===p||i.project===p))
    .filter(i=>i.type==='todo' ? (i.due&&i.due<=today)||i.my_day : (inboxLive(i)&&(i.needs||i.unread)))
    .sort((a,b)=>(a.type==='todo'?0:1)-(b.type==='todo'?0:1)||String(a.date||'').localeCompare(String(b.date||'')));
}
function tlRow({time,strong,dotClass,title,titleClass,meta,dock,dockClass,last}){
  return `<div class="tl-row">
    <div class="tl-time${strong?' strong':''}">${esc(time||'')}</div>
    <div class="tl-rail"><span class="tl-dot ${dotClass||''}"></span>${last?'':'<span class="tl-line"></span>'}</div>
    <div class="tl-body">
      <div class="tl-title ${titleClass||''}">${title}</div>
      ${meta?`<div class="tl-meta">${meta}</div>`:''}
      ${dock&&dock.length?`<div class="tl-dock ${dockClass||''}">${dock.join('')}</div>`:''}
    </div></div>`;
}
function renderCalTime(iso){
  const day=calDay(iso), all=[...((day&&day.events)||[])];
  const evs=all;
  const elsewhere=all.length-evs.length;
  const isToday_=iso===dOff(0);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const timed=evs.filter(e=>tlMin(e.time)!=null).sort((a,b)=>tlMin(a.time)-tlMin(b.time));
  const allDay=evs.filter(e=>tlMin(e.time)==null);
  const today=dOff(0);
  const late=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&i.type==='todo'&&i.due&&i.due<today)
    .sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  let lateIx=0;
  // Back-to-back meetings on one project would otherwise each claim the SAME
  // three items and read as three separate piles of work. A thing belongs to
  // the first meeting that can act on it.
  const docked=new Set();
  const out=[];
  if(allDay.length) out.push(tlRow({time:'all day',dotClass:'',title:allDay.map(e=>esc(e.title)).join(' · ')}));
  let nowPlaced=!isToday_;
  timed.forEach((e,ix)=>{
    const mins=tlMin(e.time);
    if(!nowPlaced&&mins>nowMin){
      nowPlaced=true;
      const until=mins-nowMin;
      const pick=late[lateIx];
      out.push(tlRow({time:tlHHMM(nowMin),strong:true,dotClass:'now',
        title:`<div class="tl-now-head"><span class="lbl">Now</span><span class="ln"></span>
          <span style="color:var(--faint);font-size:11.5px">${until} min until ${esc(e.title.slice(0,30))}</span></div>`,
        meta: until>=25&&pick
          ? `<div class="tl-open fits">Enough time for <b>${esc(pick.title.slice(0,54))}</b>
              <span class="chip due">${fdAge(pick.due)}d late</span>
              <div class="fd-acts"><button class="go" onclick="homeOpen('${esc(pick.project||'__none')}','${esc(pick.key)}')">Open it</button></div></div>`
          : ''}));
      if(until>=25&&pick) lateIx++;
    }
    // A real gap between meetings is a place to put something.
    const prev=timed[ix-1];
    if(prev){
      const gap=mins-(tlMin(prev.time)+30);
      if(gap>=60&&mins<=18*60){
        const pick=late[lateIx];
        out.push(tlRow({time:'', dotClass:'', titleClass:'',
          title:`<div class="tl-open${pick?' fits':''}">Open until ${esc(e.time)} — ${Math.round(gap/60*10)/10}h
            ${pick?`· <b>${esc(pick.title.slice(0,46))}</b> <span class="chip due">${fdAge(pick.due)}d late</span>`:''}</div>`}));
        if(pick) lateIx++;
      }
    }
    const dock=tlDock(e).filter(i=>!docked.has(i.key)).slice(0,3)
      .map(i=>{ docked.add(i.key); return i; })
      .map(i=>`<div class="d-row" onclick="closeOvl();homeOpen('${esc(i.project||'__none')}','${esc(i.key)}')">
      <b style="font-weight:600">${i.type==='todo'?'◯':esc((i.who||'').split('<')[0].trim().slice(0,18))}</b>
      <span class="t">${esc(i.title.slice(0,64))}</span>
      ${i.type==='todo'&&i.due&&i.due<today?`<span class="chip due">${fdAge(i.due)}d late</span>`
        :i.needs?`<span class="chip due">${fdAge(i.date)??0}d owed</span>`:''}</div>`);
    const key=dock.length>0;
    out.push(tlRow({time:e.time,strong:key,dotClass:key?'key':'',
      title:esc(e.title),titleClass:key?'key':'',
      meta:[e.location?'📍 '+esc(e.location):'',e.cal==='personal'?'personal':''].filter(Boolean).join(' · '),
      dock,dockClass:key?'key':'',last:ix===timed.length-1&&nowPlaced}));
  });
  if(!nowPlaced&&isToday_) out.push(tlRow({time:tlHHMM(nowMin),strong:true,dotClass:'now',last:true,
    title:`<div class="tl-now-head"><span class="lbl">Now</span><span class="ln"></span>
      <span style="color:var(--faint);font-size:11.5px">nothing else on the clock today</span></div>`}));
  if(!evs.length) out.push('<div class="empty">A clear track — nothing scheduled.</div>');
  const owed=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&i.type==='mail'&&inboxLive(i)&&i.needs).length;
  return `<div class="tl">${out.join('')}
    <div class="fd-foot">${late.length} late · ${owed} replies owed${elsewhere?` · ${elsewhere} meeting(s) under other accounts`:''}</div></div>`;
}

      <select class="cal-monsel" onchange="cvMonth(this.value)">${calMonthOptions(CV_MON)}</select>
      ${CAL_PEND.size?'<span style="color:var(--faint);font-size:11.5px">loading…</span>':''}

          <textarea id="cv-dn" class="dn-edit" data-date="${CV_SEL}" placeholder="journal for this day…"></textarea>

/* ------- Ask (real /command) ------- */
let ASK_LOG=[], ASK_CHAT=null, ASK_BUSY=false;
/* Projects step 5 (§6, 2026-09-30): opened from a project page, Ask is fenced
   to that project — the server reads only what's filed there and offers only
   read + draft tools. ASK_PROJ says which; ✕ on the fence leaves it. */
let ASK_PROJ=null;          // null | {id, name}
function askLeaveProj(){ ASK_PROJ=null; ASK_LOG=[]; ASK_CHAT=null; renderAsk(); }
function projAsk(id){
  const inp=$('#pj-ask-in'), q=(inp&&inp.value||'').trim(); if(!q) return;
  const p=PROJ_PAGE[id]&&PROJ_PAGE[id].data;
  if(!ASK_PROJ||ASK_PROJ.id!==id){ ASK_LOG=[]; ASK_CHAT=null; }
  ASK_PROJ={id, name:(p&&p.name)||(projById(id)||{}).name||'this project'};
  inp.value='';
  openDock('ask');
  const a=$('#ask-in'); if(a){ a.value=q; askSend(); }
}
function renderAsk(){
  const d=$('#dock');
  d.innerHTML=`<h3>${dockX}${ASK_PROJ?'✨ '+esc(ASK_PROJ.name):'Ask Grand Central'}<span class="sp"></span>
      <button class="qbtn" onclick="askHistory()" title="Past conversations">🕘</button>
      <button class="qbtn" onclick="ASK_LOG=[];ASK_CHAT=null;renderAsk()" title="New chat">＋</button></h3>
    ${ASK_PROJ?`<div class="ask-fence">📁 Only this project — its emails, todos, notes, meetings, people and context. Reads and drafts; never archives or sends.
      <a onclick="askLeaveProj()" title="Ask about everything instead">✕ leave</a></div>`:''}
    <div class="ask-log" id="ask-log">${ASK_LOG.map((t,ti)=>`<div class="ask-turn ${t.role==='user'?'you':''}"><span class="bub">${esc(t.text)}</span>${(t.cards||[]).map((c,ci)=>askCardHtml(c,ti,ci)).join('')}</div>`).join('')||`<div class="empty" style="padding:20px 0">${ASK_PROJ?'Ask about '+esc(ASK_PROJ.name)+' — status, what’s open, a summary, a draft reply…':'Ask about your mail, todos, deals, calendar…'}</div>`}</div>
    <div class="ask-opts">
      <select id="ask-model"><option value="claude-sonnet-5">Sonnet 5</option>
        <option value="claude-opus-5-5">Opus 5.5</option><option value="claude-fable-5-1">Fable 5.1</option></select>
      <select id="ask-effort"><option value="">effort: default</option><option>low</option><option>medium</option><option>high</option></select>
      <span id="ask-busy"></span></div>
    <div class="ask-form"><textarea id="ask-in" placeholder="Ask… (Enter to send)"></textarea>
      <button class="btn" onclick="askSend()">→</button></div>`;
  $('#ask-model').value=localStorage.getItem('gc2_ask_model')||'claude-sonnet-5';
  // Dev #35: a remembered model that left the picker (Opus 4.8, Fable 5) → the default
  if(!$('#ask-model').value) $('#ask-model').value='claude-sonnet-5';
  $('#ask-effort').value=localStorage.getItem('gc2_ask_effort')||'';
  $('#ask-in').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); askSend(); } };
  const log=$('#ask-log'); log.scrollTop=log.scrollHeight;
}
async function askSend(){
  if(ASK_BUSY) return;
  const text=$('#ask-in').value.trim(); if(!text) return;
  const model=$('#ask-model').value, effort=$('#ask-effort').value;
  localStorage.setItem('gc2_ask_model',model); localStorage.setItem('gc2_ask_effort',effort);
  ASK_LOG.push({role:'user',text}); ASK_BUSY=true; renderAsk();
  $('#ask-busy').textContent='thinking…'; const t0=Date.now();
  const tick=setInterval(()=>{ const el=$('#ask-busy'); if(el) el.textContent=`thinking… ${Math.round((Date.now()-t0)/1000)}s`; },1000);
  try {
    const out=await post('/command',{text,model,effort:effort||undefined,chat_id:ASK_CHAT,
      project_id:ASK_PROJ?ASK_PROJ.id:undefined,
      account:(!ASK_PROJ&&!HOME_ALL)?ACCT:undefined,   // E259: its context documents ground the answer
      history:ASK_LOG.slice(0,-1).map(t=>({role:t.role,text:t.text}))});
    ASK_CHAT=out.chat_id||ASK_CHAT;
    ASK_LOG.push({role:'assistant',text:out.reply||'(no reply)',
      cards:(out.cards||[]).map(c=>({...c,state:'',msg:''}))});
  } catch(e){
    // E136: through the tunnel, Cloudflare cuts responses at ~100s while the
    // server keeps working and still persists the answer — say so.
    ASK_LOG.push({role:'assistant',
      text:'Error — '+e.message+'\n\nIf this was a long-running ask, the answer may still have completed server-side — check 🕘 History in a minute.'});
  }
  clearInterval(tick); ASK_BUSY=false; renderAsk();
}
/* E265 (§6, 2026-10-02): Ask proposes, Casey clicks. A card holds the exact
   request; the click sends it to the same route as the board's own button,
   from this (paired) browser, so every server check applies. */
function askCardHtml(c,ti,ci){
  const st=c.state==='done'?`<span>✓ ${esc(c.msg||'Done')}</span>`
    :c.state==='busy'?'<span>Working…</span>'
    :c.state==='skip'?'<span>Skipped</span>'
    :`<button class="btn" onclick="askCard(${ti},${ci})">${esc(c.button||'Do it')}</button>
      <button class="qbtn" onclick="askCardSkip(${ti},${ci})">Skip</button>
      ${c.state==='err'?`<span style="color:var(--bad,#c33)">${esc(c.msg)}</span>`:'<span>Nothing happens until you click.</span>'}`;
  return `<div class="ask-card"><div class="ac-acct">${esc(c.account||'')} · ${esc(c.kind||'')}</div>

function askCardSkip(ti,ci){ const c=((ASK_LOG[ti]||{}).cards||[])[ci]; if(c){ c.state='skip'; renderAsk(); } }
async function askCard(ti,ci){

  const meets=[];

    <div class="ovl-stats">

      <div class="stat"><b>${todos.length}</b><span>todos</span></div>

      ${kind==='goal'&&o?`<div class="stat"><b>${o.insights?.mail7d??0}</b><span>mail this week</span></div>
        <div class="stat"><b>${o.insights?.meetings??0}</b><span>meetings</span></div>`:''}</div>
    <div class="ovl-list">
      ${sec('Status', status)}
      ${kind==='project'?sec('Workstreams', opsHtml, 'No workstreams in this project.'):''}
      ${kind==='project'?sec('Goals', goalsHtml, 'No goals in this project yet.'):''}
      ${kind==='goal'?sec('Fed by', feedsHtml, 'No operations feed this goal yet.'):''}
      ${sec('Meetings', meets.join(''), 'No mapped meetings coming up.')}
      ${waiting.length?sec('Waiting on', waitHtml):''}
      ${sec('Todos · '+todos.length, todos.slice(0,15).map(rowHtml).join(''), 'No todos filed here.')}
      ${sec('Emails · '+mails.length, mails.slice(0,20).map(rowHtml).join(''), 'No emails filed here.')}
    </div>`;
  $('#ovl-back').classList.add('open');
}

/* ------- E82: attachments — shared picker state for the inline composer
   and the Compose dialog. ≤3 files, ≤5MB total (server re-enforces);
   bigger files keep the 📎-via-Gmail hatch. ------- */
/* Dev #50: the compose window no longer blocks the page, so it and a reply
   in the pane can be open together — each keeps its own attachments, shown
   in its own list ('cp' = compose window, 'sd' = reply). */
const ATTS={cp:[],sd:[]};
const attCtx=el=>el&&el.closest&&el.closest('#cw')?'cp':'sd';
const attList=ctx=>(ctx==='cp'?$('#cw'):$('#composer'))?.querySelector('#sd-attlist');
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':n+' B';
async function sdFiles(inp){
  await addFiles(attCtx(inp), inp.files);
  inp.value='';
}
async function addFiles(ctx, files){
  const A=ATTS[ctx];
  for(const f of files){
    if(A.length>=3){ toast('Up to 3 attachments per send'); break; }
    if(A.reduce((s,a)=>s+a.size,0)+f.size>5*1024*1024){
      toast(f.name+' would push past the 5 MB total — use 📎 via Gmail for big files'); continue; }
    const data=await new Promise((res,rej)=>{ const r=new FileReader();
      r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(f); });
    A.push({name:f.name,mime:f.type||'application/octet-stream',size:f.size,data});
  }
  sdAttRender(ctx);
}
/* Dev #67 (Casey: "I want to be able to drag images or attachments (files)
   into the compose pane and have them added to the email"; interview: images
   inline where dropped, everything else attached, 5 MB as today). Drops feed
   the same two paths as 🖼 and 📎 — nothing new reaches the send path. */
async function rbInsertImageFile(id, f, x, y){
  if(f.size>3.5*1024*1024){ toast(f.name+': keep images under ~3.5 MB (5 MB total per send)'); return; }
  const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
  const el=$('#'+id); if(!el) return;
  el.focus();
  const rng=document.caretRangeFromPoint?document.caretRangeFromPoint(x,y):null;
  if(rng&&el.contains(rng.startContainer)){ const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng); }
  document.execCommand('insertImage', false, url);
  rbSave(id);
}
const dropZone=t=>t&&t.closest&&(t.closest('#cw')||t.closest('#composer'));
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
document.addEventListener('dragover', e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();                       // never let a stray drop open the file in the tab
  const z=dropZone(e.target);
  document.querySelectorAll('.drop-on').forEach(x=>{ if(x!==z) x.classList.remove('drop-on'); });
  if(z){ z.classList.add('drop-on'); e.dataTransfer.dropEffect='copy'; } else e.dataTransfer.dropEffect='none';
});
document.addEventListener('dragleave', e=>{ if(!e.relatedTarget) document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on')); });
document.addEventListener('drop', async e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();
  document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on'));
  const z=dropZone(e.target); if(!z){ toast('Drop files onto an open email you are writing'); return; }
  const ctx=z.id==='cw'?'cp':'sd', body=e.target.closest('.rb-body');
  const files=[...e.dataTransfer.files], rest=[];
  for(const f of files){
    if(body&&/^image\//.test(f.type)) await rbInsertImageFile(body.id, f, e.clientX, e.clientY);
    else rest.push(f);
  }
  if(rest.length) await addFiles(ctx, rest);
  if(rest.length) toast(`📎 Attached ${rest.length} file${rest.length>1?'s':''}`);
});
function sdAttRender(ctx){
  const d=attList(ctx); if(!d) return;
  d.innerHTML=ATTS[ctx].map((a,k)=>`<span class="att">📎 ${esc(a.name)} <span>${fmtSize(a.size)}</span>
    <b style="cursor:pointer;margin-left:4px" onclick="ATTS['${ctx}'].splice(${k},1);sdAttRender('${ctx}')">✕</b></span>`).join('');
}

/* E77: skins — cycle and persist; CSS does the rest via html[data-skin]. */
const SKINS={neon:'Neon', console:'Console', rain:'Rain', vector:'Vector', grid:'Grid', phosphor:'Phosphor', mission:'Mission Control', daylight:'Daylight', paper:'Paper', mono:'Mono', compact:'Compact'};
/* E183 (Casey: "make the light/dark open a drop down so I can choose which
   skin"): ten skins is too many to cycle through one click at a time — ◐
   opens the list, with the light ones grouped apart from the dark. */
const SKIN_LIGHT=['daylight','paper','mono','compact'];
function setSkin(k){
  if(!SKINS[k]) return;
  document.documentElement.dataset.skin=k;
  localStorage.setItem('gc2_skin',k);
  applySkinIcon(); renderList(); renderRail(); renderAcctTabs();
  const m=$('#skin-menu'); if(m){ m.hidden=true; SKIN_MANAGE=false; }
  toast('Skin: '+SKINS[k]);
}
/* E186 (Casey: "I'd like to be able to configure which skins are visible…
   not all of them need to be active"): the picker lists the ones you keep.
   Hidden skins are not deleted — ⚙ Choose skins flips the same menu into a
   checklist, and the one you are wearing is always listed. */
function skinsHidden(){
  try { const v=JSON.parse(localStorage.getItem('gc2_skins_hidden')||'[]');
    return Array.isArray(v)?v.filter(k=>SKINS[k]):[]; } catch(e){ return []; }
}
function skinToggleVisible(k){
  const cur=document.documentElement.dataset.skin||'neon';
  if(k===cur) return toast('That is the skin you are wearing');
  const h=skinsHidden();
  const next=h.includes(k)?h.filter(x=>x!==k):[...h,k];
  if(next.length>=Object.keys(SKINS).length) return toast('Keep at least one skin');
  localStorage.setItem('gc2_skins_hidden',JSON.stringify(next));
  skinMenu(true,true);
}
let SKIN_MANAGE=false;
function skinMenu(keepOpen,manage){
  const m=$('#skin-menu'); if(!m) return;
  if(!m.hidden && !keepOpen){ m.hidden=true; SKIN_MANAGE=false; return; }
  if(manage!==undefined) SKIN_MANAGE=manage;
  const cur=document.documentElement.dataset.skin||'neon';
  const hidden=skinsHidden();
  if(SKIN_MANAGE){
    const row=k=>`<button onclick="event.stopPropagation();skinToggleVisible('${k}')" title="${hidden.includes(k)?'Show in the picker':'Hide from the picker'}">
      <span>${hidden.includes(k)?'☐':'☑'}</span><span>${esc(SKINS[k])}</span>${k===cur?'<span class="pin on">wearing</span>':''}</button>`;
    m.innerHTML = `<h5>Which skins show in the picker</h5>${Object.keys(SKINS).map(row).join('')}
      <h5 style="padding-top:6px"><button onclick="event.stopPropagation();skinMenu(true,false)">← back to skins</button></h5>`;
  } else {
    const item=k=>`<button onclick="setSkin('${k}')">${k===cur?'<b>✓</b>':'<span style="width:9px;display:inline-block"></span>'}
      <span>${esc(SKINS[k])}</span></button>`;
    const show=k=>SKINS[k]&&(!hidden.includes(k)||k===cur);
    const light=SKIN_LIGHT.filter(show), dark=Object.keys(SKINS).filter(k=>!SKIN_LIGHT.includes(k)&&show(k));
    m.innerHTML = (light.length?`<h5>Light</h5>${light.map(item).join('')}`:'')
      + (dark.length?`<h5>Dark</h5>${dark.map(item).join('')}`:'')
      + `<h5 style="padding-top:6px"><button onclick="event.stopPropagation();skinMenu(true,true)">⚙ Choose skins…</button></h5>`;
  }
  m.hidden=false;
}
document.addEventListener('click', e=>{
  const m=$('#skin-menu');
  if(m&&!m.hidden&&!e.target.closest('#skin-btn')&&!e.target.closest('#skin-menu')) m.hidden=true;
});
/* E206: arm/disarm the viewport diagnostics from inside the installed app.
   Turning it ON reloads, because the numbers worth having are the ones taken
   during a cold start — that is when the gap appears. */
function toggleDiag(){
  const on = localStorage.getItem('gc2_diag') === '1';
  if (on) {
    localStorage.removeItem('gc2_diag');
    const box = document.getElementById('diag-box'); if (box) box.remove();
    const st = $('#diag-state'); if (st) st.textContent = 'off';
    toast('Viewport diagnostics off');
  } else {
    localStorage.setItem('gc2_diag', '1');
    toast('Diagnostics on — reloading to measure a cold start');
    setTimeout(() => location.reload(), 600);
  }
}
function diagState(){

/* E206: the same picker as a dialog, for the phone.

}

/* iPad/iPhone Safari: WebAudio obeys the Silent switch unless the page
   declares itself 'playback' (Safari 17+), and the context only unlocks
   inside a real touch/click gesture — so declare intent up front and
   pre-unlock on the first gesture anywhere. */
if(navigator.audioSession){ try{navigator.audioSession.type='playback';}catch(e){} }
// Dev #30 ("Sound effects don't seem to be working any more"): this unlock
// ran ONCE. iOS suspends the context again whenever the tab is backgrounded
// or the phone locks ('interrupted'), and resume() outside a gesture is
// refused silently — so sound died after the first trip away from the app.
// Re-arm on every gesture; it's a no-op while the context is running.
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{
  try{
    _AC=_AC||new (window.AudioContext||window.webkitAudioContext)();
    if(_AC.state!=='running') _AC.resume();
  }catch(e){}
},{passive:true}));
function sfx(kind){
  if(localStorage.getItem('gc2_sfx')==='0') return;
  const set=SFX[document.documentElement.dataset.skin||'neon'];
  if(!set||!set[kind]) return;
  try {
    _AC=_AC||new (window.AudioContext||window.webkitAudioContext)();
    if(_AC.state!=='running'){
      // resume() is async on iOS — scheduling against a suspended context
      // drops the sound; replay this kind once the context is live.
      _AC.resume().then(()=>{ if(_AC.state==='running') sfx(kind); },()=>{});
      return;
    }
    const now=_AC.currentTime;
    const tone=(f0,f1,at,dur,type,vol)=>{
      const o=_AC.createOscillator(), g=_AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f0,now+at);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,now+at+dur);
      g.gain.setValueAtTime(0,now+at);
      g.gain.linearRampToValueAtTime(vol||.05,now+at+.008);
      g.gain.exponentialRampToValueAtTime(.0001,now+at+dur);
      o.connect(g); g.connect(_AC.destination);
      o.start(now+at); o.stop(now+at+dur+.02);
    };
    const noise=(at,dur,vol,cutoff)=>{
      const len=Math.ceil(_AC.sampleRate*dur), buf=_AC.createBuffer(1,len,_AC.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=_AC.createBufferSource(); src.buffer=buf;
      const f=_AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cutoff||1000;
      const g=_AC.createGain(); g.gain.setValueAtTime(vol||.04,now+at);
      g.gain.exponentialRampToValueAtTime(.0001,now+at+dur);
      src.connect(f); f.connect(g); g.connect(_AC.destination);
      src.start(now+at);
    };
    set[kind](tone,noise);
  } catch(e){ /* audio is garnish — never let it break the shell */ }
}
function toggleSfx(){
  const off=localStorage.getItem('gc2_sfx')==='0';
  localStorage.setItem('gc2_sfx', off?'1':'0');
  const s=$('#sfx-state'); if(s) s.textContent=off?'on':'off';
  if(off) sfx('nav');
}

/* ================= E188: browser notifications =================
   Push arrives whether or not the board is open — on the Mac and, once it is
   on the home screen, on the iPhone. Safari only allows any of this over
   HTTPS, so the dialog says plainly when you are on the wrong address. */
const b64ToU8 = b64 => {
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
};
let PUSH=null;
async function loadPush(){ try{ PUSH=await fetch('/push').then(r=>r.json()); }catch(e){ PUSH={ok:false}; } }
async function pushDlg(){
  await loadPush();
  const secure=window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window;
  const perm=(window.Notification&&Notification.permission)||'default';
  const reg=secure?await navigator.serviceWorker.getRegistration():null;
  const sub=reg?await reg.pushManager.getSubscription():null;
  const kinds=[['brief','Morning brief','the plan, your top three, today\'s events'],
               ['event','Event reminders','~15 minutes before each meeting'],
               ['wrap','Day\'s end','what got done, what is still owed'],
               ['alert','Problems','a dead credential, a dropped tunnel, a stuck sweeper'],
               ['agent','Agent requests','an agent is waiting for you to approve something']];
  const prefs=(PUSH&&PUSH.prefs)||{};
  const row=([k,name,what])=>{ const p=prefs[k]||{imessage:true,push:true};
    return `<div class="hs-row" style="cursor:default">
      <span class="hs-l"><b>${esc(name)}</b><br><span class="status" style="text-transform:none;letter-spacing:0">${esc(what)}</span></span>
      <button class="qbtn ${p.imessage?'on':''}" onclick="pushPref('${k}',${!p.imessage},${p.push})">💬 iMessage</button>
      <button class="qbtn ${p.push?'on':''}" onclick="pushPref('${k}',${p.imessage},${!p.push})">🔔 Browser</button></div>`; };
  dlg(`<h3>🔔 Notifications</h3>
    ${secure?'':`<div class="status err" style="margin-bottom:8px">This address cannot receive notifications — Safari only allows them over HTTPS.
      Open <b>https://gc.example.com</b> (and on iPhone, add it to your Home Screen first).</div>`}
    <div class="hc-sec">this device</div>
    <div class="td-quick">
      ${sub?`<button class="qbtn on" onclick="pushOff()">🔕 Turn off here</button>`
            :`<button class="qbtn" ${secure?'':'disabled'} onclick="pushOn()">🔔 Turn on for this device</button>`}
      <button class="qbtn" onclick="pushTest()" ${PUSH&&PUSH.devices&&PUSH.devices.length?'':'disabled'}>Send a test</button>
      <span class="status" style="text-transform:none;letter-spacing:0">permission: ${esc(perm)}</span></div>
    <div class="hc-sec" style="margin-top:10px">subscribed devices</div>
    ${(PUSH&&PUSH.devices||[]).map(d=>`<div class="hs-row" style="cursor:default">
        <span class="hs-l">${esc(d.label)} <span class="status" style="text-transform:none;letter-spacing:0">· added ${esc(String(d.created_at).slice(0,10))}</span></span>
        <button class="qbtn" onclick="pushForget(${d.id})">✕ forget</button></div>`).join('')
      ||'<div class="status" style="text-transform:none;letter-spacing:0">No devices yet.</div>'}
    <div class="hc-sec" style="margin-top:12px">which channel each alert uses</div>
    <div class="hstats">${kinds.map(row).join('')}</div>
    <div class="foot"><button class="btn sec2" onclick="closeDlg()">Done</button></div>`);
}
async function pushOn(){
  try{
    if(Notification.permission!=='granted'){
      const p=await Notification.requestPermission();
      if(p!=='granted'){ toast('Notifications were not allowed'); return; }
    }
    const reg=await navigator.serviceWorker.ready;
    await loadPush();
    if(!PUSH||!PUSH.public_key){ toast('The host has no push key — check config/.env'); return; }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,
      applicationServerKey:b64ToU8(PUSH.public_key)});
    const label=(navigator.standalone||matchMedia('(display-mode: standalone)').matches?'App · ':'')
      +(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Macintosh/.test(navigator.userAgent)?'Mac':'this device');
    await post('/push',{action:'subscribe',label,subscription:sub.toJSON()});
    toast('Notifications on for this device'); pushDlg();
  }catch(e){ toast('Could not turn on — '+e.message); }
}
async function pushOff(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ const ep=sub.endpoint; await sub.unsubscribe();
      await loadPush();
      const mine=(PUSH.devices||[]).find(d=>ep.includes(d.host||''));
      if(mine) await post('/push',{action:'forget',id:mine.id}); }
    toast('Notifications off for this device'); pushDlg();
  }catch(e){ toast('Could not turn off — '+e.message); }
}
async function pushForget(id){ try{ await post('/push',{action:'forget',id}); pushDlg(); }catch(e){ toast(e.message); } }
async function pushTest(){
  try{ const r=await post('/push',{action:'test'});
    toast(r.sent?`Test sent to ${r.sent} device(s)`:'No device took it'+(r.dropped?` — ${r.dropped} dead subscription(s) removed`:''));
  }catch(e){ toast('Test failed — '+e.message); }
}
async function pushPref(kind,imessage,push){
  try{ const r=await post('/push',{action:'prefs',kind,imessage,push}); if(PUSH) PUSH.prefs=r.prefs; pushDlg(); }
  catch(e){ toast('Could not save — '+e.message); }
}

const FB_VERDICTS={good:['👍','Good','keep this'],bad:['👎','Broken','something is wrong'],adjust:['🔧','Adjust','right idea, needs a change']};
function fbSel(el){
  // Short, readable path — enough for a session to find the thing again.
  const part=n=>{
    if(n.id) return '#'+n.id;
    const cls=[...n.classList].filter(c=>!/^(on|open|sel|kb|dragging|dropat)$/.test(c)).slice(0,2);
    return n.tagName.toLowerCase()+(cls.length?'.'+cls.join('.'):'');
  };
  const path=[]; let n=el;
  while(n&&n.nodeType===1&&path.length<4&&n!==document.body){ path.unshift(part(n)); if(n.id) break; n=n.parentElement; }
  return path.join(' ▸ ');
}
function fbDescribe(el){
  const r=el.getBoundingClientRect();
  const box=el.closest('.hcard,.row,.bundle,.scope,.sec,.dlg,.pane,.list-head,header')||el;
  return { sel:fbSel(el), text:(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),
    box:box===el?'':fbSel(box), rect:`${Math.round(r.width)}×${Math.round(r.height)} at ${Math.round(r.left)},${Math.round(r.top)}` };
}
function fbFlash(el){
  const r=el.getBoundingClientRect(), m=document.createElement('div');
  m.style.cssText=`position:fixed;left:${r.left-3}px;top:${r.top-3}px;width:${r.width+6}px;height:${r.height+6}px;
    border:2px solid var(--red);pointer-events:none;z-index:200;transition:opacity .4s ease;`;

async function fbSend(){

  if(!note&&FB.verdict!=='good'){ toast('Say what is wrong — that is the part a fix needs'); $('#fb-note')?.focus(); return; }
  FB.note=note;

  const first=(note.split('\n')[0]||'this screen').trim();
  const head=first.length>70?first.slice(0,69).replace(/\s+\S*$/,'')+'…':first;
  const text=`⚑ ${name} — ${head}\n\n${note||'(no note)'}\n\n`
    +(FB.el?`Element: ${FB.el.sel}${FB.el.text?`\n  text: "${FB.el.text}"`:''}${FB.el.box?`\n  inside: ${FB.el.box}`:''}\n  size: ${FB.el.rect}\n`:'Element: not pointed at\n')
    +`Screen: ${c.screen}\nClient: ${c.client}\nBoard: ${c.board}\nErrors: ${c.errors}`;
  try {
    await post('/dev',{action:'add',text,account:ACCT},devHdr());

      try{ localStorage.removeItem('gc2_dev_code'); }catch(_){}

/* ================= keyboard ================= */
document.addEventListener('keydown', e=>{
  // E164: ⚑ works from anywhere, including mid-typing — you flag what you see.
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(e.key==='F'||e.key==='f')){ e.preventDefault(); fbDlg(); return; }
  if(e.target.matches('input,textarea,select,[contenteditable]')){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='/' ){ e.preventDefault(); $('#q').focus(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  // Dev #40 (Casey: "Let's copy the Shortwave/Gmail shortcuts"): Gmail's
  // layout, plus Shortwave's h for snooze. Two-key "go to" (g i …) and
  // "select" (* a …) sequences as in Gmail. ? lists them all.
  if(KSEQ.k&&Date.now()-KSEQ.t<1200){
    const p=KSEQ.k; KSEQ.k=null; e.preventDefault();
    if(p==='g'){
      const go={i:()=>goInbox(), s:()=>{ goInbox(); TAB='star'; syncTabs(); renderList(); renderCrumbs(); },
        t:()=>setScope('sent',null), d:()=>setScope('drafts',null), a:()=>setScope('allmail',null),
        k:()=>goTodos(), h:()=>setScope('home',null)}[e.key];
      if(go) go();
    } else if(p==='*'){
      if(e.key==='a'){ VISIBLE.forEach(i=>SEL.add(i.key)); renderList(); }
      if(e.key==='n'){ SEL.clear(); renderList(); }
    }
    return;
  }
  if(e.key==='g'||e.key==='*'){ KSEQ.k=e.key; KSEQ.t=Date.now(); e.preventDefault(); return; }
  if(e.key==='Escape'){
    // E204: Esc steps back one level — a dialog, then the pane, then an open group
    const busy=document.querySelector('#dlg-back.open,.ovl.open');
    if(SPLIT&&!OPEN&&!busy){ closeSplit(); return; }
    closeDlg(); closeOvl(); closePane(); return; }
  // With a dialog open, the list's one-key actions stay asleep.
  if(document.querySelector('#dlg-back.open')) return;
  // E204: t = add to todo (the selection, else the row under the cursor or
  // the open email) — Shortwave's one-key "Add to todo".
  if(e.key==='t'&&!e.metaKey&&!e.ctrlKey){
    const keys=SEL.size?[...SEL]:(VISIBLE[KB]?[VISIBLE[KB].key]:(OPEN?[OPEN]:[]));
    const mail=keys.filter(k=>k.startsWith('m:'));
    if(mail.length){ e.preventDefault(); todoPick(mail); return; }
  }
  if(e.key==='j'||e.key==='k'){
    KB=Math.max(0,Math.min(VISIBLE.length-1,KB+(e.key==='j'?1:-1)));
    renderList();
    const el=document.querySelector('.row.kb'); if(el) el.scrollIntoView({block:'nearest'});
    // Preview mode: the selection IS the preview (debounced so held-down
    // j/k doesn't fire a thread fetch per row).
    if(PREVIEW && VISIBLE[KB]){
      clearTimeout(window._pvT);
      window._pvT=setTimeout(()=>{ const c=VISIBLE[KB]; if(c) openItem(c.key,false); },260);
    }
  }
  if(e.key==='?'){ e.preventDefault(); keysDlg(); return; }
  if(e.key==='c'){ e.preventDefault(); composeDlg(); return; }
  if(e.key==='z'){ e.preventDefault(); undoPending(); return; }
  if(e.key==='u'){ if(SPLIT&&!OPEN) closeSplit(); else closePane(); return; }
  // The row under the cursor, else the email open in the pane.
  const cur=VISIBLE[KB]||(OPEN&&findItem(OPEN));
  if(!cur) return;
  const mail=cur.type==='mail';
  const k=cur.key;
  if(e.key==='Enter'||e.key==='o') openItem(k);
  else if(e.key==='e'||e.key==='y'){ if(mail) archiveItem(k); }
  else if(e.key==='#'){ if(mail) trashItem(k); }
  else if(e.key==='s') starItem(k);
  else if(e.key==='b'||e.key==='h') snoozeDlg(k);
  else if(e.key==='H') handledItem(k);
  else if(e.key==='l'){ if(mail){ e.preventDefault(); labelDlg(k); } }
  else if(e.key==='x') toggleSel(k);
  else if(mail&&(e.key==='r'||e.key==='a'||e.key==='f')){
    e.preventDefault();
    replyKey(k, {r:'reply',a:'all',f:'fwd'}[e.key]);
  }
  else if(mail&&e.key==='R'){ e.preventDefault(); replyOptions(k); }   // ✨ Claude's reply options
});

/* ------- pane resize (E68): drag the left edge; width persists ------- */
(function(){
  const saved=localStorage.getItem('gc2_pane_w');
  if(saved) document.documentElement.style.setProperty('--pane-w', saved);
  let dragging=false;
  $('#pane').addEventListener('mousedown', e=>{
    const r=$('#pane').getBoundingClientRect();
    if(e.clientX-r.left>8) return;
    dragging=true; e.preventDefault();
    document.body.classList.add('pane-resizing');
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const r=$('#pane').getBoundingClientRect();
    const w=Math.min(Math.max(r.right-e.clientX, 380), innerWidth*0.75);
    document.documentElement.style.setProperty('--pane-w', Math.round(w)+'px');
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging=false;
    document.body.classList.remove('pane-resizing');
    localStorage.setItem('gc2_pane_w',
      document.documentElement.style.getPropertyValue('--pane-w')||'56%');
  });
})();
