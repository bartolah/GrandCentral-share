<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Grand Central">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
<title>Grand Central</title>
<style>
  /* ============================================================
     E52 — the unified shell. One list (mail + todos), scopes in the
     rail, Shortwave grammar. Real actions. Account-first: no projects/goals.
     ============================================================ */
  /* E77 — SKINS. Every surface color is a token; a skin is a block of
     token overrides on html[data-skin] (plus a few scoped rules at the
     end of this sheet). Daylight = these defaults. */
  /* E148: Daylight speaks macOS now — Apple grays, system blue, big-Sur
     radii; the vibrancy/selection grammar lives in the daylight-scoped
     block at the end of the sheet. */
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --faint: #86868b; --line: #e2e2e7; --blue: #0071e3; --blue-soft: #eaf2ff;
    --green: #248a3d; --red: #d70015; --chip-bg: #f0f0f2;
    --shadow: 0 0 0 0.5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.05);
    --r: 10px;
    --bg-grad: linear-gradient(170deg, #f7f7f9 0%, #f2f2f6 60%, #f5f4f8 100%);
    --hover: #f2f2f5; --panel: #f7f7f9; --line-soft: #efeff2;
    --input-bg: #ffffff; --scroll: #c9c9ce; --tbtn-hover: rgba(0,0,0,.05);
    --amber: #ff9f0a; --amber-soft: #fff4e0; --red-soft: #ffebe9;
    --note-bg: #fffbef; --note-line: #ece2c4; --note-head: #91661a; --note-ink: #3d3423;
    --sel-bg: #eaf2ff; --glow: none; --cell-out: #fafafa; --subj: #3a3a3c;
  }
  /* ---- skin: neon (noir city) — near-black, squared, neon cyan/rose ---- */
  html[data-skin="neon"] {
    --bg: #07090d; --card: #0d131c; --ink: #d9e6f2; --muted: #7f95ad;
    --faint: #566880; --line: #1b2836; --blue: #22d3ee; --blue-soft: rgba(34,211,238,.13);
    --green: #2dd996; --red: #ff5470; --chip-bg: #141d2a;
    --shadow: 0 0 0 1px rgba(34,211,238,.07), 0 10px 34px rgba(0,0,0,.65);
    --r: 0px;
    --bg-grad: linear-gradient(165deg, #0a0d13 0%, #070a10 55%, #0b0912 100%);
    --hover: #121b28; --panel: #101825; --line-soft: #172231;
    --input-bg: #0a1018; --scroll: #22303f; --tbtn-hover: rgba(34,211,238,.09);
    --amber: #ffb020; --amber-soft: #2a2008; --red-soft: #2b1016;
    --note-bg: #16120a; --note-line: #3a2f12; --note-head: #e8b84b; --note-ink: #e2d5ac;
    --sel-bg: #1b2433; --glow: 0 0 18px rgba(34,211,238,.25); --cell-out: #0a0e15; --subj: #c0d0e2;
  }
  /* ---- skin: compact — Casey's own mail client, from his screenshots: a
     cool lavender ground, white panes floating on it with generous radii and
     soft shadows, one blue accent, squircle avatars, pill chrome. ---- */
  html[data-skin="compact"] {
    --bg: #e9ecf8; --card: #ffffff; --ink: #1a1c22; --muted: #5b6070;
    --faint: #8a90a2; --line: #e4e7f0; --blue: #2b59f0; --blue-soft: #e8edff;
    --green: #17996b; --red: #e5484d; --chip-bg: #eef0f6;
    --shadow: 0 1px 2px rgba(20,28,60,.06), 0 10px 28px rgba(20,28,60,.09);
    --r: 14px;
    --bg-grad: linear-gradient(160deg, #eef0fb 0%, #e6eaf7 55%, #ecebf9 100%);
    --hover: #f4f6fb; --panel: #ffffff; --line-soft: #eef0f6;
    --input-bg: #ffffff; --scroll: #d5d9e8; --tbtn-hover: rgba(43,89,240,.08);
    --amber: #f5a524; --amber-soft: #fff4e0; --red-soft: #ffe9ea;
    --note-bg: #fff8e8; --note-line: #f2e4c4; --note-head: #9a6b13; --note-ink: #2c2f38;
    --sel-bg: #e8edff; --glow: none; --cell-out: #f7f8fc; --subj: #1a1c22;
  }
  /* ---- skin: mono (Macintosh System 7 / Platinum) — the 1991 desktop:
     grey ground, white windows boxed in hard 1px black, pinstriped title
     bars, Chicago-era type, square everything, drop shadows with no blur. ---- */
  html[data-skin="mono"] {
    --bg: #a8a8a8; --card: #ffffff; --ink: #000000; --muted: #333333;
    --faint: #666666; --line: #000000; --blue: #000080; --blue-soft: #c8c8ff;
    --green: #006400; --red: #990000; --chip-bg: #dddddd;
    --shadow: 2px 2px 0 rgba(0,0,0,.55);
    --r: 0px;
    --bg-grad: #a8a8a8;
    --hover: #e6e6e6; --panel: #dddddd; --line-soft: #999999;
    --input-bg: #ffffff; --scroll: #b0b0b0; --tbtn-hover: rgba(0,0,0,.12);
    --amber: #806000; --amber-soft: #f0e6c0; --red-soft: #f0c8c8;
    --note-bg: #ffffcc; --note-line: #000000; --note-head: #806000; --note-ink: #000000;
    --sel-bg: #000080; --glow: none; --cell-out: #f0f0f0; --subj: #000000;
  }
  /* ---- skin: paper (Google Inbox, 2014-2019) — Casey's reference. Blue bar,
     #F5F5F5 ground, white cards with a hairline shadow, near-square corners,
     Material accent colours per bundle, the red ＋. ---- */
  html[data-skin="paper"] {
    --bg: #f5f5f5; --card: #ffffff; --ink: #212121; --muted: #5f6368;
    --faint: #9aa0a6; --line: #e0e0e0; --blue: #4285f4; --blue-soft: #e8f0fe;
    --green: #0f9d58; --red: #db4437; --chip-bg: #f1f3f4;
    --shadow: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
    --r: 2px;
    --bg-grad: #f5f5f5;
    --hover: #f5f5f5; --panel: #ffffff; --line-soft: #eeeeee;
    --input-bg: #ffffff; --scroll: #dadce0; --tbtn-hover: rgba(255,255,255,.18);
    --amber: #f4b400; --amber-soft: #fef7e0; --red-soft: #fce8e6;
    --note-bg: #fff8e1; --note-line: #f6e6b4; --note-head: #b06000; --note-ink: #3c4043;
    --sel-bg: #e8f0fe; --glow: none; --cell-out: #fafafa; --subj: #202124;
  }
  /* ---- skin: console (starship console) — black, amber/salmon/lavender pills ---- */
  html[data-skin="console"] {
    --bg: #000000; --card: #0b0b10; --ink: #f4e9d8; --muted: #cfa96a;
    --faint: #8d7a58; --line: #2b2338; --blue: #ff9c33; --blue-soft: rgba(255,156,51,.15);
    --green: #cc99ff; --red: #ff7755; --chip-bg: #191423;
    --shadow: 0 0 0 1px rgba(255,156,51,.10), 0 10px 30px rgba(0,0,0,.7);
    --r: 20px;
    --bg-grad: radial-gradient(ellipse at 15% 0%, #12101a 0%, #000 60%);
    --hover: #151020; --panel: #120e1b; --line-soft: #1d1729;
    --input-bg: #0d0a14; --scroll: #3a2f4d; --tbtn-hover: rgba(255,156,51,.10);
    --amber: #ff9c33; --amber-soft: #241705; --red-soft: #2b130c;
    --note-bg: #171107; --note-line: #3d2c0f; --note-head: #ffb45e; --note-ink: #ecd9b4;
    --sel-bg: #221a30; --glow: 0 0 16px rgba(255,156,51,.22); --cell-out: #0a0810; --subj: #e6d6ba;
  }
  /* ---- skin: rain — phosphor green on black, terminal type, rain ---- */
  html[data-skin="rain"] {
    --bg: #000400; --card: #030c05; --ink: #b8ffc8; --muted: #55a86b;
    --faint: #337347; --line: #0d3317; --blue: #00ff41; --blue-soft: rgba(0,255,65,.12);
    --green: #00ff41; --red: #ff5555; --chip-bg: #06180b;
    --shadow: 0 0 0 1px rgba(0,255,65,.09), 0 10px 34px rgba(0,0,0,.7);
    --r: 2px;
    --bg-grad: radial-gradient(ellipse at 50% -10%, #04240c 0%, #000400 65%);
    --hover: #06180b; --panel: #041108; --line-soft: #0a2812;
    --input-bg: #020a04; --scroll: #14522a; --tbtn-hover: rgba(0,255,65,.10);
    --amber: #ccff33; --amber-soft: #101f06; --red-soft: #240a0a;
    --note-bg: #071505; --note-line: #1d3a12; --note-head: #a8e063; --note-ink: #cfeab8;
    --sel-bg: #0a2413; --glow: 0 0 18px rgba(0,255,65,.25); --cell-out: #020a05; --subj: #8ef0a8;
  }
  /* ---- skin: vector — '77 targeting computer: crawl-yellow vector
     lines on a starfield, red alerts, condensed uppercase ---- */
  html[data-skin="vector"] {
    --bg: #000005; --card: #0b0a03; --ink: #f2e9c0; --muted: #b3a86b;
    --faint: #6e693f; --line: #3a3410; --blue: #ffe81f; --blue-soft: rgba(255,232,31,.13);
    --green: #4bd35f; --red: #ff3b30; --chip-bg: #161305;
    --shadow: 0 0 0 1px rgba(255,232,31,.10), 0 10px 30px rgba(0,0,0,.75);
    --r: 3px;
    --bg-grad: radial-gradient(ellipse at 50% 120%, #0d0c04 0%, #000005 60%);
    --hover: #141207; --panel: #100d04; --line-soft: #241f0a;
    --input-bg: #080703; --scroll: #4a421a; --tbtn-hover: rgba(255,232,31,.10);
    --amber: #ffe81f; --amber-soft: #1d1905; --red-soft: #2b0d0a;
    --note-bg: #131005; --note-line: #38300e; --note-head: #ffe81f; --note-ink: #e6dcae;
    --sel-bg: #1c1806; --glow: 0 0 16px rgba(255,232,31,.20); --cell-out: #080703; --subj: #e8dfae;
  }
  /* ---- skin: grid — the Grid: black-blue, neon cyan lines, Clu orange ---- */
  html[data-skin="grid"] {
    --bg: #010409; --card: #050d14; --ink: #d2eef7; --muted: #6ba3b8;
    --faint: #3d6b7d; --line: #0c3644; --blue: #00d9ff; --blue-soft: rgba(0,217,255,.12);
    --green: #6fffc2; --red: #ff4b33; --chip-bg: #07202b;
    --shadow: 0 0 0 1px rgba(0,217,255,.10), 0 10px 34px rgba(0,0,0,.7);
    --r: 4px;
    --bg-grad: radial-gradient(ellipse at 50% 115%, #06232e 0%, #010409 60%);
    --hover: #071b24; --panel: #061520; --line-soft: #0a2a36;
    --input-bg: #030b11; --scroll: #12495c; --tbtn-hover: rgba(0,217,255,.10);
    --amber: #ff9448; --amber-soft: #201007; --red-soft: #2b0e08;
    --note-bg: #170f06; --note-line: #3a2410; --note-head: #ffab63; --note-ink: #e8d9c4;
    --sel-bg: #0b2833; --glow: 0 0 18px rgba(0,217,255,.26); --cell-out: #04101a; --subj: #b8dfeb;
  }
  /* ---- skin: phosphor — war-room computer: black cabinet, phosphor orange-red,
     8-bit terminal, rows of blinking lights ---- */
  html[data-skin="phosphor"] {
    --bg: #020202; --card: #0b0705; --ink: #f0dfcf; --muted: #b08668;
    --faint: #7d5a45; --line: #3a1c0d; --blue: #ff6a2b; --blue-soft: rgba(255,106,43,.13);
    --green: #7fe3a0; --red: #ff3b30; --chip-bg: #1a0f08;
    --shadow: 0 0 0 1px rgba(255,106,43,.10), 0 10px 30px rgba(0,0,0,.75);
    --r: 2px;
    --bg-grad: radial-gradient(ellipse at 50% -10%, #1a0c04 0%, #020202 60%);
    --hover: #170d07; --panel: #120a06; --line-soft: #241206;
    --input-bg: #0a0503; --scroll: #4a2812; --tbtn-hover: rgba(255,106,43,.10);
    --amber: #ffb020; --amber-soft: #1d1305; --red-soft: #2b0d08;
    --note-bg: #150d05; --note-line: #3a2410; --note-head: #ffb020; --note-ink: #e8d5b8;
    --sel-bg: #221007; --glow: 0 0 16px rgba(255,106,43,.22); --cell-out: #0a0503; --subj: #e6cdb8;
  }
  /* ---- skin: mission — Houston MOCR: navy dark, console green + amber
     readouts, projection-screen glow ---- */
  html[data-skin="mission"] {
    --bg: #04070c; --card: #0a1018; --ink: #d8e8dd; --muted: #7fa08c;
    --faint: #4c6656; --line: #14283a; --blue: #57d98f; --blue-soft: rgba(87,217,143,.12);
    --green: #57d98f; --red: #ff4b33; --chip-bg: #10202c;
    --shadow: 0 0 0 1px rgba(87,217,143,.08), 0 10px 30px rgba(0,0,0,.7);
    --r: 6px;
    --bg-grad: linear-gradient(170deg, #071019 0%, #04070c 55%, #050a08 100%);
    --hover: #101a26; --panel: #0d1520; --line-soft: #0f2030;
    --input-bg: #070d14; --scroll: #1e4258; --tbtn-hover: rgba(87,217,143,.10);
    --amber: #ffb020; --amber-soft: #1c1405; --red-soft: #29100b;
    --note-bg: #131207; --note-line: #382c0e; --note-head: #ffb020; --note-ink: #e8dcb4;
    --sel-bg: #10222e; --glow: 0 0 16px rgba(87,217,143,.20); --cell-out: #070d14; --subj: #bcd8c4;
  }
  /* E203 — the two device insets, named once. They were written as env()
     in sixteen places, which made them untestable: headless Chrome reports
     env() as 0, so the status-bar collision could never fail a test. As
     custom properties a test can force them to a real iPhone's 44/34 and
     assert what actually moves. :root is html, so every rule inherits them. */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  /* E199: on iOS height:100% is the large viewport — the page stops short of
     the bottom and the unpainted strip shows through. dvh tracks the viewport
     that is actually on screen. */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  /* E203 — and when even dvh is wrong. In the installed app iOS can hand the
     page a viewport shorter than the screen (after a keyboard, a rotation, or
     a cold start), which is what "the screen is shifted up off the bottom"
     looks like: the app paints to 100dvh and the strip below it is not ours.
     syncAppHeight() measures the window itself and wins over dvh. html also
     carries the background now, so any strip that does appear is our colour
     rather than the browser's grey. */
  html { background: var(--bg-grad); }
  html.has-apph, html.has-apph body { height: var(--app-h); }
  body {
    font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg-grad);
    color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--ink); }
  a { color: var(--blue); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

  /* ---------- top bar ---------- */
  /* E157.1: backdrop-filter (macOS skin) makes .top a stacking context —
     without its own z-index the ⚙ menu (z:130 INSIDE it) painted under the
     Home cards. The bar itself now sits above page content. */
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex: 0 0 auto; position: relative; z-index: 40; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 210px; cursor: pointer; }
  .brand-logo { width: 26px; height: 26px; }
  .brand h1 { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; }
  .brand .dot { color: var(--amber); }
  /* E118: the crumb is a TRAIL now — a way back when the rail is tucked */
  .crumb { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-right: 8px; color: var(--ink); flex-wrap: wrap; }
  .crumb .cr { color: var(--muted); font-weight: 600; cursor: pointer; }
  .crumb .cr:hover { color: var(--blue); }
  .crumb .cr.on { color: var(--ink); font-weight: 700; cursor: default; }
  .crumb .cr-sep { color: var(--faint); font-weight: 400; }
  .search {
    flex: 1 1 auto; max-width: 640px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; color: var(--faint); box-shadow: 0 1px 2px rgba(20,30,50,.04);
  }
  .search input { border: none; outline: none; flex: 1; background: none; min-width: 0; }
  .search .hint { font-size: 10.5px; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .search .clr { display: none; cursor: pointer; color: var(--faint); font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .search .clr:hover { color: var(--ink); background: var(--hover); }
  .search.has-q .clr { display: inline-block; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* E206: menu entries that only exist because the phone hides the matching
     control in the top bar. The phone block turns them back on. */
  .me-menu button.phone-only { display: none; }
  .tbtn { padding: 7px 11px; border-radius: 10px; color: var(--muted); font-size: 12.5px; font-weight: 600; position: relative; }
  .tbtn:hover { background: var(--tbtn-hover); color: var(--ink); }
  .compose { display: flex; align-items: center; gap: 7px; background: var(--blue-soft); color: var(--blue); font-weight: 600; padding: 8px 15px; border-radius: 12px; }
  .compose.todo-pill { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .compose.todo-pill:hover { border-color: var(--blue); color: var(--blue); }
  .avatar { width: 32px; height: 32px; border-radius: 10px; background: #7a5c48; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; position: relative; cursor: pointer; }
  .avatar:hover { filter: brightness(1.1); }
  .wn-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 5px var(--amber); border: 1.5px solid #fff; display: inline-block; }
  /* E191 (Casey, on the phone: "I'm not able to scroll to the settings menu"):
     the ⚙ list is longer than a phone screen, and the page behind it does not
     scroll (body is overflow:hidden), so anything past the fold was simply
     unreachable. The menu scrolls itself now, and on a narrow screen it
     stretches to both edges with the notch and home indicator accounted for. */
  .me-menu {
    position: absolute; right: 0; top: 40px; z-index: 130; min-width: 240px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(20,30,50,.18); padding: 8px;
    max-height: min(70vh, calc(100vh - 72px)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  @media (max-width: 700px) {
    .me-menu {
      position: fixed; top: calc(52px + var(--safe-top)); right: 8px; left: 8px;
      min-width: 0; max-width: none;
      max-height: calc(100vh - 68px - var(--safe-top) - var(--safe-bot));
      padding-bottom: calc(8px + var(--safe-bot));
    }
  }
  .me-menu h5 { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); padding: 6px 10px 3px; }
  .me-menu a, .me-menu button {
    display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px;
    color: var(--ink); text-decoration: none; font-size: 13px; background: none;
  }
  .me-menu a:hover, .me-menu button:hover { background: #f2f5fa; }
  .me-menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
  /* E156: notification bell + panel (panel reuses .me-menu) */
  #nf-badge { position: absolute; top: -1px; right: -1px; min-width: 15px; height: 15px; border-radius: 8px; background: #c0392b; color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; padding: 0 3px; }
  .nf-row { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.35; color: var(--ink); }
  .nf-row.new { background: var(--blue-soft); }
  .nf-ts { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .nf-empty { padding: 10px; font-size: 12.5px; color: var(--muted); }

  /* ---------- shell ---------- */
  .shell { flex: 1 1 auto; display: flex; min-height: 0; padding: 0 12px 12px 6px; }

  /* ---------- rail ---------- */
  .rail { flex: 0 0 216px; overflow-y: auto; padding: 6px 10px 20px 8px; transition: flex-basis .18s ease, padding .18s ease; }
  .rail h4 { font-size: 10.5px; letter-spacing: 1.2px; color: var(--faint); text-transform: uppercase; margin: 15px 8px 4px; font-weight: 700; }
  .scope { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 6px 10px; border-radius: 9px; color: var(--ink); }
  .scope:hover { background: rgba(255,255,255,.75); }
  .scope.on { background: var(--card); box-shadow: 0 1px 2px rgba(20,30,50,.06); font-weight: 600; }
  .scope .ic { width: 18px; text-align: center; color: var(--muted); flex: 0 0 auto; }
  .scope .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scope .ct { color: var(--faint); font-size: 11.5px; }
  .scope .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  /* E117: goal names wrap in the rail — readable beats tidy */
  .scope.wrap { align-items: flex-start; }
  .scope.wrap .nm { white-space: normal; line-height: 1.25; font-size: 12.5px; }
  .rail-toggle { display: flex; justify-content: flex-end; width: 100%; padding: 2px 8px 6px; color: var(--faint); font-size: 13px; cursor: pointer; user-select: none; }
  .rail-toggle:hover { color: var(--ink); }
  /* E114: the rail collapses to a thin icon strip (desktop only — the
     mobile drawer at ≤980px keeps its own geometry). State is stamped on
     <html> pre-paint so there's no flash. */
  @media (min-width: 981px) {
    html[data-rail="slim"] .rail { flex-basis: 52px; padding: 6px 5px 20px; }
    html[data-rail="slim"] .rail .nm, html[data-rail="slim"] .rail .ct,
    html[data-rail="slim"] .rail h4, html[data-rail="slim"] .rail .rail-more { display: none; }
    html[data-rail="slim"] .rail .scope { justify-content: center; padding: 8px 0; gap: 0; }
    html[data-rail="slim"] .rail .scope .ic { width: auto; }
    html[data-rail="slim"] .rail-toggle { justify-content: center; padding: 4px 0 8px; }
    /* E118: slim-rail feel — icons pop on hover, active scope carries an
       edge light; Console hides icons on the wide text bars but slim NEEDS
       them, so they come back as colored pills. */
    html[data-rail="slim"] .rail .scope { transition: transform .15s ease, background .15s ease; }
    html[data-rail="slim"] .rail .scope .ic { font-size: 15px; color: var(--ink); transition: transform .15s ease; }
    html[data-rail="slim"] .rail .scope:hover { transform: translateX(3px); }
    html[data-rail="slim"] .rail .scope:hover .ic { transform: scale(1.25); }
    html[data-rail="slim"] .rail .scope.on { box-shadow: inset 2px 0 0 var(--blue), 0 1px 2px rgba(20,30,50,.06); }
    /* E221 (Dev #18, Casey: "the active state should be centered better"):
       a full-width pill with a left edge light read as off-centre around a
       centred icon, and the hover nudge left it shifted under the pointer.
       Slim rows are now a centred 38px square; the active one is a plain
       lifted square, and hover scales the icon without moving the row. */
    html[data-rail="slim"] .rail .scope { width: 38px; height: 38px; margin: 2px auto; padding: 0; line-height: 1; }
    html[data-rail="slim"] .rail .scope .ic { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    html[data-rail="slim"] .rail .scope:hover { transform: none; }
    html[data-rail="slim"] .rail .scope.on { box-shadow: 0 1px 3px rgba(20,30,50,.12); }
    html[data-skin="compact"][data-rail="slim"] .rail .scope { border-radius: 11px; }
    html[data-skin="console"][data-rail="slim"] .rail .scope .ic { display: inline; color: #000; }
    html[data-skin="console"][data-rail="slim"] .rail .scope { border-radius: 16px 0 0 16px; }
    @media (prefers-reduced-motion: reduce) {
      html[data-rail="slim"] .rail .scope, html[data-rail="slim"] .rail .scope .ic { transition: none; }
      html[data-rail="slim"] .rail .scope:hover, html[data-rail="slim"] .rail .scope:hover .ic { transform: none; }
    }
  }
  /* E221 (Dev #18): the slim rail's labels, shown at once beside the icon —
     the native title tooltip took a second and a half to appear. Fixed

  #railtip { position: fixed; z-index: 9000; pointer-events: none; padding: 4px 9px; border-radius: 7px; background: var(--ink); color: var(--bg, #fff); font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); opacity: 0; transform: translateY(-50%); transition: opacity .08s; }
  #railtip.on { opacity: 1; }

  /* ---------- list ---------- */

  .sec-prev b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

  /* E100: plan card */
  .plan-card { margin: 10px 8px 2px; padding: 12px 14px; border: 1px solid var(--amber); border-radius: 12px; background: var(--note-bg); animation: rise-in .4s ease both; }
  .plan-theme { font-weight: 700; font-size: 14px; margin: 2px 0 8px; color: var(--note-ink); }

  /* E153: on narrow screens a long title shrinks-and-wraps beside its

  /* E159: the brief absorbs ☀ Today and 🛰 drift — full-width across the

    border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px;

  /* E95/E96: home dashboard — full page, motion */
  body.home-on .list-head, body.home-on #daynote { display: none; }
  body.home-on .pane { display: none !important; }
  body.home-on .main { max-width: none; }

  .hwit:hover, .hcal:hover { border-color: var(--blue); }
  .hw-k { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 6px; }
  .hcal-ev { font-size: 12.5px; padding: 2px 0; color: var(--muted); }
  .hcal-ev span { color: var(--faint); font-size: 11px; display: inline-block; width: 44px; }
  .home-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 980px) { .home-grid.two { grid-template-columns: 1fr; } }
  /* E159: cards size to their content — the grid row equalizes heights,
     no need for a 265px floor now that filler sections are gone. */
  .hcard.sq { display: flex; flex-direction: column; }
  .hwit.wide { margin: 10px 10px 0; display: flex; align-items: baseline; gap: 10px; animation: rise-in .45s ease both; }
  .hwit.wide i { font-size: 13.5px; }
  .hwit.wide .hw-a { margin: 0 0 0 auto; white-space: nowrap; }
  /* E137: the wit rides beside the greeting — small, up and to the right */
  .hwit.side { margin-left: auto; max-width: 46%; display: flex; align-items: baseline; gap: 8px; font-size: 12px; animation: rise-in .45s ease both; }
  .hwit.side i { font-size: 12px; color: var(--muted); }
  .hwit .hw-q { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hwit .hw-by { font-size: 11px; color: var(--faint); }
  .hwit .hw-copy { border: none; background: none; cursor: pointer; font-size: 12px; opacity: .55; padding: 0 2px; align-self: center; }
  .hwit .hw-copy:hover { opacity: 1; }
  @media (max-width: 980px) { .hwit.side { display: none; } }
  /* E137: the numbers, calmly — one card, yesterday deltas */
  .hstats .hs-row { display: flex; align-items: center; gap: 8px; padding: 4.5px 2px; border-bottom: 1px solid var(--line-soft); cursor: pointer; font-size: 12.5px; }
  .hstats .hs-row:last-child { border-bottom: none; }
  .hstats .hs-row:hover .hs-l { color: var(--ink); }
  .hstats .hs-l { color: var(--muted); flex: 1; }
  .hstats b { font-size: 13.5px; min-width: 34px; text-align: right; }
  .hstats .hs-d { font-size: 11px; min-width: 36px; text-align: right; font-weight: 600; }
  .home-grid .plan-card, .home-grid .hdrift { margin: 0; }
  .also-hits { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px 0; color: var(--faint); font-size: 11.5px; }
  .also-hits .chip { cursor: pointer; }
  .hc-btns { margin-left: auto; display: flex; gap: 3px; flex: 0 0 auto; }
  .hc-btns button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; font-size: 12px; color: var(--muted); background: var(--card); }
  .hc-btns button:hover { border-color: var(--blue); color: var(--blue); }
  .hc-sec { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; margin: 9px 0 3px; }
  .hrow { display: flex; align-items: baseline; gap: 7px; padding: 2.5px 0; font-size: 12.5px; overflow: hidden; white-space: nowrap; cursor: pointer; }
  .hrow em { font-style: normal; color: var(--faint); font-size: 11px; }
  .hrow b { font-weight: 600; flex: 0 0 auto; }
  .hrow .ht { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .hrow .hd { color: var(--faint); font-size: 11px; flex: 0 0 auto; }
  .hrow:hover .ht, .hrow:hover b { color: var(--blue); }
  .hcard.dragging { opacity: .45; }
  .hcard.dropat { border-color: var(--blue); box-shadow: var(--glow); }
  .hcard { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .hcard:hover { border-color: var(--blue); box-shadow: var(--glow); }
  .hc-top { display: flex; align-items: baseline; gap: 8px; }
  .hc-name { font-weight: 700; font-size: 14px; flex: 1; }
  .hc-today { color: var(--amber); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .hc-stats { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .hc-stats i { color: var(--blue); font-style: normal; }
  .bundle { border: 1px solid var(--line-soft); background: var(--panel); border-radius: 11px; margin: 8px 4px; padding: 0 4px 3px; }
  .bundle .sec { padding-top: 10px; }
  #tk-matches { display: flex; flex-direction: column; gap: 3px; margin: 4px 0 2px; max-height: 180px; overflow-y: auto; }
  .tk-match { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; color: var(--ink); background: var(--panel); }
  .tk-match:hover { border-color: var(--blue); color: var(--blue); }
  .sec .secact.warn:hover { color: var(--red); border-color: var(--red); }

  /* E59: inbox steward card */
  /* E87: nested goal rows in the rail + scoped context headers */
  .scope.sub { padding-left: 30px; font-size: 12px; }
  .scope.sub .ic { font-size: 10px; }
  .goal-strip { display: flex; gap: 8px; overflow-x: auto; margin: 10px 8px 2px; padding-bottom: 3px; }
  .goal-card { flex: 0 0 225px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; background: var(--panel); }
  .goal-card:hover { border-color: var(--blue); }
  .goal-card.add { border-style: dashed; color: var(--muted); background: none; }
  .goal-card.ws { background: none; }
  .goal-card.ws .gc-t { font-weight: 500; }
  /* E104: compact recipients + inline images */
  .rcpt { display: flex; align-items: flex-start; gap: 8px; margin: 3px 0; }
  .rcpt .rl { flex: 0 0 26px; font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); font-weight: 700; padding-top: 9px; }
  .rcpt .chipfield { flex: 1 1 auto; min-width: 0; }
  .rcpt .rtog { display: flex; gap: 8px; padding-top: 9px; flex: 0 0 auto; }
  .rcpt .rtog a { color: var(--blue); font-size: 11.5px; cursor: pointer; }
  .rb-body img { max-width: 100%; border-radius: 8px; }
  .fedby { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: 6px 10px 2px; }
  .fedby .fb-k { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-right: 3px; }
  .goal-card.add .gc-t { color: var(--blue); font-weight: 600; }
  .gc-t { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .gc-m { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .gc-pct { color: var(--blue); font-weight: 700; margin-right: 6px; }
  .gc-bar { height: 3px; background: var(--line-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .gc-bar span { display: block; height: 100%; background: var(--blue); }
  .scope-head { margin: 10px 8px 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .scope-head .kind { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .sh-top { display: flex; align-items: center; gap: 8px; }
  .sh-top .kind { flex: 1; }
  .sh-title { font-weight: 700; font-size: 14.5px; margin: 4px 0 6px; }
  .sh-chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .steward-card {
    /* note tokens, not hardcoded cream — was unreadable on dark skins */
    margin: 10px 8px 0; padding: 10px 14px; border: 1px solid var(--note-line);
    background: var(--note-bg); color: var(--note-ink); border-radius: 12px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer;
  }
  .steward-card:hover { filter: brightness(.98); }
  .steward-card .n { font-weight: 700; }
  .stw-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  /* E111: 🧙 Wizard page */
  body.wiz-on .list-head, body.wiz-on #daynote { display: none; }
  .wiz { max-width: 1120px; margin: 0 auto; padding: 16px 18px 40px; }
  .wiz-sec { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 18px; margin-bottom: 14px; }
  .wiz-sec h3 { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 2px; }
  .wiz-sec h3 .ct { color: var(--faint); font-weight: 400; font-size: 12px; }
  .wiz-sec h3 .sp { flex: 1; }
  .wiz-sec > .status { margin-bottom: 6px; }
  .wiz-sec .stw-row:last-child { border-bottom: none; }
  /* E128: wizard suggestions as TILES — scannable cards, not a long list */
  .wiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 10px; margin-top: 10px; }
  .wiz-tile { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; }
  .wiz-tile .t { font-weight: 600; font-size: 13px; line-height: 1.35; }
  .wiz-tile .why { color: var(--muted); font-size: 12px; flex: 1 1 auto; }
  .wiz-tile .meta { display: flex; gap: 5px; flex-wrap: wrap; font-size: 11.5px; }
  .wiz-tile .acts { display: flex; gap: 6px; margin-top: 4px; }
  .wiz-tile .acts .add { flex: 1; text-align: center; }
  .stw-row .info { flex: 1; min-width: 0; }
  .stw-row .em { font-weight: 600; font-size: 13px; }
  .stw-row .why { color: var(--muted); font-size: 12px; }
  .stw-row .cat { font-size: 11px; background: var(--chip-bg); border-radius: 7px; padding: 2px 8px; white-space: nowrap; }
  .more-link { text-align: center; color: var(--blue); font-size: 12.5px; padding: 6px; cursor: pointer; }
  .search-more { margin: 10px 12px; padding: 12px 16px; border: 1px dashed var(--line); border-radius: 12px;
    color: var(--blue); font-size: 13px; cursor: pointer; text-align: center; }
  .search-more:hover { border-color: var(--blue); background: var(--blue-soft); }
  .search-more b { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-size: 11px; color: var(--muted); margin-left: 6px; }

  /* E64: stacked, airy rows per Casey's Shortwave reference — sender /
     subject / snippet each on their own line, real vertical padding. */
  /* E182: the avatar's position is a variable, so anything that sits ON the
     avatar (the select circle) cannot drift when the row's padding changes —
     which is exactly what happened when E175 tightened it from 13px to 9px. */
  .row { --row-pad: 9px; display: flex; align-items: flex-start; gap: 12px; padding: var(--row-pad) 12px;
    border-radius: var(--r, 10px); cursor: pointer; position: relative; margin: 0; }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--blue-soft); }
  .row.kb { outline: 2px solid #b9d2f5; }
  .row.sel { background: var(--sel-bg); }
  .row .l2 { display: flex; align-items: baseline; gap: 8px; overflow: hidden; margin-top: 1px; white-space: nowrap; }
  /* E175: status lives on the right of line 1, never on a line of its own. */
  .row .hl { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: 0 0 auto; padding-left: 8px; }
  .row .hl .chip { font-size: 10.5px; padding: 1px 7px; }
  .row .l2 .prev { color: var(--faint); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* E185: mail reads in three lines — who + its labels, the subject, then the
     preview. The chips and the time stay on line 1, on the right. */
  .row .l3 { margin-top: 2px; overflow: hidden; white-space: nowrap; }
  .row .l3 .prev { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; display: block; }
  .row .l1 .row-note { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .row .l1 .chip.lbl { flex: 0 0 auto; }
  .row .l2 .row-note { flex: 0 0 auto; }
  .row .meta { padding-left: 8px; }
  .row:hover .hl { opacity: .35; }
  /* meta lives IN line 1 — name truncates, buttons never overlap content */
  .row .meta { flex: 0 0 auto; padding-left: 10px; }
  .row .lead { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; position: relative; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
  .row .lead .acct { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card); z-index: 2; }
  .avimg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; background: #fff; }
  .row .lead.todo-ic { background: none; color: var(--blue); font-size: 19px; }
  /* Sits exactly over the avatar (rows are top-aligned since E64). */
  .row .selbox { position: absolute; left: 12px; top: var(--row-pad); width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--muted); display: none; align-items: center; justify-content: center; z-index: 2; }
  .row:hover .selbox, .row.sel .selbox { display: flex; }
  .row.sel .selbox { background: #e8b93e; color: #fff; border-color: #e8b93e; }
  .row .body { flex: 1 1 auto; min-width: 0; }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
  .row .who { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .row.read .who { font-weight: 500; color: var(--muted); }
  .row .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--subj); font-weight: 620; }
  .row.read .subj { color: var(--muted); font-weight: 400; }
  /* unread marker: a lit dot in the row gutter (todos never carry it —
     they render with .read by construction) */
  .row:not(.read)::before {
    content: ''; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
    box-shadow: 0 0 7px var(--blue);
  }
  /* Todo titles get the whole line (E54 feedback: they truncated way too
     short) — flexible like a subject, bold like a sender, no width cap;
     the ellipsis only kicks in when the window truly runs out. */
  .row .subj.todo-title { font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .row.read .subj.todo-title { color: var(--ink); }

  /* E60: emails grouped under a todo */
  .chip.mailgrp { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .chip.mailgrp.on { background: var(--blue); color: #fff; }

  /* E55: note-to-self on a thread — a little amber sticky */
  .row-note {
    color: var(--note-head); background: var(--amber-soft); border-radius: 6px; display: inline-block;
    padding: 0 7px; font-size: 12px; margin: 1px 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  body.pane-open .row .row-note { display: none; }
  .pane-note {
    margin: 8px 20px 0; padding: 7px 12px; background: var(--amber-soft); color: #6b4e10;
    border-radius: 9px; font-size: 12.5px; cursor: pointer; border: 1px solid #f3e2bd;
  }
  .pane-note.empty-note { background: none; border-style: dashed; color: var(--faint); }
  .pane-note:hover { filter: brightness(.97); }
  .row .snip { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; }
  .row .meta .st { color: var(--amber); }
  /* E93.1: the action strip FLOATS over the row's top-right corner —
     swapping it in-line for the date grew line 1 and bounced the row. */
  .row .acts { display: none; gap: 2px; position: absolute; top: 50%; transform: translateY(-50%); right: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 1px 3px; box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 3; }
  .row:hover .acts { display: flex; }
  .row:hover .meta .when { visibility: hidden; }
  .row .acts button { padding: 4px 7px; border-radius: 7px; font-size: 13px; color: var(--muted); }
  .row .acts button:hover { background: var(--chip-bg); color: var(--ink); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 8px; background: var(--chip-bg); color: var(--muted); font-size: 11px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .chip.goal { background: var(--amber-soft); color: var(--note-head); }
  .chip.due { background: var(--red-soft); color: var(--red); }
  .chip.new { background: var(--blue-soft); color: var(--blue); cursor: default; }
  .chip.lbl { background: #eef4ea; color: #4a6b3a; }
  .chip.pri-high { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .chip.pri-medium { background: var(--amber-soft); color: var(--note-head); font-weight: 600; }
  .chip.pri-low { background: var(--chip-bg); color: var(--faint); }
  .chip:hover { filter: brightness(.96); }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }

  /* E166: the Today feed — Home is ONE ranked stream (needs you · the brief ·
     overdue · waiting · projects · the numbers) instead of a grid of cards.
     Casey picked it off the feed mockups; the card grid lives on behind ⊞. */
  .fd-wrap { max-width: 1000px; margin: 0 auto; padding-bottom: 10px; }
  .fd-acts { display: flex; gap: 6px; margin-top: 8px; }
  .fd-acts button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .fd-acts button:hover { border-color: var(--blue); color: var(--blue); }
  .fd-acts button.go { border-color: var(--blue); color: var(--blue); }
  .fd-flat { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer; }
  .fd-flat:hover { background: var(--hover); }
  .fd-flat .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 12px; }
  .fd-chips .chip { padding: 3px 10px; font-size: 11.5px; }
  .fd-foot { text-align: center; color: var(--faint); font-size: 11px; padding: 24px 0 6px; }
  .fd-view { display: flex; gap: 4px; flex: 0 0 auto; }
  .fd-view button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; font-size: 12px; color: var(--muted); background: var(--card); }
  .fd-view button.on { border-color: var(--blue); color: var(--blue); }
  @media (max-width: 700px) { .fd-l1 .who { max-width: 100%; } }

  /* E171: accounts across the top. The account is the CONTEXT you work in;
     the rail filters within it. Everything below the strip — Home, Today,
     Todos, the inbox, the Wizard, the calendar — is that account only. */
  /* E184: no z-index here on purpose. At 60 the strip covered the ⚙, 🔔 and
     ◐ menus — their z-index (130) is scoped inside .top's own stacking
     context (40) and so could never beat it. Lowering it to 30 fixed those
     and broke the strip's OWN menu, which was then trapped in the strip's
     context and fell behind the list. With no z-index the strip creates no
     context at all: it still can't overlap anything (it is in normal flow),
     and its dropdown competes at the root like every other menu. */
  .acct-tabs { display: flex; align-items: stretch; gap: 2px; padding: 0 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; position: relative; }
  /* E187: installed as an app — Safari hands us the whole window, including
     the notch and the home-indicator strip, so the chrome insets itself. */
  body.app-mode .top { padding-top: calc(10px + var(--safe-top)); }
  body.app-mode .rail { padding-bottom: calc(20px + var(--safe-bot)); }
  body.app-mode .dock { padding-bottom: var(--safe-bot); }
  body.app-mode #list { padding-bottom: var(--safe-bot); }
  .acct-tabs::-webkit-scrollbar { height: 0; }
  .acct-tab { display: flex; align-items: center; gap: 7px; padding: 8px 13px; white-space: nowrap;
    color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; cursor: pointer; background: none; }
  .acct-tab:hover { color: var(--ink); background: var(--hover); }
  .acct-tab.on { color: var(--ink); font-weight: 650; border-bottom-color: var(--blue); background: var(--card); }
  .acct-tab .n { color: var(--faint); font-size: 11.5px; font-weight: 500; }
  .acct-tab.on .n { color: var(--blue); }
  @media (max-width: 700px) { .acct-tab { padding: 8px 10px; font-size: 12.5px; } }

  /* E174: the Today view, in Google Inbox's grammar — time buckets, white
     cards floating on the ground, bundles as one row, reminders among the
     mail, a pin filter and a sweep per section. */
  .ib-wrap { max-width: 1060px; margin: 0 auto; padding: 6px 12px 28px; }
  .ib-head { display: flex; align-items: center; gap: 10px; padding: 16px 6px 8px; }
  .ib-head .t { color: var(--muted); font-size: 13px; font-weight: 500; }
  .ib-head .sp { flex: 1 1 auto; }
  .ib-sweep { color: var(--faint); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 2px; }
  .ib-sweep:hover { color: var(--green); background: var(--hover); }
  .ib-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .ib-row { display: flex; align-items: flex-start; gap: 14px; padding: 13px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft); position: relative; }
  .ib-row:last-child { border-bottom: none; }
  .ib-row:hover { background: var(--hover); }
  .ib-row.pinned { box-shadow: inset 3px 0 0 var(--blue); }
  .ib-ic { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 12.5px; color: #fff; overflow: hidden; position: relative; }
  .ib-ic.glyph { background: none; font-size: 20px; }
  .ib-body { flex: 1 1 auto; min-width: 0; }
  .ib-l1 { display: flex; align-items: baseline; gap: 8px; }
  .ib-who.unread { font-weight: 700; }
  .ib-bundle { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .ib-count { background: var(--chip-bg); color: var(--muted); border-radius: 2px; padding: 1px 6px; font-size: 11.5px; font-weight: 600; }
  .ib-when { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
  .ib-senders { color: var(--muted); font-size: 13.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Highlights: what Inbox pulled out of the message so you did not open it. */
  .ib-hl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ib-hl .h { display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); color: var(--muted);
    border-radius: 2px; padding: 4px 9px; font-size: 12px; max-width: 100%; }
  .ib-hl .h b { color: var(--ink); font-weight: 600; }
  .ib-hl .h.due { background: var(--red-soft); color: var(--red); }
  .ib-hl .h.ai { background: var(--blue-soft); color: var(--blue); white-space: normal; text-align: left; }
  .ib-pin { flex: 0 0 auto; color: var(--faint); font-size: 14px; padding: 2px 4px; border-radius: 2px; opacity: 0; }
  .ib-row:hover .ib-pin, .ib-row.pinned .ib-pin { opacity: 1; }
  .ib-row.pinned .ib-pin { color: var(--blue); }
  .ib-pin:hover { color: var(--blue); }
  .ib-empty { color: var(--faint); text-align: center; padding: 44px 0; }
  .ib-nest { background: var(--panel); border-bottom: 1px solid var(--line-soft); padding: 2px 0 2px 26px; }
  .ib-nest .row { border-radius: 0; }
  /* E178: one card grammar for every list. Rows inside a card are separated
     by a hairline and square off; the section name sits above the card. */
  .ib-card { border: 1px solid var(--line); margin-bottom: 14px; }
  /* dev #28: the way from Home to the whole inbox */
  .fd-go { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 12px; }
  .fd-go .btn { flex: 1 1 auto; justify-content: center; }
  @media (max-width: 640px) { .fd-go { padding: 4px 12px 12px; } }
  .ib-card .row { border-radius: 0; margin: 0; border-bottom: 1px solid var(--line-soft); }
  .ib-card .row:last-child { border-bottom: none; }
  .ib-card .ib-row:last-child { border-bottom: none; }
  .ib-head .ib-count { flex: 0 0 auto; }
  .ib-head .fold { color: var(--faint); cursor: pointer; padding: 0 4px; }
  .ib-head .secact {
    font-size: 10.5px; letter-spacing: .5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: var(--r, 7px); padding: 2px 7px; margin-left: 4px; text-transform: none;
    visibility: hidden; white-space: nowrap; cursor: pointer;
  }
  .ib-head:hover .secact { visibility: visible; }
  .ib-head .secact:hover { color: var(--ink); border-color: var(--muted); }
  .ib-head .secact.warn:hover { color: var(--red); border-color: var(--red); }
  .ib-card .sec-prev { padding: 10px 16px; margin: 0; }
  .ib-card .more-link { padding: 10px 16px; }
  .ib-toggle { display: flex; align-items: center; gap: 6px; }
  .ib-toggle button { border: 1px solid var(--line); border-radius: 2px; padding: 3px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .ib-toggle button.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  @media (max-width: 700px) { .ib-row { padding: 12px 10px; gap: 10px; } }

  /* E167: the calendar's time view — the day in clock order, with the work
     that belongs to each meeting docked under it (the second feed mockup). */
  .tl { padding: 4px 6px 20px; overflow-y: auto; flex: 1; }
  .tl-row { display: flex; gap: 14px; padding: 8px 10px; }
  .tl-time { flex: 0 0 52px; text-align: right; color: var(--faint); font-size: 11.5px; padding-top: 2px; }
  .tl-time.strong { color: var(--ink); font-weight: 700; }
  .tl-rail { flex: 0 0 9px; display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-top: 6px; flex: 0 0 auto; }
  .tl-dot.key { background: var(--amber); }
  .tl-dot.now { width: 9px; height: 9px; background: var(--blue); box-shadow: var(--glow); margin-top: 2px; }
  .tl-line { flex: 1 1 auto; width: 1px; background: var(--line); }
  .tl-body { flex: 1 1 auto; min-width: 0; padding-bottom: 4px; }
  .tl-title { font-weight: 620; }
  .tl-title.key { font-weight: 700; }
  .tl-meta { color: var(--muted); font-size: 12px; }
  .tl-dock { margin-top: 6px; border-left: 2px solid var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
  .tl-dock.key { border-left-color: var(--amber); }
  .tl-dock .d-row { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .tl-dock .d-row:hover b, .tl-dock .d-row:hover .t { color: var(--blue); }
  .tl-dock .d-row .t { color: var(--muted); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-now-head { display: flex; align-items: center; gap: 10px; }
  .tl-now-head .lbl { color: var(--blue); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; }
  .tl-now-head .ln { flex: 1 1 auto; height: 1px; background: var(--blue); opacity: .45; }
  .tl-open { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-top: 6px; }
  .tl-open.fits { border-color: var(--blue); background: var(--blue-soft); }
  .cal-view { display: flex; gap: 4px; }
  .cal-view button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .cal-view button.on { border-color: var(--blue); color: var(--blue); }

  /* E69: Today's free-form notes */
  #daynote { margin: 10px 16px 0; border: 1px solid var(--note-line); background: var(--note-bg); border-radius: 12px; padding: 10px 14px; }
  #daynote .dn-head { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--note-head); font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
  #dn-status { font-size: 10.5px; letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 400; }
  #dn-text {
    width: 100%; border: none; outline: none; background: none; resize: vertical;
    min-height: 72px; max-height: 40vh; margin-top: 6px;
    font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--note-ink);
  }

  /* The three-line row survives the open pane (the old E48 compact rule
     hid the preview line, which in persistent-preview mode meant ALWAYS —
     Casey: "what happened to my 3 rows?"). Lines truncate; nothing hides. */
  body.pane-open .row { padding: 10px 12px; }
  body.pane-open .group-pick { display: none; }

  /* ---------- bulk bar ---------- */
  .bulkbar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: none; align-items: center; gap: 10px; background: #22304a; color: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(15,25,40,.4); font-size: 13px; }
  .bulkbar.show { display: flex; }
  .bulkbar button { color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 5px 12px; font-size: 12px; }
  .bulkbar button:hover { background: rgba(255,255,255,.12); }

  /* ---------- pane ---------- */
  .pane { flex: 0 0 var(--pane-w, 56%); margin-left: 12px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden; position: relative; }
  /* E68: drag the pane's left edge to resize (width persists) */
  .pane::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 10; }
  .pane:hover::before { background: linear-gradient(90deg, var(--blue-soft), transparent); }
  body.pane-resizing { cursor: col-resize; user-select: none; }
  body.pane-resizing .htmlbody { pointer-events: none; }
  .pane.open { display: flex; }
  .pane-tools { display: flex; align-items: center; gap: 2px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .pane-tools .sp { flex: 1; }
  .pane-tools .tool.only-sm { display: none; }   /* the ⋯ is a phone affordance */
  .tool { padding: 6px 9px; border-radius: 8px; color: var(--muted); font-size: 14px; }
  .tool:hover { background: var(--line-soft); color: var(--ink); }
  .tool.warn:hover { background: var(--red-soft); color: var(--red); }
  .pane-head { padding: 12px 20px 4px; }
  .pane-head h2 { font-size: 16.5px; display: inline; margin-right: 8px; }
  .lbl-add { border: 1px dashed var(--line); border-radius: 8px; padding: 1px 8px; font-size: 11px; color: var(--faint); background: none; width: 90px; }
  .ai-line { display: flex; gap: 8px; color: var(--muted); font-size: 12.5px; padding: 8px 20px 10px; }
  .msgs { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 16px; }
  .msg { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .msg:last-child { border-bottom: none; }
  .msg .mh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .msg .mav { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; vertical-align: middle; margin-right: 8px; position: relative; overflow: hidden; }
  .msg .mh b { font-size: 13.5px; }
  .msg .mh .t { color: var(--faint); font-size: 12px; }
  .ua-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 20px; }
  .ua-row { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--r, 10px); padding: 8px 12px; background: var(--card); flex-wrap: wrap; }
  .ua-main { flex: 1 1 260px; min-width: 0; }
  .ua-t { font-weight: 600; }
  .ua-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .ct-row { flex-wrap: nowrap; align-items: flex-start; }
  .ct-acts { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .ct-row .lead { width: 34px; height: 34px; border-radius: var(--av, 50%); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex: 0 0 auto; }
  .ct-row .ct-name { font: inherit; font-weight: 600; border: 1px solid transparent; background: none; color: var(--ink); padding: 2px 4px; border-radius: 6px; width: 100%; }
  .ct-row .ct-notes { font: inherit; font-size: 12.5px; border: 1px solid transparent; background: none; color: var(--muted); padding: 2px 4px; border-radius: 6px; width: 100%; margin-top: 3px; }
  .ct-row input:hover, .ct-row input:focus { border-color: var(--line); background: var(--input-bg, var(--card)); }
  .ua-notes { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-q { border-left: 3px solid var(--amber, #e8a33d); padding: 6px 10px; margin: 6px 0; background: var(--amber-soft, var(--chip-bg)); border-radius: 6px; }
  .dev-q textarea { width: 100%; margin-top: 6px; }
  /* E217: value score + sales-split chips */
  .val { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .val-hi { background: var(--blue); color: var(--card, #fff); }
  .val-mid { background: var(--blue-soft); color: var(--blue); }
  .val-lo { background: var(--chip-bg); color: var(--faint); }
  .chip.ty-Prospect { background: var(--blue-soft); color: var(--blue); }
  .chip.ty-Coldpitch { background: var(--chip-bg); color: var(--muted); }
  .chip.ty-Spam { background: var(--red-soft); color: var(--red); }
  /* E212: the Classified button */
  .cls-bar { padding: 2px 20px 8px; font-size: 12.5px; }
  .cls-sum { color: var(--muted); text-align: left; padding: 3px 0; line-height: 1.4; }
  .cls-sum b { color: var(--ink); font-weight: 600; }
  button.cls-sum:hover { color: var(--ink); }
  .cls-sum.muted, .cls-bar .muted { color: var(--faint); }
  .cls-panel { margin-top: 6px; border: 1px solid var(--line); border-radius: var(--r, 10px); padding: 10px 12px; background: var(--card); }
  .cls-row { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 3px 0; }
  .cls-k { color: var(--muted); }
  .cls-v { flex: 1 1 auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .cls-v select, .cls-v input[type=date] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--input-bg, var(--card)); color: var(--ink); }
  .cls-src { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); }
  .cls-src.cls-you { background: var(--blue-soft); color: var(--blue); }
  .cls-src.cls-jev { background: var(--amber-soft, var(--chip-bg)); color: var(--note-head, var(--muted)); }
  .cls-why { color: var(--muted); padding: 0 0 6px; }
  .cls-reasons { margin: 6px 0 0 18px; padding: 0; color: var(--muted); }
  .cls-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  @media (max-width: 640px) { .cls-bar { padding: 2px 14px 8px; } .cls-row { grid-template-columns: 78px minmax(0,1fr) auto; gap: 6px; }
    .cls-v input[type=date] { max-width: 150px; } }
  /* Dev #26: reply / reply all / forward ONE message of a thread */
  .msg .mh .mact { margin-left: auto; display: flex; gap: 2px; opacity: .55; }
  .msg:hover .mh .mact, .msg .mh .mact:focus-within { opacity: 1; }
  .msg .mh .mact button { padding: 2px 6px; border-radius: 7px; color: var(--muted); display: inline-flex; }
  .msg .mh .mact button:hover { background: var(--chip-bg); color: var(--ink); }
  .msg .mh .mact svg + svg { margin-left: -7px; }
  .msg .mrcpt { color: var(--faint); font-size: 11.5px; margin: 2px 0 0 38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }

  /* E65: rich body editor */
  .rb-bar { display: flex; gap: 2px; border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0; padding: 5px 8px; background: #f5f7fa; }
  .rb-bar button { padding: 3px 9px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .rb-bar button:hover { background: var(--chip-bg); color: var(--ink); }
  .rb-body {
    width: 100%; min-height: 140px; max-height: 40vh; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 0 0 9px 9px; padding: 10px 12px;
    background: var(--input-bg); outline: none; white-space: pre-wrap; font-size: 13.5px; line-height: 1.5;
  }
  .rb-body:focus { border-color: var(--blue); }
  .rb-body a { color: var(--blue); }

  /* E63: recipient chip fields */
  .chipfield {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px;
    background: var(--input-bg); min-height: 40px; cursor: text; width: 100%;
  }

    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;

  }
  .rchip.bad { background: var(--red-soft); color: var(--red); }
  .acct-tab.dragging { opacity: .45; }
  /* Projects (2026-09-29) */

  .pj-filters { display: flex; gap: 6px; padding: 4px 14px 10px; }
  .sm-a.on { border-color: var(--blue); color: var(--blue); }

  .pj-row:hover { background: var(--hover); }

  .pj-accs { display: flex; flex-wrap: wrap; gap: 3px; } .pj-accs .pj-acc { margin: 0; }
  .pj-tg { color: var(--muted); font-size: 12.5px; }
  .pj-bar { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .pj-bar b { display: block; height: 100%; background: var(--blue); }

  .srch-accts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 14px 8px; font-size: 12px; color: var(--muted); }

  /* E244: the strip is solid card, runs across the list's side padding and

  /* E62: people hover cards + contact capture */
  /* E181 (Casey: "why do we have the dashes under the names of people?"): the
     dash marks a name you can hover for a contact card — but a permanent
     dotted rule under every sender is noise in a list you scan. The hint
     arrives with the pointer instead; the hover card is unchanged. */
  .person { cursor: default; border-bottom: 1px dashed transparent; }

    position: fixed; z-index: 160; width: 320px; background: var(--card);

  }

  .msg iframe.htmlbody { width: 100%; border: none; background: #fff; min-height: 60px; }
  /* E172: a plain email is rendered in the board's own palette, so the frame
     must not sit on white; a designed email keeps its paper, framed so it
     reads as a document rather than a hole punched in the UI. */
  .msg iframe.htmlbody.native { background: transparent; }
  /* E202: no outline around the paper — Casey found the body over-bordered. */
  /* E173: art-directed mail keeps its design, but a dark board should not be

  html:not([data-skin="daylight"]) .msg iframe.htmlbody.paper { filter: brightness(.82) saturate(.92); }
