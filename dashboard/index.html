<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Grand Central">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
<title>Grand Central</title>
<style>
  /* ============================================================
     E52 — the unified shell. One list (mail + todos), scopes in the
     rail, Shortwave grammar. Real actions. Account-first: no projects/goals.
     ============================================================ */
  /* E77 — SKINS. Every surface color is a token; a skin is a block of
     token overrides on html[data-skin] (plus a few scoped rules at the
     end of this sheet). Daylight = these defaults. */
  /* E148: Daylight speaks macOS now — Apple grays, system blue, big-Sur
     radii; the vibrancy/selection grammar lives in the daylight-scoped
     block at the end of the sheet. */
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --faint: #86868b; --line: #e2e2e7; --blue: #0071e3; --blue-soft: #eaf2ff;
    --green: #248a3d; --red: #d70015; --chip-bg: #f0f0f2;
    --shadow: 0 0 0 0.5px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.05);
    --r: 10px;
    --bg-grad: linear-gradient(170deg, #f7f7f9 0%, #f2f2f6 60%, #f5f4f8 100%);
    --hover: #f2f2f5; --panel: #f7f7f9; --line-soft: #efeff2;
    --input-bg: #ffffff; --scroll: #c9c9ce; --tbtn-hover: rgba(0,0,0,.05);
    --amber: #ff9f0a; --amber-soft: #fff4e0; --red-soft: #ffebe9;
    --note-bg: #fffbef; --note-line: #ece2c4; --note-head: #91661a; --note-ink: #3d3423;
    --sel-bg: #eaf2ff; --glow: none; --cell-out: #fafafa; --subj: #3a3a3c;
  }
  /* ---- skin: 2049 (Blade Runner) — near-black, squared, neon cyan/rose ---- */
  html[data-skin="2049"] {
    --bg: #07090d; --card: #0d131c; --ink: #d9e6f2; --muted: #7f95ad;
    --faint: #566880; --line: #1b2836; --blue: #22d3ee; --blue-soft: rgba(34,211,238,.13);
    --green: #2dd996; --red: #ff5470; --chip-bg: #141d2a;
    --shadow: 0 0 0 1px rgba(34,211,238,.07), 0 10px 34px rgba(0,0,0,.65);
    --r: 0px;
    --bg-grad: linear-gradient(165deg, #0a0d13 0%, #070a10 55%, #0b0912 100%);
    --hover: #121b28; --panel: #101825; --line-soft: #172231;
    --input-bg: #0a1018; --scroll: #22303f; --tbtn-hover: rgba(34,211,238,.09);
    --amber: #ffb020; --amber-soft: #2a2008; --red-soft: #2b1016;
    --note-bg: #16120a; --note-line: #3a2f12; --note-head: #e8b84b; --note-ink: #e2d5ac;
    --sel-bg: #1b2433; --glow: 0 0 18px rgba(34,211,238,.25); --cell-out: #0a0e15; --subj: #c0d0e2;
  }
  /* ---- skin: shortwave — Bart's own mail client, from his screenshots: a
     cool lavender ground, white panes floating on it with generous radii and
     soft shadows, one blue accent, squircle avatars, pill chrome. ---- */
  html[data-skin="shortwave"] {
    --bg: #e9ecf8; --card: #ffffff; --ink: #1a1c22; --muted: #5b6070;
    --faint: #8a90a2; --line: #e4e7f0; --blue: #2b59f0; --blue-soft: #e8edff;
    --green: #17996b; --red: #e5484d; --chip-bg: #eef0f6;
    --shadow: 0 1px 2px rgba(20,28,60,.06), 0 10px 28px rgba(20,28,60,.09);
    --r: 14px;
    --bg-grad: linear-gradient(160deg, #eef0fb 0%, #e6eaf7 55%, #ecebf9 100%);
    --hover: #f4f6fb; --panel: #ffffff; --line-soft: #eef0f6;
    --input-bg: #ffffff; --scroll: #d5d9e8; --tbtn-hover: rgba(43,89,240,.08);
    --amber: #f5a524; --amber-soft: #fff4e0; --red-soft: #ffe9ea;
    --note-bg: #fff8e8; --note-line: #f2e4c4; --note-head: #9a6b13; --note-ink: #2c2f38;
    --sel-bg: #e8edff; --glow: none; --cell-out: #f7f8fc; --subj: #1a1c22;
  }
  /* ---- skin: classic (Macintosh System 7 / Platinum) — the 1991 desktop:
     grey ground, white windows boxed in hard 1px black, pinstriped title
     bars, Chicago-era type, square everything, drop shadows with no blur. ---- */
  html[data-skin="classic"] {
    --bg: #a8a8a8; --card: #ffffff; --ink: #000000; --muted: #333333;
    --faint: #666666; --line: #000000; --blue: #000080; --blue-soft: #c8c8ff;
    --green: #006400; --red: #990000; --chip-bg: #dddddd;
    --shadow: 2px 2px 0 rgba(0,0,0,.55);
    --r: 0px;
    --bg-grad: #a8a8a8;
    --hover: #e6e6e6; --panel: #dddddd; --line-soft: #999999;
    --input-bg: #ffffff; --scroll: #b0b0b0; --tbtn-hover: rgba(0,0,0,.12);
    --amber: #806000; --amber-soft: #f0e6c0; --red-soft: #f0c8c8;
    --note-bg: #ffffcc; --note-line: #000000; --note-head: #806000; --note-ink: #000000;
    --sel-bg: #000080; --glow: none; --cell-out: #f0f0f0; --subj: #000000;
  }
  /* ---- skin: inbox (Google Inbox, 2014-2019) — Bart's reference. Blue bar,
     #F5F5F5 ground, white cards with a hairline shadow, near-square corners,
     Material accent colours per bundle, the red ＋. ---- */
  html[data-skin="inbox"] {
    --bg: #f5f5f5; --card: #ffffff; --ink: #212121; --muted: #5f6368;
    --faint: #9aa0a6; --line: #e0e0e0; --blue: #4285f4; --blue-soft: #e8f0fe;
    --green: #0f9d58; --red: #db4437; --chip-bg: #f1f3f4;
    --shadow: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
    --r: 2px;
    --bg-grad: #f5f5f5;
    --hover: #f5f5f5; --panel: #ffffff; --line-soft: #eeeeee;
    --input-bg: #ffffff; --scroll: #dadce0; --tbtn-hover: rgba(255,255,255,.18);
    --amber: #f4b400; --amber-soft: #fef7e0; --red-soft: #fce8e6;
    --note-bg: #fff8e1; --note-line: #f6e6b4; --note-head: #b06000; --note-ink: #3c4043;
    --sel-bg: #e8f0fe; --glow: none; --cell-out: #fafafa; --subj: #202124;
  }
  /* ---- skin: lcars (Star Trek) — black, amber/salmon/lavender pills ---- */
  html[data-skin="lcars"] {
    --bg: #000000; --card: #0b0b10; --ink: #f4e9d8; --muted: #cfa96a;
    --faint: #8d7a58; --line: #2b2338; --blue: #ff9c33; --blue-soft: rgba(255,156,51,.15);
    --green: #cc99ff; --red: #ff7755; --chip-bg: #191423;
    --shadow: 0 0 0 1px rgba(255,156,51,.10), 0 10px 30px rgba(0,0,0,.7);
    --r: 20px;
    --bg-grad: radial-gradient(ellipse at 15% 0%, #12101a 0%, #000 60%);
    --hover: #151020; --panel: #120e1b; --line-soft: #1d1729;
    --input-bg: #0d0a14; --scroll: #3a2f4d; --tbtn-hover: rgba(255,156,51,.10);
    --amber: #ff9c33; --amber-soft: #241705; --red-soft: #2b130c;
    --note-bg: #171107; --note-line: #3d2c0f; --note-head: #ffb45e; --note-ink: #ecd9b4;
    --sel-bg: #221a30; --glow: 0 0 16px rgba(255,156,51,.22); --cell-out: #0a0810; --subj: #e6d6ba;
  }
  /* ---- skin: matrix — phosphor green on black, terminal type, rain ---- */
  html[data-skin="matrix"] {
    --bg: #000400; --card: #030c05; --ink: #b8ffc8; --muted: #55a86b;
    --faint: #337347; --line: #0d3317; --blue: #00ff41; --blue-soft: rgba(0,255,65,.12);
    --green: #00ff41; --red: #ff5555; --chip-bg: #06180b;
    --shadow: 0 0 0 1px rgba(0,255,65,.09), 0 10px 34px rgba(0,0,0,.7);
    --r: 2px;
    --bg-grad: radial-gradient(ellipse at 50% -10%, #04240c 0%, #000400 65%);
    --hover: #06180b; --panel: #041108; --line-soft: #0a2812;
    --input-bg: #020a04; --scroll: #14522a; --tbtn-hover: rgba(0,255,65,.10);
    --amber: #ccff33; --amber-soft: #101f06; --red-soft: #240a0a;
    --note-bg: #071505; --note-line: #1d3a12; --note-head: #a8e063; --note-ink: #cfeab8;
    --sel-bg: #0a2413; --glow: 0 0 18px rgba(0,255,65,.25); --cell-out: #020a05; --subj: #8ef0a8;
  }
  /* ---- skin: starwars — '77 targeting computer: crawl-yellow vector
     lines on a starfield, red alerts, condensed uppercase ---- */
  html[data-skin="starwars"] {
    --bg: #000005; --card: #0b0a03; --ink: #f2e9c0; --muted: #b3a86b;
    --faint: #6e693f; --line: #3a3410; --blue: #ffe81f; --blue-soft: rgba(255,232,31,.13);
    --green: #4bd35f; --red: #ff3b30; --chip-bg: #161305;
    --shadow: 0 0 0 1px rgba(255,232,31,.10), 0 10px 30px rgba(0,0,0,.75);
    --r: 3px;
    --bg-grad: radial-gradient(ellipse at 50% 120%, #0d0c04 0%, #000005 60%);
    --hover: #141207; --panel: #100d04; --line-soft: #241f0a;
    --input-bg: #080703; --scroll: #4a421a; --tbtn-hover: rgba(255,232,31,.10);
    --amber: #ffe81f; --amber-soft: #1d1905; --red-soft: #2b0d0a;
    --note-bg: #131005; --note-line: #38300e; --note-head: #ffe81f; --note-ink: #e6dcae;
    --sel-bg: #1c1806; --glow: 0 0 16px rgba(255,232,31,.20); --cell-out: #080703; --subj: #e8dfae;
  }
  /* ---- skin: tron — the Grid: black-blue, neon cyan lines, Clu orange ---- */
  html[data-skin="tron"] {
    --bg: #010409; --card: #050d14; --ink: #d2eef7; --muted: #6ba3b8;
    --faint: #3d6b7d; --line: #0c3644; --blue: #00d9ff; --blue-soft: rgba(0,217,255,.12);
    --green: #6fffc2; --red: #ff4b33; --chip-bg: #07202b;
    --shadow: 0 0 0 1px rgba(0,217,255,.10), 0 10px 34px rgba(0,0,0,.7);
    --r: 4px;
    --bg-grad: radial-gradient(ellipse at 50% 115%, #06232e 0%, #010409 60%);
    --hover: #071b24; --panel: #061520; --line-soft: #0a2a36;
    --input-bg: #030b11; --scroll: #12495c; --tbtn-hover: rgba(0,217,255,.10);
    --amber: #ff9448; --amber-soft: #201007; --red-soft: #2b0e08;
    --note-bg: #170f06; --note-line: #3a2410; --note-head: #ffab63; --note-ink: #e8d9c4;
    --sel-bg: #0b2833; --glow: 0 0 18px rgba(0,217,255,.26); --cell-out: #04101a; --subj: #b8dfeb;
  }
  /* ---- skin: wargames — WOPR: black cabinet, phosphor orange-red,
     8-bit terminal, rows of blinking lights ---- */
  html[data-skin="wargames"] {
    --bg: #020202; --card: #0b0705; --ink: #f0dfcf; --muted: #b08668;
    --faint: #7d5a45; --line: #3a1c0d; --blue: #ff6a2b; --blue-soft: rgba(255,106,43,.13);
    --green: #7fe3a0; --red: #ff3b30; --chip-bg: #1a0f08;
    --shadow: 0 0 0 1px rgba(255,106,43,.10), 0 10px 30px rgba(0,0,0,.75);
    --r: 2px;
    --bg-grad: radial-gradient(ellipse at 50% -10%, #1a0c04 0%, #020202 60%);
    --hover: #170d07; --panel: #120a06; --line-soft: #241206;
    --input-bg: #0a0503; --scroll: #4a2812; --tbtn-hover: rgba(255,106,43,.10);
    --amber: #ffb020; --amber-soft: #1d1305; --red-soft: #2b0d08;
    --note-bg: #150d05; --note-line: #3a2410; --note-head: #ffb020; --note-ink: #e8d5b8;
    --sel-bg: #221007; --glow: 0 0 16px rgba(255,106,43,.22); --cell-out: #0a0503; --subj: #e6cdb8;
  }
  /* ---- skin: mission — Houston MOCR: navy dark, console green + amber
     readouts, projection-screen glow ---- */
  html[data-skin="mission"] {
    --bg: #04070c; --card: #0a1018; --ink: #d8e8dd; --muted: #7fa08c;
    --faint: #4c6656; --line: #14283a; --blue: #57d98f; --blue-soft: rgba(87,217,143,.12);
    --green: #57d98f; --red: #ff4b33; --chip-bg: #10202c;
    --shadow: 0 0 0 1px rgba(87,217,143,.08), 0 10px 30px rgba(0,0,0,.7);
    --r: 6px;
    --bg-grad: linear-gradient(170deg, #071019 0%, #04070c 55%, #050a08 100%);
    --hover: #101a26; --panel: #0d1520; --line-soft: #0f2030;
    --input-bg: #070d14; --scroll: #1e4258; --tbtn-hover: rgba(87,217,143,.10);
    --amber: #ffb020; --amber-soft: #1c1405; --red-soft: #29100b;
    --note-bg: #131207; --note-line: #382c0e; --note-head: #ffb020; --note-ink: #e8dcb4;
    --sel-bg: #10222e; --glow: 0 0 16px rgba(87,217,143,.20); --cell-out: #070d14; --subj: #bcd8c4;
  }
  /* E203 — the two device insets, named once. They were written as env()
     in sixteen places, which made them untestable: headless Chrome reports
     env() as 0, so the status-bar collision could never fail a test. As
     custom properties a test can force them to a real iPhone's 44/34 and
     assert what actually moves. :root is html, so every rule inherits them. */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  /* E199: on iOS height:100% is the large viewport — the page stops short of
     the bottom and the unpainted strip shows through. dvh tracks the viewport
     that is actually on screen. */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  /* E203 — and when even dvh is wrong. In the installed app iOS can hand the
     page a viewport shorter than the screen (after a keyboard, a rotation, or
     a cold start), which is what "the screen is shifted up off the bottom"
     looks like: the app paints to 100dvh and the strip below it is not ours.
     syncAppHeight() measures the window itself and wins over dvh. html also
     carries the background now, so any strip that does appear is our colour
     rather than the browser's grey. */
  html { background: var(--bg-grad); }
  html.has-apph, html.has-apph body { height: var(--app-h); }
  body {
    font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg-grad);
    color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--ink); }
  a { color: var(--blue); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; }

  /* ---------- top bar ---------- */
  /* E157.1: backdrop-filter (macOS skin) makes .top a stacking context —
     without its own z-index the ⚙ menu (z:130 INSIDE it) painted under the
     Home cards. The bar itself now sits above page content. */
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex: 0 0 auto; position: relative; z-index: 40; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 210px; cursor: pointer; }
  .brand-logo { width: 26px; height: 26px; }
  .brand h1 { font-size: 16.5px; font-weight: 800; letter-spacing: -.2px; }
  .brand .dot { color: var(--amber); }
  /* E118: the crumb is a TRAIL now — a way back when the rail is tucked */
  .crumb { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-right: 8px; color: var(--ink); flex-wrap: wrap; }
  .crumb .cr { color: var(--muted); font-weight: 600; cursor: pointer; }
  .crumb .cr:hover { color: var(--blue); }
  .crumb .cr.on { color: var(--ink); font-weight: 700; cursor: default; }
  .crumb .cr-sep { color: var(--faint); font-weight: 400; }
  .search {
    flex: 1 1 auto; max-width: 640px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; color: var(--faint); box-shadow: 0 1px 2px rgba(20,30,50,.04);
  }
  .search input { border: none; outline: none; flex: 1; background: none; min-width: 0; }
  .search .hint { font-size: 10.5px; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .search .clr { display: none; cursor: pointer; color: var(--faint); font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .search .clr:hover { color: var(--ink); background: var(--hover); }
  .search.has-q .clr { display: inline-block; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  /* E206: menu entries that only exist because the phone hides the matching
     control in the top bar. The phone block turns them back on. */
  .me-menu button.phone-only { display: none; }
  .tbtn { padding: 7px 11px; border-radius: 10px; color: var(--muted); font-size: 12.5px; font-weight: 600; position: relative; }
  .tbtn:hover { background: var(--tbtn-hover); color: var(--ink); }
  .compose { display: flex; align-items: center; gap: 7px; background: var(--blue-soft); color: var(--blue); font-weight: 600; padding: 8px 15px; border-radius: 12px; }
  .compose.todo-pill { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .compose.todo-pill:hover { border-color: var(--blue); color: var(--blue); }
  .avatar { width: 32px; height: 32px; border-radius: 10px; background: #7a5c48; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; position: relative; cursor: pointer; }
  .avatar:hover { filter: brightness(1.1); }
  .wn-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 5px var(--amber); border: 1.5px solid #fff; display: inline-block; }
  /* E191 (Bart, on the phone: "I'm not able to scroll to the settings menu"):
     the ⚙ list is longer than a phone screen, and the page behind it does not
     scroll (body is overflow:hidden), so anything past the fold was simply
     unreachable. The menu scrolls itself now, and on a narrow screen it
     stretches to both edges with the notch and home indicator accounted for. */
  .me-menu {
    position: absolute; right: 0; top: 40px; z-index: 130; min-width: 240px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(20,30,50,.18); padding: 8px;
    max-height: min(70vh, calc(100vh - 72px)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  @media (max-width: 700px) {
    .me-menu {
      position: fixed; top: calc(52px + var(--safe-top)); right: 8px; left: 8px;
      min-width: 0; max-width: none;
      max-height: calc(100vh - 68px - var(--safe-top) - var(--safe-bot));
      padding-bottom: calc(8px + var(--safe-bot));
    }
  }
  .me-menu h5 { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); padding: 6px 10px 3px; }
  .me-menu a, .me-menu button {
    display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px;
    color: var(--ink); text-decoration: none; font-size: 13px; background: none;
  }
  .me-menu a:hover, .me-menu button:hover { background: #f2f5fa; }
  .me-menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
  /* E156: notification bell + panel (panel reuses .me-menu) */
  #nf-badge { position: absolute; top: -1px; right: -1px; min-width: 15px; height: 15px; border-radius: 8px; background: #c0392b; color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; padding: 0 3px; }
  .nf-row { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.35; color: var(--ink); }
  .nf-row.new { background: var(--blue-soft); }
  .nf-ts { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .nf-empty { padding: 10px; font-size: 12.5px; color: var(--muted); }

  /* ---------- shell ---------- */
  .shell { flex: 1 1 auto; display: flex; min-height: 0; padding: 0 12px 12px 6px; }

  /* ---------- rail ---------- */
  .rail { flex: 0 0 216px; overflow-y: auto; padding: 6px 10px 20px 8px; transition: flex-basis .18s ease, padding .18s ease; }
  .rail h4 { font-size: 10.5px; letter-spacing: 1.2px; color: var(--faint); text-transform: uppercase; margin: 15px 8px 4px; font-weight: 700; }
  .scope { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 6px 10px; border-radius: 9px; color: var(--ink); }
  .scope:hover { background: rgba(255,255,255,.75); }
  .scope.on { background: var(--card); box-shadow: 0 1px 2px rgba(20,30,50,.06); font-weight: 600; }
  .scope .ic { width: 18px; text-align: center; color: var(--muted); flex: 0 0 auto; }

  .rail-toggle { display: flex; justify-content: flex-end; width: 100%; padding: 2px 8px 6px; color: var(--faint); font-size: 13px; cursor: pointer; user-select: none; }

  @media (min-width: 981px) {

    /* E118: slim-rail feel — icons pop on hover, active scope carries an
       edge light; LCARS hides icons on the wide text bars but slim NEEDS

    html[data-rail="slim"] .rail .scope { transition: transform .15s ease, background .15s ease; }
    html[data-rail="slim"] .rail .scope .ic { font-size: 15px; color: var(--ink); transition: transform .15s ease; }
    html[data-rail="slim"] .rail .scope:hover { transform: translateX(3px); }
    html[data-rail="slim"] .rail .scope:hover .ic { transform: scale(1.25); }

    html[data-skin="lcars"][data-rail="slim"] .rail .scope .ic { display: inline; color: #000; }
    html[data-skin="lcars"][data-rail="slim"] .rail .scope { border-radius: 16px 0 0 16px; }
    @media (prefers-reduced-motion: reduce) {

      html[data-rail="slim"] .rail .scope:hover, html[data-rail="slim"] .rail .scope:hover .ic { transform: none; }
    }
  }

  /* ---------- list ---------- */
  .main { flex: 1 1 auto; min-width: 0; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .list-head { display: flex; align-items: center; gap: 6px; padding: 12px 16px 0; flex-wrap: wrap; }

     lens tabs, where the two read as a single confusing row. */
  .list-head .crumb { flex: 1 1 100%; margin: 0 0 6px; }

  .ltab[hidden], .group-pick[hidden] { display: none !important; }

  .list { flex: 1 1 auto; overflow-y: auto; padding: 6px 8px 30px; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 22px 12px 8px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); font-weight: 700; cursor: pointer; user-select: none; }
  .sec .n { font-weight: 500; letter-spacing: 0; }
  .sec .fold { margin-left: auto; color: var(--faint); }
  .sec .secact {
    font-size: 10.5px; letter-spacing: .5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 7px; margin-left: 5px; text-transform: none;
    visibility: hidden; white-space: nowrap;
  }
  .sec:hover .secact { visibility: visible; }
  .sec .secact:hover { color: var(--ink); border-color: var(--muted); }
  .sec-prev { display: flex; align-items: baseline; gap: 6px; padding: 0 12px 6px 14px; font-size: 12px; color: var(--muted); cursor: pointer; overflow: hidden; white-space: nowrap; }
  .sec-prev b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .sec-prev .sep { color: var(--faint); }
  .sec-prev .pt { margin-left: auto; color: var(--faint); font-size: 11.5px; flex: 0 0 auto; }
  .hd-line { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; font-size: 12.5px; cursor: pointer; flex-wrap: wrap; }
  .hd-line span { font-weight: 600; }
  .hd-line em { color: var(--faint); font-style: normal; font-size: 11.5px; }
  .hd-line:hover span { color: var(--blue); }
  /* E100: plan card */
  .plan-card { margin: 10px 8px 2px; padding: 12px 14px; border: 1px solid var(--amber); border-radius: 12px; background: var(--note-bg); animation: rise-in .4s ease both; }
  .plan-theme { font-weight: 700; font-size: 14px; margin: 2px 0 8px; color: var(--note-ink); }
  .plan-must { display: flex; gap: 7px; align-items: baseline; padding: 2.5px 0; font-size: 13px; color: var(--note-ink); flex-wrap: wrap; }
  .plan-must em { color: var(--note-head); font-style: normal; font-size: 11.5px; flex-basis: 100%; padding-left: 18px; }
  /* E153: on narrow screens a long title shrinks-and-wraps beside its
     number instead of dropping to its own flex line */
  .plan-must span { flex: 1 1 10ch; min-width: 0; }
  .plan-then, .plan-wait { color: var(--note-head); font-size: 12px; margin-top: 6px; }
  .plan-wait { opacity: .75; }
  /* E159: the brief absorbs ☀ Today and 🛰 drift — full-width across the
     grid, its three sections as columns (wrapping on narrow screens), plus
     note-palette overrides so inherited row styles stay readable on amber. */
  .plan-card.brief { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 28px; }
  .plan-card.brief > .hw-k, .plan-card.brief > .plan-theme { flex-basis: 100%; }

  .plan-card.brief .hrow .hd, .plan-card.brief .hcal-ev, .plan-card.brief .hd-line em { color: var(--note-head); }
  .plan-card.brief .hrow:hover .ht, .plan-card.brief .hd-line:hover span { color: var(--blue); }
  /* E159: projects with nothing for today rest here instead of holding a card */
  .hquiet { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px;
    color: var(--faint); animation: rise-in .45s ease both; }

  /* E95/E96: home dashboard — full page, motion */
  body.home-on .list-head, body.home-on #daynote { display: none; }
  body.home-on .pane { display: none !important; }
  body.home-on .main { max-width: none; }
  .hgreet { display: flex; align-items: center; gap: 14px; margin: 18px 14px 6px; }
  .hgreet b { font-size: 21px; display: block; letter-spacing: -.2px; }
  .hgreet span:not(.htrain) { color: var(--faint); font-size: 12.5px; }
  .htrain { font-size: 30px; display: inline-block; animation: train-in .9s cubic-bezier(.2,.8,.3,1) both, train-bob 3.2s ease-in-out 1s infinite; }
  @keyframes train-in { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes train-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; margin: 10px; }
  /* E153: a card's nowrap mail rows give it a ~485px min-content — without
     this, the phone's single column inflates to that and every card runs
     off-screen. min-width:0 lets cards shrink to the track; .hrow's
     overflow+ellipsis does the rest. */
  .home-grid > * { min-width: 0; }
  @media (max-width: 1150px) { }
  .hask { display: flex; align-items: center; gap: 10px; margin: 12px 10px 0; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px 14px; }
  .hask input { flex: 1; border: none; outline: none; background: none; color: var(--ink); font-size: 13.5px; }
  .hask:focus-within { border-color: var(--blue); box-shadow: var(--glow); }
  .hwit, .hcal { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; animation: rise-in .45s ease both; }
  .hwit:hover, .hcal:hover { border-color: var(--blue); }

  /* E159: cards size to their content — the grid row equalizes heights,

  .hcard.sq { display: flex; flex-direction: column; }

  .hwit.wide i { font-size: 13.5px; }

  .hwit.side i { font-size: 12px; color: var(--muted); }

  /* E137: the numbers, calmly — one card, yesterday deltas */

  .hstats .hs-row:last-child { border-bottom: none; }
  .hstats .hs-row:hover .hs-l { color: var(--ink); }

  .hstats b { font-size: 13.5px; min-width: 34px; text-align: right; }
  .hstats .hs-d { font-size: 11px; min-width: 36px; text-align: right; font-weight: 600; }
  .home-grid .plan-card, .home-grid .hdrift { margin: 0; }
  .also-hits { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px 0; color: var(--faint); font-size: 11.5px; }
  .also-hits .chip { cursor: pointer; }
  .hc-btns { margin-left: auto; display: flex; gap: 3px; flex: 0 0 auto; }
  .hc-btns button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; font-size: 12px; color: var(--muted); background: var(--card); }
  .hc-btns button:hover { border-color: var(--blue); color: var(--blue); }
  .hc-sec { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; margin: 9px 0 3px; }

  .hrow em { font-style: normal; color: var(--faint); font-size: 11px; }
  .hrow b { font-weight: 600; flex: 0 0 auto; }
  .hrow .ht { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .hrow .hd { color: var(--faint); font-size: 11px; flex: 0 0 auto; }
  .hrow:hover .ht, .hrow:hover b { color: var(--blue); }

  .hcard { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }

  .bundle .sec { padding-top: 10px; }

  .tk-match { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; color: var(--ink); background: var(--panel); }
  .tk-match:hover { border-color: var(--blue); color: var(--blue); }
  .sec .secact.warn:hover { color: var(--red); border-color: var(--red); }

  /* E59: inbox steward card */

  .gc-bar span { display: block; height: 100%; background: var(--blue); }

  .scope-head .kind { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .sh-top { display: flex; align-items: center; gap: 8px; }

  /* E111: 🧙 Wizard page */

  .wiz-sec h3 { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 2px; }

  .wiz-sec .stw-row:last-child { border-bottom: none; }

  .wiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 10px; margin-top: 10px; }

  /* E64: stacked, airy rows per Bart's Shortwave reference — sender /
     subject / snippet each on their own line, real vertical padding. */
  /* E182: the avatar's position is a variable, so anything that sits ON the
     avatar (the select circle) cannot drift when the row's padding changes —
     which is exactly what happened when E175 tightened it from 13px to 9px. */
  .row { --row-pad: 9px; display: flex; align-items: flex-start; gap: 12px; padding: var(--row-pad) 12px;
    border-radius: var(--r, 10px); cursor: pointer; position: relative; margin: 0; }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--blue-soft); }
  .row.kb { outline: 2px solid #b9d2f5; }
  .row.sel { background: var(--sel-bg); }
  .row .l2 { display: flex; align-items: baseline; gap: 8px; overflow: hidden; margin-top: 1px; white-space: nowrap; }
  /* E175: status lives on the right of line 1, never on a line of its own. */
  .row .hl { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: 0 0 auto; padding-left: 8px; }
  .row .hl .chip { font-size: 10.5px; padding: 1px 7px; }
  .row .l2 .prev { color: var(--faint); overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .row .l3 { margin-top: 2px; overflow: hidden; white-space: nowrap; }

  .row .l1 .row-note { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
