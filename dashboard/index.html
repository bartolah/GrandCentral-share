<script>
/* ======================================================================
   E52 unified shell. All actions hit the same endpoints classic uses —
   nothing server-side changed except labels-on-todos.
   ====================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POLL_MS = 60_000, BOARD_MS = 300_000;

let MAIL = [], TODOS = [], BOARD = {}, OUTBOX = [], DRAFTS = null, SENT = null, CONN = null;
let ITEMS = [], PNAME = {}, OWN = new Set();
let SCOPE = { kind:'home', id:null }, TAB='all', GROUP='smart', Q='', OPEN=null, DOCK=null;
/* ================= accounts (account-first, 2026-09-24) =================
   An account is a real mail account (personal, connectblue, …) — the primary
   navigation and the ownership boundary. Mail and todos are only ever seen
   through the account they belong to; nothing crosses. There are no projects
   or goals: items carry `project` = their account purely so the older
   per-"project" views (Home cards, scope rows) now group by account. A todo
   with no account yet is "Unassigned" until one is picked. */
let ACCOUNTS=[];
let ACCT = localStorage.getItem('gc2_acct') || '';
const acctLabel = id => String(id||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function acctIds(){ return ACCOUNTS.slice(); }
const mailAcctInAcct = a => !!ACCT && a===ACCT;
const sentInAcct = row => mailAcctInAcct(row.account);
const inAcctId = pid => !!ACCT && pid===ACCT;
const inAcct = i => !!ACCT && i.account===ACCT;
const acctName = id => acctLabel(id);
async function setAcct(id){
  if(!ACCOUNTS.includes(id) || id===ACCT) return;
  ACCT=id; localStorage.setItem('gc2_acct',id);
  // Account changes invalidate every account-owned cache before repainting.
  DRAFTS=null; SENT=null; DEVQ=null; SEL.clear(); KB=-1; closePane();
  if(SCOPE.kind==='project') SCOPE={kind:'inbox',id:null};
  renderAcctTabs(); renderCrumbs();
  $('#list').innerHTML='<div class="empty">Loading '+esc(acctLabel(id))+'…</div>';
  await loadMailTodos();
  if(SCOPE.kind==='dev') await loadDev();
}
function acctCount(id){
  const was=ACCT; ACCT=id;
  const n=ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&inboxLive(i)&&(i.type==='todo'?isToday(i):(i.needs||i.unread))).length;
  ACCT=was; return n;
}
function renderAcctTabs(){
  const el=$('#acct-tabs'); if(!el) return;
  const tab=(id,label)=>{ const n=acctCount(id);
    return `<button class="acct-tab ${ACCT===id?'on':''}" onclick="setAcct('${esc(id)}')" title="${esc(acctName(id))}">
      <span>${esc(label)}</span>${n?`<span class="n">${n}</span>`:''}</button>`; };
  el.innerHTML = acctIds().map(id=>tab(id,acctLabel(id).slice(0,22))).join('');
}
/* ================= E164: ⚑ flag it from the screen =================
   NewsBot/SalesDB grammar: say what is wrong WHERE it is wrong, and let the
   report carry what a fix needs — the element, the screen state, and what
   broke just before. Reports land in the dev queue (E144) as ordinary
   requests, so one queue still holds every change Bart asks for. */
const FB_ERRS=[];
const fbErr=(kind,msg)=>{
  FB_ERRS.push({t:new Date().toTimeString().slice(0,8),kind,msg:String(msg??'').slice(0,180)});
  if(FB_ERRS.length>6) FB_ERRS.shift();
};
addEventListener('error',e=>fbErr('js',`${e.message} @${String(e.filename||'').split('/').pop()}:${e.lineno}`));
addEventListener('unhandledrejection',e=>fbErr('promise',e.reason&&e.reason.message||e.reason));
// Failed requests are the other half of "what broke just before" — a thin
// passthrough, so every existing caller sees the same response or throw.
// E195: only OUR requests count. Grand Central never fetches another origin,
// so a cross-origin failure is always something else on the page — a tracker
// an extension injected, blocked by an ad blocker. Six slots is all the ⚑
// report has, and that noise was spending every one of them.
(function(){ const _f=window.fetch;
  const ours=u=>{ try{ return new URL(u,location.href).origin===location.origin; }catch(e){ return true; } };
  window.fetch=async function(...a){
    const raw=String(a[0]&&a[0].url||a[0]||''), url=raw.replace(location.origin,'');
    try{ const r=await _f.apply(this,a); if(!r.ok&&ours(raw)) fbErr('http',r.status+' '+url); return r; }
    catch(e){ if(ours(raw)) fbErr('net',(e&&e.message||e)+' '+url); throw e; }
  };
})();
let SEL = new Set(), KB = -1, SEARCH_ROWS = null;
const FOLDS = new Set();

const ACCT_COLOR = { personal:'#4a7fd6', connectblue:'#1c8a4c' };
const AV_COLORS = ['#7a5c48','#4a7fd6','#8a5cb8','#1c8a4c','#c07a2e','#b84a6c','#3a8a8a'];
const avColor = s => AV_COLORS[[...String(s||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
const initials = s => (String(s||'?').match(/\b[A-Za-z]/g)||['?']).slice(0,2).join('').toUpperCase();

/* E71: real avatars, Shortwave-style — Gravatar (people) → sender-domain
   favicon (brands/newsletters) → the colored initials underneath. Initials
   always render first; the image only covers them if a source loads.
   Gravatar needs SubtleCrypto (HTTPS only) — on the plain-http LAN we skip
   straight to favicons. Freemail domains never get a favicon (a Gmail logo
   on every human is worse than initials). */
const AV_URL=new Map();
const FREEMAIL=/(^|\.)(gmail|googlemail|yahoo|outlook|hotmail|icloud|aol|live|me|proton|protonmail)\.(com|net|org|me|ch)$/i;
async function gravatarUrl(em){
  if(AV_URL.has(em)) return AV_URL.get(em);
  let url=null;
  if(crypto?.subtle){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(em));
    url='https://www.gravatar.com/avatar/'+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')+'?d=404&s=80';
  }
  AV_URL.set(em,url); return url;
}
const avImg = em => em?`<img class="avimg" data-em="${esc(em)}" loading="lazy" onerror="avErr(this)">`:'';
function avErr(img){
  const dom=(img.dataset.em||'').split('@')[1]||'';
  if(img.dataset.st!=='f' && dom && !FREEMAIL.test(dom)){
    img.dataset.st='f';
    img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64';
  } else img.remove();
}
function hydrateAvatars(root){
  (root||document).querySelectorAll('img.avimg:not([src])').forEach(async img=>{
    const em=(img.dataset.em||'').trim().toLowerCase(); if(!em) return img.remove();
    const g=await gravatarUrl(em);
    if(g) img.src=g;
    else {   // no HTTPS → straight to the favicon stage
      const dom=em.split('@')[1]||'';
      if(dom&&!FREEMAIL.test(dom)){ img.dataset.st='f';
        img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(dom)+'&sz=64'; }
      else img.remove();
    }
  });
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);
  sfx(/fail|could not|error|refused/i.test(m)?'err':'ack'); }
// Clipboard with the http://gc-host.local fallback (no clipboard API there).
function copyText(s, label){
  const done=()=>toast('Copied '+(label||s.slice(0,40)));
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(s).then(done).catch(()=>fallbackCopy(s,done)); }
  else fallbackCopy(s,done);
}
function fallbackCopy(s,done){
  const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }

}
async function post(url, body, headers){
  // E155: name the two connection-loss shapes plainly. A dropped Cloudflare
  // tunnel either rejects the fetch outright or answers a 5xx HTML page that
  // used to surface as "Unexpected token '<'" — either way Bart needs to know
  // the change did NOT land, and that what he typed is still on screen.
  let r;
  try { r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json',...(headers||{})}, body: JSON.stringify(body) }); }
  catch(e){ throw new Error('connection lost — NOT saved. Your text is still here; retry once the red bar clears'); }
  let out;
  try { out = await r.json(); }
  catch(e){ throw new Error('the server answered '+r.status+' instead of data — NOT saved; retry in a moment'); }
  if (!out.ok) throw Object.assign(new Error(out.error || 'request failed'), {data: out});
  return out;
}

async function loadMailTodos(){

function rebuild(){
  BOARD.theaters=acctIds().map(id=>({id,name:acctLabel(id)}));
  // The server already scoped both payloads; keep the client predicate as a
  // second boundary so a malformed response still cannot cross accounts.
  MAIL=MAIL.filter(x=>x.account===ACCT);
  TODOS=TODOS.filter(x=>x.account===ACCT);
  const OWED = new Set((BOARD.reply_debt||[]).map(r=>r.account+':'+r.thread_id));
  const now = new Date().toISOString();
  // E152: my_day stores Bart's LOCAL date — comparing it against the UTC
  // date made every My Day flag vanish after 5pm Pacific (Bart hit this).
  const today = dOff(0);
  ITEMS = [
    ...MAIL.map(x=>({
      type:'mail', key:'m:'+x.account+':'+x.thread_id, raw:x,
      who:x.who||x.last_from||'', title:x.subject||'(no subject)', snip:x.snippet||'',
      account:x.account, project:x.account, goals:[],
      labels:(x.labels||[]).filter(l=>!l.startsWith('GC/')),
      date:x.last_date, unread:!!x.unread, starred:!!x.starred, pinned:!!x.pinned,
      snoozed:!!(x.snoozed_until && x.snoozed_until>now), wake:x.snoozed_until||null,
      my_day:!!(x.my_day && x.my_day===today),
      attachments:!!x.attachments,
      // E58: bundled mail (newsletters/updates/promos/receipts) categorically
      // can't owe a reply, whatever the sweep said — Bart's ⊘ clicks and the
      // categorizer outrank a stale reply-debt row until the next sweep heals.
      // E217: where Jev (account switched on) or Bart's own correction has
      // judged "respond", that decides; elsewhere the hourly assessor's list.
      needs:(x.cls&&['jev','you'].includes(x.cls.respond_src))
        ? x.cls.respond==='yes' && x.last_direction!=='outbound'
        : OWED.has(x.account+':'+x.thread_id) && (x.category||'people')==='people',
      cls:x.cls||null,
      note:x.note||'',
    })),
    ...TODOS.map(x=>({
      type:'todo', key:'t:'+x.id, raw:x,
      who:'Todo', title:x.text, snip:x.notes||'',
      // A todo belongs to exactly ONE account (server-enforced); a legacy
      // todo without one is Unassigned until an account is picked.
      account:x.account||null, project:x.account||null, goals:[],
      labels:x.labels||[], date:x.due||x.created_at, due:x.due,
      starred:!!x.starred, my_day:!!(x.my_day && x.my_day===today),
      snoozed:!!x.snoozed_active, wake:x.snoozed_until||null,
      priority:x.priority||null,
      threads:x.threads||[],
    })),
  ].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  // Carry fetched thread messages across rebuilds — the poll used to mint
  // fresh item objects, dropping _msgs, so Reply on a thread open >60s got
  // EMPTY recipients (Bart hit this).
  // E93.8: overlay in-flight star intents until the DB catches up (or 10
  // min passes); a poll row that already agrees clears the memory.
  for(const [k,p] of STAR_PENDING){
    const it=ITEMS.find(x=>x.key===k);
    if(!it||Date.now()-p.ts>600e3){ STAR_PENDING.delete(k); continue; }
    if(it.starred===p.v) STAR_PENDING.delete(k);
    else { it.starred=p.v; it.raw.starred=p.v; }
  }
  // E93.5: an email grouped under a todo is SPOKEN FOR — flag it here so
  // every inbox-ish scope can hide it (E60 only hid it in Smart grouping).
  const attached=new Set();
  TODOS.forEach(t=>(t.threads||[]).forEach(th=>attached.add('m:'+th.account+':'+th.thread_id)));
  ITEMS.forEach(i=>{ if(i.type==='mail') i.attached=attached.has(i.key); });
  for(const [k,t] of DROPPED) if(Date.now()-t>600e3) DROPPED.delete(k);
  ITEMS=ITEMS.filter(i=>!DROPPED.has(i.key));
  if (rebuild._prev){
    ITEMS.forEach(i=>{ const p=rebuild._prev.get(i.key);
      if(p&&p._msgs){ i._msgs=p._msgs; i._tlabels=p._tlabels; } });
  }
  rebuild._prev = new Map(ITEMS.map(i=>[i.key,i]));
  renderAcctTabs(); renderRail(); renderList(); if (DOCK) renderDock();   // E171
}

/* ================= list ================= */
// E57 — a real inbox concept. Gmail's INBOX label accumulates for years
// (509 threads, 186 older than 30d), so the Inbox scope shows what's
// RECENT OR STILL ALIVE: last 30 days, unread, needs-reply, starred,
// pinned, noted, or freshly back from snooze. Everything else stays fully
// reachable via All mail, labels, projects, goals, and Gmail search —
// just not in the default view.
const RECENT_DAYS=30;
function inboxLive(i){
  if(i.type==='todo') return true;
  if(i.attached) return false;   // lives under its todo, not in the inbox
  // E108: moved to its project, not here. moved_at (triage, instant) leads;
  // in_inbox follows at the next mail_sync — checking both kills the
  // poll-resurrection race (E93.8 class) without a client overlay.
  if(!i.raw.in_inbox || i.raw.moved_at) return false;
  return (i.raw.age_h||0)<=RECENT_DAYS*24 || i.unread || i.needs || i.starred
      || i.pinned || !!i.note || !!i.raw.snooze_returned;
}
function inScope(i){
  if (!inAcct(i)) return false;          // E171: the account is the context
  if (SCOPE.kind==='snoozed') return !!i.snoozed;
  if (i.snoozed) return false;          // snoozed items live ONLY there
  if (SCOPE.kind==='inbox') return inboxLive(i);
  if (SCOPE.kind==='allmail') return i.type==='mail';
  if (SCOPE.kind==='account') return i.account===SCOPE.id && inboxLive(i);
  if (SCOPE.kind==='project') return SCOPE.id==='__none'
      ? !i.project && inboxLive(i)
      : projTheater(i.project)===SCOPE.id||i.project===SCOPE.id||(i.raw.extra_projects||[]).includes(SCOPE.id);
  if (SCOPE.kind==='goal') return i.goals.includes(SCOPE.id);
  if (SCOPE.kind==='label') return i.labels.includes(SCOPE.id);
  return true;
}
// Today = tasks due (incl. overdue) or in My Day + mail that arrived today
// and matters (people mail, needs-reply, or starred — bulk stays out unless
// it's bundled below the fold).
function isToday(i){
  const today=new Date().toDateString();
  // Today = due TODAY or pulled in via My Day — the overdue backlog stays
  // in the Todos tab, not haunting the day plan (Bart, E72.1).
  if(i.type==='todo') return i.due===dOff(0)||i.my_day;
  if(i.my_day) return true;   // E91: anything pulled into the day
  const arrived=i.date&&new Date(i.date).toDateString()===today;
  return arrived&&!!i.raw.in_inbox&&!i.raw.moved_at&&(i.raw.category==='people'||i.needs||i.starred);
}
const inTab = i => TAB==='all'||(TAB==='mail'&&i.type==='mail')||(TAB==='todos'&&i.type==='todo')
  ||(TAB==='star'&&i.starred)||(TAB==='today'&&isToday(i));
/* E105: Gmail-grammar instant filter — from:/to:/subject:/label:/
   account:/is:/has:/before:/after:, quoted phrases, -negation. Bare terms
   keep the old broad match. The SAME string goes to Gmail verbatim on
   Enter (X-GM-RAW), which speaks this natively — one syntax, two depths. */
let _QC={q:null,terms:[]};
function parseQ(q){
  if(_QC.q===q) return _QC.terms;
  const terms=[]; let m;
  const re=/(-)?(?:(from|to|subject|label|project|account|is|has|before|after|in):)?(?:"([^"]*)"|(\S+))/gi;
  while(m=re.exec(q)){
    const val=(m[3]!==undefined?m[3]:m[4]||'').toLowerCase();
    if(!val) continue;
    terms.push({neg:!!m[1], field:(m[2]||'').toLowerCase()||null, val});
  }
  _QC={q,terms}; return terms;
}
function qMatch(i,t){
  const v=t.val;
  switch(t.field){
    case 'from': return ((i.raw.last_from||i.who||'')+' '+(i.raw.last_from_email||'')).toLowerCase().includes(v);
    case 'to': return ((i.raw.participants||[]).join(' ')).toLowerCase().includes(v);
    case 'subject': return (i.title||'').toLowerCase().includes(v);
    case 'label': return i.labels.some(l=>l.toLowerCase().includes(v));
    case 'project': case 'in': return ((theaterName(i.project)||'')+' '+(i.project||'')).toLowerCase().includes(v);
    case 'account': return (i.account||'').toLowerCase().includes(v);
    case 'is':
      if(v==='unread') return !!i.unread;
      if(v==='read') return i.type==='mail'&&!i.unread;
      if(v==='starred') return !!i.starred;
      if(v==='snoozed') return !!i.snoozed;
      if(v==='todo'||v==='task') return i.type==='todo';
      if(v==='mail'||v==='email') return i.type==='mail';
      if(v==='needs'||v==='unreplied') return !!i.needs;
      if(v==='pinned') return !!i.pinned;
      return false;
    case 'has':
      if(v==='attachment'||v==='attachments') return !!i.attachments;
      if(v==='note') return !!i.note;
      if(v==='label'||v==='labels') return i.labels.length>0;
      if(v==='due') return i.type==='todo'&&!!i.due;
      return false;
    case 'before': case 'after': {
      const d=v.replace(/\//g,'-');
      const iso=String(i.date||'').slice(0,10);
      return iso ? (t.field==='before'? iso<d : iso>d) : false;
    }
    default:
      return (i.who+' '+i.title+' '+i.snip+' '+i.labels.join(' ')+' '+(theaterName(i.project)||'')).toLowerCase().includes(v);
  }
}
const inQ = i => !Q || parseQ(Q).every(t=>{ const m=qMatch(i,t); return t.neg ? !m : m; });

function groupBy(items,keyFn,nameFn){
  const m=new Map(); items.forEach(i=>{ const k=keyFn(i); if(!m.has(k))m.set(k,[]); m.get(k).push(i); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>[nameFn(k),v]);
}
function groupItems(items){
  // E150 (Bart): the Todos tab groups by URGENCY — overdue, due today,
  // coming up, no date — with dues soonest-first inside each. Explicit
  // groupings from the picker still override.
  if (TAB==='todos'&&GROUP==='urgency'){
    const today=dOff(0);
    const sorted=[...items].sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))||(b.raw.id||0)-(a.raw.id||0));
    // NB: not 📅 — that prefix marks mail bundles (DEFAULT_FOLD + archive-all)
    // E151.1: My-Day todos count as TODAY even without a due date.
    const names={'0':'⏰ Overdue','1':'☀ Today','2':'🗓 Coming up','3':'◌ No date'};
    return groupBy(sorted,i=>i.my_day?'1':!i.due?'3':i.due<today?'0':i.due===today?'1':'2',k=>names[k]);
  }
  if (GROUP==='value'){
    // E217: at-a-glance triage — bands, highest value first inside each
    const bands=[['★ High value · 70+',i=>i.cls?.value>=70],['Worth a look · 40–69',i=>i.cls?.value>=40],
                 ['Low · below 40',i=>i.cls?.value!=null],['Not scored',()=>true]];
    const out=bands.map(([n])=>[n,[]]);
    items.forEach(i=>{ const k=bands.findIndex(([,f])=>f(i)); out[k][1].push(i); });
    out.forEach(([,v])=>v.sort((a,b)=>(b.cls?.value??-1)-(a.cls?.value??-1)||String(b.date||'').localeCompare(String(a.date||''))));
    return out.filter(([,v])=>v.length);
  }
  if (GROUP==='account') return groupBy(items,i=>i.account||'todos',k=>k==='todos'?'Todos (no account)':k);
  if (GROUP==='date') return groupBy(items,i=>String(i.date||'').slice(0,10)||'zz',k=>k==='zz'?'Undated':k);
  if (GROUP==='label'){
    const m=new Map(), none=[];
    items.forEach(i=>{ if(!i.labels.length){none.push(i);return;} i.labels.forEach(l=>{ if(!m.has(l))m.set(l,[]); m.get(l).push(i); }); });
    const out=[...m.entries()].sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>['🏷 '+k,v]);
    if(none.length) out.push(['No label',none]);
    return out;
  }
  // E204 — Smart, in Shortwave's order (Bart's screenshots): TODOS (the five
  // most recently active, "Go to all todos →"), STARRED, then the mail by
  // age — and within it, similar bulk mail is ONE ROW at the height of its
  // newest message ("Updates 17 · Chase | Google Alerts | ◉◉◉◉"), a peer of
  // the emails around it rather than a section of its own.
  const todos=[], starred=[], flow=[], groups={};
  // E60: an email attached to an open todo is spoken for — it lives in its todo.
  const attached=new Set();
  items.forEach(i=>{ if(i.type==='todo') i.threads.forEach(t=>attached.add('m:'+t.account+':'+t.thread_id)); });
  items.forEach(i=>{
    if(i.type==='todo') todos.push(i);
    else if(attached.has(i.key)) return;
    else if(i.starred) starred.push(i);          // E86: star outranks category
    else if(GRP_KIND[i.raw.category]) (groups[i.raw.category]=groups[i.raw.category]||[]).push(i);
    else flow.push(i);
  });
  todos.sort((a,b)=>String(todoActivity(b)).localeCompare(String(todoActivity(a))));
  let td=todos;
  if (TAB!=='todos' && td.length>5){ const extra=td.length-5; td=todos.slice(0,5); td._more=extra; }
  const byD=(a,b)=>String(b.date||'').localeCompare(String(a.date||''));
  starred.sort(byD); flow.sort(byD);
  const entries=flow.map(i=>({d:String(i.date||''),row:i}));
  Object.entries(groups).forEach(([cat,rows])=>{
    rows.sort(byD);
    entries.push({d:String(rows[0]?.date||''),row:{grp:cat,rows,date:rows[0]?.date}});
  });
  entries.sort((a,b)=>b.d.localeCompare(a.d));
  const out=[];
  if(td.length) out.push([TAB==='today'?'Due & My Day':'Todos',td]);
  let st=starred;
  if (TAB!=='star' && st.length>10){ const extra=st.length-10; st=starred.slice(0,10); st._more=extra; st._tab='star'; st._word='starred'; }
  if(st.length) out.push(['Starred',st]);
  const age=d=>{ const iso=String(d||'').slice(0,10);
    return iso>=dOff(-7)?'Last 7 days':iso>=dOff(-30)?'Earlier this month':'Older'; };
  const buckets=new Map();
  entries.forEach(e=>{ const b=age(e.d); if(!buckets.has(b)) buckets.set(b,[]); buckets.get(b).push(e.row); });
  buckets.forEach((rows,name)=>{ rows._age=true; out.push([name,rows]); });
  return out;
}
/* E204: the bulk-mail kinds that collapse into one row — names and glyphs
   from Shortwave (Updates ⚑, Promotions 🏷, Newsletters 📰…). */
const GRP_KIND={
  notification:{name:'Updates',icon:'flag'},
  promo:{name:'Promotions',icon:'tag'},
  newsletter:{name:'Newsletters',icon:'news'},
  receipt:{name:'Receipts',icon:'receipt'},
  calendar:{name:'Calendar',icon:'calendar'},
};
const GRP_BULK={newsletter:'📰 Newsletters',notification:'🔔 Updates & notifications',
  receipt:'🧾 Receipts',calendar:'📅 Calendar mail',promo:'🛍 Promos'};   // BUNDLE_NAME's keys
/* One group row. The two senders with the most mail get their NAME (with a
   face); everyone else is just a face — Bart: "I love how it will show the
   name of the most prominent emails within a grouping, and then icons for
   the others". */
function grpRowHtml(g){
  const k=GRP_KIND[g.grp]||{name:g.grp,icon:'label'};
  const by=new Map();
  g.rows.forEach(r=>{ const nm=String(r.who||'').split('<')[0].trim().replace(/"/g,'')||r.raw.last_from_email||'?';
    const e=by.get(nm)||{nm,em:r.raw.last_from_email,n:0,unread:0}; e.n++; if(r.unread) e.unread++; by.set(nm,e); });
  const ranked=[...by.values()].sort((a,b)=>b.unread-a.unread||b.n-a.n);
  const face=e=>`<span class="fav" style="background:${avColor(e.nm)}">${initials(e.nm).slice(0,1)}${avImg(e.em)}</span>`;
  const named=ranked.slice(0,2).map(e=>`<span class="gs">${face(e)}<b>${esc(e.nm)}</b></span>`).join('<span class="gbar"></span>');
  const rest=ranked.slice(2,9).map(e=>`<span title="${esc(e.nm)}">${face(e)}</span>`).join('');
  const unread=g.rows.some(r=>r.unread), open=SPLIT&&SPLIT.cat===g.grp;
  const bulk=esc(GRP_BULK[g.grp]||'');
  return `<div class="grp ${unread?'':'read'} ${open?'open':''}" data-grp="${esc(g.grp)}" onclick="openSplit('${esc(g.grp)}')">
    <span class="gic">${ic(k.icon,'lg')}</span>
    <div class="gb">
      <div class="g1"><span class="gname">${esc(k.name)}</span><span class="gn">${g.rows.length}</span>
        <span class="gw">${fmtDate(g.date)}</span>
        <span class="acts">
          ${actBtn('check','Archive all '+g.rows.length+' in Gmail',`bundleBulk('${bulk}','archive')`)}
          ${actBtn('trash','Delete all — Gmail Trash, recoverable 30d',`bundleTrash('${bulk}')`)}</span></div>
      <div class="g2">${named}${rest?'<span class="gbar"></span>'+rest:''}</div>
    </div></div>`;
}

function renderList(){

/* ------- E102 (#5): drift sentinels — what's quietly going stale.
   Computed live from data already in memory; shows on Home only when
   something is actually drifting. Uncategorized growth tracked against
   a rolling local snapshot. ------- */
/* E159: drift is a section of the brief now, not its own card — this
   returns the lines (and still owns the uncat-history snapshot). */
function driftLines(){
  const L=[];
  const gz=(BOARD.objectives||[]).filter(o=>{const i=o.insights||{};return !(i.mail7d||i.tasks||i.meetings);});
  if(gz.length) L.push({t:`🎯 ${gz.length} goal${gz.length>1?'s':''} with zero activity this week`,
    d:gz.slice(0,3).map(o=>esc(o.statement.slice(0,30))).join(' · '), go:`openOvl('goal','${esc(gz[0].id)}')`});
  const wo=(BOARD.waiting_on||[]).filter(w=>(w.age_days||0)>=7);
  if(wo.length) L.push({t:`⏳ ${wo.length} waiting-on quiet ≥7 days`,
    d:wo.slice(0,3).map(w=>esc(w.who)).join(' · '), go:`document.querySelector('.dk[data-dock=wait]')?.click()`});
  const deals=(BOARD.pipeline||[]).filter(x=>(x.stale_days||0)>=14);
  if(deals.length) L.push({t:`💼 ${deals.length} deal${deals.length>1?'s':''} silent ≥14 days`,
    d:deals.sort((a,b)=>b.stale_days-a.stale_days).slice(0,3).map(x=>esc((x.deal||'').split(' - ')[0].slice(0,22))+` (${x.stale_days}d)`).join(' · '),
    go:`homeAsk('Which stale pipeline deals are worth reviving, and why?')`});
  const un=ITEMS.filter(i=>!i.snoozed&&!i.project&&inboxLive(i)).length;
  let hist={}; try{ hist=JSON.parse(localStorage.getItem('gc2_uncat_hist')||'{}'); }catch(e){}
  const past=Object.entries(hist).filter(([d])=>d<=dOff(-6)).sort().pop();
  const growth=past&&un>past[1]?` — ▲${un-past[1]} vs last week`:'';
  hist[dOff(0)]=un;
  Object.keys(hist).filter(d=>d<dOff(-30)).forEach(d=>delete hist[d]);
  localStorage.setItem('gc2_uncat_hist',JSON.stringify(hist));
  if(un>15||growth) L.push({t:`◌ ${un} uncategorized${growth}`,
    d:'file them, or let the 🧭 suggestions write the rules', go:`setScope('project','__none')`});
  return L;
}

    <div class="plan-theme" style="margin-bottom:0">${esc(p?.theme||'')}${todayItems.length?` · ☀ ${todayItems.length}`:''}${drifts.length?` · 🛰 ${drifts.length}`:''}</div></div>`;
  return `<div class="plan-card brief">

    ${p?`<div class="plan-theme">${esc(p.theme||'')}</div>
    ${(p.must||[]).map((m,i)=>`<div class="plan-must"><b>${i+1}.</b> <span>${esc(m.title||'')}</span>
      <em>${esc(m.why||'')}</em></div>`).join('')}
    ${(p.should||[]).length?`<div class="plan-then">then: ${p.should.map(s=>esc(s.title||'')).join(' · ')}</div>`:''}
    ${(p.wait||[]).length?`<div class="plan-wait">can wait: ${p.wait.map(esc).join(' · ')}</div>`:''}`
    :`<div class="plan-then">no plan yet — ↻ writes one from today's board</div>`}
    </div>
    <div class="bf-col">
    <div class="hc-sec" style="cursor:pointer" onclick="goToday()">☀ due &amp; flagged today</div>
    ${todayItems.slice(0,6).map(tline).join('')||'<div class="hcal-ev">nothing flagged — pull things in with ☀</div>'}
    ${todayItems.length>6?`<div class="hcal-ev" style="cursor:pointer" onclick="goToday()">+${todayItems.length-6} more in Today ⤢</div>`:''}
    </div>
    ${drifts.length?`<div class="bf-col"><div class="hc-sec">🛰 watch</div>${drifts.map(x=>`<div class="hd-line" onclick="event.stopPropagation();${x.go}">
      <span>${x.t}</span><em>${x.d}</em></div>`).join('')}</div>`:''}
  </div>`;
}

async function planSave(){
  const lines=id=>$('#'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const splitWhy=l=>{ const ix=l.indexOf(' — ')>=0?l.indexOf(' — '):l.indexOf(' -- ');
    return ix>0?{title:l.slice(0,ix).trim(),why:l.slice(ix+3).trim()}:{title:l,why:''}; };
  const plan={theme:$('#pe-theme').value.trim(),
    must:lines('pe-must').map(splitWhy),
    should:lines('pe-should').map(t=>({title:t})),
    wait:lines('pe-wait')};
  try { const out=await post('/plan',{plan}); PLAN=out.plan; closeDlg(); renderList(); toast('Plan updated — the brief reads your version'); }
  catch(e){ const st=$('#pe-status'); if(st){ st.textContent=e.message; st.className='status err'; } }
}

let WIT_IX=null;
function witPick(rand){
  const day=Math.floor(Date.now()/864e5);
  if(rand||WIT_IX==null) WIT_IX=rand?Math.floor(Math.random()*WITS.length):day%WITS.length;
  return WITS[WIT_IX];
}
/* E97: card order = priority, saved per browser */
const homeOrder=()=>{ try{ return JSON.parse(localStorage.getItem('gc2_home_order')||'[]'); }catch(e){ return []; } };
const saveHomeOrder=o=>localStorage.setItem('gc2_home_order',JSON.stringify(o));
let _dragPid=null;
function homeDnD(){
  if(window._homeDnD) return; window._homeDnD=true;
  const list=$('#list');
  list.addEventListener('dragstart',e=>{ const c=e.target.closest('.hcard'); if(c){ _dragPid=c.dataset.pid; c.classList.add('dragging'); } });
  list.addEventListener('dragend',e=>{ document.querySelectorAll('.hcard').forEach(c=>c.classList.remove('dragging','dropat')); });
  list.addEventListener('dragover',e=>{ const c=e.target.closest('.hcard'); if(c&&_dragPid&&c.dataset.pid!==_dragPid){ e.preventDefault(); c.classList.add('dropat'); } });
  list.addEventListener('dragleave',e=>{ const c=e.target.closest('.hcard'); if(c) c.classList.remove('dropat'); });
  list.addEventListener('drop',e=>{ const c=e.target.closest('.hcard'); if(!c||!_dragPid) return;
    e.preventDefault();
    const cur=[...document.querySelectorAll('.hcard')].map(x=>x.dataset.pid);
    const from=cur.indexOf(_dragPid), to=cur.indexOf(c.dataset.pid);
    cur.splice(to,0,cur.splice(from,1)[0]);
    saveHomeOrder(cur); _dragPid=null; renderHome();
  });
}
function homeGo(id,tab){ setScope('project',id); TAB=tab; syncTabs(); renderList(); }
function homeOpen(pid,key){ setScope('project',pid); TAB='all'; syncTabs(); renderList(); openItem(key); }
function homeAsk(q){
  if(!q.trim()) return;
  if(DOCK!=='ask'){ DOCK='ask';
    document.querySelectorAll('.dk').forEach(x=>x.classList.toggle('on',x.dataset.dock==='ask'));
    $('#dock').classList.add('open'); renderAsk(); }
  const hi=$('#hask-in'); if(hi) hi.value='';
  const inp=$('#ask-in');
  if(inp){ inp.value=q; askSend(); }
  else toast('Ask panel failed to open — try the ✨ dock button');   // E136: never swallow it
}

/* ------- E95: ⌂ Home — the rollup dashboard (Bart's idea): overall
   stats, then a card per major project (+ Unassigned) with today's
   highlights and previews. Everything computed from data already in
   memory; every number is a link into the scoped view. ------- */
function renderHome(){
  // E100.1 (Bart): the plan lives on Home, not in the inbox
  if(PLAN===undefined){ PLAN=null;
    fetch('/plan').then(r=>r.json()).then(r=>{ PLAN=r.plan||null; if(SCOPE.kind==='home') renderHome(); }).catch(()=>{}); }
  const live=ITEMS.filter(i=>!i.snoozed&&inAcct(i));   // E171: this account
  const mailLive=live.filter(i=>i.type==='mail'&&inboxLive(i));
  const todosOpen=live.filter(i=>i.type==='todo');
  const dueToday=todosOpen.filter(isToday);
  const needs=mailLive.filter(i=>i.needs);
  const unread=mailLive.filter(i=>i.unread);
  const snoozedN=ITEMS.filter(i=>i.snoozed).length;
  const pending=OUTBOX.filter(o=>o.status==='pending').length;
  const allTodayEvs=((BOARD.calendar||[]).find(d=>d.date===dOff(0))||{}).events||[];
  const allTomEvs=((BOARD.calendar||[]).find(d=>d.date===dOff(1))||{}).events||[];
  // E171: an account's Home shows the meetings filed to it; the count of the
  // rest is kept so the day never silently shrinks without saying so.
  const todayEvs=allTodayEvs;   // calendar events belong to no account
  const tomEvs=allTomEvs;
  const evsElsewhere=allTodayEvs.length-todayEvs.length;
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const nextEv=todayEvs.find(e=>e.time>=new Date().toTimeString().slice(0,5))||todayEvs[0];
  const head=`<div class="hgreet"><span class="htrain">🚂</span><div>
      <b>${greet}, Bart</b>
      <span>${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}${nextEv?` · next: ${esc(nextEv.time)} ${esc(nextEv.title.slice(0,40))}`:` · a clear track today`}</span>
    </div><span class="sp" style="flex:1"></span>%%WIT%%</div>`;
  let _ix=0;
  // E137 (Bart: "the stats are stressful"): the hero tiles are gone — the
  // numbers live in ONE calm card at the end of the grid, with yesterday
  // deltas from a rolling local snapshot. Down is green for burden numbers.
  const cur={inbox:mailLive.length, unread:unread.length, needs:needs.length,
    due:dueToday.length, todos:todosOpen.length, snoozed:snoozedN,
    sched:pending, events:todayEvs.length};
  let hist={}; try{ hist=JSON.parse(localStorage.getItem('gc2_stats_hist')||'{}'); }catch(e){}
  hist[dOff(0)]=cur;
  Object.keys(hist).filter(d=>d<dOff(-14)).forEach(d=>delete hist[d]);
  localStorage.setItem('gc2_stats_hist',JSON.stringify(hist));
  const prevKey=Object.keys(hist).filter(d=>d<dOff(0)).sort().pop();
  const prev=prevKey?hist[prevKey]:null;
  const srow=(k,label,go,goodDown=true)=>{
    const v=cur[k], p=prev?prev[k]:null, d=p==null?null:v-p;
    const col=d==null||d===0?'var(--faint)':((goodDown?d<0:d>0)?'var(--green)':'var(--red)');
    return `<div class="hs-row" onclick="event.stopPropagation();${go}"><span class="hs-l">${label}</span>
      <b>${v}</b><span class="hs-d" style="color:${col}">${d==null?'':d===0?'—':(d>0?'▲':'▼')+Math.abs(d)}</span></div>`;
  };
  const statsTile=`<div class="hcard sq hstats" style="animation-delay:${(++_ix)*45}ms">
    <div class="hc-top"><span class="hc-name">📊 The numbers</span>
      <span class="hc-btns"><span style="color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:1px">${prev?'vs yesterday':'first reading'}</span></span></div>
    ${srow('inbox','inbox',"setScope('inbox',null)")}
    ${srow('unread','unread',"setScope('inbox',null)")}
    ${srow('needs','need reply',"setScope('inbox',null)")}
    ${srow('due','due today',"goToday()")}
    ${srow('todos','open todos',"setScope('inbox',null);TAB='todos';syncTabs();renderList()")}
    ${srow('snoozed','snoozed',"setScope('snoozed',null)")}
    ${srow('sched','scheduled',"setScope('outbox',null)")}
    ${srow('events','events today',"openCalPage()",false)}
  </div>`;
  // E137→E159: today's flagged work — due/overdue todos + everything pulled
  // into My Day — now lives INSIDE the brief, not as its own tile.
  const todayItems=live.filter(isToday)
    .sort((a,b)=>(a.type==='todo'?0:1)-(b.type==='todo'?0:1)
      ||String(a.due||'9999').localeCompare(String(b.due||'9999')));
  const tline=i=>`<div class="hrow">
    <em style="cursor:pointer" title="${i.type==='todo'?'Done':'Archive'}" onclick="event.stopPropagation();doneItem('${esc(i.key)}')">${i.type==='todo'?'◯':'✉'}</em>
    <span class="ht" style="cursor:pointer" onclick="event.stopPropagation();openItem('${esc(i.key)}')">${esc(i.title.slice(0,44))}</span>
    <span class="hd">${i.my_day?'☀ ':''}${i.due?esc(String(i.due).slice(5)):''}</span></div>`;
  const [wq,wa]=witPick();
  const wit=`<div class="hwit side" onclick="event.stopPropagation();witPick(true);renderHome()" title="Another one">🎭
    <i>“${esc(wq)}”</i></div>`;
  const evLine=e=>`<div class="hcal-ev"><span>${esc(e.time)}</span> ${esc(e.title.slice(0,44))}</div>`;
  const calCard=`<div class="hcard sq" onclick="openCalPage()" style="animation-delay:0ms">
    <div class="hc-top"><span class="hc-name">📅 Calendar</span>
      <span class="hc-btns"><button title="Full month" onclick="event.stopPropagation();openCalPage()">⤢</button></span></div>
    <div class="hc-sec">today</div>
    ${todayEvs.map(evLine).join('')||'<div class="hcal-ev" style="color:var(--faint)">a clear track</div>'}
    ${tomEvs.length?`<div class="hc-sec">tomorrow</div>${tomEvs.slice(0,5).map(evLine).join('')}`:''}
  </div>`;
  const rowLine=(i,pid)=>`<div class="hrow" data-key="${esc(i.key)}" onclick="event.stopPropagation();homeOpen('${esc(pid)}','${esc(i.key)}')">
      <em>${i.type==='todo'?'✓':'✉'}</em>${i.type==='todo'?'':`<b>${esc((i.who||'').split('<')[0].trim().slice(0,15))}</b>`}
      <span class="ht">${esc(i.title.slice(0,46))}</span><span class="hd">${fmtDate(i.date)}</span></div>`;
  // E159: a card on Home MEANS "this project needs you today" — something
  // due/flagged, mail awaiting you, or a waiting-on gone quiet ≥7 days.
  // Everything else rests in the 😴 quiet strip. Inside a card, "recent
  // mail" is gone: only mail that needs you shows — needs-reply, or unread
  // PEOPLE mail (an unread newsletter neither earns a card nor a row; the
  // ✉ count in the stats line still tells the whole story).
  const card=(id)=>{
    const un=id==='__none';
    const its=live.filter(i=>un?!i.project:(projTheater(i.project)===id||i.project===id));
    const m=its.filter(i=>i.type==='mail'&&inboxLive(i))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const attn=m.filter(x=>x.needs||(x.unread&&x.raw.category==='people'));
    const td=its.filter(i=>i.type==='todo');
    const dueT=td.filter(isToday).slice(0,4);
    const today=its.filter(isToday);
    const stale=un?[]:(BOARD.waiting_on||[]).filter(w=>projTheater(w.project)===id&&(w.age_days||0)>=7);
    if(!today.length&&!attn.length&&!stale.length) return '';
    const goals=un?[]:(BOARD.objectives||[]).filter(o=>o.theater_id===id);
    const progs=goals.map(o=>(PROGRESS['objective:'+o.id]||{}).progress).filter(p=>p!=null);
    const avg=progs.length?Math.round(progs.reduce((a,b)=>a+b,0)/progs.length):null;
    const waitN=un?0:(BOARD.waiting_on||[]).filter(w=>projTheater(w.project)===id).length;
    return `<div class="hcard sq" draggable="true" data-pid="${esc(id)}" style="animation-delay:${(++_ix)*45}ms" onclick="homeGo('${esc(id)}','all')">
      <div class="hc-top"><span class="hc-name">${un?'◌ Unassigned':esc(theaterName(id))}</span>
        ${today.length?`<span class="hc-today">☀ ${today.length} today</span>`:''}
        <span class="hc-btns">
          ${un?'':`<button title="New todo in this project" onclick="event.stopPropagation();newTodoDlg('${esc(id)}')">＋✓</button>`}
          <button title="Compose email" onclick="event.stopPropagation();composeDlg()">✏️</button>
          <button title="Today view of this project" onclick="event.stopPropagation();homeGo('${esc(id)}','today')">☀</button>
          <button title="Full project view" onclick="event.stopPropagation();homeGo('${esc(id)}','all')">⤢</button>
        </span></div>
      <div class="hc-stats">✉ ${m.length}${m.filter(x=>x.unread).length?` <i>(${m.filter(x=>x.unread).length} new)</i>`:''}
        · ✓ ${td.length}${goals.length?` · 🎯 ${goals.length}${avg!=null?` <i>${avg}%</i>`:''}`:''}${waitN?` · ⏳ ${waitN}`:''}</div>
      ${dueT.length?`<div class="hc-sec">due today</div>${dueT.map(r=>rowLine(r,id)).join('')}`:''}
      ${attn.length?`<div class="hc-sec">needs you</div>${attn.slice(0,5).map(r=>rowLine(r,id)).join('')}
        ${attn.length>5?`<div class="hcal-ev" style="color:var(--faint)">+${attn.length-5} more</div>`:''}`:''}
      ${stale.length?`<div class="hc-sec">⏳ waiting, gone quiet</div>${stale.slice(0,3).map(w=>
        `<div class="hrow"><em>⏳</em><span class="ht">${esc(w.who||'')}${w.what?` — ${esc(String(w.what).slice(0,36))}`:''}</span><span class="hd">${w.age_days}d</span></div>`).join('')}`:''}
    </div>`;
  };
  const ths=(BOARD.theaters||[]).map(t=>t.id);
  const rank=id=>{ const its=live.filter(i=>projTheater(i.project)===id||i.project===id);
    return its.filter(isToday).length*1000+its.filter(i=>i.type==='mail'&&i.unread).length*10+its.length/1000; };
  const saved=homeOrder();
  const all=[...ths,'__none'];
  const orderedIds=[...saved.filter(id=>all.includes(id)),
                    ...all.filter(id=>!saved.includes(id)).sort((a,b)=>rank(b)-rank(a))];
  VISIBLE=[];
  // E166 (Bart picked the ranked stream off the feed mockups): Home is a
  // FEED — one ordered read of the day, not a grid to scan. The card grid is
  // still here behind ⊞ for the things a feed cannot do (drag ordering,
  // per-project shape); nothing was thrown away.
  if(HOME_VIEW==='feed') return renderHomeFeed({head,wit,todayItems,tline,todayEvs,tomEvs,
    live,mailLive,todosOpen,needs,unread,dueToday,snoozedN,pending,cur,prev,srow,evsElsewhere});
  const entries=orderedIds.map(id=>({id,html:card(id)}));
  const quiet=entries.filter(e=>!e.html
    &&!(e.id==='__none'&&!live.some(i=>!i.project&&inboxLive(i))));
  const quietStrip=quiet.length?`<div class="hquiet"><span class="hw-k">😴 quiet today</span>
    ${quiet.map(e=>`<span class="chip" onclick="homeGo('${esc(e.id)}','all')">${e.id==='__none'?'◌ Unassigned':esc(theaterName(e.id))}</span>`).join('')}</div>`:'';
  // E179: the cards grid drops the brief tile too; ◎ in the dock holds it.
  $('#list').innerHTML = head.replace('%%WIT%%',homeViewToggle()+wit)
    +`<div class="hask"><span>🔮</span><input id="hask-in" placeholder="Ask Grand Central anything — mail, deals, todos, calendar…"
        onkeydown="if(event.key==='Enter')homeAsk(this.value)"></div>`
    +`<div class="home-grid two">${calCard
      +entries.map(e=>e.html).join('')+quietStrip+statsTile}</div>`
    +`<div class="status" style="text-align:center;padding:8px">a card means it needs you today · drag to reorder · every number is a door 🎈</div>`;
  homeDnD();
}

/* ================= E166: the Today feed =================
   Order is the design: what needs you now, the plan for the day, what is
   already late, who you are waiting on, then the quiet stuff as chips. Every
   row is a door, the same ones the cards opened. */
let HOME_VIEW = localStorage.getItem('gc2_home_view') || 'feed';
/* E169 (Bart: "I don't seem to have a way to get to the new feed"): the
   switch has to live in BOTH views. E166 put it only in the feed's header,
   so anyone whose Home opened as cards had no way out. */
const homeViewToggle = () => `<div class="fd-view">
    <button class="${HOME_VIEW==='feed'?'on':''}" onclick="setHomeView('feed')" title="Feed — one ordered read of the day">☰ Feed</button>
    <button class="${HOME_VIEW==='cards'?'on':''}" onclick="setHomeView('cards')" title="Cards — the project grid, drag to reorder">⊞ Cards</button></div>`;
function setHomeView(v){ HOME_VIEW=v; localStorage.setItem('gc2_home_view',v); renderList(); }
const fdAge = d => { const t=Date.parse(d); return isFinite(t)?Math.max(0,Math.round((Date.now()-t)/864e5)):null; };
// E180: Home's bands are the same header as every other list's groups.
function fdBand(label,count,go,urgent){
  return `<div class="ib-head${urgent?' urgent':''}"><span class="t">${label}</span>
    <span class="sp"></span>${count?`<span class="ct"${go?` onclick="${go}"`:''}>${esc(count)}</span>`:''}</div>`;
}
const fdCard = rows => rows?`<div class="ib-card">${rows}</div>`:'';
const fdMailRow = (i)=>{ VISIBLE.push(i); return rowHtml(i); };
function renderHomeFeed(d){
  const today=dOff(0);
  // 1 — E170 (Bart: "the latest emails should be from my inbox"): the feed
  // opens with what actually arrived, newest first. Week-old reply debt is
  // real but it is not news, so it gets its own band further down.
  const fresh=d.mailLive.filter(i=>(i.raw.category||'people')==='people'&&(i.unread||i.needs||fdAge(i.date)<=2))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const freshShow=fresh.slice(0,15);   // dev #28: more mail on Home (was 6)
  // Replies owed: oldest first, and only the ones that have actually aged —
  // anything still in the fresh band above is not "owed", it is just today.
  const freshKeys=new Set(freshShow.map(i=>i.key));
  const attn=d.mailLive.filter(i=>i.needs&&!freshKeys.has(i.key))
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  const attnShow=attn.slice(0,5);
  // 2 — already late: overdue todos, oldest due first (today's live in the brief).
  const overdue=d.todosOpen.filter(t=>t.due&&t.due<today).sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  // 3 — waiting on other people, quietest first.
  // E197 (#9): this band ignored the account tabs and nothing happened when
  // you clicked a row — it was the only band left reading the board directly.
  const waiting=[...(BOARD.waiting_on||[])].filter(w=>inAcctId(w.project))
    .sort((a,b)=>(b.age_days||0)-(a.age_days||0));
  // 4 — the selected account, using the legacy project-card renderer only
  // as presentation; there is no project/goal navigation behind it.
  const projRows=(BOARD.theaters||[]).filter(t=>t.id===ACCT).map(t=>{
    const its=d.live.filter(i=>projTheater(i.project)===t.id||i.project===t.id);

        <span class="chip" onclick="goTodos()">${d.todosOpen.length} todos</span>

    + `<div class="hask"><span>🔮</span><input id="hask-in" placeholder="Ask Grand Central anything — mail, deals, todos, calendar…"
        onkeydown="if(event.key==='Enter')homeAsk(this.value)"></div>`
    + fdBand('📅 today', `${d.todayEvs.length} meeting${d.todayEvs.length===1?'':'s'}${d.evsElsewhere?` · ${d.evsElsewhere} elsewhere`:''} ⤢`, "openCalPage('time')")
    + `<div class="fd-chips cal-strip" onclick="openCalPage('time')" style="cursor:pointer">${evStrip}</div>`
    + (freshShow.length?fdBand('latest from your inbox', fresh.length>freshShow.length?`${freshShow.length} of ${fresh.length} →`:'', "setScope('inbox',null)")
        + fdCard(freshShow.map(i=>fdMailRow(i)).join('')):'')
    // dev #28 (Bart): "clear buttons to get to the entire inbox"
    + `<div class="fd-go"><button class="btn" onclick="setScope('inbox',null)">📥 Open the whole inbox · ${d.mailLive.length}</button>

    // E179: the brief lives in the ◎ dock now — one line here says where.
    + `<div class="fd-chips" style="padding-top:10px"><span class="chip" onclick="document.querySelector('.dk[data-dock=brief]')?.click()"
        title="Today's brief — the plan, what's due, what's drifting">◎ today's brief${PLAN&&PLAN.theme?` — ${esc(PLAN.theme.slice(0,68))}`:''}</span></div>`
    + (attnShow.length?fdBand('replies owed', attn.length>attnShow.length?`${attnShow.length} of ${attn.length} →`:'', "setScope('inbox',null)", true)

    + (overdue.length?fdBand('already late', overdue.length>5?`${overdue.length} total →`:'', 'goTodos()')
        + fdCard(overdue.slice(0,5).map(rowT).join('')):'')
    + (waiting.length?fdBand('waiting on other people', `${waiting.length} →`, "setScope('inbox',null)")

              onclick="event.stopPropagation();nudge('${esc(w.account||'')}','${esc(w.thread_id)}',this)">Nudge</button>`:''}</div>`;}).join('')):'')
    + fdBand('projects', 'open one →')

        ${p.n?'style="background:var(--blue-soft);color:var(--blue)"':''}>${esc(p.name)}${p.n?` · ${p.n}`:''}</span>`).join('')}
        ${unfiled?`<span class="chip" onclick="homeGo('__none','all')">◌ ${unfiled} unfiled</span>`:''}</div>`
    + fdBand('quiet, unless you want it')

    + `<div class="fd-foot">swept ${esc(String(BOARD.generated_at||'').replace('T',' ').replace('Z',' UTC'))}
        · next sweep ${esc(String(BOARD.next_sweep_at||'').slice(11,16)||'—')} · every number is a door 🎈</div>`
    + `</div>`;
  hydrateAvatars($('#list'));   // E174: the feed carries avatars too
}

/* ================= E204: freshness, the steward badge, grouping =================
   Bart: "I want to make sure that when I am using it, I'm always able to see
   the latest emails. Having an easy way to refresh the emails and make sure I
   can see when it was updated." mail_sync stamps data/mail_sync_status.json
   the moment the accounts are current; /mail carries it; ↻ runs a quick sync
   now (inbox + todo labels only) and the list follows it in. */
let SYNC={}, SYNC_BUSY=false, SEEN_UNREAD=null, NEW_COUNT=0;
function syncAgo(iso){
  const t=Date.parse(iso||''); if(!t) return '';
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<45) return 'just now';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return new Date(t).toLocaleDateString([],{month:'short',day:'numeric'});
}
function renderFresh(){
  const el=$('#fresh'); if(!el) return;
  const busy=SYNC_BUSY||SYNC.running;
  const age=(Date.now()-Date.parse(SYNC.finished_at||0))/60000;
  el.classList.toggle('busy',!!busy);
  el.classList.toggle('stale',!busy&&age>10);
  el.innerHTML=ic('refresh','sm')+`<span class="ft">${busy?'Checking…':SYNC.finished_at?'Updated '+syncAgo(SYNC.finished_at):'Refresh'}</span>`
    +`<span class="fs">${busy?'…':SYNC.finished_at?syncAgo(SYNC.finished_at).replace(' ago',''):''}</span>`;
  el.title=(SYNC.finished_at?`Inbox last synced ${new Date(SYNC.finished_at).toLocaleString()}`
    +(SYNC.ok_accounts!=null?` · ${SYNC.ok_accounts}/${SYNC.accounts} accounts`:'')+' — ':'')+'click to check every account now';
}
setInterval(renderFresh,15000);
async function refreshMail(){
  if(SYNC_BUSY) return;
  SYNC_BUSY=true; renderFresh();
  const before=SYNC.finished_at, t0=Date.now(), unread0=ITEMS.filter(i=>i.type==='mail'&&i.unread).length;
  try {
    await post('/mail/refresh',{});
    while(Date.now()-t0<120e3){
      await new Promise(r=>setTimeout(r,3000));
      await loadMailTodos();
      if(SYNC.finished_at&&SYNC.finished_at!==before&&!SYNC.running) break;
    }
    const d=ITEMS.filter(i=>i.type==='mail'&&i.unread).length-unread0;
    toast(SYNC.finished_at!==before?(d>0?`${d} new — you're up to date`:"You're up to date"):'Still syncing — the list will catch up on its own');
  } catch(e){ toast('Refresh failed — '+e.message); }
  SYNC_BUSY=false; renderFresh();
}
function noteNewMail(){
  const keys=new Set(MAIL.filter(x=>x.unread&&x.in_inbox).map(x=>x.account+':'+x.thread_id));
  if(SEEN_UNREAD){ let n=0; keys.forEach(k=>{ if(!SEEN_UNREAD.has(k)) n++; }); NEW_COUNT+=n; }
  SEEN_UNREAD=keys;
}
/* the steward badge: only the senders who actually mail THIS account */
function stewardHere(){
  if(!ACCT) return [];
  // by the mail account the sender writes to (server-joined), not by project
  return STEWARD.filter(s=>(s.accounts||[]).some(mailAcctInAcct));
}
function renderListHead(){
  renderFresh();
  const b=$('#stw-badge'); if(b){
    const n=SCOPE.kind==='inbox'?stewardHere().length:0;
    b.hidden=!n;
    if(n) { b.innerHTML=`<span class="dot"></span>🤵 ${n}`; b.title=`Inbox steward: ${n} sender${n>1?'s':''} here look like services, not people — review`; }
  }
  const pv=$('#pv-btn'); if(pv){ pv.innerHTML=ic('preview'); pv.classList.toggle('on',!!PREVIEW); }
  const g=$('#group-btn'); if(g){ g.innerHTML=ic('group'); g.classList.toggle('on',GROUP!=='smart'); }
}
function groupMenu(ev){
  ev.stopPropagation();
  const r=ev.currentTarget.getBoundingClientRect();
  const opts=[['smart','Smart — todos, starred, then by date'],['value','Value — highest first'],['account','Account'],['label','Label'],['date','Date'],...(TAB==='todos'?[['urgency','Urgency — overdue, today, later']]:[])];
  ctxOpen(r.right-250,r.bottom+4,'<div style="padding:4px 10px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)">Group by</div>'
    +opts.map(([v,l])=>`<button onclick="ctxClose();GROUP='${v}';const s=$('#group');if(s)s.value='${v}';renderList()">${GROUP===v?'✓ ':'　'}${esc(l)}</button>`).join(''));
}
/* pull down at the top of the list to refresh (phones) */
(function(){
  const L=()=>$('#list'); let y0=null, pulling=false;
  document.addEventListener('touchstart',e=>{ const l=L(); if(!l||!l.contains(e.target)||l.scrollTop>0) return;
    y0=e.touches[0].clientY; pulling=false; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(y0==null) return; const dy=e.touches[0].clientY-y0;
    if(dy>12&&L().scrollTop<=0){ pulling=true; let p=$('#ptr'); if(!p){ p=document.createElement('div'); p.id='ptr'; p.className='ptr'; L().prepend(p); }
      p.style.height=Math.min(56,dy/2)+'px'; p.textContent=dy>110?'Release to check for mail':'Pull to refresh'; } },{passive:true});
  document.addEventListener('touchend',e=>{ if(y0==null) return;
    const dy=(e.changedTouches[0]?.clientY||0)-y0; y0=null; const p=$('#ptr'); if(p) p.remove();
    if(pulling&&dy>110) refreshMail(); pulling=false; },{passive:true});
})();
$('#list').addEventListener('scroll',()=>{ if(NEW_COUNT&&$('#list').scrollTop<60){ NEW_COUNT=0; const p=document.querySelector('.new-pill'); if(p) p.remove(); } },{passive:true});

/* ================= E174: Today, in Inbox's grammar =================
   Bart's reference is Google Inbox (2014-2019). What made it work was not
   the blue: it was that the inbox arrived in TIME BUCKETS, that similar mail
   collapsed into one bundle row you could sweep whole, that reminders sat
   among the mail as equals, and that highlights told you the thing without
   opening it. Grand Central already computes all four — this is that model,
   rendered. */
let TODAY_VIEW = localStorage.getItem('gc2_today_view') || 'inbox';
let IB_PINNED_ONLY = false;
function setTodayView(v){ TODAY_VIEW=v; localStorage.setItem('gc2_today_view',v); renderList(); }
function ibPinnedOnly(){ IB_PINNED_ONLY=!IB_PINNED_ONLY; renderList(); }
const IB_BUNDLES={
  newsletter:{name:'Newsletters', color:'#f4511e', icon:'🗞'},
  notification:{name:'Updates', color:'#f4511e', icon:'⚑'},
  promo:{name:'Promos', color:'#00acc1', icon:'🏷'},
  receipt:{name:'Purchases', color:'#0f9d58', icon:'🧾'},
  calendar:{name:'Calendar', color:'#8e24aa', icon:'📅'},
};
function ibBucket(d){
  const iso=String(d||'').slice(0,10);
  if(!iso) return {k:'9',name:'Earlier'};
  if(iso===dOff(0)) return {k:'0',name:'Today'};
  if(iso===dOff(-1)) return {k:'1',name:'Yesterday'};
  if(iso>=dOff(-7)) return {k:'2',name:'This week'};
  if(iso>=dOff(-30)) return {k:'3',name:'This month'};
  return {k:'9',name:'Earlier'};
}
/* Highlights, from what the board already knows — no new extraction. */
function ibHighlights(i){
  const h=[];
  if(i.type==='todo'){
    if(i.due) h.push(`<span class="h ${i.due<dOff(0)?'due':''}"><b>${i.due<dOff(0)?'Overdue':'Due'}</b> ${esc(new Date(i.due+'T12:00').toLocaleDateString([],{month:'short',day:'numeric'}))}</span>`);
    if(i.raw.recur) h.push(`<span class="h">⟳ ${esc(RECUR_LABEL[i.raw.recur]||'')}</span>`);
    if(i.threads?.length) h.push(`<span class="h">✉ ${i.threads.length} email${i.threads.length>1?'s':''}</span>`);
  } else {
    if(i.attachments) h.push(`<span class="h">📎 attachment</span>`);
    if(i.needs) h.push(`<span class="h due"><b>Reply owed</b> ${fdAge(i.date)??0}d</span>`);
    if(i.raw.snooze_returned) h.push(`<span class="h">⏰ back from snooze</span>`);
  }
  if(i.snip) h.push(`<span class="h ai">✨ ${esc(i.snip.slice(0,130))}</span>`);
  return h.length?`<div class="ib-hl">${h.join('')}</div>`:'';
}
async function pinItem(key){
  const i=findItem(key); if(!i) return;
  if(i.type==='todo'){ starItem(key); return; }   // a todo's ★ is its pin
  const next=!i.pinned;
  try {
    await post('/mail/triage',{action:next?'pin':'unpin',thread_id:i.raw.thread_id,account:i.account});
    i.pinned=i.raw.pinned=next; renderList();
  } catch(e){ toast('Pin failed — '+e.message); }
}
// E175: the Inbox view renders the SAME row as everywhere else.
const ibRow = i => rowHtml(i);
/* E175 (Bart: "I want the Google Inbox style bundling for our bundles… this
   can be applied to tasks, calendar, todos"): a bundle is one row until you
   open it, whatever is inside — mail by category, the day's meetings, or a
   pile of reminders. Opening expands it in place, the way Inbox did. */
let IB_OPEN=new Set();
function ibToggle(k){ IB_OPEN.has(k)?IB_OPEN.delete(k):IB_OPEN.add(k); renderList(); }
function ibBundleRow({key,name,color,icon,count,unread,line,when,sweep,body}){
  const open=IB_OPEN.has(key);
  return `<div class="ib-row" data-bundle="${esc(key)}" data-sweep="${esc(sweep||'')}" onclick="ibToggle('${esc(key)}')">
    <span class="ib-ic glyph" style="color:${color}">${icon}</span>
    <div class="ib-body">
      <div class="ib-l1">
        <span class="ib-bundle" style="color:${color}">${esc(name)}</span>
        ${unread?`<span class="ib-count" style="background:${color}1f;color:${color}">${unread} new</span>`
                :`<span class="ib-count">${count}</span>`}
        <span class="ib-when">${esc(when||'')}${open?' ⌃':' ⌄'}</span>
      </div>
      <div class="ib-senders">${line}</div>
    </div>
    ${sweep?`<span class="ib-pin" title="Sweep this bundle — archives every thread in it"
      onclick="event.stopPropagation();ibSweepBundle('${esc(sweep)}')">✓</span>`:''}
  </div>${open&&body?`<div class="ib-nest">${body}</div>`:''}`;
}
function ibMailBundle(cat,rows,bucket){
  const b=IB_BUNDLES[cat]||{name:cat,color:'#5f6368',icon:'✉'};
  const senders=[...new Set(rows.map(r=>(r.who||'').split('<')[0].trim()).filter(Boolean))];
  const open=IB_OPEN.has(bucket+':'+cat);
  if(open) rows.forEach(r=>VISIBLE.push(r));
  return ibBundleRow({key:bucket+':'+cat, name:b.name, color:b.color, icon:b.icon,
    count:rows.length, unread:rows.filter(r=>r.unread).length,
    line:esc(senders.slice(0,6).join(', '))+(senders.length>6?` +${senders.length-6}`:''),
    when:fmtDate(rows[0]?.date), sweep:cat, body:rows.map(rowHtml).join('')});
}
function ibTodoBundle(rows,bucket){
  const open=IB_OPEN.has(bucket+':todo');
  if(open) rows.forEach(r=>VISIBLE.push(r));
  const late=rows.filter(r=>r.due&&r.due<dOff(0)).length;
  return ibBundleRow({key:bucket+':todo', name:'Reminders', color:'#4285f4', icon:'◉',
    count:rows.length, unread:late,
    line:esc(rows.slice(0,4).map(r=>r.title.slice(0,28)).join(' · '))+(rows.length>4?` +${rows.length-4}`:''),
    when:'', body:rows.map(rowHtml).join('')});
}
function ibCalBundle(iso,bucket){
  const day=(BOARD.calendar||[]).find(d=>d.date===iso);
  const evs=(day?.events||[]);
  if(!evs.length) return '';
  const b=IB_BUNDLES.calendar;
  return ibBundleRow({key:bucket+':cal', name:'Calendar', color:b.color, icon:b.icon,
    count:evs.length, unread:0,
    line:esc(evs.slice(0,4).map(e=>`${e.time} ${e.title.slice(0,22)}`).join(' · '))+(evs.length>4?` +${evs.length-4}`:''),
    when:'', body:evs.map(e=>`<div class="row" onclick="openCalPage('time')">
        <span class="lead todo-ic" style="color:${b.color}">📅</span>
        <div class="body"><div class="l1"><span class="subj todo-title">${esc(e.title)}</span>
          <span class="meta"><span class="when">${esc(e.time||'')}</span></span></div>
          ${e.location?`<div class="l2"><span class="prev">📍 ${esc(e.location)}</span></div>`:''}</div></div>`).join('')});
}
function ibOpenBundle(cat){ GROUP='smart'; TAB='mail'; syncTabs(); Q='category:'+cat; renderList();
  toast('Showing the '+(IB_BUNDLES[cat]?.name||cat)+' bundle'); }
async function ibSweepBundle(cat){
  const rows=ibItems().filter(i=>i.type==='mail'&&(i.raw.category||'people')===cat);
  if(!rows.length) return;
  if(!confirm(`Sweep ${rows.length} ${IB_BUNDLES[cat]?.name||cat} thread(s)? They are archived in Gmail.`)) return;
  for(let at=0; at<rows.length; at+=50){
    await post('/mail/bulk',{action:'archive',items:rows.slice(at,at+50).map(r=>({thread_id:r.raw.thread_id,account:r.account}))});
  }
  toast(`Swept ${rows.length} — archived`); await loadMailTodos(); renderList();
}
async function ibSweepBucket(name){
  const rows=ibBuckets().find(b=>b.name===name)?.items||[];
  const mail=rows.filter(i=>i.type==='mail');
  if(!mail.length){ toast('Nothing to sweep here'); return; }
  if(!confirm(`Sweep ${mail.length} thread(s) in "${name}"? They are archived in Gmail; todos are left alone.`)) return;
  for(let at=0; at<mail.length; at+=50){
    await post('/mail/bulk',{action:'archive',items:mail.slice(at,at+50).map(r=>({thread_id:r.raw.thread_id,account:r.account}))});
  }
  toast(`Swept ${mail.length} — archived`); await loadMailTodos(); renderList();
}
function ibItems(){
  return ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&inQ(i)
    &&(i.type==='todo' ? (i.due||i.my_day||i.starred) : inboxLive(i))
    &&(!IB_PINNED_ONLY||i.pinned));
}
function ibBuckets(){
  const byB=new Map();
  ibItems().forEach(i=>{
    const b=ibBucket(i.type==='todo'?(i.due||String(i.date||'').slice(0,10)):i.date);
    if(!byB.has(b.k)) byB.set(b.k,{k:b.k,name:b.name,items:[]});
    byB.get(b.k).items.push(i);
  });
  return [...byB.values()].sort((a,b)=>a.k.localeCompare(b.k))
    .map(b=>({...b, items:b.items.sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')))}));
}
function renderTodayInbox(){
  VISIBLE=[];
  const buckets=ibBuckets();
  const body=buckets.map(b=>{
    const bundles={}, todos=[], singles=[];
    b.items.forEach(i=>{
      if(i.type==='todo'){ todos.push(i); return; }
      const cat=i.raw.category||'people';
      if(IB_BUNDLES[cat]) (bundles[cat]=bundles[cat]||[]).push(i);
      else { singles.push(i); VISIBLE.push(i); }
    });
    // A handful of reminders read better as rows; a pile reads better bundled.
    const todoRows = todos.length>3 ? ibTodoBundle(todos,b.k)
      : todos.map(i=>{ VISIBLE.push(i); return rowHtml(i); }).join('');
    const rows=(b.k==='0'?ibCalBundle(dOff(0),b.k):'')
      + todoRows
      + singles.map(ibRow).join('')
      + Object.entries(bundles).map(([c,r])=>ibMailBundle(c,r,b.k)).join('');
    if(!rows) return '';
    return `<div class="ib-head"><span class="t">${esc(b.name)}</span><span class="sp"></span>
        <span class="ib-sweep" title="Sweep everything in ${esc(b.name)} — archives the mail, leaves todos"
          onclick="ibSweepBucket('${esc(b.name)}')">✓≡</span></div>
      <div class="ib-card">${rows}</div>`;
  }).join('');
  $('#list').innerHTML = `<div class="ib-wrap">
    <div class="ib-head" style="padding-top:8px">
      <span class="t">${esc(acctName(ACCT))} · ${ibItems().length} item${ibItems().length===1?'':'s'}</span>
      <span class="sp"></span>
      <span class="ib-toggle">
        <button class="${IB_PINNED_ONLY?'on':''}" onclick="ibPinnedOnly()" title="Show only pinned — Inbox's pin switch">📌 Pinned</button>
        <button class="on" title="Inbox layout">▤</button>

/* ================= E177: Todos, bundled =================
   The last list still speaking the old grammar. Urgency IS the bundle here —
   overdue, today, this week, later, no date — each a card row that opens in
   place. Overdue and today start open, because a bundle you must not miss is
   not a bundle you should have to click. */
const TODO_BUNDLES=[
  {k:'over', name:'Overdue',   color:'#db4437', icon:'⏰', open:true,
   test:i=>i.due&&i.due<dOff(0)},
  {k:'today',name:'Today',     color:'#f4b400', icon:'☀', open:true,
   test:i=>i.due===dOff(0)||i.my_day},
  {k:'week', name:'This week', color:'#0f9d58', icon:'🗓', open:false,
   test:i=>i.due&&i.due>dOff(0)&&i.due<=dOff(7)},
  {k:'later',name:'Later',     color:'#4285f4', icon:'📆', open:false,
   test:i=>i.due&&i.due>dOff(7)},
  {k:'none', name:'No date',   color:'#5f6368', icon:'◌', open:false,
   test:i=>!i.due&&!i.my_day},
];
let TODO_SEEDED=false;
function renderTodosInbox(items){
  VISIBLE=[];
  const todos=items.filter(i=>i.type==='todo');
  if(!TODO_SEEDED){   // first paint: the two that matter are already open
    TODO_BUNDLES.filter(b=>b.open).forEach(b=>IB_OPEN.add('todos:'+b.k));
    TODO_SEEDED=true;
  }
  const body=TODO_BUNDLES.map(b=>{
    const rows=todos.filter(b.test)
      .sort((x,y)=>String(x.due||'9999').localeCompare(String(y.due||'9999'))
        ||((({high:0,medium:1,low:2})[x.priority]??3)-(({high:0,medium:1,low:2})[y.priority]??3)));
    if(!rows.length) return '';
    const key='todos:'+b.k;
    if(IB_OPEN.has(key)) rows.forEach(r=>VISIBLE.push(r));
    const starred=rows.filter(r=>r.starred).length;
    return ibBundleRow({key, name:b.name, color:b.color, icon:b.icon,
      count:rows.length, unread:0,
      line:esc(rows.slice(0,4).map(r=>r.title.slice(0,30)).join(' · '))+(rows.length>4?` +${rows.length-4}`:''),
      when:starred?`★ ${starred}`:'', sweep:'', body:rows.map(rowHtml).join('')});
  }).join('');
  const done=todos.filter(i=>i.raw.state==='done').length;
  $('#list').innerHTML = `<div class="ib-wrap">
    <div class="ib-head" style="padding-top:8px">
      <span class="t">${esc(acctName(ACCT))} · ${todos.length} todo${todos.length===1?'':'s'}${done?` · ${done} done recently`:''}</span>
      <span class="sp"></span>
      <span class="ib-toggle">
        <button class="qbtn" onclick="newTodoDlg()" title="New todo">＋</button>
        <button class="on" title="Inbox layout">▤</button>
        <button onclick="setTodayView('list')" title="The plain Grand Central list">☰</button>
      </span></div>
    ${body?`<div class="ib-card">${body}</div>`:'<div class="ib-empty">No todos here — nothing owed.</div>'}
  </div>`;
  hydrateAvatars($('#list'));
}

/* ------- E141: domain-aware projects — the theater's `domains` list has
   driven auto-filing in the mapping engine all along (unambiguous domain →
   this project's catch-all); now it's SETTABLE right on the project page,
   and people on those domains read as partners on their hover cards. ------- */
function domainsHtml(th){
  const t=((REG?.theaters)||[]).find(x=>x.id===th); if(!t) return '';
  const doms=t.domains||[];
  return `<div class="sp-wrap"><div class="sp-head">🌐 domains
      <span class="status" style="text-transform:none;letter-spacing:0;font-weight:400">mail from these auto-files here · their people read as partners</span></div>
    <div class="td-quick">
      ${doms.map(d=>`<span class="chip">${esc(d)} <b style="cursor:pointer" onclick="projDomain('${esc(th)}','${esc(d)}','remove')">×</b></span>`).join('')}
      <input type="text" class="sp-edit" id="pd-in" placeholder="＋ add domain… ⏎" style="border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:var(--input-bg);color:var(--ink);font-size:12px;width:170px"
        onkeydown="if(event.key==='Enter')projDomain('${esc(th)}',this.value,'add')"></div></div>`;
}
async function projDomain(th,dom,action){
  dom=String(dom||'').trim().toLowerCase().replace(/^@/,'');
  if(!dom||!dom.includes('.')){ if(action==='add') toast('That doesn\'t look like a domain'); return; }
  const t=((REG?.theaters)||[]).find(x=>x.id===th); if(!t){ toast('Registry still loading — try again'); return; }
  const doms=new Set((t.domains||[]).map(d=>d.toLowerCase()));
  if(action==='add') doms.add(dom); else doms.delete(dom);
  try {
    await post('/registry',{entity:'theater',action:'update',id:th,fields:{domains:[...doms]}});
    t.domains=[...doms]; renderList();
    toast(action==='add'?'Domain added — its mail auto-files here from the next sweep':'Domain removed');
  } catch(e){ toast('Failed — '+e.message); }
}
/* E141: who is this person to you? Inferred, not hand-curated — your own
   (non-freemail) domains mean colleague; a project's domains mean partner;
   volume means frequent contact. */
const _FREEMAIL=new Set(['gmail.com','googlemail.com','yahoo.com','outlook.com','hotmail.com','live.com','icloud.com','me.com','aol.com','proton.me','protonmail.com','msn.com','comcast.net']);
function personRel(em,threads){
  const dom=(String(em).split('@')[1]||'').toLowerCase();
  if(!dom) return null;
  const mine=new Set(((CONN&&CONN.accounts)||[]).map(a=>(a.user||'').split('@')[1]||'')
    .filter(d=>d&&!_FREEMAIL.has(d)));
  if(mine.has(dom)) return {ic:'🤝',label:'colleague',why:'@'+dom+' — your domain'};
  const ths=((REG?.theaters)||[]).filter(t=>(t.domains||[]).some(d=>d.toLowerCase()===dom));
  if(ths.length) return {ic:'🧩',label:'partner',why:'via '+ths.map(t=>t.name||t.id).join(' + ')};
  if((threads||0)>=8) return {ic:'🔁',label:'frequent contact',why:(threads)+' threads on the board'};
  return null;
}
/* ------- E134: scratch pads — one freeform journal per project/goal,
   beside the structured fields. Cached; autosaves on blur. ------- */
let SCRATCH={};
function scratchHtml(kind,id){
  const key=kind+':'+id;
  if(!(key in SCRATCH)){
    SCRATCH[key]='';
    fetch(`/scratch?kind=${kind}&id=${encodeURIComponent(id)}`).then(r=>r.json())
      .then(r=>{ if(r.ok&&r.text){ SCRATCH[key]=r.text;
        const el=document.querySelector(`textarea.sp-pad[data-sp="${key}"]`);
        if(el&&document.activeElement!==el) el.value=r.text; } }).catch(()=>{});
  }
  return `<div class="sp-wrap"><div class="sp-head">🗒 scratch pad <span class="status" id="sp-status-${kind}"></span></div>
    <textarea class="tp-notes sp-edit sp-pad" data-sp="${esc(key)}" placeholder="freeform thoughts — kept out of the structured stuff…"
      onchange="spSave('${esc(kind)}','${esc(id)}',this.value)">${esc(SCRATCH[key])}</textarea></div>`;
}
async function spSave(kind,id,text){
  SCRATCH[kind+':'+id]=text;
  const st=$('#sp-status-'+kind);
  try {
    await post('/scratch',{kind,id,text});
    if(st){ st.textContent='saved'; setTimeout(()=>{ if(st.textContent==='saved') st.textContent=''; },1500); }
  } catch(e){ if(st){ st.textContent=e.message; st.className='status err'; } else toast('Scratch save failed — '+e.message); }
}

/* ------- E144: the Dev request queue — change orders for the app, written

   and answer back through status + note (episode ids, questions, reasons).

let DEVQ=null, DEV_PAIRING_SET=true, DEV_DRAFT='';

   queue is run unattended, so text in it must provably come from Bart. */
const devCode=()=>{ try{ return localStorage.getItem('gc2_dev_code')||''; }catch(e){ return ''; } };
const devHdr=()=>({'X-GC-Dev-Code':devCode()});
function devUnpaired(e){
  if(!e.data?.pairing_required) return false;

  toast(e.message); renderList(); return true;
}
async function loadDev(){
  try { const r=await fetch('/dev?account='+encodeURIComponent(ACCT)).then(r=>r.json());

async function devPair(){

    await post('/dev',{action:'check'},{'X-GC-Dev-Code':code});
    try{ localStorage.setItem('gc2_dev_code',code); }catch(e){ toast('This browser won’t store the code — private window?'); return; }
    toast('Paired — this device can file dev requests'); renderList();
  } catch(e){ toast(e.data?.pairing_required?'That code didn’t match':'Failed — '+e.message); }
}

async function ctSave(email,fields,drop){

/* ------- E69/E70/E76: day notes — one journal note PER DATE. The Today
   card always edits today; the calendar dock and the month page edit
   whichever day they show. Every editor is a textarea.dn-edit carrying
   data-date; the cache and the per-date debounced autosave are shared. ------- */
let DN_CACHE={};                       // date -> {text, updated_at}
const DN_TIMERS={};                    // date -> debounce timer
const dnStatuses=()=>[...document.querySelectorAll('#dn-status,.dk-dn-status')];
function dnFill(){
  const t=$('#dn-text'); if(t) t.dataset.date=dOff(0);
  document.querySelectorAll('textarea.dn-edit').forEach(el=>{
    if(document.activeElement!==el) el.value=(DN_CACHE[el.dataset.date]||{}).text||'';
  });
  // E150.1 (Bart's screenshot): a once-dragged resize was remembered
  // forever, so a ~350px mostly-empty notes card shoved the Today list
  // down until rows clipped against it. Restore the height CAPPED — drag
  // it taller any time, but each day starts reasonable.
  const h=parseInt(localStorage.getItem('gc2_dn_h'))||0;
  if(t&&h) t.style.height=Math.max(72,Math.min(h,170))+'px';
}
async function loadDayNote(date,force){
  date=date||dOff(0);
  if(DN_CACHE[date]&&!force){ dnFill(); return; }
  try {
    const out=await fetch('/daynote?date='+date).then(r=>r.json());
    if(out.ok){ DN_CACHE[date]={text:out.text||'',updated_at:out.updated_at}; dnFill();
      const st=$('#dn-status');
      if(st&&date===dOff(0)) st.textContent=out.updated_at?('saved '+String(out.updated_at).replace('T',' ').slice(5,16)):''; }
  } catch(e){ dnStatuses().forEach(s=>s.textContent='could not load'); }
}
function dnInput(e){

      dnStatuses().forEach(s=>s.textContent='saved ✓'); dnFill();

// E59: delete a whole group = Gmail Trash, behind an explicit approval
// dialog (not a bare confirm) — E7's delete rules: recoverable 30 days,
// human-only, no purge verb anywhere.
function bundleTrash(name){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  dlg(`<h3>🗑 Delete all of ${esc(name)}?</h3>
    <div class="status" style="margin:4px 0 10px">Moves <b>${items.length} thread(s)</b> to Gmail Trash — recoverable there for 30 days, then Gmail purges them. Grand Central has no purge button by design.</div>
    <div class="foot">
      <button class="btn danger" onclick="closeDlg();doBundleTrash('${esc(name)}')">Delete ${items.length} threads</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
}
async function doBundleTrash(name){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  // E93.4: optimistic — rows vanish NOW, deletes run in the background
  // with live progress (each thread is a real IMAP move server-side).
  const gone=new Set(items.map(i=>i.key));
  items.forEach(i=>DROPPED.set(i.key,Date.now()));
  MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
  rebuild();
  const prog=m=>{ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); };
  let ok=0;
  prog(`🗑 Deleting ${items.length} thread(s) in the background… 0/${items.length}`);
  try {
    for(let at=0; at<items.length; at+=5){
      const out=await post('/mail/bulk',{action:'trash',
        items:items.slice(at,at+5).map(i=>({thread_id:i.raw.thread_id,account:i.account}))});
      ok+=(out.results||[]).filter(r=>r.ok).length;
      prog(`🗑 Deleting ${name}… ${Math.min(at+5,items.length)}/${items.length}`);
    }
    toast(`Deleted ${ok} thread(s) from ${name} — in Gmail Trash 30 days`);
  } catch(e){
    items.forEach(i=>DROPPED.delete(i.key));
    toast(`Delete stopped after ${ok} — ${e.message}; refreshing`); loadMailTodos();
  }
}
// Clear a whole bundle: archive = real Gmail archive (chunked ≤50 per call),
// dismiss = board-only. Two-step via confirm; rows drop locally on success.
function bundleBulk(name, mode){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  // E94.2: in-app confirm (native confirm() gets suppressed)
  dlg(`<h3>${mode==='archive'?'✓ Archive':'⊘ Dismiss'} all of ${esc(name)}?</h3>
    <div class="status" style="margin:4px 0 10px">${mode==='archive'
      ?`Archives <b>${items.length} thread(s)</b> in Gmail — they leave the inbox, recoverable in All Mail.`
      :`Clears <b>${items.length} thread(s)</b> from the board — Gmail untouched.`}</div>
    <div class="foot"><button class="btn" onclick="closeDlg();doBundleBulk('${esc(name)}','${mode}')">${mode==='archive'?'Archive':'Dismiss'} ${items.length}</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
}
async function doBundleBulk(name, mode){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  let ok=0;
  try {
    if(mode==='archive'){
      for(let at=0; at<items.length; at+=50){
        const out=await post('/mail/bulk',{action:'archive',
          items:items.slice(at,at+50).map(i=>({thread_id:i.raw.thread_id,account:i.account}))});
        ok+=out.archived||0;
      }
    } else {
      for(const i of items){ try{ await post('/dismiss',{thread_id:i.raw.thread_id,account:i.account}); ok++; }catch(e){} }
    }
    const gone=new Set(items.map(i=>i.key));
    MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
    rebuild();
    toast(`${mode==='archive'?'Archived':'Dismissed'} ${ok} thread(s) from ${name}`);
  } catch(e){ toast(`Group ${mode} stopped after ${ok} — ${e.message}`); rebuild(); }
}
const BUNDLE_NAME = i => ({newsletter:'📰 Newsletters',notification:'🔔 Updates & notifications',

/* E198: labelling has to cost one gesture or it does not happen. `l` on the
   focused row, or 🏷 on any row — type to filter, ⏎ takes the top match,
   and a name that does not exist yet is offered as "create". */
function labelDlg(key){
  const i=findItem(key); if(!i) return;
  const all=labelUniverse(), mine=new Set(i.labels||[]);
  const render=(q='')=>{
    const hits=all.filter(l=>l.toLowerCase().includes(q.toLowerCase())).slice(0,10);
    const exact=all.some(l=>l.toLowerCase()===q.toLowerCase());
    return hits.map(l=>`<button class="tk-match" onclick="labelPut('${esc(key)}','${esc(l)}',${!mine.has(l)})">
        ${mine.has(l)?'✓':'＋'} <span class="chip lbl" style="${lblStyle(l)}">${esc(l)}</span></button>`).join('')
      + (q&&!exact?`<button class="tk-match" onclick="labelPut('${esc(key)}','${esc(q)}',true)">＋ create <b>${esc(q)}</b></button>`:'');
  };
  dlg(`<h3>🏷 Label</h3>
    <div class="status" style="text-transform:none;letter-spacing:0">${esc((i.title||'').slice(0,64))}</div>
    <input type="text" id="lbl-q" placeholder="type to filter or name a new label… ⏎"
      oninput="document.getElementById('lbl-hits').innerHTML=window._lblRender(this.value)"
      onkeydown="if(event.key==='Enter'){const b=document.querySelector('#lbl-hits .tk-match'); if(b) b.click();}">
    <div id="lbl-hits" style="display:flex;flex-direction:column;gap:3px;margin-top:8px;max-height:260px;overflow:auto">${render()}</div>
    <div class="foot"><button class="btn sec2" onclick="closeDlg()">Done</button></div>`);

async function labelPut(key,label,add){
  const i=findItem(key); if(!i) return;
  try {
    if(i.type==='todo'){
      const next=add?[...new Set([...(i.labels||[]),label])]:(i.labels||[]).filter(l=>l!==label);
      await post('/task',{action:'update',id:i.raw.id,fields:{labels:next}});
      i.labels=i.raw.labels=next;
    } else {
      await post('/mail-action',{action:add?'label-add':'label-remove',thread_id:i.raw.thread_id,account:i.account,label});
      i.labels=add?[...new Set([...(i.labels||[]),label])]:(i.labels||[]).filter(l=>l!==label);
      i.raw.labels=i.labels;
    }
    toast(add?`Labelled ${label}`:`Removed ${label}`);
    renderList(); renderRail(); labelDlg(key);
  } catch(e){ toast('Label failed — '+e.message); }
}

/* E199 (Bart: "maybe put the actions in a menu with a long tap"): a touch
   device never sees the hover tray, so hold a row for half a second and the
   same menu right-click gives opens. The press is cancelled by any movement,
   and the tap that follows the menu is swallowed so the row does not open
   underneath it. */
(function(){
  let timer=null, moved=false, opened=false;
  const start=e=>{
    const row=e.target.closest('[data-key], .ib-row[data-bundle]'); if(!row) return;
    moved=false; opened=false;
    const t=e.touches&&e.touches[0]; if(!t) return;
    const x=t.clientX, y=t.clientY;
    timer=setTimeout(()=>{
      if(moved) return;
      opened=true;
      if(navigator.vibrate) navigator.vibrate(8);
      const key=row.dataset.key;
      if(key){ const i=findItem(key); if(i) ctxOpen(x-20,y+8, i.type==='mail'?mailCtxHtml(i):todoCtxHtml(i)); }
      else { const b=row.dataset.bundle, sw=row.dataset.sweep;
        ctxOpen(x-20,y+8,`<button onclick="ctxClose();ibToggle('${b}')">${IB_OPEN.has(b)?'⌃ Close':'⌄ Open'} this bundle</button>`
          +(sw?`<button onclick="ctxClose();ibSweepBundle('${sw}')">✓ Sweep — archive everything in it</button>`:'')); }
    },480);
  };
  const cancel=()=>{ clearTimeout(timer); timer=null; };
  document.addEventListener('touchstart', start, {passive:true});
  document.addEventListener('touchmove', ()=>{ moved=true; cancel(); }, {passive:true});
  document.addEventListener('touchend', cancel, {passive:true});
  document.addEventListener('touchcancel', cancel, {passive:true});
  // the click that follows a long press belongs to the menu, not the row
  document.addEventListener('click', e=>{ if(opened){ opened=false; e.stopPropagation(); e.preventDefault(); } }, true);
})();
