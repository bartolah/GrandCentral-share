let WIT_IX=null;
const witBy = a => a ? a : '— Grand Central original';
function witCopy(){
  const [q,a]=witPick();
  const txt=`“${q}” ${witBy(a)}`;
  (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Quote copied'),()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Quote copied'); } catch(e){ toast('Could not copy'); } ta.remove(); });
}
function witPick(rand){
  const day=Math.floor(Date.now()/864e5);
  if(rand||WIT_IX==null) WIT_IX=rand?Math.floor(Math.random()*WITS.length):day%WITS.length;
  return WITS[WIT_IX];
}
/* E97: card order = priority, saved per browser */
const homeOrder=()=>{ try{ return JSON.parse(localStorage.getItem('gc2_home_order')||'[]'); }catch(e){ return []; } };
const saveHomeOrder=o=>localStorage.setItem('gc2_home_order',JSON.stringify(o));
let _dragPid=null;
function homeDnD(){
  if(window._homeDnD) return; window._homeDnD=true;
  const list=$('#list');
  list.addEventListener('dragstart',e=>{ const c=e.target.closest('.hcard'); if(c){ _dragPid=c.dataset.pid; c.classList.add('dragging'); } });
  list.addEventListener('dragend',e=>{ document.querySelectorAll('.hcard').forEach(c=>c.classList.remove('dragging','dropat')); });
  list.addEventListener('dragover',e=>{ const c=e.target.closest('.hcard'); if(c&&_dragPid&&c.dataset.pid!==_dragPid){ e.preventDefault(); c.classList.add('dropat'); } });
  list.addEventListener('dragleave',e=>{ const c=e.target.closest('.hcard'); if(c) c.classList.remove('dropat'); });
  list.addEventListener('drop',e=>{ const c=e.target.closest('.hcard'); if(!c||!_dragPid) return;
    e.preventDefault();
    const cur=[...document.querySelectorAll('.hcard')].map(x=>x.dataset.pid);
    const from=cur.indexOf(_dragPid), to=cur.indexOf(c.dataset.pid);
    cur.splice(to,0,cur.splice(from,1)[0]);
    saveHomeOrder(cur); _dragPid=null; renderHome();
  });
}
function homeGo(id,tab){ setScope('project',id); TAB=tab; syncTabs(); renderList(); }
function homeOpen(pid,key){ setScope('project',pid); TAB='all'; syncTabs(); renderList(); openItem(key); }
function homeAsk(q){
  if(!q.trim()) return;
  if(ASK_PROJ){ ASK_PROJ=null; ASK_LOG=[]; ASK_CHAT=null; }   // Home's Ask is never fenced to a project
  if(DOCK!=='ask'){ DOCK='ask';
    document.querySelectorAll('.dk').forEach(x=>x.classList.toggle('on',x.dataset.dock==='ask'));
    $('#dock').classList.add('open'); renderAsk(); }
  const hi=$('#hask-in'); if(hi) hi.value='';
  const inp=$('#ask-in');
  if(inp){ inp.value=q; askSend(); }
  else toast('Ask panel failed to open — try the ✨ dock button');   // E136: never swallow it
}

/* ------- E95: ⌂ Home — the rollup dashboard (Casey's idea): overall
   stats, then a card per major project (+ Unassigned) with today's
   highlights and previews. Everything computed from data already in
   memory; every number is a link into the scoped view. ------- */
function renderHome(){
  // E249: ◫ Day is the default Home layout; Feed and Cards stay one click away
  if(HOME_VIEW==='day') return renderHomeDay();
  // E100.1 (Casey): the plan lives on Home, not in the inbox
  if(PLAN===undefined){ PLAN=null;
    fetch('/plan').then(r=>r.json()).then(r=>{ PLAN=r.plan||null; if(SCOPE.kind==='home') renderHome(); }).catch(()=>{}); }
  const live=ITEMS.filter(i=>!i.snoozed&&inAcct(i));   // E171: this account
  const mailLive=live.filter(i=>i.type==='mail'&&inboxLive(i));
  const todosOpen=live.filter(i=>i.type==='todo');
  const dueToday=todosOpen.filter(isToday);
  const needs=mailLive.filter(i=>i.needs);
  const unread=mailLive.filter(i=>i.unread);
  const snoozedN=ITEMS.filter(i=>i.snoozed).length;
  const pending=OUTBOX.filter(o=>o.status==='pending').length;
  const allTodayEvs=((BOARD.calendar||[]).find(d=>d.date===dOff(0))||{}).events||[];
  const allTomEvs=((BOARD.calendar||[]).find(d=>d.date===dOff(1))||{}).events||[];
  // E171: an account's Home shows the meetings filed to it; the count of the
  // rest is kept so the day never silently shrinks without saying so.
  const todayEvs=allTodayEvs;   // calendar events belong to no account
  const tomEvs=allTomEvs;
  const evsElsewhere=allTodayEvs.length-todayEvs.length;
  const h=new Date().getHours();
  const greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const nextEv=todayEvs.find(e=>e.time>=new Date().toTimeString().slice(0,5))||todayEvs[0];
  const head=`<div class="hgreet"><span class="htrain">🚂</span><div>
      <b>${greet}, Casey</b>
      <span>${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}${nextEv?` · next: ${esc(nextEv.time)} ${esc(nextEv.title.slice(0,40))}`:` · a clear track today`}</span>
    </div><span class="sp" style="flex:1"></span>%%WIT%%</div>`;
  let _ix=0;
  // E137 (Casey: "the stats are stressful"): the hero tiles are gone — the
  // numbers live in ONE calm card at the end of the grid, with yesterday
  // deltas from a rolling local snapshot. Down is green for burden numbers.
  const cur={inbox:mailLive.length, unread:unread.length, needs:needs.length,
    due:dueToday.length, todos:todosOpen.length, snoozed:snoozedN,
    sched:pending, events:todayEvs.length};
  let hist={}; try{ hist=JSON.parse(localStorage.getItem('gc2_stats_hist')||'{}'); }catch(e){}
  hist[dOff(0)]=cur;
  Object.keys(hist).filter(d=>d<dOff(-14)).forEach(d=>delete hist[d]);
  localStorage.setItem('gc2_stats_hist',JSON.stringify(hist));
  const prevKey=Object.keys(hist).filter(d=>d<dOff(0)).sort().pop();
  const prev=prevKey?hist[prevKey]:null;
  const srow=(k,label,go,goodDown=true)=>{
    const v=cur[k], p=prev?prev[k]:null, d=p==null?null:v-p;
    const col=d==null||d===0?'var(--faint)':((goodDown?d<0:d>0)?'var(--green)':'var(--red)');
    return `<div class="hs-row" onclick="event.stopPropagation();${go}"><span class="hs-l">${label}</span>
      <b>${v}</b><span class="hs-d" style="color:${col}">${d==null?'':d===0?'—':(d>0?'▲':'▼')+Math.abs(d)}</span></div>`;
  };
  const statsTile=`<div class="hcard sq hstats" style="animation-delay:${(++_ix)*45}ms">
    <div class="hc-top"><span class="hc-name">📊 The numbers</span>
      <span class="hc-btns"><span style="color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:1px">${prev?'vs yesterday':'first reading'}</span></span></div>
    ${srow('inbox','inbox',"setScope('inbox',null)")}
    ${srow('unread','unread',"setScope('inbox',null)")}
    ${srow('needs','need reply',"setScope('inbox',null)")}
    ${srow('due','due today',"goToday()")}
    ${srow('todos','open todos',"setScope('inbox',null);TAB='todos';syncTabs();renderList()")}
    ${srow('snoozed','snoozed',"setScope('snoozed',null)")}
    ${srow('sched','scheduled',"setScope('outbox',null)")}
    ${srow('events','events today',"openCalPage()",false)}
  </div>`;
  // E137→E159: today's flagged work — due/overdue todos + everything pulled
  // into My Day — now lives INSIDE the brief, not as its own tile.
  const todayItems=live.filter(isToday)
    .sort((a,b)=>(a.type==='todo'?0:1)-(b.type==='todo'?0:1)
      ||String(a.due||'9999').localeCompare(String(b.due||'9999')));
  const tline=i=>`<div class="hrow">
    <em style="cursor:pointer" title="${i.type==='todo'?'Done':'Archive'}" onclick="event.stopPropagation();doneItem('${esc(i.key)}')">${i.type==='todo'?'◯':'✉'}</em>
    <span class="ht" style="cursor:pointer" onclick="event.stopPropagation();openItem('${esc(i.key)}')">${esc(i.title.slice(0,44))}</span>
    <span class="hd">${i.my_day?'☀ ':''}${i.due?esc(String(i.due).slice(5)):''}</span></div>`;
  const [wq,wa]=witPick();
  // Dev #51 (Casey: "copy the insight quotes and also see who wrote them"):
  // the credit shows — a book's line is credited to it, the rest are
  // originals written for Grand Central (E97) — and 📋 copies both. A
  // click elsewhere on the quote still deals another one.
  const wit=`<div class="hwit side" onclick="event.stopPropagation();witPick(true);renderHome()" title="Another one">🎭
    <span class="hw-q"><i>“${esc(wq)}”</i><span class="hw-by">${esc(witBy(wa))}</span></span>
    <button class="hw-copy" title="Copy the quote" onclick="event.stopPropagation();witCopy()">📋</button></div>`;
  const evLine=e=>`<div class="hcal-ev"><span>${esc(e.time)}</span> ${esc(e.title.slice(0,44))}</div>`;
  const calCard=`<div class="hcard sq" onclick="openCalPage()" style="animation-delay:0ms">
    <div class="hc-top"><span class="hc-name">📅 Calendar</span>
      <span class="hc-btns"><button title="Full month" onclick="event.stopPropagation();openCalPage()">⤢</button></span></div>
    <div class="hc-sec">today</div>
    ${todayEvs.map(evLine).join('')||'<div class="hcal-ev" style="color:var(--faint)">a clear track</div>'}
    ${tomEvs.length?`<div class="hc-sec">tomorrow</div>${tomEvs.slice(0,5).map(evLine).join('')}`:''}
  </div>`;
  const rowLine=(i,pid)=>`<div class="hrow" data-key="${esc(i.key)}" onclick="event.stopPropagation();homeOpen('${esc(pid)}','${esc(i.key)}')">
      <em>${i.type==='todo'?'✓':'✉'}</em>${i.type==='todo'?'':`<b>${esc((i.who||'').split('<')[0].trim().slice(0,15))}</b>`}
      <span class="ht">${esc(i.title.slice(0,46))}</span><span class="hd">${fmtDate(i.date)}</span></div>`;
  // E159: a card on Home MEANS "this project needs you today" — something
  // due/flagged, mail awaiting you, or a waiting-on gone quiet ≥7 days.
  // Everything else rests in the 😴 quiet strip. Inside a card, "recent
  // mail" is gone: only mail that needs you shows — needs-reply, or unread
  // PEOPLE mail (an unread newsletter neither earns a card nor a row; the
  // ✉ count in the stats line still tells the whole story).
  const card=(id)=>{
    const un=id==='__none';
    const its=live.filter(i=>un?!i.project:(projTheater(i.project)===id||i.project===id));
    const m=its.filter(i=>i.type==='mail'&&inboxLive(i))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const attn=m.filter(x=>x.needs||(x.unread&&x.raw.category==='people'));
    const td=its.filter(i=>i.type==='todo');
    const dueT=td.filter(isToday).slice(0,4);
    const today=its.filter(isToday);
    const stale=un?[]:(BOARD.waiting_on||[]).filter(w=>projTheater(w.project)===id&&(w.age_days||0)>=7);
    if(!today.length&&!attn.length&&!stale.length) return '';
    const goals=un?[]:(BOARD.objectives||[]).filter(o=>o.theater_id===id);
    const progs=goals.map(o=>(PROGRESS['objective:'+o.id]||{}).progress).filter(p=>p!=null);
    const avg=progs.length?Math.round(progs.reduce((a,b)=>a+b,0)/progs.length):null;
    const waitN=un?0:(BOARD.waiting_on||[]).filter(w=>projTheater(w.project)===id).length;
    return `<div class="hcard sq" draggable="true" data-pid="${esc(id)}" style="animation-delay:${(++_ix)*45}ms" onclick="homeGo('${esc(id)}','all')">
      <div class="hc-top"><span class="hc-name">${un?'◌ Unassigned':esc(theaterName(id))}</span>
        ${today.length?`<span class="hc-today">☀ ${today.length} today</span>`:''}
        <span class="hc-btns">
          ${un?'':`<button title="New todo in this project" onclick="event.stopPropagation();newTodoDlg('${esc(id)}')">＋✓</button>`}
          <button title="Compose email" onclick="event.stopPropagation();composeDlg()">✏️</button>
          <button title="Today view of this project" onclick="event.stopPropagation();homeGo('${esc(id)}','today')">☀</button>
          <button title="Full project view" onclick="event.stopPropagation();homeGo('${esc(id)}','all')">⤢</button>
        </span></div>
      <div class="hc-stats">✉ ${m.length}${m.filter(x=>x.unread).length?` <i>(${m.filter(x=>x.unread).length} new)</i>`:''}
        · ✓ ${td.length}${goals.length?` · 🎯 ${goals.length}${avg!=null?` <i>${avg}%</i>`:''}`:''}${waitN?` · ⏳ ${waitN}`:''}</div>
      ${dueT.length?`<div class="hc-sec">due today</div>${dueT.map(r=>rowLine(r,id)).join('')}`:''}
      ${attn.length?`<div class="hc-sec">needs you</div>${attn.slice(0,5).map(r=>rowLine(r,id)).join('')}
        ${attn.length>5?`<div class="hcal-ev" style="color:var(--faint)">+${attn.length-5} more</div>`:''}`:''}
      ${stale.length?`<div class="hc-sec">⏳ waiting, gone quiet</div>${stale.slice(0,3).map(w=>
        `<div class="hrow"><em>⏳</em><span class="ht">${esc(w.who||'')}${w.what?` — ${esc(String(w.what).slice(0,36))}`:''}</span><span class="hd">${w.age_days}d</span></div>`).join('')}`:''}
    </div>`;
  };
  const ths=(BOARD.theaters||[]).map(t=>t.id);
  const rank=id=>{ const its=live.filter(i=>projTheater(i.project)===id||i.project===id);
    return its.filter(isToday).length*1000+its.filter(i=>i.type==='mail'&&i.unread).length*10+its.length/1000; };
  const saved=homeOrder();
  const all=[...ths,'__none'];
  const orderedIds=[...saved.filter(id=>all.includes(id)),
                    ...all.filter(id=>!saved.includes(id)).sort((a,b)=>rank(b)-rank(a))];
  VISIBLE=[];
  // E166 (Casey picked the ranked stream off the feed mockups): Home is a
  // FEED — one ordered read of the day, not a grid to scan. The card grid is
  // still here behind ⊞ for the things a feed cannot do (drag ordering,
  // per-project shape); nothing was thrown away.
  if(HOME_VIEW==='feed') return renderHomeFeed({head,wit,todayItems,tline,todayEvs,tomEvs,
    live,mailLive,todosOpen,needs,unread,dueToday,snoozedN,pending,cur,prev,srow,evsElsewhere});
  const entries=orderedIds.map(id=>({id,html:card(id)}));
  const quiet=entries.filter(e=>!e.html
    &&!(e.id==='__none'&&!live.some(i=>!i.project&&inboxLive(i))));
  const quietStrip=quiet.length?`<div class="hquiet"><span class="hw-k">😴 quiet today</span>
    ${quiet.map(e=>`<span class="chip" onclick="homeGo('${esc(e.id)}','all')">${e.id==='__none'?'◌ Unassigned':esc(theaterName(e.id))}</span>`).join('')}</div>`:'';
  // E179: the cards grid drops the brief tile too; ◎ in the dock holds it.
  $('#list').innerHTML = head.replace('%%WIT%%',homeViewToggle()+wit)
    +`<div class="hask"><span>🔮</span><input id="hask-in" placeholder="Ask Grand Central anything — mail, deals, todos, calendar…"
        onkeydown="if(event.key==='Enter')homeAsk(this.value)"></div>`
    +`<div class="home-grid two">${calCard
      +entries.map(e=>e.html).join('')+quietStrip+statsTile}</div>`
    +`<div class="status" style="text-align:center;padding:8px">a card means it needs you today · drag to reorder · every number is a door 🎈</div>`;
  homeDnD();
}

/* ================= E166: the Today feed =================
   Order is the design: what needs you now, the plan for the day, what is
   already late, who you are waiting on, then the quiet stuff as chips. Every
   row is a door, the same ones the cards opened. */
// E249 (Casey: "make this design the default for each of the account home
// pages"): a new key, so a Feed/Cards choice saved before ◫ Day existed does
// not hide it; picking Feed or Cards again still sticks.
let HOME_VIEW = localStorage.getItem('gc2_home_view2') || 'day';
/* E169 (Casey: "I don't seem to have a way to get to the new feed"): the
   switch has to live in BOTH views. E166 put it only in the feed's header,
   so anyone whose Home opened as cards had no way out. */
const homeViewToggle = () => `<div class="fd-view">
    <button class="${HOME_VIEW==='day'?'on':''}" onclick="setHomeView('day')" title="Day — the day's note, your top mail and the calendar, side by side">◫ Day</button>
    <button class="${HOME_VIEW==='feed'?'on':''}" onclick="setHomeView('feed')" title="Feed — one ordered read of the day">☰ Feed</button>
    <button class="${HOME_VIEW==='cards'?'on':''}" onclick="setHomeView('cards')" title="Cards — the project grid, drag to reorder">⊞ Cards</button></div>`;
function setHomeView(v){ HOME_VIEW=v; localStorage.setItem('gc2_home_view2',v); renderList(); }
const fdAge = d => { const t=Date.parse(d); return isFinite(t)?Math.max(0,Math.round((Date.now()-t)/864e5)):null; };
// E180: Home's bands are the same header as every other list's groups.
function fdBand(label,count,go,urgent){
  return `<div class="ib-head${urgent?' urgent':''}"><span class="t">${label}</span>
    <span class="sp"></span>${count?`<span class="ct"${go?` onclick="${go}"`:''}>${esc(count)}</span>`:''}</div>`;
}
const fdCard = rows => rows?`<div class="ib-card">${rows}</div>`:'';
const fdMailRow = (i)=>{ VISIBLE.push(i); return rowHtml(i); };
function renderHomeFeed(d){
  const today=dOff(0);
  // 1 — E170 (Casey: "the latest emails should be from my inbox"): the feed
  // opens with what actually arrived, newest first. Week-old reply debt is
  // real but it is not news, so it gets its own band further down.
  const fresh=d.mailLive.filter(i=>(i.raw.category||'people')==='people'&&(i.unread||i.needs||fdAge(i.date)<=2))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const freshShow=fresh.slice(0,15);   // dev #28: more mail on Home (was 6)
  // Replies owed: oldest first, and only the ones that have actually aged —
  // anything still in the fresh band above is not "owed", it is just today.
  const freshKeys=new Set(freshShow.map(i=>i.key));
  const attn=d.mailLive.filter(i=>i.needs&&!freshKeys.has(i.key))
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  const attnShow=attn.slice(0,5);
  // 2 — already late: overdue todos, oldest due first (today's live in the brief).
  const overdue=d.todosOpen.filter(t=>t.due&&t.due<today).sort((a,b)=>String(a.due).localeCompare(String(b.due)));
  // 3 — waiting on other people, quietest first.
  // E197 (#9): this band ignored the account tabs and nothing happened when
  // you clicked a row — it was the only band left reading the board directly.
  const waiting=[...(BOARD.waiting_on||[])].filter(w=>inAcctId(w.project))
    .sort((a,b)=>(b.age_days||0)-(a.age_days||0));
  // 4 — the selected account, using the legacy project-card renderer only
  // as presentation; there is no project/goal navigation behind it.
  const projRows=(BOARD.theaters||[]).filter(t=>t.id===ACCT).map(t=>{
    const its=d.live.filter(i=>projTheater(i.project)===t.id||i.project===t.id);
    const n=its.filter(i=>(i.type==='mail'&&inboxLive(i)&&(i.needs||i.unread))||(i.type==='todo'&&isToday(i))).length;
    return {id:t.id,name:t.name,n,total:its.length};
  }).filter(x=>x.total).sort((a,b)=>b.n-a.n||b.total-a.total);
  const unfiled=d.live.filter(i=>!i.project&&inboxLive(i)).length;
  const stale=(BOARD.pipeline||[]).filter(p=>(p.stale_days||0)>=90).length;
  const nextEv=d.todayEvs.find(e=>e.time>=new Date().toTimeString().slice(0,5));
  const evStrip=d.todayEvs.length
    ? d.todayEvs.slice(0,5).map(e=>`<span class="chip"${e===nextEv?' style="background:var(--blue-soft);color:var(--blue)"':''}>${esc(e.time)} ${esc(e.title.slice(0,26))}</span>`).join('')
      +(d.todayEvs.length>5?`<span class="chip">+${d.todayEvs.length-5}</span>`:'')
    : '<span class="chip">a clear track today</span>';

  const rowT=i=>{ VISIBLE.push(i); return rowHtml(i); };

  $('#list').innerHTML = `<div class="fd-wrap">`
    + d.head.replace('%%WIT%%', homeViewToggle()+d.wit)
    + `<div class="fd-chips" style="padding-top:6px">
        <span class="chip" onclick="setScope('inbox',null)">${d.needs.length} replies owed</span>
        <span class="chip" onclick="setScope('inbox',null)">${d.unread.length} unread</span>
        <span class="chip" onclick="goTodos()">${d.todosOpen.length} todos</span>
        <span class="chip" onclick="goToday()">☀ ${d.todayItems.length} today</span>
        ${d.pending?`<span class="chip" onclick="setScope('outbox',null)">${d.pending} scheduled</span>`:''}
        ${d.snoozedN?`<span class="chip" onclick="setScope('snoozed',null)">${d.snoozedN} snoozed</span>`:''}</div>`
    + `<div class="hask"><span>🔮</span><input id="hask-in" placeholder="Ask Grand Central anything — mail, deals, todos, calendar…"
        onkeydown="if(event.key==='Enter')homeAsk(this.value)"></div>`
    + fdBand('📅 today', `${d.todayEvs.length} meeting${d.todayEvs.length===1?'':'s'}${d.evsElsewhere?` · ${d.evsElsewhere} elsewhere`:''} ⤢`, "openCalPage('time')")
    + `<div class="fd-chips cal-strip" onclick="openCalPage('time')" style="cursor:pointer">${evStrip}</div>`
    + (freshShow.length?fdBand('latest from your inbox', fresh.length>freshShow.length?`${freshShow.length} of ${fresh.length} →`:'', "setScope('inbox',null)")
        + fdCard(freshShow.map(i=>fdMailRow(i)).join('')):'')
    // dev #28 (Casey): "clear buttons to get to the entire inbox"
    + `<div class="fd-go"><button class="btn" onclick="setScope('inbox',null)">📥 Open the whole inbox · ${d.mailLive.length}</button>
        <button class="btn sec2" onclick="setScope('allmail',null)">🗄 All mail · ${MAIL.length}</button></div>`
    // E179: the brief lives in the ◎ dock now — one line here says where.
    + `<div class="fd-chips" style="padding-top:10px"><span class="chip" onclick="document.querySelector('.dk[data-dock=brief]')?.click()"
        title="Today's brief — the plan, what's due, what's drifting">◎ today's brief${PLAN&&PLAN.theme?` — ${esc(PLAN.theme.slice(0,68))}`:''}</span></div>`
    + (attnShow.length?fdBand('replies owed', attn.length>attnShow.length?`${attnShow.length} of ${attn.length} →`:'', "setScope('inbox',null)", true)
        + fdCard(attnShow.map(i=>fdMailRow(i)).join('')):'')
    + (overdue.length?fdBand('already late', overdue.length>5?`${overdue.length} total →`:'', 'goTodos()')
        + fdCard(overdue.slice(0,5).map(rowT).join('')):'')
    + (waiting.length?fdBand('waiting on other people', `${waiting.length} →`, "setScope('inbox',null)")
        + fdCard(waiting.slice(0,4).map(w=>{
            const key=w.account&&w.thread_id?`m:${w.account}:${w.thread_id}`:'';
            return `<div class="fd-flat"${key?` data-key="${esc(key)}" onclick="openItem('${esc(key)}')" style="cursor:pointer"`:''}>
            <em style="font-style:normal;color:var(--faint)">⏳</em>
            <span class="t"><b style="font-weight:600">${esc(w.who||'')}</b>${w.what?` — ${esc(String(w.what).slice(0,70))}`:''}</span>
            ${w.project?`<span class="chip">${esc(theaterName(projTheater(w.project)).slice(0,22))}</span>`:''}
            <span class="chip">quiet ${w.age_days||0}d</span>
            ${w.thread_id?`<button class="qbtn" title="Draft a nudge into Gmail Drafts"
              onclick="event.stopPropagation();nudge('${esc(w.account||'')}','${esc(w.thread_id)}',this)">Nudge</button>`:''}</div>`;}).join('')):'')
    + fdBand('projects', 'open one →')
    + `<div class="fd-chips">${projRows.map(p=>`<span class="chip" onclick="homeGo('${esc(p.id)}','all')"
        ${p.n?'style="background:var(--blue-soft);color:var(--blue)"':''}>${esc(p.name)}${p.n?` · ${p.n}`:''}</span>`).join('')}
        ${unfiled?`<span class="chip" onclick="homeGo('__none','all')">◌ ${unfiled} unfiled</span>`:''}</div>`
    + fdBand('quiet, unless you want it')
    + `<div class="fd-chips">
        ${stale?`<span class="chip" onclick="setScope('home',null)">${stale} deals quiet 90d+</span>`:''}
        <span class="chip" onclick="setScope('wizard',null)">🧙 ${(typeof WIZ!=='undefined'&&WIZ.filter(wizInAcct).length)||0} suggestions</span>
        <span class="chip" onclick="setScope('braindump',null)">💡 braindump</span>
        </div>`
    + fdBand('the numbers', d.prev?'vs yesterday':'first reading')
    + `<div class="hstats" style="padding:0 12px">${d.srow('inbox','inbox',"setScope('inbox',null)")}
        ${d.srow('needs','need reply',"setScope('inbox',null)")}
        ${d.srow('due','due today',"goToday()")}
        ${d.srow('todos','open todos',"goTodos()")}</div>`

function ctxDocFile(inp){

    if(!$('#cx-t').value.trim()) $('#cx-t').value=f.name.replace(/\.(md|markdown|txt)$/i,'').replace(/[_-]+/g,' '); };

  try { await projAct({action:'remove',id,item_id:itemId},'Removed from the project — the item itself is untouched'); projRefresh(id); } catch(e){}
}
async function projTodoDone(id,todoId){
  try { await post('/task',{action:'done',id:todoId}); toast('Todo done'); projRefresh(id); loadMailTodos(); } catch(e){ toast(e.message); }
}
// an item opens where it lives: mail in the reading pane with its own account;
// a todo inside its own account
function projOpenMail(a,tid){ openItem('m:'+a+':'+tid); }
function projOpenTodo(a,id){ leaveProj(); const go=()=>openItem('t:'+id); a===ACCT?go():setAcct(a).then(go); }

// ---- 📁 Add to project, from anywhere (step 3)
// Casey: promote a task, note, calendar entry, contact or email into a
// project. The item doesn't move; the project points at it.
function projItemOf(key){
  const i=findItem(key); if(!i) return null;
  if(i.type==='mail') return {kind:'thread', account:i.account, ref:i.raw.thread_id, title:i.title};
  if(i.type==='todo') return {kind:'todo', account:i.account, ref:String(i.raw.id), title:i.title};
  return null;
}
function projPickKey(ev,key){ const it=projItemOf(key); if(it) projPick(ev,it); }
async function projPick(ev,it,q=''){
  const anchor=ev&&ev.currentTarget&&ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():null;
  const [x,y]=anchor?[anchor.right-290,anchor.bottom+4]:[LASTXY[0]-40,LASTXY[1]+8];
  window._pjItem=it;
  let inMap={};
  try { const r=await fetch('/projects?'+new URLSearchParams({kind:it.kind,account:it.account||'',ref:it.ref}),{cache:'no-store'}).then(r=>r.json());
    if(r.ok){ PROJECTS=r.projects; inMap=r.in||{}; } } catch(e){}
  window._pjIn=inMap;
  const draw=()=>{
    const ql=q.toLowerCase();
    const open=(PROJECTS||[]).filter(p=>p.status==='open'&&(!ql||p.name.toLowerCase().includes(ql)));
    ctxOpen(x,y,`<div class="pj-pick keep">
      <div class="pj-pick-h">Add to project</div>
      <input id="pj-pick-q" class="pj-find" placeholder="Find or create…" value="${esc(q)}"
        onkeydown="if(event.key==='Enter'){const b=document.querySelector('.pj-pick .pj-opt');if(b)b.click();else projPickNew()}">
      ${open.map(p=>{ const on=inMap[p.id]; return `<button class="pj-opt ${on?'on':''}" onclick="ctxClose();projPickToggle(${p.id})">
        ${projDot(p.color,9)}<span>${esc(p.name)}</span><span class="sp"></span>${on?'<b>✓</b>':''}</button>`; }).join('')
        ||`<div class="status" style="padding:4px 8px;text-transform:none;letter-spacing:0">${q?'No project matches':'No projects yet'}</div>`}
      <button class="pj-opt pj-new" onclick="ctxClose();projPickNew()">＋ New project “${esc((q||it.title||'').slice(0,40))}”…</button></div>`);
    const i=$('#pj-pick-q'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);
      i.oninput=()=>{ q=i.value; draw(); }; }
  };
  draw();
}
async function projPickToggle(pid){
  const it=window._pjItem, on=window._pjIn&&window._pjIn[pid], p=projById(pid);
  try {
    if(on) await post('/projects',{action:'remove',id:pid,item_id:on});
    else await post('/projects',{action:'add',id:pid,kind:it.kind,account:it.account,ref:it.ref,title:it.title});
    toast(on?`Removed from ${p?p.name:'the project'}`:`Added to ${p?p.name:'the project'} — it stays where it is`);
    loadProjects(); if(PROJ&&PROJ.view==='page'&&PROJ.id===pid) loadProject(pid);
  } catch(e){ toast(e.message); }
}
function projPickNew(){
  const it=window._pjItem; const q=$('#pj-pick-q')?.value||'';
  window._pjPendingAdd=it;
  projEditDlg();
  setTimeout(()=>{ const n=$('#pj-name'); if(n&&!n.value) n.value=(q||it.title||'').replace(/^(re|fwd?):\s*/i,'').slice(0,80); },40);
}

function homeFetch(key){
  const hit=HOME_DATA[key];
  if(hit && (hit.busy || Date.now()-hit.at<60000)) return hit.data||null;
  HOME_DATA[key]={at:Date.now(), data:hit&&hit.data, busy:true};
  fetch('/home'+(key?'?account='+encodeURIComponent(key):'')).then(r=>r.json()).then(out=>{
    HOME_DATA[key]={at:Date.now(), data:out.ok?out:(hit&&hit.data)||{error:out.error}};
    if(homeShowing(key)) renderList();
  }).catch(e=>{ HOME_DATA[key]={at:Date.now(), data:(hit&&hit.data)||{error:e.message}}; if(homeShowing(key)) renderList(); });
  return hit&&hit.data||null;
}
function homeNote(key, refresh){
  const hit=HOME_NOTE[key];
  if(!refresh && hit && (hit.busy || Date.now()-hit.at<(hit.pending?8000:300000))) return hit;
  HOME_NOTE[key]={...(hit||{}), at:Date.now(), busy:true};
  fetch('/home/note'+(key?'?account='+encodeURIComponent(key):'')+(refresh?(key?'&':'?')+'refresh=1':''))
    .then(r=>r.json()).then(out=>{
      HOME_NOTE[key]={at:Date.now(), note:out.note||null, pending:!!out.pending};
      if(homeShowing(key)) renderList();
      // the note is being written: look again shortly
      if(out.pending) setTimeout(()=>{ if(homeShowing(key)) renderList(); }, 9000);
    }).catch(()=>{ HOME_NOTE[key]={at:Date.now(), note:null, pending:false}; });
  return hit||{};
}
const homeShowing = key => key ? (!HOME_ALL && SCOPE.kind==='home' && HOME_VIEW==='day' && ACCT===key) : HOME_ALL;
const hdayMin = t => { const m=/^(\d{1,2}):(\d{2})$/.exec(t||''); return m?(+m[1])*60+(+m[2]):null; };
const hdayClock = m => { const h=Math.floor(m/60), mm=String(m%60).padStart(2,'0'); return ((h%12)||12)+':'+mm; };
const hdayAgo = iso => { const t=Date.parse(iso||''); if(!isFinite(t)) return '';
  const d=new Date(t); return d.toDateString()===new Date().toDateString()
    ? d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : fmtDate(iso); };
const hdayInit = n => String(n||'?').replace(/[<"].*$/,'').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';
const HDAY_AV=['#3d6fd0','#2f8a60','#a8672a','#b04a64','#6b54c6','#2b7f8f','#8a5a3f'];
const hdayAvBg = n => HDAY_AV[[...String(n||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%HDAY_AV.length];
const hdayVal = v => v==null?'':`<span class="hday-v ${v>=70?'hi':v>=40?'mid':'lo'}" title="Value score">${v}</span>`;
function hdayOpenMail(a, tid){
  const go=()=>openItem('m:'+a+':'+tid);
  if(HOME_ALL){ setAcct(a).then(go); return; }   // opening happens inside its own account
  go();
}
function hdayGo(a, where){
  const go=()=>{ if(where==='inbox') setScope('inbox',null);
    else if(where==='todos') goTodos();
    else if(where==='cal') openCalPage(); };
  if(HOME_ALL){ setAcct(a).then(go); return; }
  go();
}
function hdayOpenTodo(a, id){
  if(HOME_ALL){ setAcct(a).then(()=>openItem('t:'+id)); return; }
  openItem('t:'+id);
}

function hdayMailBlock(s){
  const a=esc(s.account), t=homeTab(s.account), nNeed=s.top.length+s.follows.length;
  const tabs=`<div class="hday-tabs" role="tablist">
      <button role="tab" aria-selected="${t==='recent'}" class="${t==='recent'?'on':''}" onclick="homeSetTab('${a}','recent')">Recent</button>
      <button role="tab" aria-selected="${t==='needs'}" class="${t==='needs'?'on':''}" onclick="homeSetTab('${a}','needs')">Needs You${nNeed?` <span class="n">${nNeed}</span>`:''}</button>
      <span class="sp"></span><a onclick="hdayGo('${a}','inbox')">Inbox</a></div>`;
  if(t==='recent'){
    const ib=s.inbox||[];
    return tabs+(ib.length?ib.map(e=>e.bundle?hdayBundleRow(e):hdayInboxRow(e)).join(''):'<div class="hday-none">Nothing in the inbox.</div>');

  return tabs+`<div class="hday-sub"><span>Top emails</span></div>

    ${s.follows.length?s.follows.map(hdayFollowRow).join(''):'<div class="hday-none">Nothing waiting on you here.</div>'}`;
}
// Today's events, each with the account its calendar belongs to
function hdayEvents(calAcct){
  const evs=((BOARD.calendar||[]).find(d=>d.date===dOff(0))||{}).events||[];
  return evs.map(e=>({...e, account:(calAcct||{})[e.cal]||null}));
}
function hdayClashes(evs){
  const t=evs.map(e=>{ const s=hdayMin(e.time); if(s==null) return null;
    const en=hdayMin(e.end); return {s, e:en&&en>s?en:s+30, ev:e}; }).filter(Boolean).sort((a,b)=>a.s-b.s);
  const out=[];
  t.forEach((a,i)=>{ for(const b of t.slice(i+1)){ if(b.s>=a.e) break; out.push([a.ev,b.ev]); } });
  return out;
}
// The day as blocks. mine: null = every account (colour each), else only
// that account's events carry titles; the rest are grey "busy" blocks.
function hdayTimeline(evs, mine){
  const PX=52;
  const timed=evs.map(e=>{ const s=hdayMin(e.time); if(s==null) return null;
    const en=hdayMin(e.end); return {s, e:en&&en>s?en:s+30, ev:e}; }).filter(Boolean).sort((a,b)=>a.s-b.s||b.e-a.e);
  const nowM=new Date().getHours()*60+new Date().getMinutes();
  const h0=Math.min(8, ...timed.map(x=>Math.floor(x.s/60)));
  const h1=Math.max(19, ...timed.map(x=>Math.ceil(x.e/60)));
  // side-by-side lanes inside each run of overlapping events
  let run=[], runEnd=-1; const runs=[];
  timed.forEach(x=>{ if(x.s>=runEnd && run.length){ runs.push(run); run=[]; } run.push(x); runEnd=Math.max(runEnd,x.e); });
  if(run.length) runs.push(run);
  runs.forEach(r=>{ const lanes=[]; r.forEach(x=>{ let l=lanes.findIndex(end=>end<=x.s); if(l<0){ l=lanes.length; lanes.push(0); } lanes[l]=x.e; x.lane=l; }); r.forEach(x=>{ x.lanes=lanes.length; }); });
  const top=m=>(m-h0*60)/60*PX;
  let html='';
  for(let h=h0; h<=h1; h++) html+=`<div class="hday-hr" style="top:${top(h*60)}px"><span>${((h%12)||12)}${h<12?' AM':' PM'}</span><i></i></div>`;
  timed.forEach(x=>{
    const e=x.ev, own=!mine||e.account===mine, col=own?(e.account?acctColor(e.account):'var(--muted)'):'var(--line)';
    const w=100/x.lanes, left=`calc(${x.lane*w}% + ${x.lane?3:0}px)`, width=`calc(${w}% - ${x.lanes>1?3:0}px)`;
    const tint=own?`color-mix(in srgb, ${col} 15%, transparent)`:'color-mix(in srgb, var(--line) 45%, transparent)';
    html+= own
      ? `<div class="hday-ev" style="top:${top(x.s)+1}px;height:${Math.max(18,top(x.e)-top(x.s)-2)}px;left:${left};width:${width};border-color:${col};background:${tint}" title="${esc(e.title)}${e.location?' · '+esc(e.location):''}" onclick="openCalPage()">
          <b>${esc(e.title)}</b><span>${esc(hdayClock(x.s))}${e.end?' – '+esc(hdayClock(x.e)):''}</span></div>`
      : `<div class="hday-ev other" style="top:${top(x.s)+1}px;height:${Math.max(14,top(x.e)-top(x.s)-2)}px;left:${left};width:${width};border-color:${col};background:${tint}" title="Busy in another account" aria-label="Busy in another account"></div>`;
  });
  if(nowM>=h0*60 && nowM<=h1*60) html+=`<div class="hday-now" style="top:${top(nowM)-4}px"><i></i><i></i></div>`;
  return `<div class="hday-tl" style="height:${top(h1*60)}px">${html}</div>`;
}
function hdayRight(sections, evs, mine){
  const due=[].concat(...sections.map(s=>s.due));
  const overdue=sections.reduce((n,s)=>n+s.counts.overdue,0);
  const byAcct=sections.filter(s=>s.counts.overdue).map(s=>`${acctLabel(s.account)} ${s.counts.overdue}`).join(', ');
  const oldest=sections.map(s=>s.overdue_oldest).filter(Boolean).sort()[0];
  const allDay=evs.filter(e=>hdayMin(e.time)==null && (!mine||e.account===mine));
  const todoRow=t=> HOME_ALL
    ? `<div class="hday-todo" onclick="hdayOpenTodo('${esc(t.account)}',${+t.id})"><span class="hday-dot" style="background:${acctColor(t.account)}"></span>
        <span class="x">${esc(t.text)}</span><span class="a">${esc(acctLabel(t.account))}</span></div>`
    : `<label class="hday-todo"><input type="checkbox" onclick="event.stopPropagation();doneItem('t:${+t.id}')" aria-label="Mark done: ${esc(t.text)}">
        <span class="x" onclick="event.preventDefault();openItem('t:${+t.id}')">${esc(t.text)}</span></label>`;
  const clash=hdayClashes(evs).filter(([a,b])=>!mine||a.account===mine||b.account===mine);
  const clashLine=clash.slice(0,2).map(([a,b])=>{
    const nm=e=>(!mine||e.account===mine)?`${esc(hdayClock(hdayMin(e.time)))} ${esc(e.title)}${!mine&&e.account?` (${esc(acctLabel(e.account))})`:''}`:'a meeting in another account';
    return `${nm(a)} overlaps ${nm(b)}.`; }).join(' ');
  const legend=mine
    ? `<span><span class="hday-dot" style="background:${acctColor(mine)}"></span>${esc(acctLabel(mine))}</span><span><span class="hday-dot" style="background:var(--line)"></span>Busy in another account</span>`
    : [...new Set(evs.map(e=>e.account).filter(Boolean))].map(a=>`<span><span class="hday-dot" style="background:${acctColor(a)}"></span>${esc(acctLabel(a))}</span>`).join('');
  const meetings=evs.filter(e=>!mine||e.account===mine).length;
  return `<div class="hday-right">
    <div class="rtop"><b>Today${meetings?` · ${meetings} ${meetings===1?'meeting':'meetings'}`:''}</b><a onclick="openCalPage()">Open calendar</a></div>
    ${legend?`<div class="hday-legend">${legend}</div>`:''}
    <div class="hday-cal">
      <div class="hday-sub" style="padding:0 2px 4px"><span>Todos due today · ${due.length}</span>${HOME_ALL?'':`<a onclick="goTodos()">All todos</a>`}</div>
      ${due.length?due.map(todoRow).join(''):'<div class="hday-none" style="padding:4px 2px">Nothing due today.</div>'}
      ${overdue?`<div class="hday-over" onclick="${HOME_ALL?`hdayGo('${esc(sections.find(s=>s.counts.overdue).account)}','todos')`:'goTodos()'}">
        <span><b>${overdue} overdue ${overdue===1?'todo':'todos'}</b><span class="m"> · ${HOME_ALL?esc(byAcct):oldest?'oldest from '+esc(fmtDate(oldest)):''}</span></span><span>›</span></div>`:'<div style="height:12px"></div>'}
      ${allDay.length?`<div class="hday-allday">${allDay.map(e=>`<span style="border-left-color:${e.account?acctColor(e.account):'var(--line)'}">${esc(e.title)}</span>`).join('')}</div>`:''}
      ${hdayTimeline(evs, mine)}
      ${clashLine?`<div class="hday-clash">${clashLine}</div>`:''}
    </div></div>`;
}
function hdayHead(evs, mine, toggle){
  const h=new Date().getHours(), greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const nowM=h*60+new Date().getMinutes();
  const timed=evs.map(e=>({e, s:hdayMin(e.time), en:hdayMin(e.end)})).filter(x=>x.s!=null);
  const own=x=>!mine||x.e.account===mine;
  const next=timed.find(x=>own(x)&&x.s>=nowM);
  const cur=timed.find(x=>x.s<=nowM&&nowM<(x.en&&x.en>x.s?x.en:x.s+30));
  const curLine=cur?(own(cur)?`Now: ${esc(cur.e.title)}${cur.e.location?' · '+esc(cur.e.location.slice(0,40)):''}`
    :`Now: busy in another account${cur.en?' until '+esc(hdayClock(cur.en)):''}`):'';
  const [wq,wa]=witPick();
  const wit=`<div class="hwit side" onclick="event.stopPropagation();witPick(true);renderList()" title="Another one">🎭
    <span class="hw-q"><i>“${esc(wq)}”</i><span class="hw-by">${esc(witBy(wa))}</span></span>
    <button class="hw-copy" title="Copy the quote" onclick="event.stopPropagation();witCopy()">📋</button></div>`;
  return `<div class="hgreet"><span class="htrain">🚂</span><div>
      <b>${greet}, Casey</b>
      <span class="hg-sub">${mine?esc(acctLabel(mine))+' · ':''}${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}${next?` · next: ${esc(next.e.time)} ${esc(next.e.title.slice(0,40))}`:' · a clear track'}</span>
      ${curLine?`<span class="hg-sub">${curLine}</span>`:''}
    </div><span class="sp" style="flex:1"></span>${toggle||''}${wit}</div>`;
}

/* ================= E204: freshness, the steward badge, grouping =================
   Casey: "I want to make sure that when I am using it, I'm always able to see
   the latest emails. Having an easy way to refresh the emails and make sure I
   can see when it was updated." mail_sync stamps data/mail_sync_status.json
   the moment the accounts are current; /mail carries it; ↻ runs a quick sync
   now (inbox + todo labels only) and the list follows it in. */
let SYNC={}, SYNC_BUSY=false, SEEN_UNREAD=null, NEW_COUNT=0;
function syncAgo(iso){
  const t=Date.parse(iso||''); if(!t) return '';
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<45) return 'just now';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return new Date(t).toLocaleDateString([],{month:'short',day:'numeric'});
}
function renderFresh(){
  const el=$('#fresh'); if(!el) return;
  const busy=SYNC_BUSY||SYNC.running;
  const age=(Date.now()-Date.parse(SYNC.finished_at||0))/60000;
  el.classList.toggle('busy',!!busy);
  el.classList.toggle('stale',!busy&&age>10);
  el.innerHTML=ic('refresh','sm')+`<span class="ft">${busy?'Checking…':SYNC.finished_at?'Updated '+syncAgo(SYNC.finished_at):'Refresh'}</span>`
    +`<span class="fs">${busy?'…':SYNC.finished_at?syncAgo(SYNC.finished_at).replace(' ago',''):''}</span>`;
  el.title=(SYNC.finished_at?`Inbox last synced ${new Date(SYNC.finished_at).toLocaleString()}`
    +(SYNC.ok_accounts!=null?` · ${SYNC.ok_accounts}/${SYNC.accounts} accounts`:'')+' — ':'')+'click to check every account now';
}
setInterval(renderFresh,15000);
// E260: requests from the Claude desktop app waiting for Casey. Count only;
// the request itself is read and approved in Settings → Agents.
async function loadApprovals(){
  try{
    const d=await (await fetch('/agent/proposals?status=pending',{cache:'no-store'})).json();
    const n=(d&&d.ok&&d.proposals)?d.proposals.length:0;
    const b=$('#appr-btn'); if(!b) return;
    b.hidden=!n; $('#appr-n').textContent=n>1?String(n):'';
  }catch(e){}
}
async function refreshMail(){
  if(SYNC_BUSY) return;
  SYNC_BUSY=true; renderFresh();
  const before=SYNC.finished_at, t0=Date.now(), unread0=ITEMS.filter(i=>i.type==='mail'&&i.unread).length;
  try {
    await post('/mail/refresh',{});
    while(Date.now()-t0<120e3){
      await new Promise(r=>setTimeout(r,3000));
      await loadMailTodos();
      if(SYNC.finished_at&&SYNC.finished_at!==before&&!SYNC.running) break;
    }
    const d=ITEMS.filter(i=>i.type==='mail'&&i.unread).length-unread0;
    toast(SYNC.finished_at!==before?(d>0?`${d} new — you're up to date`:"You're up to date"):'Still syncing — the list will catch up on its own');
  } catch(e){ toast('Refresh failed — '+e.message); }
  SYNC_BUSY=false; renderFresh();
}
function noteNewMail(){
  const keys=new Set(MAIL.filter(x=>x.unread&&x.in_inbox).map(x=>x.account+':'+x.thread_id));
  if(SEEN_UNREAD){ let n=0; keys.forEach(k=>{ if(!SEEN_UNREAD.has(k)) n++; }); NEW_COUNT+=n; }
  SEEN_UNREAD=keys;
}

function groupMenu(ev){

/* ================= E174: Today, in Inbox's grammar =================
   Casey's reference is Google Inbox (2014-2019). What made it work was not
   the blue: it was that the inbox arrived in TIME BUCKETS, that similar mail
   collapsed into one bundle row you could sweep whole, that reminders sat
   among the mail as equals, and that highlights told you the thing without
   opening it. Grand Central already computes all four — this is that model,
   rendered. */
let TODAY_VIEW = localStorage.getItem('gc2_today_view') || 'inbox';
function setTodayView(v){ TODAY_VIEW=v; localStorage.setItem('gc2_today_view',v); renderList(); }
const IB_BUNDLES={
  newsletter:{name:'Newsletters', color:'#f4511e', icon:'🗞'},
  notification:{name:'Updates', color:'#f4511e', icon:'⚑'},
  promo:{name:'Promos', color:'#00acc1', icon:'🏷'},
  receipt:{name:'Purchases', color:'#0f9d58', icon:'🧾'},
  calendar:{name:'Calendar', color:'#8e24aa', icon:'📅'},
};
function ibBucket(d){
  const iso=String(d||'').slice(0,10);
  if(!iso) return {k:'9',name:'Earlier'};
  if(iso===dOff(0)) return {k:'0',name:'Today'};
  if(iso===dOff(-1)) return {k:'1',name:'Yesterday'};
  if(iso>=dOff(-7)) return {k:'2',name:'This week'};
  if(iso>=dOff(-30)) return {k:'3',name:'This month'};
  return {k:'9',name:'Earlier'};
}
/* Highlights, from what the board already knows — no new extraction. */
function ibHighlights(i){

    if(i.raw.recur) h.push(`<span class="h">⟳ ${esc(RECUR_LABEL[i.raw.recur]||'')}</span>`);
    if(i.threads?.length) h.push(`<span class="h">✉ ${i.threads.length} email${i.threads.length>1?'s':''}</span>`);

}
// E175: the Inbox view renders the SAME row as everywhere else.
const ibRow = i => rowHtml(i);
/* E175 (Casey: "I want the Google Inbox style bundling for our bundles… this
   can be applied to tasks, calendar, todos"): a bundle is one row until you
   open it, whatever is inside — mail by category, the day's meetings, or a
   pile of reminders. Opening expands it in place, the way Inbox did. */
let IB_OPEN=new Set();
function ibToggle(k){ IB_OPEN.has(k)?IB_OPEN.delete(k):IB_OPEN.add(k); renderList(); }
function ibBundleRow({key,name,color,icon,count,unread,line,when,sweep,body}){
  const open=IB_OPEN.has(key);
  return `<div class="ib-row" data-bundle="${esc(key)}" data-sweep="${esc(sweep||'')}" onclick="ibToggle('${esc(key)}')">
    <span class="ib-ic glyph" style="color:${color}">${icon}</span>
    <div class="ib-body">
      <div class="ib-l1">
        <span class="ib-bundle" style="color:${color}">${esc(name)}</span>
        ${unread?`<span class="ib-count" style="background:${color}1f;color:${color}">${unread} new</span>`
                :`<span class="ib-count">${count}</span>`}
        <span class="ib-when">${esc(when||'')}${open?' ⌃':' ⌄'}</span>
      </div>
      <div class="ib-senders">${line}</div>
    </div>
    ${sweep?`<span class="ib-pin" title="Sweep this bundle — archives every thread in it"
      onclick="event.stopPropagation();ibSweepBundle('${esc(sweep)}')">✓</span>`:''}
  </div>${open&&body?`<div class="ib-nest">${body}</div>`:''}`;
}
function ibMailBundle(cat,rows,bucket){
  const b=IB_BUNDLES[cat]||{name:cat,color:'#5f6368',icon:'✉'};
  const senders=[...new Set(rows.map(r=>(r.who||'').split('<')[0].trim()).filter(Boolean))];
  const open=IB_OPEN.has(bucket+':'+cat);
  if(open) rows.forEach(r=>VISIBLE.push(r));
  return ibBundleRow({key:bucket+':'+cat, name:b.name, color:b.color, icon:b.icon,
    count:rows.length, unread:rows.filter(r=>r.unread).length,
    line:esc(senders.slice(0,6).join(', '))+(senders.length>6?` +${senders.length-6}`:''),
    when:fmtDate(rows[0]?.date), sweep:cat, body:rows.map(rowHtml).join('')});
}
function ibTodoBundle(rows,bucket){
  const open=IB_OPEN.has(bucket+':todo');
  if(open) rows.forEach(r=>VISIBLE.push(r));
  const late=rows.filter(r=>r.due&&r.due<dOff(0)).length;
  return ibBundleRow({key:bucket+':todo', name:'Reminders', color:'#4285f4', icon:'◉',
    count:rows.length, unread:late,
    line:esc(rows.slice(0,4).map(r=>r.title.slice(0,28)).join(' · '))+(rows.length>4?` +${rows.length-4}`:''),
    when:'', body:rows.map(rowHtml).join('')});
}
function ibCalBundle(iso,bucket){
  const day=(BOARD.calendar||[]).find(d=>d.date===iso);
  const evs=(day?.events||[]);
  if(!evs.length) return '';
  const b=IB_BUNDLES.calendar;
  return ibBundleRow({key:bucket+':cal', name:'Calendar', color:b.color, icon:b.icon,
    count:evs.length, unread:0,
    line:esc(evs.slice(0,4).map(e=>`${e.time} ${e.title.slice(0,22)}`).join(' · '))+(evs.length>4?` +${evs.length-4}`:''),
    when:'', body:evs.map(e=>`<div class="row" onclick="openCalPage('time')">

}

async function ibSweepBundle(cat){
  const rows=ibItems().filter(i=>i.type==='mail'&&(i.raw.category||'people')===cat);
  if(!rows.length) return;
  if(!confirm(`Sweep ${rows.length} ${IB_BUNDLES[cat]?.name||cat} thread(s)? They are archived in Gmail.`)) return;
  for(let at=0; at<rows.length; at+=50){
    await post('/mail/bulk',{action:'archive',items:rows.slice(at,at+50).map(r=>({thread_id:r.raw.thread_id,account:r.account}))});
  }

}
async function ibSweepBucket(name){
  const rows=ibBuckets().find(b=>b.name===name)?.items||[];
  const mail=rows.filter(i=>i.type==='mail');
  if(!mail.length){ toast('Nothing to sweep here'); return; }
  if(!confirm(`Sweep ${mail.length} thread(s) in "${name}"? They are archived in Gmail; todos are left alone.`)) return;
  for(let at=0; at<mail.length; at+=50){
    await post('/mail/bulk',{action:'archive',items:mail.slice(at,at+50).map(r=>({thread_id:r.raw.thread_id,account:r.account}))});

function ibItems(){
  return ITEMS.filter(i=>!i.snoozed&&inAcct(i)&&inQ(i)
    &&(i.type==='todo' ? (i.due||i.my_day||i.starred) : inboxLive(i))
    );
}
function ibBuckets(){
  const byB=new Map();
  ibItems().forEach(i=>{
    const b=ibBucket(i.type==='todo'?(i.due||String(i.date||'').slice(0,10)):i.date);
    if(!byB.has(b.k)) byB.set(b.k,{k:b.k,name:b.name,items:[]});
    byB.get(b.k).items.push(i);
  });
  return [...byB.values()].sort((a,b)=>a.k.localeCompare(b.k))
    .map(b=>({...b, items:b.items.sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')))}));
}
function renderTodayInbox(){
  VISIBLE=[];
  const buckets=ibBuckets();
  const body=buckets.map(b=>{
    const bundles={}, todos=[], singles=[];
    b.items.forEach(i=>{
      if(i.type==='todo'){ todos.push(i); return; }
      const cat=i.raw.category||'people';
      if(IB_BUNDLES[cat]) (bundles[cat]=bundles[cat]||[]).push(i);
      else { singles.push(i); VISIBLE.push(i); }
    });
    // A handful of reminders read better as rows; a pile reads better bundled.
    const todoRows = todos.length>3 ? ibTodoBundle(todos,b.k)
      : todos.map(i=>{ VISIBLE.push(i); return rowHtml(i); }).join('');
    const rows=(b.k==='0'?ibCalBundle(dOff(0),b.k):'')
      + todoRows
      + singles.map(ibRow).join('')
      + Object.entries(bundles).map(([c,r])=>ibMailBundle(c,r,b.k)).join('');
    if(!rows) return '';
    return `<div class="ib-head"><span class="t">${esc(b.name)}</span><span class="sp"></span>
        <span class="ib-sweep" title="Sweep everything in ${esc(b.name)} — archives the mail, leaves todos"

  }).join('');

}

/* ================= E177: Todos, bundled =================
   The last list still speaking the old grammar. Urgency IS the bundle here —
   overdue, today, this week, later, no date — each a card row that opens in

const TODO_BUNDLES=[

  {k:'later',name:'Later',     color:'#4285f4', icon:'📆', open:false,

let TODO_SEEDED=false;

/* ------- E141: domain-aware projects — the theater's `domains` list has

function domainsHtml(th){

async function projDomain(th,dom,action){
  dom=String(dom||'').trim().toLowerCase().replace(/^@/,'');
  if(!dom||!dom.includes('.')){ if(action==='add') toast('That doesn\'t look like a domain'); return; }
  const t=((REG?.theaters)||[]).find(x=>x.id===th); if(!t){ toast('Registry still loading — try again'); return; }
  const doms=new Set((t.domains||[]).map(d=>d.toLowerCase()));
  if(action==='add') doms.add(dom); else doms.delete(dom);
  try {
    await post('/registry',{entity:'theater',action:'update',id:th,fields:{domains:[...doms]}});
    t.domains=[...doms]; renderList();
    toast(action==='add'?'Domain added — its mail auto-files here from the next sweep':'Domain removed');
  } catch(e){ toast('Failed — '+e.message); }
}
/* E141: who is this person to you? Inferred, not hand-curated — your own
   (non-freemail) domains mean colleague; a project's domains mean partner;
   volume means frequent contact. */
const _FREEMAIL=new Set(['gmail.com','googlemail.com','yahoo.com','outlook.com','hotmail.com','live.com','icloud.com','me.com','aol.com','proton.me','protonmail.com','msn.com','comcast.net']);
function personRel(em,threads){
  const dom=(String(em).split('@')[1]||'').toLowerCase();
  if(!dom) return null;
  const mine=new Set(((CONN&&CONN.accounts)||[]).map(a=>(a.user||'').split('@')[1]||'')
    .filter(d=>d&&!_FREEMAIL.has(d)));
  if(mine.has(dom)) return {ic:'🤝',label:'colleague',why:'@'+dom+' — your domain'};
  const ths=((REG?.theaters)||[]).filter(t=>(t.domains||[]).some(d=>d.toLowerCase()===dom));
  if(ths.length) return {ic:'🧩',label:'partner',why:'via '+ths.map(t=>t.name||t.id).join(' + ')};
  if((threads||0)>=8) return {ic:'🔁',label:'frequent contact',why:(threads)+' threads on the board'};
  return null;
}
/* ------- E134: scratch pads — one freeform journal per project/goal,
   beside the structured fields. Cached; autosaves on blur. ------- */
let SCRATCH={};
function scratchHtml(kind,id){
  const key=kind+':'+id;
  if(!(key in SCRATCH)){
    SCRATCH[key]='';
    fetch(`/scratch?kind=${kind}&id=${encodeURIComponent(id)}`).then(r=>r.json())
      .then(r=>{ if(r.ok&&r.text){ SCRATCH[key]=r.text;
        const el=document.querySelector(`textarea.sp-pad[data-sp="${key}"]`);
        if(el&&document.activeElement!==el) el.value=r.text; } }).catch(()=>{});
  }
  return `<div class="sp-wrap"><div class="sp-head">🗒 scratch pad <span class="status" id="sp-status-${kind}"></span></div>
    <textarea class="tp-notes sp-edit sp-pad" data-sp="${esc(key)}" placeholder="freeform thoughts — kept out of the structured stuff…"
      onchange="spSave('${esc(kind)}','${esc(id)}',this.value)">${esc(SCRATCH[key])}</textarea></div>`;

async function spSave(kind,id,text){

    await post('/scratch',{kind,id,text});
    if(st){ st.textContent='saved'; setTimeout(()=>{ if(st.textContent==='saved') st.textContent=''; },1500); }
  } catch(e){ if(st){ st.textContent=e.message; st.className='status err'; } else toast('Scratch save failed — '+e.message); }

/* ------- E69/E70/E76: day notes — one journal note PER DATE. The Today
   card always edits today; the calendar dock and the month page edit
   whichever day they show. Every editor is a textarea.dn-edit carrying
   data-date; the cache and the per-date debounced autosave are shared. ------- */
let DN_CACHE={};                       // date -> {text, updated_at}
const DN_TIMERS={};                    // date -> debounce timer
const dnStatuses=()=>[...document.querySelectorAll('#dn-status,.dk-dn-status')];
function dnFill(){
  const t=$('#dn-text'); if(t) t.dataset.date=dOff(0);
  document.querySelectorAll('textarea.dn-edit').forEach(el=>{
    if(document.activeElement!==el) el.value=(DN_CACHE[el.dataset.date]||{}).text||'';
  });
  // E150.1 (Casey's screenshot): a once-dragged resize was remembered
  // forever, so a ~350px mostly-empty notes card shoved the Today list
  // down until rows clipped against it. Restore the height CAPPED — drag
  // it taller any time, but each day starts reasonable.
  const h=parseInt(localStorage.getItem('gc2_dn_h'))||0;
  if(t&&h) t.style.height=Math.max(72,Math.min(h,170))+'px';
}
async function loadDayNote(date,force){
  date=date||dOff(0);
  if(DN_CACHE[date]&&!force){ dnFill(); return; }
  try {
    const out=await fetch('/daynote?date='+date).then(r=>r.json());
    if(out.ok){ DN_CACHE[date]={text:out.text||'',updated_at:out.updated_at}; dnFill();
      const st=$('#dn-status');
      if(st&&date===dOff(0)) st.textContent=out.updated_at?('saved '+String(out.updated_at).replace('T',' ').slice(5,16)):''; }
  } catch(e){ dnStatuses().forEach(s=>s.textContent='could not load'); }
}
function dnInput(e){
  const date=e.target.dataset.date||dOff(0);
  DN_CACHE[date]={...(DN_CACHE[date]||{}),text:e.target.value};
  dnStatuses().forEach(s=>s.textContent='…');
  clearTimeout(DN_TIMERS[date]);
  DN_TIMERS[date]=setTimeout(async ()=>{
    try {
      await post('/daynote',{date,text:(DN_CACHE[date]||{}).text||''});
      dnStatuses().forEach(s=>s.textContent='saved ✓'); dnFill();
    } catch(err){ dnStatuses().forEach(s=>s.textContent='save failed — '+err.message); }
  },800);
}
$('#dn-text').addEventListener('input', dnInput);
// Resizable: the browser's drag-corner works; remember the height chosen.
$('#dn-text').addEventListener('mouseup', ()=>{
  const h=$('#dn-text').style.height;
  if(h) localStorage.setItem('gc2_dn_h',h);

// Delegated: any section header carrying data-sec folds/expands on click;
// the group-action buttons (E58) claim their clicks first.
$('#list').addEventListener('click', e=>{
  const act=e.target.closest('.secact');
  if(act){
    if(act.dataset.sectrash) return bundleTrash(act.dataset.sectrash);
    return bundleBulk(act.dataset.secarch||act.dataset.secdis, act.dataset.secarch?'archive':'dismiss');
  }

// E59: delete a whole group = Gmail Trash, behind an explicit approval
// dialog (not a bare confirm) — E7's delete rules: recoverable 30 days,
// human-only, no purge verb anywhere.
function bundleTrash(name){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  // Dev #64 (Casey, 10-01: "10 or fewer … no need to have a second
  // confirmation", chose "≤10, keep 10s Undo"; BUILD_SPEC §6): a small group
  // goes on one click, held 10 seconds behind Undo like a single delete.
  // Still Gmail Trash, still human-only; more than 10 keeps the dialog.
  if(items.length<=10){ bundleTrashHeld(name,items); return; }
  dlg(`<h3>🗑 Delete all of ${esc(name)}?</h3>
    <div class="status" style="margin:4px 0 10px">Moves <b>${items.length} thread(s)</b> to Gmail Trash — recoverable there for 30 days, then Gmail purges them. Grand Central has no purge button by design.</div>
    <div class="foot">
      <button class="btn danger" onclick="closeDlg();doBundleTrash('${esc(name)}')">Delete ${items.length} threads</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
}
function bundleTrashHeld(name,items){
  items.forEach(i=>DROPPED.set(i.key,Date.now()));
  const gone=new Set(items.map(i=>i.key));
  MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
  rebuild();
  queueUndo(`Deleting ${items.length} from ${name} — Gmail Trash`, async ()=>{
    let ok=0;
    try {
      for(let at=0; at<items.length; at+=5){
        const out=await post('/mail/bulk',{action:'trash',
          items:items.slice(at,at+5).map(i=>({thread_id:i.raw.thread_id,account:i.account}))});
        ok+=(out.results||[]).filter(r=>r.ok).length;
      }
      toast(`Deleted ${ok} thread(s) from ${name} — in Gmail Trash 30 days`);
    } catch(e){
      // some may already be in Trash, so let the server say what is left
      items.forEach(i=>DROPPED.delete(i.key));
      toast(`Delete stopped after ${ok} — ${e.message}; refreshing`); loadMailTodos();
    }
  }, ()=>{ items.forEach(i=>{ DROPPED.delete(i.key); if(!MAIL.includes(i.raw)) MAIL.push(i.raw); }); rebuild(); }, 10000);
}
async function doBundleTrash(name){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  // E93.4: optimistic — rows vanish NOW, deletes run in the background
  // with live progress (each thread is a real IMAP move server-side).
  const gone=new Set(items.map(i=>i.key));
  items.forEach(i=>DROPPED.set(i.key,Date.now()));
  MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
  rebuild();
  const prog=m=>{ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); };
  let ok=0;
  prog(`🗑 Deleting ${items.length} thread(s) in the background… 0/${items.length}`);
  try {
    for(let at=0; at<items.length; at+=5){
      const out=await post('/mail/bulk',{action:'trash',
        items:items.slice(at,at+5).map(i=>({thread_id:i.raw.thread_id,account:i.account}))});
      ok+=(out.results||[]).filter(r=>r.ok).length;
      prog(`🗑 Deleting ${name}… ${Math.min(at+5,items.length)}/${items.length}`);
    }
    toast(`Deleted ${ok} thread(s) from ${name} — in Gmail Trash 30 days`);
  } catch(e){
    items.forEach(i=>DROPPED.delete(i.key));
    toast(`Delete stopped after ${ok} — ${e.message}; refreshing`); loadMailTodos();
  }
}
// Clear a whole bundle: archive = real Gmail archive (chunked ≤50 per call),
// dismiss = board-only. Two-step via confirm; rows drop locally on success.
function bundleBulk(name, mode){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  // E94.2: in-app confirm (native confirm() gets suppressed)
  dlg(`<h3>${mode==='archive'?'✓ Archive':'⊘ Dismiss'} all of ${esc(name)}?</h3>
    <div class="status" style="margin:4px 0 10px">${mode==='archive'
      ?`Archives <b>${items.length} thread(s)</b> in Gmail — they leave the inbox, recoverable in All Mail.`
      :`Clears <b>${items.length} thread(s)</b> from the board — Gmail untouched.`}</div>
    <div class="foot"><button class="btn" onclick="closeDlg();doBundleBulk('${esc(name)}','${mode}')">${mode==='archive'?'Archive':'Dismiss'} ${items.length}</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
}
async function doBundleBulk(name, mode){
  const items=ITEMS.filter(i=>inScope(i)&&inTab(i)&&inQ(i)&&i.type==='mail'&&!i.starred&&!i.attached&&BUNDLE_NAME(i)===name);
  if(!items.length) return;
  let ok=0;
  try {
    if(mode==='archive'){
      for(let at=0; at<items.length; at+=50){
        const out=await post('/mail/bulk',{action:'archive',
          items:items.slice(at,at+50).map(i=>({thread_id:i.raw.thread_id,account:i.account}))});
        ok+=out.archived||0;
      }
    } else {
      for(const i of items){ try{ await post('/dismiss',{thread_id:i.raw.thread_id,account:i.account}); ok++; }catch(e){} }
    }
    const gone=new Set(items.map(i=>i.key));
    MAIL=MAIL.filter(t=>!gone.has('m:'+t.account+':'+t.thread_id));
    rebuild();
    toast(`${mode==='archive'?'Archived':'Dismissed'} ${ok} thread(s) from ${name}`);
  } catch(e){ toast(`Group ${mode} stopped after ${ok} — ${e.message}`); rebuild(); }
}

   focused row, or 🏷 on any row — type to filter, ⏎ takes the top match,

function labelDlg(key){
  const i=findItem(key); if(!i) return;

  const render=(q='')=>{

async function labelPut(key,label,add){
  const i=findItem(key); if(!i) return;
  try {
    if(i.type==='todo'){
      const next=add?[...new Set([...(i.labels||[]),label])]:(i.labels||[]).filter(l=>l!==label);
      await post('/task',{action:'update',id:i.raw.id,fields:{labels:next}});
      i.labels=i.raw.labels=next;
    } else {
      await post('/mail-action',{action:add?'label-add':'label-remove',thread_id:i.raw.thread_id,account:i.account,label});
      i.labels=add?[...new Set([...(i.labels||[]),label])]:(i.labels||[]).filter(l=>l!==label);
      i.raw.labels=i.labels;
    }
    toast(add?`Labelled ${label}`:`Removed ${label}`);
    renderList(); renderRail(); labelDlg(key);
  } catch(e){ toast('Label failed — '+e.message); }
}

/* Dev #37 (Casey: "The From address is showing me, but the email thread is
   with someone else"): when Casey wrote last, the row names who it's WITH,
   Gmail-style — "Sam, me". Casey is his account addresses plus anyone
   carrying his own display name (old addresses from past jobs). */
function mailWho(x){
  const who=x.who||x.last_from||'';
  const lastEm=(x.last_from_email||emOf(x.last_from)||'').toLowerCase();
  if(!(x.last_direction==='outbound'||OWN.has(lastEm))) return {who};
  const me=nmOf(x.last_from||'').toLowerCase();
  const seen=new Set(), others=[];
  (x.participants||[]).forEach(p=>{
    const em=emOf(p), nm=nmOf(p);
    if(!em||OWN.has(em)||(me&&nm.toLowerCase()===me)) return;
    const k=(nm&&!nm.includes('@')?nm:em).toLowerCase(); if(seen.has(k)) return;
    seen.add(k); others.push({em, nm:nm&&!nm.includes('@')?nm:em.split('@')[0]});
  });
  if(!others.length) return {who:'me'};
  const first=n=>others.length>1?n.split(/\s+/)[0]:n;
  return {who:others.slice(0,2).map(o=>first(o.nm)).join(', ')+(others.length>2?' +'+(others.length-2):'')+', me',
          whoEm:others[0].em, whoNm:others[0].nm};
}

/* E199 (Casey: "maybe put the actions in a menu with a long tap"): a touch
   device never sees the hover tray, so hold a row for half a second and the
   same menu right-click gives opens. The press is cancelled by any movement,
   and the tap that follows the menu is swallowed so the row does not open
   underneath it. */
(function(){
  let timer=null, moved=false, opened=false;
  const start=e=>{
    const row=e.target.closest('[data-key], .ib-row[data-bundle]'); if(!row) return;
    moved=false; opened=false;
    const t=e.touches&&e.touches[0]; if(!t) return;
    const x=t.clientX, y=t.clientY;
    timer=setTimeout(()=>{
      if(moved) return;
      opened=true;
      if(navigator.vibrate) navigator.vibrate(8);
      const key=row.dataset.key;
      if(key){ const i=findItem(key); if(i) ctxOpen(x-20,y+8, i.type==='mail'?mailCtxHtml(i):todoCtxHtml(i)); }
      else { const b=row.dataset.bundle, sw=row.dataset.sweep;
        ctxOpen(x-20,y+8,`<button onclick="ctxClose();ibToggle('${b}')">${IB_OPEN.has(b)?'⌃ Close':'⌄ Open'} this bundle</button>`
          +(sw?`<button onclick="ctxClose();ibSweepBundle('${sw}')">✓ Sweep — archive everything in it</button>`:'')); }
    },480);
  };
  const cancel=()=>{ clearTimeout(timer); timer=null; };
  document.addEventListener('touchstart', start, {passive:true});
  document.addEventListener('touchmove', ()=>{ moved=true; cancel(); }, {passive:true});
  document.addEventListener('touchend', cancel, {passive:true});
  document.addEventListener('touchcancel', cancel, {passive:true});
  // the click that follows a long press belongs to the menu, not the row
  document.addEventListener('click', e=>{ if(opened){ opened=false; e.stopPropagation(); e.preventDefault(); } }, true);
})();

function fmtDate(d){
  if(!d) return '';
  // Date-only values (todo dues) parse as UTC midnight = "5:00 PM" Pacific
  // the previous evening — a phantom time on things that HAVE no time.
  // Anchor them to local noon and never render a clock for them.
  const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(String(d));
  const dt=dateOnly?new Date(d+'T12:00:00'):new Date(d);
  if(isNaN(dt)) return String(d).slice(5,10);
  const today=new Date();
  if(dt.toDateString()===today.toDateString())
    return dateOnly?'Today':dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(Math.abs(today-dt)/864e5<7) return dt.toLocaleDateString([],{weekday:'short'});
  return dt.toLocaleDateString([],{month:'short',day:'numeric'});
}

/* ================= undo (E74) =================
   Actions run in the UI instantly but the SERVER call is held ~6s; Undo
   cancels it entirely — uniform undo for archive/dismiss/trash/snooze/
   done with no inverse endpoints. A newer action commits the older one;
   leaving the page commits whatever is pending (keepalive fetches). */
let PENDING=null;
function queueUndo(label, exec, restore, ms=6000){
  flushPending();                       // one held action at a time
  $('#undo-label').textContent=label;
  const bar=$('#undobar'); bar.hidden=false;
  const tick=$('#undo-tick'); tick.style.animation='none'; void tick.offsetWidth;
  tick.style.animation=''; tick.style.animationDuration=(ms/1000)+'s';
  PENDING={exec,restore,timer:setTimeout(commitPending,ms)};
}
async function commitPending(){
  if(!PENDING) return;
  const p=PENDING; PENDING=null; clearTimeout(p.timer); $('#undobar').hidden=true;
  try { await p.exec(); }
  catch(e){ toast('Action failed — '+e.message+' (restored)'); p.restore(); }
}
function flushPending(){ if(PENDING) commitPending(); }
function undoPending(){
  if(!PENDING) return;
  const p=PENDING; PENDING=null; clearTimeout(p.timer); $('#undobar').hidden=true;
  p.restore(); toast('Undone');
}
window.addEventListener('pagehide', flushPending);
const STAR_PENDING=new Map();   // E93.8: key -> {v,ts} in-flight star intents
const DROPPED=new Map();   // key -> ts; E85: survives the poll's wholesale
                           // MAIL/TODOS replacement so acted-on rows can't
                           // resurrect before the server catches up
function restoreItem(i){
  return ()=>{ DROPPED.delete(i.key);
    if(i.type==='mail'){ if(!MAIL.includes(i.raw)) MAIL.push(i.raw); }
    else { if(!TODOS.includes(i.raw)) TODOS.push(i.raw); }
    rebuild(); };
}
// E62: acting on the open item advances to the NEXT one instead of dumping
// you back to the list — triage keeps moving (done/snooze/dismiss/trash all
// funnel through here).
// Dev #47 (Casey: "After I delete an email with the preview pane open, open
// the next email, don't close that window"): an open email advances to the
// next EMAIL, the way j/k do — the neighbour row could be a todo, and opening
// a todo navigates into its page, which took the reading pane away. An email
// that wasn't in the flat list (a stub, a folded section) opens the list's
// first email instead of closing the pane.
function dropLocal(i){
  DROPPED.set(i.key, Date.now());
  const wasOpen = OPEN===i.key;
  const pool = VISIBLE.filter(x=>i.type!=='mail'||x.type==='mail');
  const idx = pool.findIndex(x=>x.key===i.key);
  const near = idx>=0 ? [...pool.slice(idx+1), ...pool.slice(0,idx).reverse()] : [];
  if(i.type==='mail') MAIL=MAIL.filter(t=>t!==i.raw); else TODOS=TODOS.filter(t=>t!==i.raw);
  rebuild();   // refreshes VISIBLE
  if(wasOpen){
    let next = near.map(x=>VISIBLE.find(v=>v.key===x.key)).find(Boolean) || null;
    if(!next && idx<0 && i.type==='mail') next = VISIBLE.find(x=>x.type==='mail') || null;
    if(next){ KB=VISIBLE.indexOf(next); openItem(next.key); }
    else closePane();
  }
}

function snoozeWhen(kind){
  const d=new Date();
  if(kind==='evening'){ d.setHours(18,0,0,0); if(d<new Date()) d.setDate(d.getDate()+1); }
  else if(kind==='tomorrow'){ d.setDate(d.getDate()+1); d.setHours(8,0,0,0); }
  else if(kind==='weekend'){ d.setDate(d.getDate()+((6-d.getDay()+7)%7||7)); d.setHours(8,0,0,0); }
  else if(kind==='nextweek'){ d.setDate(d.getDate()+((8-d.getDay())%7||7)); d.setHours(8,0,0,0); }
  return d.toISOString();
}
/* E83: Shortwave-style natural-language snooze — type "7 days" and the
   dialog resolves it live. Durations under a day land at the exact
   offset; day-or-longer targets land at 8am (the picker convention). */
function parseSnooze(input){
  const s=String(input||'').trim().toLowerCase().replace(/^in\s+/,'').replace(/\s+/g,' ');
  if(!s) return null;
  const now=new Date();
  const at=(x,h,mi)=>{ x.setHours(h,mi||0,0,0); return x; };
  const parseTime=t=>{ const m=t&&t.replace(/ /g,'').match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
    if(!m||(!m[2]&&!m[3])) return null;               // bare number = ambiguous
    let h=+m[1]; const mi=+(m[2]||0);
    if(m[3]==='pm'&&h<12) h+=12; if(m[3]==='am'&&h===12) h=0;
    return h>23||mi>59?null:{h,mi}; };
  const later=d=>d&&d>now?d:null;
  let m;
  if(m=s.match(/^(\d+(?:\.\d+)?) ?(min(?:ute)?s?|m|h(?:ou)?rs?|hrs?|h|d(?:ay)?s?|w(?:ee)?ks?|w|mo(?:nth)?s?)$/)){
    const n=+m[1], u=m[2], d=new Date(now);
    if(/^mo/.test(u)){ d.setMonth(d.getMonth()+Math.round(n)); return later(at(d,8)); }
    if(u[0]==='w'){ d.setDate(d.getDate()+Math.round(n*7)); return later(at(d,8)); }
    if(u[0]==='d'){ d.setDate(d.getDate()+Math.round(n)); return later(at(d,8)); }
    if(u[0]==='h') return later(new Date(now.getTime()+n*3600e3));
    return later(new Date(now.getTime()+n*60e3));
  }
  if(m=s.match(/^(tomorrow|tmrw|tonight)( (.+))?$/)){
    const d=new Date(now), t=parseTime(m[3]);
    if(m[1]==='tonight') return later(t?at(d,t.h,t.mi):at(d,18));
    d.setDate(d.getDate()+1); return later(t?at(d,t.h,t.mi):at(d,8));
  }
  const wd={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  if(m=s.match(/^(next )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*( (.+))?$/)){
    const d=new Date(now), t=parseTime(m[4]);
    let delta=(wd[m[2]]-d.getDay()+7)%7||7;
    if(m[1]&&delta<7) delta+=7;
    d.setDate(d.getDate()+delta); return later(t?at(d,t.h,t.mi):at(d,8));
  }
  const mo={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  if(m=s.match(/^(?:([a-z]{3,9}) (\d{1,2})|(\d{1,2}) ([a-z]{3,9}))( (.+))?$/)){
    const key=(m[1]||m[4]||'').slice(0,3);
    if(key in mo){
      const day=+(m[2]||m[3]), t=parseTime(m[6]);
      if(day>=1&&day<=31){
        const d=new Date(now.getFullYear(),mo[key],day);
        const cand=t?at(new Date(d),t.h,t.mi):at(new Date(d),8);
        if(cand<=now) cand.setFullYear(cand.getFullYear()+1);
        return later(cand);
      }
    }
  }
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})( (.+))?$/)){
    if(+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){
      const t=parseTime(m[4]);
      const cand=at(new Date(now.getFullYear(),+m[1]-1,+m[2]),t?t.h:8,t?t.mi:0);
      if(cand<=now) cand.setFullYear(cand.getFullYear()+1);
      return later(cand);
    }
  }
  const t=parseTime(s);
  if(t){ const d=at(new Date(now),t.h,t.mi); if(d<=now) d.setDate(d.getDate()+1); return d; }
  return null;
}

/* E89 Phase 3: deterministic filing-pattern suggester — no LLM, just your
   own history: a sender/label whose filed mail concentrates ≥80% (n≥4) in
   one place, with no rule yet, is one click from becoming a rule. */
function feedSuggestions(){
  if(!REG) return [];
  const ruled=new Set((REG.rules||[]).map(r=>r.match.type+':'+String(r.match.value).toLowerCase()));
  const send={}, lab={};
  MAIL.forEach(x=>{ if(!x.project) return;
    const em=(x.last_from_email||'').toLowerCase();
    if(em) (send[em]=send[em]||{})[x.project]=((send[em][x.project]||0)+1);
    (x.labels||[]).forEach(l=>{ if(!l.startsWith('GC/')) (lab[l]=lab[l]||{})[x.project]=((lab[l][x.project]||0)+1); });
  });
  const out=[];
  const scan=(typ,table)=>Object.entries(table).forEach(([val,c])=>{
    const n=Object.values(c).reduce((a,b)=>a+b,0);
    const [op,k]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
    if(n>=4 && k/n>=0.8 && !ruled.has(typ+':'+val.toLowerCase())) out.push({typ,val,op,n,pct:Math.round(100*k/n)});
  });
  scan('sender',send); scan('label',lab);
  return out.sort((a,b)=>b.n-a.n).slice(0,20);
}

let TP={keys:[],opts:[],at:0};

  dlg(`<div class="tk-h">Add ${keys.length>1?keys.length+' emails':''} to todo</div>

function tpRender(){

    .sort((a,b)=>String(todoActivity(b)).localeCompare(String(todoActivity(a)))).slice(0,ql?30:40);
  const exact=todos.some(t=>t.title.toLowerCase()===ql);
  const name=q||TP.suggest;
  TP.opts=[...(name&&!exact?[{create:name}]:[]), ...todos.map(t=>({todo:t}))];
  TP.at=Math.min(TP.at,Math.max(0,TP.opts.length-1));

    ? `<div class="tk-o ${ix===TP.at?'on':''}" onmouseenter="TP.at=${ix};tpHi()" onclick="tpGo(${ix})">${ic('sparkle')}<span>Create "${esc(o.create)}"</span></div>`

async function openItem(key, keepScroll){
  // E115: a todo is a PLACE now, not a pane — opening one navigates into it.
  if(key.startsWith('t:')){ const it=findItem(key); if(it) return openTodoPlace(it.raw.id); }

  // them"): Home hides the reading pane (body.home-on .pane{display:none}),
  // so a click here has to step out of Home first. The feed used to do this
  // itself; E180 swapped in the shared row and lost it.
  // Projects: a project page keeps the reading pane beside it (the email
  // opens with its own account), so there is no Home to step out of.
  if(SCOPE.kind==='home' && !PROJ){ const it=findItem(key);
    return homeOpen(it&&it.project?it.project:'__none', key); }

  OPEN=key; document.body.classList.add('pane-open'); renderList();
  let i=findItem(key);
  if(!i && key.startsWith('m:')){
    // E73: a thread outside the synced set (Sent view) — build a stub and
    // let the live /thread fetch fill it in.
    const parts=key.split(':');
    i={type:'mail', key, account:parts[1],
       raw:{thread_id:parts.slice(2).join(':'), account:parts[1],
            link:'https://mail.google.com/mail/?authuser='+encodeURIComponent(acctEmail(parts[1]))+'#all/'},
       who:'', title:'…', snip:'', goals:[], labels:[], needs:false,
       starred:false, note:'', threads:[]};

  }

  if(!keepScroll) $('#pane').innerHTML=paneShell(i,'<div class="empty">Loading thread…</div>');
  try {
    const r=await fetch(`/thread?thread_id=${i.raw.thread_id}&account=${i.account}`);
    const out=await r.json();
    if(!out.ok) throw new Error(out.error||'failed');
    i._msgs=out.messages||[]; i._tlabels=out.labels||[];
    if(i.title==='…'&&i._msgs.length) i.title=i._msgs[i._msgs.length-1].subject||'(no subject)';

const HTML_WRAP='<base target="_blank"><style>body{margin:12px;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;color:#111;word-break:break-word}img{max-width:100%;height:auto}</style>';
/* ================= E172: HTML mail in a dark skin =================
   Casey sent a screenshot of the reading pane: a white sheet with near-black
   text dropped into a black UI. Every HTML body went through HTML_WRAP with
   color:#111 on the iframe's default white ground.

   Mail cannot simply be inverted — a newsletter's artwork, buttons and brand
   colors assume a light page, and forcing them dark makes black-on-black. So
   the decision is per email: one that carries its own design keeps its paper
   (framed, so it reads as a document); a plain one — most people mail, and
   the Outlook forward in the screenshot — is rendered in the board's palette.
   ◐ in the pane toolbar overrides the guess either way. */
const darkSkin = () => (document.documentElement.dataset.skin||'neon')!=='daylight';
const mailRender = () => localStorage.getItem('gc2_mail_render') || 'auto';
function mailBringsOwnDesign(html){
  // Outlook emits a <style> block, ~100 layout tables and a background-color
  // on nearly every cell for mail that is visibly two lines of text — and all
  // of those backgrounds are rgba(255,255,255,0). So the question is not
  // "does it declare a background" but "does any of it actually paint": an
  // opaque ground that is not white, or a bgcolor attribute that is not white.
  const h=String(html||'');
  const CLEAR=/^(transparent|none|inherit|initial|unset|currentcolor|#fff(fff)?f?f?|white|rgba?\(\s*255\s*,\s*255\s*,\s*255\s*(?:,\s*[\d.]+\s*)?\))$/i;
  const painted=[];
  for(const m of h.matchAll(/background(?:-color)?\s*:\s*([^;"'}]+)/gi)){
    const v=(m[1]||'').trim();
    if(/rgba\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*0?\.?0*\s*\)/i.test(v)) continue;   // fully transparent
    if(/^url\(/i.test(v)) return true;                                                      // a background image is art
    if(!CLEAR.test(v)) painted.push(v);
  }
  for(const m of h.matchAll(/bgcolor\s*=\s*["']?([^"'\s>]+)/gi)){
    const v=(m[1]||'').trim();
    if(!CLEAR.test(v)) painted.push(v);
  }
  // One amber highlight inside a 121KB Outlook forward is not a design — that
  // single declaration is what kept Casey's screenshot on white paper. A real
  // template paints a ground, a header and buttons, so ask for three.
  if(painted.length < 3) return false;
  // E173: and a page whose only grounds are off-whites (#f0f2f2 receipts,
  // #d9d2e9 panels) is a light DOCUMENT, not artwork — its design is "a white
  // page", which is exactly what clashes with a dark board. Those get drawn
  // in the board's palette too; artwork needs a ground with some colour in it.
  return painted.some(v=>{ const l=cssLum(v); return l===null || l<0.86; });
}
/* Relative luminance of a CSS colour, or null when we cannot read it (a
   var(), a named colour) — unreadable counts as "might be artwork". */
function cssLum(v){
  let r,g,b;
  const hex=/^#([0-9a-f]{3}|[0-9a-f]{6})\b/i.exec(v);
  const rgb=/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(v);
  if(hex){ let x=hex[1]; if(x.length===3) x=x.split('').map(c=>c+c).join('');
    r=parseInt(x.slice(0,2),16); g=parseInt(x.slice(2,4),16); b=parseInt(x.slice(4,6),16); }
  else if(rgb){ r=+rgb[1]; g=+rgb[2]; b=+rgb[3]; }
  else return null;
  return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
}
function mailNative(html){
  if(!darkSkin()) return false;                 // Daylight: the paper IS the palette
  if(mailRender()==='original') return false;   // you asked for it as sent
  if(mailRender()==='native') return true;      // …or for it to match the board
  return !mailBringsOwnDesign(html);
}
