    VERSION_STALE=true;
    notify('warn','This tab is running an old version of Grand Central — reload to pick up the latest.');   // E156
    if(document.getElementById('upbar')) return;
    const bar=document.createElement('div'); bar.id='upbar';
    bar.innerHTML='Grand Central was updated.<button class="btn" onclick="location.reload()">Reload</button><button class="btn sec2" onclick="this.parentNode.remove()">Later</button>';
    document.body.appendChild(bar);
  } catch(e){}
}
setInterval(checkVersion,60_000); checkVersion();
/* E147 (Casey filed on a stale tab and the new move-out never ran): once the
   tab KNOWS it's outdated, every write action nags — dismissing the bar no
   longer silences it, because acting on old code is how changes get lost. */
const _post_real=post;
post=async function(url,body,headers){
  if(VERSION_STALE&&!post._warned){
    post._warned=true; setTimeout(()=>{ post._warned=false; },120_000);
    toast('⚠ This tab is running an OLD version — reload to get current behavior');
    if(!document.getElementById('upbar')) checkVersion();
  }
  return _post_real(url,body,headers);
};

/* offline (E45) */
function offline(on){
  let b=document.getElementById('offbar');
  if(on&&!b){ b=document.createElement('div'); b.id='offbar'; b.textContent='📴 Offline — showing the last synced data (read-only)'; document.body.appendChild(b); }
  if(!on&&b) b.remove();
}
window.addEventListener('online',()=>{ offline(false); loadMailTodos(); });
window.addEventListener('offline',()=>offline(true));
if(!navigator.onLine) offline(true);

/* connection watchdog (E155, dev request #4) ==============================
   The browser only fires 'offline' when the DEVICE loses its network — when
   the Cloudflare tunnel drops, navigator.onLine stays true, polls fail
   silently, and sends/saves die with a cryptic "Failed to fetch" in a tiny
   status line. Watch every same-origin request instead: any network failure
   or Cloudflare 5xx raises a red banner, a 5s probe watches for the tunnel's
   return, and recovery flashes green + resyncs. */
let NET={down:false,since:null,probe:null};
const _fetch_raw=window.fetch.bind(window);
window.fetch=function(url,opts){
  const local=typeof url==='string'&&(url.startsWith('/')||url.startsWith(location.origin));
  const p=_fetch_raw(url,opts);
  if(!local) return p;
  return p.then(r=>{
    // 502/504 + Cloudflare's own 52x/530 mean the tunnel, not the app, failed
    if(r.status===502||r.status===504||(r.status>=520&&r.status<=530)) netDown('HTTP '+r.status);
    else netUp();
    return r;
  }, e=>{ netDown(e.message); throw e; });
};
function netDown(why){
  const first=!NET.down;
  // E266 (Casey, 10-02: "the reconnect and disconnect is very noisy, doesn't
  // need to be in my notification menu"): the bar below says it while it
  // matters; the bell no longer keeps a record of every blip.
  if(first){ NET.down=true; NET.since=new Date(); sfx('err'); }
  let b=document.getElementById('netbar');
  if(!b){ b=document.createElement('div'); b.id='netbar'; document.body.appendChild(b); }
  b.className='';
  b.innerHTML='⚡ <b>Connection lost</b> since '+NET.since.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+
    ' — nothing is reaching Grand Central. Keep this tab open: what you\'ve typed is safe here; retry once this turns green.';
  if(!NET.probe) NET.probe=setInterval(()=>{ fetch('/version?probe=1',{cache:'no-store'}).catch(()=>{}); },5000);
}
function netUp(){
  if(!NET.down) return;
  NET.down=false; clearInterval(NET.probe); NET.probe=null;
  const b=document.getElementById('netbar');
  if(b){ b.className='back'; b.innerHTML='✓ Reconnected — syncing…'; setTimeout(()=>b.remove(),4000); }
  sfx('ack'); loadMailTodos();
}

/* notifications (E156, dev request #3) ====================================
   A simple bell: alerts accumulate here instead of vanishing with a toast —
   a mail account or API key that stopped (connection blips left in E266)
   working, a sweeper that missed its slot, a stale tab. Kept in localStorage
   (last 50); opening the panel marks everything seen. An identical text never
   stacks — it just refreshes its timestamp. */
let NOTIFS=[];
try{ NOTIFS=JSON.parse(localStorage.getItem('gc2_notifs')||'[]'); }catch(e){}
// E266: sweep out the connection blips stored before they left the bell
NOTIFS=NOTIFS.filter(n=>!/^(Connection to Grand Central lost at|Reconnected at) /.test(n.text||''));
function nfSave(){ try{ localStorage.setItem('gc2_notifs', JSON.stringify(NOTIFS.slice(0,50))); }catch(e){} }
function notify(kind,text){
  const dup=NOTIFS.find(n=>n.text===text);
  if(dup) dup.ts=Date.now();
  else NOTIFS.unshift({ts:Date.now(),kind:kind||'info',text,seen:false});
  NOTIFS=NOTIFS.slice(0,50);
  nfSave(); nfBadge();
  const m=$('#nf-menu'); if(m&&!m.hidden) nfRender();
}
const agoTxt=ts=>{ const s=(Date.now()-ts)/1000;
  return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago'
    :new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };
function nfBadge(){ const b=$('#nf-badge'); if(!b) return;
  const n=NOTIFS.filter(x=>!x.seen).length; b.hidden=!n; b.textContent=n>9?'9+':n; }
function nfRender(){
  $('#nf-menu').innerHTML='<h5>Notifications</h5>'+
    (NOTIFS.length?NOTIFS.map(n=>
      `<div class="nf-row${n.seen?'':' new'}"><span>${n.kind==='err'?'⛔':n.kind==='warn'?'⚠️':'ℹ️'}</span>
       <div>${esc(n.text)}<div class="nf-ts">${agoTxt(n.ts)}</div></div></div>`).join('')
      +'<hr><button onclick="NOTIFS=[];nfSave();nfBadge();nfRender()">Clear all</button>'
     :'<div class="nf-empty">Nothing yet — credential problems and a stuck sweeper will land here.</div>')
    // E190: this panel only catches alerts while a tab is open. The way to be
    // told when it is not is one click away, and it belongs here.
    + `<hr><button onclick="nfClose();pushDlg()">🔔 ${(window.Notification&&Notification.permission==='granted')?'Notification settings':'Get these on your Mac and phone…'}</button>`;
}
function nfClose(){ const m=$('#nf-menu'); if(m&&!m.hidden){ m.hidden=true; NOTIFS.forEach(n=>n.seen=true); nfSave(); nfBadge(); } }
$('#nf-btn').onclick=e=>{ e.stopPropagation(); meClose(); const m=$('#nf-menu'); if(m.hidden){ nfRender(); m.hidden=false; } else nfClose(); };
document.addEventListener('click', e=>{ if(!e.target.closest('#nf-menu')) nfClose(); });
nfBadge();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(draftRecoverOffer, 3500);   // Dev #53: an email that a reload interrupted

/* ================= boot ================= */
(async function boot(){
  $('#list').innerHTML='<div class="empty">Loading…</div>';
  try {
    await loadAccounts();
    await Promise.all([loadMailTodos(), loadBoard(), loadConn(), loadSigs(), loadSteward(), loadWizard(), loadBraindump(), loadProjects()]);
  }
  catch(e){ $('#list').innerHTML=`<div class="empty">Could not load — ${esc(e.message)}</div>`; }
  const b=$('#pv-state'); if(b) b.textContent=PREVIEW?'on':'off';
  $('#pv-btn')?.classList.toggle('on',PREVIEW);
  const sx=$('#sfx-state'); if(sx) sx.textContent=localStorage.getItem('gc2_sfx')==='0'?'off':'on';
  diagState();       // E206: reflect whether viewport diagnostics are armed
  applySkinIcon();   // E129: the saved skin's ship, from first paint
  if(PREVIEW && innerWidth>980) closePane();   // opens the persistent pane
  const p=new URLSearchParams(location.search);
  // E187: app shortcuts (long-press the icon) open a view directly.
  const go=p.get('go');
  if(go==='today') goToday(); else if(go==='todos') goTodos();
  else if(go==='dev'){ const a=p.get('account'); if(a&&ACCOUNTS.includes(a)&&a!==ACCT) setAcct(a).then(()=>setScope('dev',null)); else setScope('dev',null); }
  else if(go==='inbox'){ setScope('inbox',null); TAB='all'; syncTabs(); renderList(); }
  const th=p.get('thread');
  if(th&&th.includes(':')) openItem('m:'+th);
  if(p.get('wn')) openWhatsNew();
  // E197: ?nopoll=1 leaves the board static after first paint. Headless
  // Chrome waits for the page to go idle, and four live polls mean it never
  // does — so this is what makes the UI half of selftest.py possible.
  if(!new URLSearchParams(location.search).get('nopoll')){
    setInterval(loadMailTodos,POLL_MS);
    setInterval(loadBoard,BOARD_MS);
    setInterval(loadSteward,BOARD_MS);
    setInterval(loadWizard,BOARD_MS);
    setInterval(loadApprovals,POLL_MS);
  }
  loadApprovals();
})();
</script>
