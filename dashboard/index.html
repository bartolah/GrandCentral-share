/* ------- E82: attachments — shared picker state for the inline composer
   and the Compose dialog. ≤3 files, ≤5MB total (server re-enforces);
   bigger files keep the 📎-via-Gmail hatch. ------- */
let SD_ATTS=[];
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':n+' B';
async function sdFiles(inp){
  for(const f of inp.files){
    if(SD_ATTS.length>=3){ toast('Up to 3 attachments per send'); break; }
    if(SD_ATTS.reduce((s,a)=>s+a.size,0)+f.size>5*1024*1024){
      toast(f.name+' would push past the 5 MB total — use 📎 via Gmail for big files'); continue; }
    const data=await new Promise((res,rej)=>{ const r=new FileReader();
      r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(f); });
    SD_ATTS.push({name:f.name,mime:f.type||'application/octet-stream',size:f.size,data});
  }
  inp.value=''; sdAttRender();
}
function sdAttRender(){
  const d=sdEl('sd-attlist'); if(!d) return;
  d.innerHTML=SD_ATTS.map((a,k)=>`<span class="att">📎 ${esc(a.name)} <span>${fmtSize(a.size)}</span>
    <b style="cursor:pointer;margin-left:4px" onclick="SD_ATTS.splice(${k},1);sdAttRender()">✕</b></span>`).join('');
}
// A dialog can overlay an open pane composer — both carry these ids, so
// always address the LAST instance (dialogs append later in the DOM).

  <input type="file" id="sd-files" multiple hidden onchange="sdFiles(this)">`;

/* E77: skins — cycle and persist; CSS does the rest via html[data-skin]. */
const SKINS={'2049':'2049 (Blade Runner)', lcars:'LCARS (Star Trek)', matrix:'Matrix', starwars:'Star Wars (holonet)', tron:'MCP (TRON)', wargames:'WOPR (WarGames)', mission:'Mission Control (Houston)', daylight:'Daylight (macOS)', inbox:'Inbox (Google, 2014)', classic:'Classic (Macintosh, 1991)', shortwave:'Shortwave'};
/* E183 (Bart: "make the light/dark open a drop down so I can choose which
   skin"): ten skins is too many to cycle through one click at a time — ◐
   opens the list, with the light ones grouped apart from the dark. */
const SKIN_LIGHT=['daylight','inbox','classic','shortwave'];
function setSkin(k){
  if(!SKINS[k]) return;
  document.documentElement.dataset.skin=k;
  localStorage.setItem('gc2_skin',k);
  applySkinIcon(); renderList(); renderRail(); renderAcctTabs();
  const m=$('#skin-menu'); if(m){ m.hidden=true; SKIN_MANAGE=false; }
  toast('Skin: '+SKINS[k]);
}
/* E186 (Bart: "I'd like to be able to configure which skins are visible…
   not all of them need to be active"): the picker lists the ones you keep.
   Hidden skins are not deleted — ⚙ Choose skins flips the same menu into a
   checklist, and the one you are wearing is always listed. */
function skinsHidden(){
  try { const v=JSON.parse(localStorage.getItem('gc2_skins_hidden')||'[]');
    return Array.isArray(v)?v.filter(k=>SKINS[k]):[]; } catch(e){ return []; }
}
function skinToggleVisible(k){
  const cur=document.documentElement.dataset.skin||'2049';
  if(k===cur) return toast('That is the skin you are wearing');
  const h=skinsHidden();
  const next=h.includes(k)?h.filter(x=>x!==k):[...h,k];
  if(next.length>=Object.keys(SKINS).length) return toast('Keep at least one skin');
  localStorage.setItem('gc2_skins_hidden',JSON.stringify(next));
  skinMenu(true,true);
}
let SKIN_MANAGE=false;
function skinMenu(keepOpen,manage){
  const m=$('#skin-menu'); if(!m) return;
  if(!m.hidden && !keepOpen){ m.hidden=true; SKIN_MANAGE=false; return; }
  if(manage!==undefined) SKIN_MANAGE=manage;
  const cur=document.documentElement.dataset.skin||'2049';
  const hidden=skinsHidden();
  if(SKIN_MANAGE){
    const row=k=>`<button onclick="event.stopPropagation();skinToggleVisible('${k}')" title="${hidden.includes(k)?'Show in the picker':'Hide from the picker'}">
      <span>${hidden.includes(k)?'☐':'☑'}</span><span>${esc(SKINS[k])}</span>${k===cur?'<span class="pin on">wearing</span>':''}</button>`;
    m.innerHTML = `<h5>Which skins show in the picker</h5>${Object.keys(SKINS).map(row).join('')}
      <h5 style="padding-top:6px"><button onclick="event.stopPropagation();skinMenu(true,false)">← back to skins</button></h5>`;
  } else {
    const item=k=>`<button onclick="setSkin('${k}')">${k===cur?'<b>✓</b>':'<span style="width:9px;display:inline-block"></span>'}
      <span>${esc(SKINS[k])}</span></button>`;
    const show=k=>SKINS[k]&&(!hidden.includes(k)||k===cur);
    const light=SKIN_LIGHT.filter(show), dark=Object.keys(SKINS).filter(k=>!SKIN_LIGHT.includes(k)&&show(k));
    m.innerHTML = (light.length?`<h5>Light</h5>${light.map(item).join('')}`:'')
      + (dark.length?`<h5>Dark</h5>${dark.map(item).join('')}`:'')
      + `<h5 style="padding-top:6px"><button onclick="event.stopPropagation();skinMenu(true,true)">⚙ Choose skins…</button></h5>`;
  }
  m.hidden=false;
}
document.addEventListener('click', e=>{
  const m=$('#skin-menu');
  if(m&&!m.hidden&&!e.target.closest('#skin-btn')&&!e.target.closest('#skin-menu')) m.hidden=true;
});
/* E206: arm/disarm the viewport diagnostics from inside the installed app.

   during a cold start — that is when the gap appears. */

/* E206: the same picker as a dialog, for the phone.
   skinMenu() writes into #skin-menu, which lives inside #skin-wrap — and the
   phone hides that wrapper, so the popup has no anchor there. This renders the
   identical list into the standard dialog instead. Same setSkin(), same
   visibility rules; only the container differs. */
function skinDlg(){
  const cur=document.documentElement.dataset.skin||'2049';
  const hidden=skinsHidden();
  const show=k=>SKINS[k]&&(!hidden.includes(k)||k===cur);
  const item=k=>`<button class="qbtn ${k===cur?'on':''}" onclick="setSkin('${k}');closeDlg()">
    ${esc(SKINS[k])}${k===cur?' ·now':''}</button>`;
  const light=SKIN_LIGHT.filter(show), dark=Object.keys(SKINS).filter(k=>!SKIN_LIGHT.includes(k)&&show(k));
  dlg(`<h3>◐ Skin</h3>
    ${light.length?`<div class="status" style="margin-bottom:6px">Light</div><div class="snz-grid">${light.map(item).join('')}</div>`:''}
    ${dark.length?`<div class="status" style="margin:8px 0 6px">Dark</div><div class="snz-grid">${dark.map(item).join('')}</div>`:''}
    <div class="foot"><button class="btn sec2" onclick="closeDlg()">Done</button></div>`);
}

function applySkinIcon(){
  // E187: the installed window's title bar takes its colour from the skin.
  try{ const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const tc=document.querySelector('meta[name="theme-color"]'); if(tc&&bg) tc.setAttribute('content',bg); }catch(e){}
  const svg=SKIN_ICON[document.documentElement.dataset.skin||'2049'];
  const url=svg?'data:image/svg+xml,'+encodeURIComponent(svg.replace(/\s+/g,' ')):'favicon.svg';
  document.querySelector('link[rel="icon"]')?.setAttribute('href',url);
  document.querySelectorAll('.brand-logo').forEach(i=>i.src=url);
}

/* iPad/iPhone Safari: WebAudio obeys the Silent switch unless the page
   declares itself 'playback' (Safari 17+), and the context only unlocks
   inside a real touch/click gesture — so declare intent up front and
   pre-unlock on the first gesture anywhere. */
if(navigator.audioSession){ try{navigator.audioSession.type='playback';}catch(e){} }
// Dev #30 ("Sound effects don't seem to be working any more"): this unlock
// ran ONCE. iOS suspends the context again whenever the tab is backgrounded
// or the phone locks ('interrupted'), and resume() outside a gesture is
// refused silently — so sound died after the first trip away from the app.
// Re-arm on every gesture; it's a no-op while the context is running.
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{
  try{
    _AC=_AC||new (window.AudioContext||window.webkitAudioContext)();
    if(_AC.state!=='running') _AC.resume();
  }catch(e){}
},{passive:true}));
function sfx(kind){
  if(localStorage.getItem('gc2_sfx')==='0') return;
  const set=SFX[document.documentElement.dataset.skin||'2049'];
  if(!set||!set[kind]) return;
  try {
    _AC=_AC||new (window.AudioContext||window.webkitAudioContext)();
    if(_AC.state!=='running'){
      // resume() is async on iOS — scheduling against a suspended context
      // drops the sound; replay this kind once the context is live.
      _AC.resume().then(()=>{ if(_AC.state==='running') sfx(kind); },()=>{});
      return;
    }
    const now=_AC.currentTime;
    const tone=(f0,f1,at,dur,type,vol)=>{
      const o=_AC.createOscillator(), g=_AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f0,now+at);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,now+at+dur);
      g.gain.setValueAtTime(0,now+at);
      g.gain.linearRampToValueAtTime(vol||.05,now+at+.008);
      g.gain.exponentialRampToValueAtTime(.0001,now+at+dur);
      o.connect(g); g.connect(_AC.destination);
      o.start(now+at); o.stop(now+at+dur+.02);
    };
    const noise=(at,dur,vol,cutoff)=>{
      const len=Math.ceil(_AC.sampleRate*dur), buf=_AC.createBuffer(1,len,_AC.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const src=_AC.createBufferSource(); src.buffer=buf;
      const f=_AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cutoff||1000;
      const g=_AC.createGain(); g.gain.setValueAtTime(vol||.04,now+at);
      g.gain.exponentialRampToValueAtTime(.0001,now+at+dur);
      src.connect(f); f.connect(g); g.connect(_AC.destination);
      src.start(now+at);
    };
    set[kind](tone,noise);
  } catch(e){ /* audio is garnish — never let it break the shell */ }
}
function toggleSfx(){
  const off=localStorage.getItem('gc2_sfx')==='0';
  localStorage.setItem('gc2_sfx', off?'1':'0');
  const s=$('#sfx-state'); if(s) s.textContent=off?'on':'off';
  if(off) sfx('nav');
}

   so an action can never mean one thing on a laptop and another on a phone. */
function paneMore(key,ev){
  // E199: this did nothing on the phone. document listens for click →
  // ctxClose, so the very click that opened the menu closed it again; and a
  // thread outside the synced set made findItem return nothing at all.

     <button onclick="ctxClose();todoPick(['${esc(key)}'])">◯ Add to todo…</button>

/* ================= E188: browser notifications =================
   Push arrives whether or not the board is open — on the Mac and, once it is
   on the home screen, on the iPhone. Safari only allows any of this over
   HTTPS, so the dialog says plainly when you are on the wrong address. */
const b64ToU8 = b64 => {
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
};
let PUSH=null;
async function loadPush(){ try{ PUSH=await fetch('/push').then(r=>r.json()); }catch(e){ PUSH={ok:false}; } }
async function pushDlg(){
  await loadPush();
  const secure=window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window;
  const perm=(window.Notification&&Notification.permission)||'default';
  const reg=secure?await navigator.serviceWorker.getRegistration():null;
  const sub=reg?await reg.pushManager.getSubscription():null;
  const kinds=[['brief','Morning brief','the plan, your top three, today\'s events'],
               ['event','Event reminders','~15 minutes before each meeting'],
               ['wrap','Day\'s end','what got done, what is still owed'],
               ['alert','Problems','a dead credential, a dropped tunnel, a stuck sweeper']];
  const prefs=(PUSH&&PUSH.prefs)||{};
  const row=([k,name,what])=>{ const p=prefs[k]||{imessage:true,push:true};
    return `<div class="hs-row" style="cursor:default">
      <span class="hs-l"><b>${esc(name)}</b><br><span class="status" style="text-transform:none;letter-spacing:0">${esc(what)}</span></span>
      <button class="qbtn ${p.imessage?'on':''}" onclick="pushPref('${k}',${!p.imessage},${p.push})">💬 iMessage</button>
      <button class="qbtn ${p.push?'on':''}" onclick="pushPref('${k}',${p.imessage},${!p.push})">🔔 Browser</button></div>`; };
  dlg(`<h3>🔔 Notifications</h3>
    ${secure?'':`<div class="status err" style="margin-bottom:8px">This address cannot receive notifications — Safari only allows them over HTTPS.
      Open <b>https://gc.example.com</b> (and on iPhone, add it to your Home Screen first).</div>`}
    <div class="hc-sec">this device</div>
    <div class="td-quick">
      ${sub?`<button class="qbtn on" onclick="pushOff()">🔕 Turn off here</button>`
            :`<button class="qbtn" ${secure?'':'disabled'} onclick="pushOn()">🔔 Turn on for this device</button>`}
      <button class="qbtn" onclick="pushTest()" ${PUSH&&PUSH.devices&&PUSH.devices.length?'':'disabled'}>Send a test</button>
      <span class="status" style="text-transform:none;letter-spacing:0">permission: ${esc(perm)}</span></div>
    <div class="hc-sec" style="margin-top:10px">subscribed devices</div>
    ${(PUSH&&PUSH.devices||[]).map(d=>`<div class="hs-row" style="cursor:default">
        <span class="hs-l">${esc(d.label)} <span class="status" style="text-transform:none;letter-spacing:0">· added ${esc(String(d.created_at).slice(0,10))}</span></span>
        <button class="qbtn" onclick="pushForget(${d.id})">✕ forget</button></div>`).join('')
      ||'<div class="status" style="text-transform:none;letter-spacing:0">No devices yet.</div>'}
    <div class="hc-sec" style="margin-top:12px">which channel each alert uses</div>
    <div class="hstats">${kinds.map(row).join('')}</div>
    <div class="foot"><button class="btn sec2" onclick="closeDlg()">Done</button></div>`);
}
async function pushOn(){
  try{
    if(Notification.permission!=='granted'){
      const p=await Notification.requestPermission();
      if(p!=='granted'){ toast('Notifications were not allowed'); return; }
    }
    const reg=await navigator.serviceWorker.ready;
    await loadPush();
    if(!PUSH||!PUSH.public_key){ toast('The Mini has no push key — check config/.env'); return; }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,
      applicationServerKey:b64ToU8(PUSH.public_key)});
    const label=(navigator.standalone||matchMedia('(display-mode: standalone)').matches?'App · ':'')
      +(/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Macintosh/.test(navigator.userAgent)?'Mac':'this device');
    await post('/push',{action:'subscribe',label,subscription:sub.toJSON()});
    toast('Notifications on for this device'); pushDlg();
  }catch(e){ toast('Could not turn on — '+e.message); }
}
async function pushOff(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){ const ep=sub.endpoint; await sub.unsubscribe();
      await loadPush();
      const mine=(PUSH.devices||[]).find(d=>ep.includes(d.host||''));
      if(mine) await post('/push',{action:'forget',id:mine.id}); }
    toast('Notifications off for this device'); pushDlg();
  }catch(e){ toast('Could not turn off — '+e.message); }
}
async function pushForget(id){ try{ await post('/push',{action:'forget',id}); pushDlg(); }catch(e){ toast(e.message); } }
async function pushTest(){
  try{ const r=await post('/push',{action:'test'});
    toast(r.sent?`Test sent to ${r.sent} device(s)`:'No device took it'+(r.dropped?` — ${r.dropped} dead subscription(s) removed`:''));
  }catch(e){ toast('Test failed — '+e.message); }
}
async function pushPref(kind,imessage,push){
  try{ const r=await post('/push',{action:'prefs',kind,imessage,push}); if(PUSH) PUSH.prefs=r.prefs; pushDlg(); }
  catch(e){ toast('Could not save — '+e.message); }
}

let FB={verdict:'bad',note:'',el:null};
const FB_VERDICTS={good:['👍','Good','keep this'],bad:['👎','Broken','something is wrong'],adjust:['🔧','Adjust','right idea, needs a change']};
function fbSel(el){
  // Short, readable path — enough for a session to find the thing again.
  const part=n=>{
    if(n.id) return '#'+n.id;
    const cls=[...n.classList].filter(c=>!/^(on|open|sel|kb|dragging|dropat)$/.test(c)).slice(0,2);
    return n.tagName.toLowerCase()+(cls.length?'.'+cls.join('.'):'');
  };
  const path=[]; let n=el;
  while(n&&n.nodeType===1&&path.length<4&&n!==document.body){ path.unshift(part(n)); if(n.id) break; n=n.parentElement; }
  return path.join(' ▸ ');
}
function fbDescribe(el){
  const r=el.getBoundingClientRect();
  const box=el.closest('.hcard,.row,.bundle,.scope,.sec,.dlg,.pane,.list-head,header')||el;
  return { sel:fbSel(el), text:(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),
    box:box===el?'':fbSel(box), rect:`${Math.round(r.width)}×${Math.round(r.height)} at ${Math.round(r.left)},${Math.round(r.top)}` };
}
function fbFlash(el){
  const r=el.getBoundingClientRect(), m=document.createElement('div');
  m.style.cssText=`position:fixed;left:${r.left-3}px;top:${r.top-3}px;width:${r.width+6}px;height:${r.height+6}px;
    border:2px solid var(--red);pointer-events:none;z-index:200;transition:opacity .4s ease;`;
  document.body.appendChild(m);
  setTimeout(()=>{ m.style.opacity='0'; setTimeout(()=>m.remove(),450); },900);
}
function fbPick(){
  FB.note=$('#fb-note')?.value||FB.note;
  closeDlg();
  document.body.style.cursor='crosshair';
  toast('Click the thing that is wrong — Esc to cancel');
  const done=()=>{ document.body.style.cursor=''; document.removeEventListener('click',onClick,true); document.removeEventListener('keydown',onKey,true); };
  const onClick=e=>{ e.preventDefault(); e.stopPropagation(); done(); FB.el=fbDescribe(e.target); fbFlash(e.target); fbDlg(); };
  const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(); fbDlg(); } };
  document.addEventListener('click',onClick,true);
  document.addEventListener('keydown',onKey,true);
}
function fbContext(){
  const crumb=($('#scope-name')?.innerText||'').replace(/\s+/g,' ').trim();
  const lens=TAB==='all'?'everything':TAB;
  return {
    screen:`${crumb||SCOPE.kind} (scope ${SCOPE.kind}${SCOPE.id?':'+SCOPE.id:''}) · lens ${lens} · group ${GROUP}${Q?` · search "${Q}"`:''}${OPEN?` · open ${OPEN}`:''}`,
    client:`${innerWidth}×${innerHeight} · skin ${document.documentElement.dataset.skin||'daylight'} · rail ${document.documentElement.dataset.rail==='slim'?'slim':'wide'} · build ${BUILD_VERSION||'?'}`,
    board:`swept ${String(BOARD.generated_at||'?').replace('T',' ').replace('Z',' UTC')} · ${ITEMS.length} items in view`,
    errors:FB_ERRS.length?FB_ERRS.map(e=>`${e.t} ${e.kind}: ${e.msg}`).join('\n  '):'none in this tab',
  };
}
function fbDlg(){
  const c=fbContext();
  const vbtn=k=>{ const [ic,name,hint]=FB_VERDICTS[k];
    return `<button class="qbtn" style="${FB.verdict===k?'border-color:var(--blue);color:var(--blue)':''}" onclick="FB.note=$('#fb-note').value;FB.verdict='${k}';fbDlg()" title="${hint}">${ic} ${name}</button>`; };
  dlg(`<h3>⚑ Flag this screen</h3>
    <div class="status" style="margin:2px 0 8px">It files as a dev request, carrying the element you point at and the state of this screen.</div>
    <div class="td-quick" style="margin-bottom:8px">${Object.keys(FB_VERDICTS).map(vbtn).join('')}</div>
    <textarea id="fb-note" class="tp-notes" placeholder="${FB.verdict==='good'?'What works here? (optional)':'What is wrong, and what should happen instead?'}"
      onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))fbSend()">${esc(FB.note||'')}</textarea>
    <div class="td-quick" style="margin:8px 0">
      <button class="qbtn" onclick="fbPick()">◎ ${FB.el?'Point at something else':'Point at the element'}</button>
      ${FB.el?`<button class="qbtn" onclick="FB.note=$('#fb-note').value;FB.el=null;fbDlg()">✕ Clear pointer</button>`:''}
    </div>
    ${FB.el?`<div class="row-note" style="display:block;white-space:normal;max-width:none">◎ ${esc(FB.el.sel)}${FB.el.text?` — "${esc(FB.el.text.slice(0,70))}"`:''}</div>`:''}
    ${devCode()?'':`<div class="hc-sec" style="margin-top:10px">🔒 pair this device</div>
      <div class="status" style="text-transform:none;letter-spacing:0;margin-bottom:6px">Reports are filed as dev requests, and this device has not been paired yet. Enter the code once — your note is kept.
        <br>To get one: on a device that is already paired, ⚙ → 🛠 Dev requests → 🔑 Pair another device.</div>
      <div class="td-quick"><input id="fb-code" class="tp-notes" style="min-height:0;max-width:240px" autocomplete="off"
        placeholder="XXXX-XXXX-XXXX-XXXX" onkeydown="if(event.key==='Enter')fbPair()">
        <button class="qbtn" onclick="fbPair()">🔑 Pair</button></div>`}
    <div class="hc-sec" style="margin-top:10px">Rides along</div>
    <div class="status" style="text-transform:none;letter-spacing:0;line-height:1.55">
      ${esc(c.screen)}<br>${esc(c.client)}<br>${esc(c.board)}<br>
      <span style="color:${FB_ERRS.length?'var(--red)':'var(--faint)'}">errors: ${esc(c.errors.replace(/\n\s*/g,' · '))}</span></div>
    <div class="foot" style="margin-top:12px"><button class="btn" onclick="fbSend()">⚑ File it (⌘⏎)</button>
      <button class="btn sec2" onclick="closeDlg()">Cancel</button></div>`);
  setTimeout(()=>$('#fb-note')?.focus(),30);
}
/* E189: mint a fresh code from a device that is already paired, and show it
   once. Everything else then re-pairs with it — no terminal, and an unpaired
   device still cannot mint. */
async function devNewCode(){
  if(!confirm('Mint a new pairing code?\n\nThis device stays paired. Every OTHER device will need the new code.')) return;
  try{
    const r=await post('/dev',{action:'newcode'},devHdr());
    try{ localStorage.setItem('gc2_dev_code',r.code); }catch(e){}
    dlg(`<h3>🔑 Pairing code</h3>
      <div class="status" style="text-transform:none;letter-spacing:0">Type this on the device you want to pair — in ⚑ or in Dev requests. It is shown once.</div>
      <div style="font-size:26px;font-weight:700;letter-spacing:3px;text-align:center;padding:18px 0;user-select:all">${esc(r.code)}</div>
      <div class="foot"><button class="btn" onclick="copyText('${esc(r.code)}','pairing code')">Copy</button>
        <button class="btn sec2" onclick="closeDlg()">Done</button></div>`);
  }catch(e){ toast(e.data?.pairing_required?'Only a paired device can mint a code':'Failed — '+e.message); }
}
async function fbPair(){
  const code=($('#fb-code')?.value||'').trim(); if(!code) return;
  FB.note=$('#fb-note')?.value||FB.note;
  try {
    await post('/dev',{action:'check'},{'X-GC-Dev-Code':code});
    try{ localStorage.setItem('gc2_dev_code',code); }catch(e){ toast('This browser won’t store the code — private window?'); return; }
    toast('Paired — filing your report');
    await fbSend();
  } catch(e){ toast(e.data?.pairing_required?'That code didn’t match':'Failed — '+e.message); }
}
async function fbSend(){
  const note=($('#fb-note')?.value||'').trim();
  if(!note&&FB.verdict!=='good'){ toast('Say what is wrong — that is the part a fix needs'); $('#fb-note')?.focus(); return; }
  FB.note=note;
  const [ic,name]=FB_VERDICTS[FB.verdict], c=fbContext();
  const first=(note.split('\n')[0]||'this screen').trim();
  const head=first.length>70?first.slice(0,69).replace(/\s+\S*$/,'')+'…':first;
  const text=`⚑ ${name} — ${head}\n\n${note||'(no note)'}\n\n`
    +(FB.el?`Element: ${FB.el.sel}${FB.el.text?`\n  text: "${FB.el.text}"`:''}${FB.el.box?`\n  inside: ${FB.el.box}`:''}\n  size: ${FB.el.rect}\n`:'Element: not pointed at\n')
    +`Screen: ${c.screen}\nClient: ${c.client}\nBoard: ${c.board}\nErrors: ${c.errors}`;
  try {
    await post('/dev',{action:'add',text,account:ACCT},devHdr());
    closeDlg(); FB={verdict:'bad',note:'',el:null};
    toast('Filed ⚑ — it is in the dev queue');
    loadDev();
  } catch(e){
    if(e.data?.pairing_required){
      // Keep the report on screen — the note is the work, the code is a formality.
      try{ localStorage.removeItem('gc2_dev_code'); }catch(_){}
      fbDlg(); toast('This device needs the pairing code — enter it below, your note is kept');
    }
    else toast('Could not file it — '+e.message);
  }
}

/* ================= keyboard ================= */
document.addEventListener('keydown', e=>{
  // E164: ⚑ works from anywhere, including mid-typing — you flag what you see.
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(e.key==='F'||e.key==='f')){ e.preventDefault(); fbDlg(); return; }
  if(e.target.matches('input,textarea,select,[contenteditable]')){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='/' ){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='Escape'){
    // E204: Esc steps back one level — a dialog, then the pane, then an open group
    const busy=document.querySelector('#dlg-back.open,.ovl.open');
    if(SPLIT&&!OPEN&&!busy){ closeSplit(); return; }
    closeDlg(); closeOvl(); closePane(); return; }
  // E204: t = add to todo (the selection, else the row under the cursor or
  // the open email) — Shortwave's one-key "Add to todo".
  if(e.key==='t'&&!e.metaKey&&!e.ctrlKey){
    const keys=SEL.size?[...SEL]:(VISIBLE[KB]?[VISIBLE[KB].key]:(OPEN?[OPEN]:[]));
    const mail=keys.filter(k=>k.startsWith('m:'));
    if(mail.length){ e.preventDefault(); todoPick(mail); return; }
  }
  if(e.key==='j'||e.key==='k'){
    KB=Math.max(0,Math.min(VISIBLE.length-1,KB+(e.key==='j'?1:-1)));
    renderList();
    const el=document.querySelector('.row.kb'); if(el) el.scrollIntoView({block:'nearest'});
    // Preview mode: the selection IS the preview (debounced so held-down
    // j/k doesn't fire a thread fetch per row).
    if(PREVIEW && VISIBLE[KB]){
      clearTimeout(window._pvT);
      window._pvT=setTimeout(()=>{ const c=VISIBLE[KB]; if(c) openItem(c.key,false); },260);
    }
  }
  // E208: c = compose, as in Gmail and Shortwave.
  if(e.key==='c'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); composeDlg(); return; }
  const cur=VISIBLE[KB];
  if(!cur) return;
  if(e.key==='Enter'||e.key==='o') openItem(cur.key);
  if(e.key==='e'&&cur.type==='mail') archiveItem(cur.key);
  if(e.key==='h') handledItem(cur.key);
  if(e.key==='p') pinItem(cur.key);
  if(e.key==='r'&&cur.type==='mail') replyOptions(cur.key);
  if(e.key==='s') snoozeDlg(cur.key);
  if(e.key==='x') toggleSel(cur.key);
});

/* ------- pane resize (E68): drag the left edge; width persists ------- */
(function(){
  const saved=localStorage.getItem('gc2_pane_w');
  if(saved) document.documentElement.style.setProperty('--pane-w', saved);
  let dragging=false;
  $('#pane').addEventListener('mousedown', e=>{
    const r=$('#pane').getBoundingClientRect();
    if(e.clientX-r.left>8) return;
    dragging=true; e.preventDefault();
    document.body.classList.add('pane-resizing');
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const r=$('#pane').getBoundingClientRect();
    const w=Math.min(Math.max(r.right-e.clientX, 380), innerWidth*0.75);
    document.documentElement.style.setProperty('--pane-w', Math.round(w)+'px');
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging=false;
    document.body.classList.remove('pane-resizing');
    localStorage.setItem('gc2_pane_w',
      document.documentElement.style.getPropertyValue('--pane-w')||'56%');
  });
})();

/* stale-tab reload bar (E28) */
let BUILD_VERSION=null, VERSION_STALE=false;
async function checkVersion(){
  try {
    const out=await fetch('/version',{cache:'no-store'}).then(r=>r.json());
    if(!out.ok||!out.version) return;
    if(BUILD_VERSION===null){ BUILD_VERSION=out.version; return; }
    if(out.version===BUILD_VERSION) return;
    VERSION_STALE=true;
    notify('warn','This tab is running an old version of Grand Central — reload to pick up the latest.');   // E156
    if(document.getElementById('upbar')) return;
    const bar=document.createElement('div'); bar.id='upbar';
    bar.innerHTML='Grand Central was updated.<button class="btn" onclick="location.reload()">Reload</button><button class="btn sec2" onclick="this.parentNode.remove()">Later</button>';
    document.body.appendChild(bar);
  } catch(e){}
}
setInterval(checkVersion,60_000); checkVersion();
/* E147 (Bart filed on a stale tab and the new move-out never ran): once the
   tab KNOWS it's outdated, every write action nags — dismissing the bar no
   longer silences it, because acting on old code is how changes get lost. */
const _post_real=post;
post=async function(url,body,headers){
  if(VERSION_STALE&&!post._warned){
    post._warned=true; setTimeout(()=>{ post._warned=false; },120_000);
    toast('⚠ This tab is running an OLD version — reload to get current behavior');
    if(!document.getElementById('upbar')) checkVersion();
  }
  return _post_real(url,body,headers);
};

/* connection watchdog (E155, dev request #4) ==============================
   The browser only fires 'offline' when the DEVICE loses its network — when
   the Cloudflare tunnel drops, navigator.onLine stays true, polls fail
   silently, and sends/saves die with a cryptic "Failed to fetch" in a tiny
   status line. Watch every same-origin request instead: any network failure
   or Cloudflare 5xx raises a red banner, a 5s probe watches for the tunnel's
   return, and recovery flashes green + resyncs. */
let NET={down:false,since:null,probe:null};
const _fetch_raw=window.fetch.bind(window);
window.fetch=function(url,opts){
  const local=typeof url==='string'&&(url.startsWith('/')||url.startsWith(location.origin));
  const p=_fetch_raw(url,opts);
  if(!local) return p;
  return p.then(r=>{
    // 502/504 + Cloudflare's own 52x/530 mean the tunnel, not the app, failed
    if(r.status===502||r.status===504||(r.status>=520&&r.status<=530)) netDown('HTTP '+r.status);
    else netUp();
    return r;
  }, e=>{ netDown(e.message); throw e; });
};
function netDown(why){
  const first=!NET.down;
  if(first){ NET.down=true; NET.since=new Date(); sfx('err');
    if(typeof notify==='function') notify('err','Connection to Grand Central lost at '+NET.since.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' — the tunnel stopped answering ('+why+')'); }
  let b=document.getElementById('netbar');
  if(!b){ b=document.createElement('div'); b.id='netbar'; document.body.appendChild(b); }
  b.className='';
  b.innerHTML='⚡ <b>Connection lost</b> since '+NET.since.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+
    ' — nothing is reaching Grand Central. Keep this tab open: what you\'ve typed is safe here; retry once this turns green.';
  if(!NET.probe) NET.probe=setInterval(()=>{ fetch('/version?probe=1',{cache:'no-store'}).catch(()=>{}); },5000);
}
function netUp(){
  if(!NET.down) return;
  NET.down=false; clearInterval(NET.probe); NET.probe=null;
  const mins=Math.max(1,Math.round((Date.now()-NET.since)/60000));
  const b=document.getElementById('netbar');
  if(b){ b.className='back'; b.innerHTML='✓ Reconnected — syncing…'; setTimeout(()=>b.remove(),4000); }
  if(typeof notify==='function') notify('info','Reconnected at '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' — the connection was down ~'+mins+' min');
  sfx('ack'); loadMailTodos();
}

/* notifications (E156, dev request #3) ====================================
   A simple bell: alerts accumulate here instead of vanishing with a toast —
   connection drops/recoveries (E155), a mail account or API key that stopped
   working, a sweeper that missed its slot, a stale tab. Kept in localStorage
   (last 50); opening the panel marks everything seen. An identical text never
   stacks — it just refreshes its timestamp. */
let NOTIFS=[];
try{ NOTIFS=JSON.parse(localStorage.getItem('gc2_notifs')||'[]'); }catch(e){}
function nfSave(){ try{ localStorage.setItem('gc2_notifs', JSON.stringify(NOTIFS.slice(0,50))); }catch(e){} }
function notify(kind,text){
  const dup=NOTIFS.find(n=>n.text===text);
  if(dup) dup.ts=Date.now();
  else NOTIFS.unshift({ts:Date.now(),kind:kind||'info',text,seen:false});
  NOTIFS=NOTIFS.slice(0,50);
  nfSave(); nfBadge();
  const m=$('#nf-menu'); if(m&&!m.hidden) nfRender();
}
const agoTxt=ts=>{ const s=(Date.now()-ts)/1000;
  return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago'
    :new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); };
function nfBadge(){ const b=$('#nf-badge'); if(!b) return;
  const n=NOTIFS.filter(x=>!x.seen).length; b.hidden=!n; b.textContent=n>9?'9+':n; }
function nfRender(){
  $('#nf-menu').innerHTML='<h5>Notifications</h5>'+
    (NOTIFS.length?NOTIFS.map(n=>
      `<div class="nf-row${n.seen?'':' new'}"><span>${n.kind==='err'?'⛔':n.kind==='warn'?'⚠️':'ℹ️'}</span>
       <div>${esc(n.text)}<div class="nf-ts">${agoTxt(n.ts)}</div></div></div>`).join('')
      +'<hr><button onclick="NOTIFS=[];nfSave();nfBadge();nfRender()">Clear all</button>'
     :'<div class="nf-empty">Nothing yet — connection drops, credential problems, and a stuck sweeper will land here.</div>')
    // E190: this panel only catches alerts while a tab is open. The way to be
    // told when it is not is one click away, and it belongs here.
    + `<hr><button onclick="nfClose();pushDlg()">🔔 ${(window.Notification&&Notification.permission==='granted')?'Notification settings':'Get these on your Mac and phone…'}</button>`;
}
function nfClose(){ const m=$('#nf-menu'); if(m&&!m.hidden){ m.hidden=true; NOTIFS.forEach(n=>n.seen=true); nfSave(); nfBadge(); } }
$('#nf-btn').onclick=e=>{ e.stopPropagation(); meClose(); const m=$('#nf-menu'); if(m.hidden){ nfRender(); m.hidden=false; } else nfClose(); };
document.addEventListener('click', e=>{ if(!e.target.closest('#nf-menu')) nfClose(); });
nfBadge();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ================= boot ================= */
(async function boot(){
  $('#list').innerHTML='<div class="empty">Loading…</div>';
  try {
    await loadAccounts();
    await Promise.all([loadMailTodos(), loadBoard(), loadConn(), loadSigs(), loadSteward(), loadWizard(), loadBraindump()]);
  }
  catch(e){ $('#list').innerHTML=`<div class="empty">Could not load — ${esc(e.message)}</div>`; }
  const b=$('#pv-state'); if(b) b.textContent=PREVIEW?'on':'off';
  $('#pv-btn')?.classList.toggle('on',PREVIEW);
  const sx=$('#sfx-state'); if(sx) sx.textContent=localStorage.getItem('gc2_sfx')==='0'?'off':'on';
  diagState();       // E206: reflect whether viewport diagnostics are armed
  applySkinIcon();   // E129: the saved skin's ship, from first paint
  if(PREVIEW && innerWidth>980) closePane();   // opens the persistent pane
  const p=new URLSearchParams(location.search);
  // E187: app shortcuts (long-press the icon) open a view directly.
  const go=p.get('go');
  if(go==='today') goToday(); else if(go==='todos') goTodos();
  else if(go==='dev'){ const a=p.get('account'); if(a&&ACCOUNTS.includes(a)&&a!==ACCT) setAcct(a).then(()=>setScope('dev',null)); else setScope('dev',null); }
  else if(go==='inbox'){ setScope('inbox',null); TAB='all'; syncTabs(); renderList(); }
  const th=p.get('thread');
  if(th&&th.includes(':')) openItem('m:'+th);
  if(p.get('wn')) openWhatsNew();
  // E197: ?nopoll=1 leaves the board static after first paint. Headless
  // Chrome waits for the page to go idle, and four live polls mean it never
  // does — so this is what makes the UI half of selftest.py possible.
  if(!new URLSearchParams(location.search).get('nopoll')){
    setInterval(loadMailTodos,POLL_MS);
    setInterval(loadBoard,BOARD_MS);
    setInterval(loadSteward,BOARD_MS);
    setInterval(loadWizard,BOARD_MS);
  }
})();
</script>
</body>
