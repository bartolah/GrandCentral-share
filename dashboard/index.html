  .row .l2 .row-note { flex: 0 0 auto; }
  .row .meta { padding-left: 8px; }
  .row:hover .hl { opacity: .35; }
  /* meta lives IN line 1 — name truncates, buttons never overlap content */
  .row .meta { flex: 0 0 auto; padding-left: 10px; }
  .row .lead { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; position: relative; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
  .row .lead .acct { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card); z-index: 2; }
  .avimg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; background: #fff; }
  .row .lead.todo-ic { background: none; color: var(--blue); font-size: 19px; }
  /* Sits exactly over the avatar (rows are top-aligned since E64). */
  .row .selbox { position: absolute; left: 12px; top: var(--row-pad); width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--muted); display: none; align-items: center; justify-content: center; z-index: 2; }
  .row:hover .selbox, .row.sel .selbox { display: flex; }
  .row.sel .selbox { background: #e8b93e; color: #fff; border-color: #e8b93e; }
  .row .body { flex: 1 1 auto; min-width: 0; }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; overflow: hidden; }
  .row .who { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .row.read .who { font-weight: 500; color: var(--muted); }
  .row .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--subj); font-weight: 620; }
  .row.read .subj { color: var(--muted); font-weight: 400; }
  /* unread marker: a lit dot in the row gutter (todos never carry it —
     they render with .read by construction) */
  .row:not(.read)::before {
    content: ''; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%; background: var(--blue);
    box-shadow: 0 0 7px var(--blue);
  }
  /* Todo titles get the whole line (E54 feedback: they truncated way too
     short) — flexible like a subject, bold like a sender, no width cap;
     the ellipsis only kicks in when the window truly runs out. */
  .row .subj.todo-title { font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .row.read .subj.todo-title { color: var(--ink); }

  /* E60: emails grouped under a todo */
  .chip.mailgrp { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .chip.mailgrp.on { background: var(--blue); color: #fff; }

  /* E55: note-to-self on a thread — a little amber sticky */
  .row-note {
    color: var(--note-head); background: var(--amber-soft); border-radius: 6px; display: inline-block;
    padding: 0 7px; font-size: 12px; margin: 1px 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  body.pane-open .row .row-note { display: none; }
  .pane-note {
    margin: 8px 20px 0; padding: 7px 12px; background: var(--amber-soft); color: #6b4e10;
    border-radius: 9px; font-size: 12.5px; cursor: pointer; border: 1px solid #f3e2bd;
  }
  .pane-note.empty-note { background: none; border-style: dashed; color: var(--faint); }
  .pane-note:hover { filter: brightness(.97); }
  .row .snip { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; }
  .row .meta .st { color: var(--amber); }
  /* E93.1: the action strip FLOATS over the row's top-right corner —
     swapping it in-line for the date grew line 1 and bounced the row. */
  .row .acts { display: none; gap: 2px; position: absolute; top: 50%; transform: translateY(-50%); right: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    padding: 1px 3px; box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 3; }
  .row:hover .acts { display: flex; }
  .row:hover .meta .when { visibility: hidden; }
  .row .acts button { padding: 4px 7px; border-radius: 7px; font-size: 13px; color: var(--muted); }
  .row .acts button:hover { background: var(--chip-bg); color: var(--ink); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 8px; background: var(--chip-bg); color: var(--muted); font-size: 11px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .chip.goal { background: var(--amber-soft); color: var(--note-head); }
  .chip.due { background: var(--red-soft); color: var(--red); }
  .chip.new { background: var(--blue-soft); color: var(--blue); cursor: default; }
  .chip.lbl { background: #eef4ea; color: #4a6b3a; }
  .chip.pri-high { background: var(--red-soft); color: var(--red); font-weight: 600; }
  .chip.pri-medium { background: var(--amber-soft); color: var(--note-head); font-weight: 600; }
  .chip.pri-low { background: var(--chip-bg); color: var(--faint); }
  .chip:hover { filter: brightness(.96); }
  .empty { color: var(--faint); text-align: center; padding: 40px 0; }

  /* E166: the Today feed — Home is ONE ranked stream (needs you · the brief ·
     overdue · waiting · projects · the numbers) instead of a grid of cards.
     Bart picked it off the feed mockups; the card grid lives on behind ⊞. */
  .fd-wrap { max-width: 1000px; margin: 0 auto; padding-bottom: 10px; }
  .fd-acts { display: flex; gap: 6px; margin-top: 8px; }
  .fd-acts button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .fd-acts button:hover { border-color: var(--blue); color: var(--blue); }
  .fd-acts button.go { border-color: var(--blue); color: var(--blue); }
  .fd-flat { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer; }
  .fd-flat:hover { background: var(--hover); }
  .fd-flat .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 12px; }
  .fd-chips .chip { padding: 3px 10px; font-size: 11.5px; }
  .fd-foot { text-align: center; color: var(--faint); font-size: 11px; padding: 24px 0 6px; }
  .fd-view { display: flex; gap: 4px; flex: 0 0 auto; }
  .fd-view button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px; font-size: 12px; color: var(--muted); background: var(--card); }
  .fd-view button.on { border-color: var(--blue); color: var(--blue); }
  @media (max-width: 700px) { .fd-l1 .who { max-width: 100%; } }

  /* E171: accounts across the top. The account is the CONTEXT you work in;
     the rail filters within it. Everything below the strip — Home, Today,
     Todos, the inbox, the Wizard, the calendar — is that account only. */
  /* E184: no z-index here on purpose. At 60 the strip covered the ⚙, 🔔 and
     ◐ menus — their z-index (130) is scoped inside .top's own stacking
     context (40) and so could never beat it. Lowering it to 30 fixed those
     and broke the strip's OWN menu, which was then trapped in the strip's
     context and fell behind the list. With no z-index the strip creates no
     context at all: it still can't overlap anything (it is in normal flow),
     and its dropdown competes at the root like every other menu. */
  .acct-tabs { display: flex; align-items: stretch; gap: 2px; padding: 0 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; position: relative; }
  /* E187: installed as an app — Safari hands us the whole window, including
     the notch and the home-indicator strip, so the chrome insets itself. */
  body.app-mode .top { padding-top: calc(10px + var(--safe-top)); }
  body.app-mode .rail { padding-bottom: calc(20px + var(--safe-bot)); }
  body.app-mode .dock { padding-bottom: var(--safe-bot); }
  body.app-mode #list { padding-bottom: var(--safe-bot); }
  .acct-tabs::-webkit-scrollbar { height: 0; }
  .acct-tab { display: flex; align-items: center; gap: 7px; padding: 8px 13px; white-space: nowrap;
    color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; cursor: pointer; background: none; }
  .acct-tab:hover { color: var(--ink); background: var(--hover); }
  .acct-tab.on { color: var(--ink); font-weight: 650; border-bottom-color: var(--blue); background: var(--card); }
  .acct-tab .n { color: var(--faint); font-size: 11.5px; font-weight: 500; }
  .acct-tab.on .n { color: var(--blue); }
  @media (max-width: 700px) { .acct-tab { padding: 8px 10px; font-size: 12.5px; } }

  /* E174: the Today view, in Google Inbox's grammar — time buckets, white
     cards floating on the ground, bundles as one row, reminders among the
     mail, a pin filter and a sweep per section. */
  .ib-wrap { max-width: 1060px; margin: 0 auto; padding: 6px 12px 28px; }
  .ib-head { display: flex; align-items: center; gap: 10px; padding: 16px 6px 8px; }
  .ib-head .t { color: var(--muted); font-size: 13px; font-weight: 500; }
  .ib-head .sp { flex: 1 1 auto; }
  .ib-sweep { color: var(--faint); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 2px; }
  .ib-sweep:hover { color: var(--green); background: var(--hover); }
  .ib-card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .ib-row { display: flex; align-items: flex-start; gap: 14px; padding: 13px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft); position: relative; }
  .ib-row:last-child { border-bottom: none; }
  .ib-row:hover { background: var(--hover); }
  .ib-row.pinned { box-shadow: inset 3px 0 0 var(--blue); }
  .ib-ic { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 12.5px; color: #fff; overflow: hidden; position: relative; }
  .ib-ic.glyph { background: none; font-size: 20px; }
  .ib-body { flex: 1 1 auto; min-width: 0; }
  .ib-l1 { display: flex; align-items: baseline; gap: 8px; }
  .ib-who.unread { font-weight: 700; }
  .ib-bundle { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .ib-count { background: var(--chip-bg); color: var(--muted); border-radius: 2px; padding: 1px 6px; font-size: 11.5px; font-weight: 600; }
  .ib-when { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; flex: 0 0 auto; }
  .ib-senders { color: var(--muted); font-size: 13.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Highlights: what Inbox pulled out of the message so you did not open it. */
  .ib-hl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ib-hl .h { display: inline-flex; align-items: center; gap: 6px; background: var(--chip-bg); color: var(--muted);
    border-radius: 2px; padding: 4px 9px; font-size: 12px; max-width: 100%; }
  .ib-hl .h b { color: var(--ink); font-weight: 600; }
  .ib-hl .h.due { background: var(--red-soft); color: var(--red); }
  .ib-hl .h.ai { background: var(--blue-soft); color: var(--blue); white-space: normal; text-align: left; }
  .ib-pin { flex: 0 0 auto; color: var(--faint); font-size: 14px; padding: 2px 4px; border-radius: 2px; opacity: 0; }
  .ib-row:hover .ib-pin, .ib-row.pinned .ib-pin { opacity: 1; }
  .ib-row.pinned .ib-pin { color: var(--blue); }
  .ib-pin:hover { color: var(--blue); }
  .ib-empty { color: var(--faint); text-align: center; padding: 44px 0; }
  .ib-nest { background: var(--panel); border-bottom: 1px solid var(--line-soft); padding: 2px 0 2px 26px; }
  .ib-nest .row { border-radius: 0; }
  /* E178: one card grammar for every list. Rows inside a card are separated
     by a hairline and square off; the section name sits above the card. */
  .ib-card { border: 1px solid var(--line); margin-bottom: 14px; }
  /* dev #28: the way from Home to the whole inbox */
  .fd-go { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 12px; }
  .fd-go .btn { flex: 1 1 auto; justify-content: center; }
  @media (max-width: 640px) { .fd-go { padding: 4px 12px 12px; } }
  .ib-card .row { border-radius: 0; margin: 0; border-bottom: 1px solid var(--line-soft); }
  .ib-card .row:last-child { border-bottom: none; }
  .ib-card .ib-row:last-child { border-bottom: none; }
  .ib-head .ib-count { flex: 0 0 auto; }
  .ib-head .fold { color: var(--faint); cursor: pointer; padding: 0 4px; }
  .ib-head .secact {
    font-size: 10.5px; letter-spacing: .5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: var(--r, 7px); padding: 2px 7px; margin-left: 4px; text-transform: none;
    visibility: hidden; white-space: nowrap; cursor: pointer;
  }
  .ib-head:hover .secact { visibility: visible; }
  .ib-head .secact:hover { color: var(--ink); border-color: var(--muted); }
  .ib-head .secact.warn:hover { color: var(--red); border-color: var(--red); }
  .ib-card .sec-prev { padding: 10px 16px; margin: 0; }
  .ib-card .more-link { padding: 10px 16px; }
  .ib-toggle { display: flex; align-items: center; gap: 6px; }
  .ib-toggle button { border: 1px solid var(--line); border-radius: 2px; padding: 3px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .ib-toggle button.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  @media (max-width: 700px) { .ib-row { padding: 12px 10px; gap: 10px; } }

  /* E167: the calendar's time view — the day in clock order, with the work
     that belongs to each meeting docked under it (the second feed mockup). */
  .tl { padding: 4px 6px 20px; overflow-y: auto; flex: 1; }
  .tl-row { display: flex; gap: 14px; padding: 8px 10px; }
  .tl-time { flex: 0 0 52px; text-align: right; color: var(--faint); font-size: 11.5px; padding-top: 2px; }
  .tl-time.strong { color: var(--ink); font-weight: 700; }
  .tl-rail { flex: 0 0 9px; display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-top: 6px; flex: 0 0 auto; }
  .tl-dot.key { background: var(--amber); }
  .tl-dot.now { width: 9px; height: 9px; background: var(--blue); box-shadow: var(--glow); margin-top: 2px; }
  .tl-line { flex: 1 1 auto; width: 1px; background: var(--line); }
  .tl-body { flex: 1 1 auto; min-width: 0; padding-bottom: 4px; }
  .tl-title { font-weight: 620; }
  .tl-title.key { font-weight: 700; }
  .tl-meta { color: var(--muted); font-size: 12px; }
  .tl-dock { margin-top: 6px; border-left: 2px solid var(--line); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
  .tl-dock.key { border-left-color: var(--amber); }
  .tl-dock .d-row { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .tl-dock .d-row:hover b, .tl-dock .d-row:hover .t { color: var(--blue); }
  .tl-dock .d-row .t { color: var(--muted); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-now-head { display: flex; align-items: center; gap: 10px; }
  .tl-now-head .lbl { color: var(--blue); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; }
  .tl-now-head .ln { flex: 1 1 auto; height: 1px; background: var(--blue); opacity: .45; }
  .tl-open { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-top: 6px; }
  .tl-open.fits { border-color: var(--blue); background: var(--blue-soft); }
  .cal-view { display: flex; gap: 4px; }
  .cal-view button { border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; font-size: 12px; color: var(--muted); background: var(--card); }
  .cal-view button.on { border-color: var(--blue); color: var(--blue); }

  /* E69: Today's free-form notes */
  #daynote { margin: 10px 16px 0; border: 1px solid var(--note-line); background: var(--note-bg); border-radius: 12px; padding: 10px 14px; }
  #daynote .dn-head { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--note-head); font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
  #dn-status { font-size: 10.5px; letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 400; }
  #dn-text {
    width: 100%; border: none; outline: none; background: none; resize: vertical;
    min-height: 72px; max-height: 40vh; margin-top: 6px;
    font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--note-ink);
  }

  /* The three-line row survives the open pane (the old E48 compact rule
     hid the preview line, which in persistent-preview mode meant ALWAYS —
     Bart: "what happened to my 3 rows?"). Lines truncate; nothing hides. */
  body.pane-open .row { padding: 10px 12px; }
  body.pane-open .group-pick { display: none; }

  /* ---------- bulk bar ---------- */
  .bulkbar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: none; align-items: center; gap: 10px; background: #22304a; color: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 0 10px 30px rgba(15,25,40,.4); font-size: 13px; }
  .bulkbar.show { display: flex; }
  .bulkbar button { color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 5px 12px; font-size: 12px; }
  .bulkbar button:hover { background: rgba(255,255,255,.12); }

  /* ---------- pane ---------- */
  .pane { flex: 0 0 var(--pane-w, 56%); margin-left: 12px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden; position: relative; }
  /* E68: drag the pane's left edge to resize (width persists) */
  .pane::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 10; }
  .pane:hover::before { background: linear-gradient(90deg, var(--blue-soft), transparent); }
  body.pane-resizing { cursor: col-resize; user-select: none; }
  body.pane-resizing .htmlbody { pointer-events: none; }
  .pane.open { display: flex; }
  .pane-tools { display: flex; align-items: center; gap: 2px; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .pane-tools .sp { flex: 1; }
  .pane-tools .tool.only-sm { display: none; }   /* the ⋯ is a phone affordance */
  .tool { padding: 6px 9px; border-radius: 8px; color: var(--muted); font-size: 14px; }
  .tool:hover { background: var(--line-soft); color: var(--ink); }
  .tool.warn:hover { background: var(--red-soft); color: var(--red); }
  .pane-head { padding: 12px 20px 4px; }
  .pane-head h2 { font-size: 16.5px; display: inline; margin-right: 8px; }
  .lbl-add { border: 1px dashed var(--line); border-radius: 8px; padding: 1px 8px; font-size: 11px; color: var(--faint); background: none; width: 90px; }
  .ai-line { display: flex; gap: 8px; color: var(--muted); font-size: 12.5px; padding: 8px 20px 10px; }
  .msgs { flex: 1 1 auto; overflow-y: auto; padding: 4px 20px 16px; }
  .msg { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .msg:last-child { border-bottom: none; }
  .msg .mh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .msg .mav { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; vertical-align: middle; margin-right: 8px; position: relative; overflow: hidden; }
  .msg .mh b { font-size: 13.5px; }
  .msg .mh .t { color: var(--faint); font-size: 12px; }
  .ua-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 20px; }
  .ua-row { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--r, 10px); padding: 8px 12px; background: var(--card); flex-wrap: wrap; }
  .ua-main { flex: 1 1 260px; min-width: 0; }
  .ua-t { font-weight: 600; }
  .ua-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
  .ct-row { flex-wrap: nowrap; align-items: flex-start; }
  .ct-acts { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .ct-row .lead { width: 34px; height: 34px; border-radius: var(--av, 50%); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex: 0 0 auto; }
  .ct-row .ct-name { font: inherit; font-weight: 600; border: 1px solid transparent; background: none; color: var(--ink); padding: 2px 4px; border-radius: 6px; width: 100%; }
  .ct-row .ct-notes { font: inherit; font-size: 12.5px; border: 1px solid transparent; background: none; color: var(--muted); padding: 2px 4px; border-radius: 6px; width: 100%; margin-top: 3px; }
  .ct-row input:hover, .ct-row input:focus { border-color: var(--line); background: var(--input-bg, var(--card)); }
  .ua-notes { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-q { border-left: 3px solid var(--amber, #e8a33d); padding: 6px 10px; margin: 6px 0; background: var(--amber-soft, var(--chip-bg)); border-radius: 6px; }
  .dev-q textarea { width: 100%; margin-top: 6px; }
  /* E217: value score + sales-split chips */
  .val { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .val-hi { background: var(--blue); color: var(--card, #fff); }
  .val-mid { background: var(--blue-soft); color: var(--blue); }
  .val-lo { background: var(--chip-bg); color: var(--faint); }
  .chip.ty-Prospect { background: var(--blue-soft); color: var(--blue); }
  .chip.ty-Coldpitch { background: var(--chip-bg); color: var(--muted); }
  .chip.ty-Spam { background: var(--red-soft); color: var(--red); }
  /* E212: the Classified button */
  .cls-bar { padding: 2px 20px 8px; font-size: 12.5px; }
  .cls-sum { color: var(--muted); text-align: left; padding: 3px 0; line-height: 1.4; }
  .cls-sum b { color: var(--ink); font-weight: 600; }
  button.cls-sum:hover { color: var(--ink); }
  .cls-sum.muted, .cls-bar .muted { color: var(--faint); }
  .cls-panel { margin-top: 6px; border: 1px solid var(--line); border-radius: var(--r, 10px); padding: 10px 12px; background: var(--card); }
  .cls-row { display: grid; grid-template-columns: 92px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 3px 0; }
  .cls-k { color: var(--muted); }
  .cls-v { flex: 1 1 auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .cls-v select, .cls-v input[type=date] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--input-bg, var(--card)); color: var(--ink); }
  .cls-src { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); }
  .cls-src.cls-you { background: var(--blue-soft); color: var(--blue); }
  .cls-src.cls-jev { background: var(--amber-soft, var(--chip-bg)); color: var(--note-head, var(--muted)); }
  .cls-why { color: var(--muted); padding: 0 0 6px; }
  .cls-reasons { margin: 6px 0 0 18px; padding: 0; color: var(--muted); }
  .cls-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  @media (max-width: 640px) { .cls-bar { padding: 2px 14px 8px; } .cls-row { grid-template-columns: 78px minmax(0,1fr) auto; gap: 6px; }
    .cls-v input[type=date] { max-width: 150px; } }
  /* Dev #26: reply / reply all / forward ONE message of a thread */
  .msg .mh .mact { margin-left: auto; display: flex; gap: 2px; opacity: .55; }
  .msg:hover .mh .mact, .msg .mh .mact:focus-within { opacity: 1; }
  .msg .mh .mact button { padding: 2px 6px; border-radius: 7px; color: var(--muted); display: inline-flex; }
  .msg .mh .mact button:hover { background: var(--chip-bg); color: var(--ink); }
  .msg .mh .mact svg + svg { margin-left: -7px; }
  .msg .mrcpt { color: var(--faint); font-size: 11.5px; margin: 2px 0 0 38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }

  /* E65: rich body editor */
  .rb-bar { display: flex; gap: 2px; border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0; padding: 5px 8px; background: #f5f7fa; }
  .rb-bar button { padding: 3px 9px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .rb-bar button:hover { background: var(--chip-bg); color: var(--ink); }
  .rb-body {
    width: 100%; min-height: 140px; max-height: 40vh; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 0 0 9px 9px; padding: 10px 12px;
    background: var(--input-bg); outline: none; white-space: pre-wrap; font-size: 13.5px; line-height: 1.5;
  }
  .rb-body:focus { border-color: var(--blue); }
  .rb-body a { color: var(--blue); }

  /* E63: recipient chip fields */
  .chipfield {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px;
    background: var(--input-bg); min-height: 40px; cursor: text; width: 100%;
  }
  .chipfield:focus-within { border-color: var(--blue); }
  .rchip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    background: var(--blue-soft); color: var(--ink); border-radius: 14px;
    padding: 3px 6px 3px 11px; font-size: 12.5px; font-weight: 500;
  }
  .rchip.bad { background: var(--red-soft); color: var(--red); }
  .rchip b { cursor: pointer; color: var(--muted); font-size: 13px; padding: 0 4px; border-radius: 50%; }
  .rchip b:hover { color: var(--red); }
  .chip-in { flex: 1 1 120px; min-width: 120px; border: none !important; outline: none; background: none; padding: 3px 2px !important; font-size: 13px; }

  /* E62: people hover cards + contact capture */
  /* E181 (Bart: "why do we have the dashes under the names of people?"): the
     dash marks a name you can hover for a contact card — but a permanent
     dotted rule under every sender is noise in a list you scan. The hint
     arrives with the pointer instead; the hover card is unchanged. */
  .person { cursor: default; border-bottom: 1px dashed transparent; }
  .person:hover { color: var(--blue); border-bottom-color: var(--blue); }
  #ppop {
    position: fixed; z-index: 160; width: 320px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 14px 44px rgba(20,30,50,.22); font-size: 13px;
  }
  #ppop .pp-head { display: flex; align-items: center; gap: 10px; }
  #ppop .mav { width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; flex: 0 0 auto; }
  #ppop .pp-em { color: var(--muted); font-size: 12px; cursor: pointer; }
  #ppop .pp-em:hover { color: var(--blue); }
  #ppop .pp-meta { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
  #ppop .pp-acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .stw-row .mav { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; flex: 0 0 auto; }
  .msg .mb { margin-top: 8px; white-space: pre-wrap; color: var(--ink); font-size: 13.5px; overflow-wrap: break-word; }
  .msg iframe.htmlbody { width: 100%; border: none; background: #fff; min-height: 60px; }
  /* E172: a plain email is rendered in the board's own palette, so the frame
     must not sit on white; a designed email keeps its paper, framed so it
     reads as a document rather than a hole punched in the UI. */
  .msg iframe.htmlbody.native { background: transparent; }
  /* E202: no outline around the paper — Bart found the body over-bordered. */
  /* E173: art-directed mail keeps its design, but a dark board should not be
     lit up by it — take the glare off without touching the layout. */
  html:not([data-skin="daylight"]) .msg iframe.htmlbody.paper { filter: brightness(.82) saturate(.92); }
  html:not([data-skin="daylight"]) .msg iframe.htmlbody.paper:hover { filter: none; }
  .fold-msgs { text-align: center; color: var(--blue); font-size: 12.5px; padding: 8px; cursor: pointer; }
  /* E107: earlier messages collapse to one-liners; quoted history trims behind ••• */
  .mcol { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; min-width: 0; }
  .mcol:hover { background: var(--hover); }
  .mcol .mav { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 11px; flex: 0 0 auto; position: relative; overflow: hidden; }
  .mcol b { font-size: 13px; flex: 0 0 auto; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mcol .csnip { color: var(--faint); font-size: 12.5px; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mcol .t { color: var(--faint); font-size: 11.5px; flex: 0 0 auto; }
  .msg .mh { cursor: pointer; }
  .qdots { display: inline-block; margin: 8px 0 0 38px; padding: 1px 12px; border-radius: 9px; background: var(--hover); color: var(--faint); font-size: 13px; letter-spacing: 2px; cursor: pointer; user-select: none; line-height: 1.4; }
  .qdots:hover { color: var(--ink); }
  .qdots.on { background: var(--sel-bg); }
  .replybar { display: flex; align-items: center; gap: 10px; margin: 10px 16px 14px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--faint); cursor: pointer; }
  .replybar:hover { border-color: var(--blue); color: var(--blue); }
  .td-quick { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .qbtn { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .qbtn:hover, .qbtn.on { border-color: var(--blue); color: var(--blue); }
  .btn { background: var(--blue); color: #fff; border-radius: 9px; padding: 8px 16px; font-weight: 600; }
  .btn.sec2 { background: var(--chip-bg); color: var(--ink); }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- E115/E116: todo & goal places (containers as destinations) ---------- */
  .tp-title { width: 100%; font-size: 19px; font-weight: 700; border: none; background: none; color: var(--ink); padding: 6px 0 2px; }
  .tp-title:focus { outline: none; box-shadow: inset 0 -2px 0 var(--blue); }
  .tp-notes { width: 100%; min-height: 58px; border: 1px solid var(--line); border-radius: 9px; background: var(--input-bg); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; margin-top: 4px; }
  .todo-bar { display: flex; align-items: center; gap: 8px; margin: 8px 16px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .todo-bar b { color: var(--ink); cursor: pointer; }
  .todo-bar b:hover { color: var(--blue); }
  /* E117: the All-goals page — cards in a grid, grouped by project */
  .goals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin: 4px 12px 14px; }
  .goals-grid .goal-card { flex: none; }
  .goal-card .gc-d { color: var(--muted); font-size: 12px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .goal-card .gc-pin { float: right; cursor: pointer; color: var(--faint); font-size: 14px; padding: 0 0 2px 6px; }
  .goal-card .gc-pin:hover { color: var(--amber); }
  .goal-card .gc-pin.on { color: var(--amber); }
  /* E134: scratch pads + braindump */
  .sp-wrap { margin-top: 8px; }
  .sp-head { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); font-weight: 700; display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
  .sp-pad { min-height: 44px; }
  .bd-text { width: 100%; min-height: 84px; border: none; background: none; color: var(--ink); font: inherit; font-size: 12.5px; resize: vertical; }
  .bd-text:focus { outline: none; }
  .bd-text:disabled { color: var(--muted); }
  /* ideas deserve elbow room — the braindump grid grows with the screen */
  .bd-grid { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  @media (min-width: 1400px) {
    .bd-grid { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
    .bd-grid .wiz-tile { padding: 15px 17px; }
    .bd-grid .bd-text { min-height: 150px; font-size: 13.5px; line-height: 1.5; }
  }

  /* ---------- dock ---------- */
  .dockbar { flex: 0 0 46px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; }
  .dockbar .dk { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .dockbar .dk.on { background: var(--card); box-shadow: 0 1px 3px rgba(20,30,50,.1); color: var(--blue); }
  .dock { flex: 0 0 320px; margin-left: 4px; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden; }
  .dock.open { display: flex; }
  .dock h3 { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); padding: 14px 16px 6px; display: flex; align-items: center; gap: 8px; }
  .dock h3 .sp { flex: 1; }
  .dock .dbody { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
  .cal-ev { display: flex; gap: 10px; padding: 6px 4px; align-items: flex-start; }
  /* E70: expandable calendar items + dock note */
  .cal-ev.clickable { cursor: pointer; border-radius: 8px; }
  .cal-ev.clickable:hover { background: var(--hover); }
  .cal-ev .fold { color: var(--faint); font-size: 11px; padding-top: 2px; }
  .cal-loc { color: var(--faint); font-size: 11px; }
  .cal-detail {
    margin: 2px 8px 8px 56px; padding: 8px 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; font-size: 12px;
    display: flex; flex-direction: column; gap: 5px; overflow-wrap: break-word;
  }
  .cal-detail a, .mb a { word-break: break-all; }
  .dock-note { border: 1px solid var(--note-line); background: var(--note-bg); border-radius: 10px; padding: 8px 10px; margin: 4px 2px 10px; }
  .dock-note .dn-head { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--note-head); font-weight: 700; display: flex; }
  #dk-dn, #cv-dn { width: 100%; border: none; outline: none; background: none; resize: vertical; min-height: 54px; margin-top: 4px; font: 12.5px/1.5 -apple-system, sans-serif; color: var(--note-ink); }
  .cal-ev .bar { width: 4px; border-radius: 2px; align-self: stretch; }
  .cal-ev .tm { color: var(--faint); font-size: 11.5px; width: 42px; flex: 0 0 auto; padding-top: 1px; }
  .cal-ev .tt { font-size: 12.5px; }
  /* ---------- E125: right-click context menu ---------- */
  .ctx { position: fixed; z-index: 300; min-width: 200px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow), var(--glow); padding: 5px; display: none; }
  .ctx.open { display: block; }
  .ctx button { display: flex; width: 100%; text-align: left; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 12.5px; color: var(--ink); align-items: center; }
  .ctx button:hover { background: var(--hover); }
  .ctx button.warn { color: var(--red); }
  .ctx hr { border: none; border-top: 1px solid var(--line-soft); margin: 4px 6px; }
  .ctx .ctx-inline { display: flex; gap: 4px; padding: 4px 8px; align-items: center; }
  .ctx .ctx-inline span { font-size: 11px; color: var(--faint); margin-right: 2px; }

  .dk-add { width: calc(100% - 12px); margin: 2px 6px 8px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--input-bg); color: var(--ink); font-size: 12.5px; }
  .dk-add:focus { outline: none; border-color: var(--blue); }
  .dk-done { color: var(--muted); font-size: 13px; flex: 0 0 auto; padding: 0; line-height: 1.35; }
  .dk-done:hover { color: var(--green); }
  .dk-row { padding: 8px 6px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .dk-row.clickable { cursor: pointer; border-radius: 8px; }
  .dk-row.clickable:hover { background: var(--hover); }
  .dk-row .w { font-weight: 600; }
  .dk-row .m { color: var(--faint); font-size: 11.5px; margin-top: 1px; }
  .nudge { color: var(--blue); border: 1px solid var(--line); border-radius: 7px; padding: 2px 9px; font-size: 11.5px; }
  .nudge.sent { color: var(--green); border-color: var(--green); }
  /* E82: attachment chips (received + composing) */
  .matts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .att { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--muted);
    background: var(--panel); text-decoration: none; max-width: 100%; }
  .att span { color: var(--faint); font-size: 10.5px; }
  .att:hover { border-color: var(--blue); color: var(--blue); }
  /* E76: dock day-nav + full-page month calendar */
  .cal-monsel { border: 1px solid var(--line); border-radius: 7px; font-size: 11px; padding: 2px 2px; color: var(--muted); max-width: 82px; background: var(--input-bg); }
  .dock h3 .cal-nav { padding: 2px 5px; font-size: 12px; }
  .dk-x { display: none; }
  @media (max-width: 980px) {
    .dk-x { display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px;
      font-size: 14px; color: var(--muted); margin-right: 4px; flex: 0 0 auto; }
  }
  .ovl.cal-wide { width: min(1180px, 96vw); height: 88vh; }
  .cv-wrap { display: flex; flex: 1; min-height: 0; padding: 0 18px 18px 24px; gap: 14px; }
  .cv-dow { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 0 0 4px; text-align: center; }
  .cv-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; border-top: 1px solid var(--line); border-left: 1px solid var(--line); overflow-y: auto; }
  .cv-cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px 4px; font-size: 11px; cursor: pointer; overflow: hidden; min-height: 76px; }
  .cv-cell:hover { background: var(--hover); }
  .cv-cell.out { background: var(--cell-out); color: var(--faint); }
  .cv-cell.sel { outline: 2px solid var(--blue); outline-offset: -2px; }
  .cv-d { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; border-radius: 50%; }
  .cv-d.today { background: var(--blue); color: #fff; }
  .cv-ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .cv-ev span { color: var(--faint); font-size: 10px; }
  .cv-more { color: var(--faint); font-size: 10px; }
  .cv-note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--note-head); background: var(--note-bg); border: 1px solid var(--note-line); border-radius: 5px; padding: 0 4px; margin-top: 2px; font-size: 10.5px; }
  .cv-side { flex: 0 0 320px; border-left: 1px solid var(--line); padding: 10px 0 6px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .cv-side .cal-detail { margin: 4px 0 2px; }
  @media (max-width: 900px) { .cv-side { display: none; } }

  /* ---------- ask dock ---------- */
  .ask-log { flex: 1; overflow-y: auto; padding: 4px 14px 10px; font-size: 13px; }
  .ask-turn { margin: 10px 0; }
  .ask-turn.you { text-align: right; }
  .ask-turn.you .bub { background: var(--blue-soft); color: var(--ink); }
  .ask-turn .bub { display: inline-block; text-align: left; background: var(--hover); border-radius: 12px; padding: 8px 12px; max-width: 92%; white-space: pre-wrap; overflow-wrap: break-word; }
  .ask-form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .ask-form textarea { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; resize: none; height: 60px; background: var(--input-bg); color: var(--ink); }
  .ask-opts { display: flex; gap: 6px; padding: 0 14px 8px; font-size: 11.5px; color: var(--faint); align-items: center; }
  .ask-opts select { border: 1px solid var(--line); border-radius: 7px; padding: 2px 5px; font-size: 11.5px; background: var(--input-bg); color: var(--muted); }

  /* ---------- overlays & dialogs ---------- */
  .ovl-back { position: fixed; inset: 0; background: rgba(25,32,45,.35); display: none; align-items: flex-start; justify-content: center; padding: 5vh 4vw; z-index: 70; overflow-y: auto; }
  .ovl-back.open { display: flex; }
  .ovl { background: var(--card); border-radius: 16px; box-shadow: 0 24px 70px rgba(15,25,40,.35); width: min(880px, 94vw); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .ovl .x { position: absolute; top: 14px; right: 16px; font-size: 17px; color: var(--faint); z-index: 2; }
  .ovl-head { padding: 20px 24px 6px; }
  .ovl-head .kind { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .ovl-head h2 { font-size: 19px; margin-top: 3px; }
  .ovl-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .ovl-stats { display: flex; gap: 10px; padding: 12px 24px; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .stat b { font-size: 16px; display: block; }
  .stat span { color: var(--faint); font-size: 11px; }
  .ovl-list { flex: 1; overflow-y: auto; padding: 0 14px 20px; }
  .ovl-sec { margin: 6px 8px 14px; }
  .ovl-sec h4 { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 10px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .ovl-status { padding: 4px; }
  .ovl-prog { display: flex; align-items: center; gap: 12px; }
  .ovl-prog input[type=range] { flex: 1; accent-color: var(--blue); }
  .ovl-prog b { min-width: 44px; text-align: right; }
  .ovl-note { color: var(--muted); font-size: 12.5px; margin-top: 6px; font-style: italic; }
  .ovl-note span { font-style: normal; color: var(--faint); font-size: 11px; }

  .dlg-back { position: fixed; inset: 0; background: rgba(25,32,45,.4); display: none; align-items: center; justify-content: center; z-index: 90; padding: 4vh 4vw; }
  .dlg-back.open { display: flex; }
  .dlg { background: var(--card); border-radius: 14px; box-shadow: 0 24px 70px rgba(15,25,40,.4); width: min(560px, 94vw); max-height: 88vh; overflow-y: auto; padding: 20px 22px; }
  .dlg h3 { font-size: 15px; margin-bottom: 12px; }
  .dlg label { display: block; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin: 12px 0 4px; font-weight: 700; }
  .dlg input[type=text], .dlg input[type=email], .dlg input[type=date], .dlg input[type=datetime-local], .dlg textarea, .dlg select { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--input-bg); }
  .dlg textarea { min-height: 110px; resize: vertical; }
  .dlg .foot { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .dlg .status { font-size: 12px; color: var(--muted); flex: 1; }
  .dlg .status.err { color: var(--red); }
  .snz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .snz-grid .qbtn { padding: 10px; text-align: center; }
  /* E83: snooze mini calendar */
  .snz-cal { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .snz-cal-h { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
  .snz-dow, .snz-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .snz-dow div { font-size: 10px; color: var(--faint); font-weight: 700; padding: 2px 0; }
  .snz-day { padding: 5px 0; font-size: 12px; border-radius: 7px; cursor: pointer; }
  .snz-day:hover { background: var(--blue-soft); color: var(--blue); }
  .snz-day.out { color: var(--faint); opacity: .55; }
  .snz-day.past { color: var(--faint); opacity: .3; cursor: default; pointer-events: none; }
  .snz-day.today { outline: 1px solid var(--blue); outline-offset: -1px; }

  /* ---------- misc ---------- */
  .toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #22304a; color: #fff; padding: 9px 18px; border-radius: 10px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 120; max-width: 80vw; }
  /* E74: undo bar — the action is held for a few seconds */
  #undobar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 130;
    display: flex; align-items: center; gap: 12px; background: #22304a; color: #fff;
    border-radius: 12px; padding: 11px 18px; font-size: 13px; box-shadow: 0 10px 30px rgba(15,25,40,.4); overflow: hidden; }
  /* display:flex beats the hidden attribute's UA display:none — restate it */
  #undobar[hidden] { display: none; }
  #undobar button { color: #ffd479; font-weight: 700; font-size: 13px; }
  #undobar button:hover { text-decoration: underline; }
  #undo-tick { position: absolute; left: 0; bottom: 0; height: 3px; background: #ffd479; animation: undotick 6s linear forwards; }
  @keyframes undotick { from { width: 100%; } to { width: 0; } }
  .toast.show { opacity: 1; }
  #upbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 110; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--amber); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 28px rgba(20,30,50,.25); }
  #offbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); background: #5a4a1c; color: #fff; border-radius: 9px; padding: 6px 14px; font-size: 12px; z-index: 110; }
  /* E155: tunnel-down banner — louder than #offbar because saves are failing */
  #netbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); max-width: min(92vw, 560px); background: #6e1f1f; color: #fff; border: 1px solid #b03a3a; border-radius: 9px; padding: 7px 14px; font-size: 12.5px; z-index: 135; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  #netbar.back { background: #1f5232; border-color: #2e8b57; }
  .bak-strip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; margin: 4px 0; }
  .wn-rel { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 20px; }
  .wn-rel h4 { font-size: 14px; }
  .wn-rel .m { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
  .wn-rel ol { padding-left: 18px; font-size: 12.5px; }
  /* ---------- E78: mobile — drawer nav, bottom dock bar ---------- */
  #nav-btn { display: none; font-size: 18px; color: var(--muted); padding: 6px 10px; }
  #nav-back { display: none; }
  @media (max-width: 980px) {
    .top { gap: 8px; padding: 8px 10px; flex-wrap: nowrap; }
    #nav-btn { display: block; }
    .brand { min-width: 0; }
    .search { padding: 7px 10px; min-width: 0; }
    .search .hint { display: none; }
    .top-right { gap: 4px; }
    .tbtn { padding: 7px 8px; }
    .shell { padding: 0 6px 6px; }
    /* the rail becomes a slide-in drawer under the ☰ */
    .rail {
      position: fixed; top: 0; bottom: 0; left: 0; width: min(82vw, 300px);
      z-index: 90; background: var(--card); margin: 0;
      transform: translateX(-106%); transition: transform .22s ease;
      box-shadow: 8px 0 40px rgba(0,0,0,.35);
      padding: 14px 14px calc(30px + var(--safe-bot));
    }
    body.nav-open .rail { transform: none; }
    body.nav-open #nav-back { display: block; position: fixed; inset: 0; z-index: 89; background: rgba(8,12,18,.55); }
    .pane { position: fixed; inset: 0; max-width: none; margin: 0; z-index: 70; border-radius: 0; }
    /* dock buttons become a bottom tab bar; panels open full-screen above it */
    .dockbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      flex-direction: row; justify-content: space-around; align-items: center;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 4px 10px calc(4px + var(--safe-bot));
    }
    .dock, .dock.open {
      position: fixed; left: 0; right: 0; top: 0; margin: 0; flex: none;
      bottom: calc(45px + var(--safe-bot)); z-index: 59;
    }
    .list { padding-bottom: calc(60px + var(--safe-bot)); }
    /* tab strip scrolls sideways instead of wrapping */
    .list-head { flex-wrap: nowrap; overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 10px 12px 8px; align-items: center; }
    .list-head::-webkit-scrollbar { display: none; }
    .ltab, .group-pick, .crumb { flex: 0 0 auto; white-space: nowrap; }
  }
  @media (max-width: 640px) {
    .top { gap: 5px; }
    .brand { gap: 5px; min-width: 0; }
    .brand h1 { display: none; }
    .compose .lbl { display: none; }
    .compose { padding: 7px 9px; }
    .tbtn, #nav-btn { padding: 6px 6px; }
    .avatar { width: 30px; height: 30px; flex: 0 0 auto; }
  }
  /* ================= E192: the phone pass =================
     Bart, on an iPhone: "the main views don't seem to fit on the screen and
     float around when I put my finger on it. The nav is too tight."
     Three causes: nothing capped horizontal overflow, so the shell panned
     under a finger and rubber-banded; the greeting was a flex row whose text
     column collapsed to ~120px and wrapped one word per line; and the top bar
     carried nine controls across 375pt. */
  /* ================= E200: the phone, in one place =================
     Every phone rule lives here once. Three separate .row rules and two
     .top rules had accumulated in this block, and the last one silently
     won — which is how the status-bar inset got "fixed" three times
     without changing anything. selftest now fails on a repeat. */
  @media (max-width: 760px) {
    /* 0 — E199: the inset lives in the SAME rule as the padding shorthand. E196 put it in its own rule earlier in this block, and the later `.top { padding: 8px; }
    ` reset it every time — which is why the clock kept sitting on the nav after two attempts to fix it. */ .acct-tabs { padding-top: 0; }
    .rail { padding-top: calc(10px + var(--safe-top)); }
    /* E200 — edge to edge, the way every other phone app does it: the list is the screen. Cards lose their side borders and radii and become full -bleed bands; the breathing room moves INSIDE the rows, where it helps reading, instead of outside them, where it just narrows the column. */
    .shell { padding: 0; }
    .main { padding: 0; }
    .list { padding: 0 0 calc(64px + var(--safe-bot)); }
    /* E201 — the view switcher, on its own line. The 760px block set the
       strip to nowrap but left .crumb at `flex: 1 1 100%` from the desktop
       rule, so the breadcrumb ate the whole row and pushed Todos and Starred
       off the right edge; and because .main is a column flex, `flex: 0 1 auto`
       shrank the strip to 19px while its 32px tabs spilled over the rows
       above and below. Both gone: the strip cannot shrink, it wraps into two
       lines, and only the tab row scrolls sideways. */
    .list-head { flex: none; flex-wrap: wrap; overflow: visible; row-gap: 6px; padding: 8px 12px 8px; }
    .list-head .crumb { flex: 1 1 100%; margin: 0; }
    .ltabs {
      flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; overflow-y: visible;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 8px;
    }
    .ltabs::-webkit-scrollbar { display: none; }
    .ltab { min-height: 34px; display: inline-flex; align-items: center; padding: 7px 14px; }
    /* the preview-pane toggle is a two-column idea; a phone has one column */
    .pvbtn { display: none; }
    .list-head .group-pick { margin-left: 0; font-size: 12.5px; }
    /* E201 — on a phone the title owns line 1. Chips carry fixed content, so
       in a nowrap flex line the title was the only thing that could shrink:
       todos were arriving as "B..." and "Strate..." on a 390px screen. The
       line wraps now — title first, its overdue/label/date beneath it, the
       way every phone task list does it. */
    .row .l1 { flex-wrap: wrap; row-gap: 4px; overflow: visible; }
    .row .l1 .subj.todo-title {
      flex: 1 1 100%; white-space: normal; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .row .l1 .who { flex: 1 1 auto; max-width: 62%; }
    .row .meta {
      flex: 1 1 auto; margin-left: 0; padding-left: 0;
      display: flex; align-items: center; gap: 6px; min-width: 0;
    }
    .row .meta .when { margin-left: auto; }
    .ib-wrap, .fd-wrap { max-width: 100%; padding: 0 0 10px; }
    .ib-card { border-left: none; border-right: none; border-radius: 0; margin: 0 0 10px; box-shadow: none; }
    .ib-head { padding: 14px 8px 6px; }
    .ib-head .t { font-size: 13px; letter-spacing: .8px; text-transform: uppercase; }
    .row { padding: 14px 16px; min-height: 76px; align-items: center; gap: 12px; }
    .ib-nest { padding-left: 16px; }
    .fd-chips { padding-left: 10px; padding-right: 10px; }
    .hask { margin: 10px 16px; }
    .hgreet { margin: 12px 10px 4px; flex-wrap: wrap; gap: 8px; align-items: center; }
    .plan-card, .dk-body { margin-left: 0; margin-right: 0; }
    /* the day's meetings read as one swipeable row, not a stack of chips */
    .fd-chips.cal-strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; scroll-snap-type: x proximity; }
    .fd-chips.cal-strip::-webkit-scrollbar { display: none; }
    .fd-chips.cal-strip .chip { flex: 0 0 auto; scroll-snap-align: start; }
    /* 1 — the page is exactly the viewport, and never pans sideways */
    html { background: var(--bg-grad, var(--bg)); }
    html, body { overflow-x: hidden; overscroll-behavior: none; }
    .shell, .main, .list { max-width: 100vw; min-width: 0; overflow-x: hidden; }
    .hgreet .sp { display: none; }
    /* the desktop spacer would sort first and eat the row */
    .hgreet .htrain { font-size: 22px; order: 1; }
    .hgreet > div { order: 2; flex: 1 1 auto; min-width: 0; }
    /* E200: a segmented control under the greeting, full width, the way a phone app switches between two modes of the same screen. */
    .hgreet .fd-view { order: 3; flex: 1 1 100%; margin: 8px 0 0; }
    .hgreet .fd-view button { flex: 1 1 50%; padding: 9px 0; font-size: 14px; }
    .hgreet b { font-size: 19px; }
    .hgreet span:not(.htrain) { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 3 — the nav gets room: the wordmark and the ⚑ go (⚑ lives in ⚙), and what remains is a real touch target rather than a 28px dot */
    .top { gap: 6px; padding: calc(8px + var(--safe-top)) 8px 8px; }
    .brand h1 { display: none; }
    #fb-btn { display: none; }
    /* E206: ◐ joins ⚑ in the avatar menu. Seven controls in one row left the
       search box reading "Filter th"; five give it back its width. The menu
       entries that replace them are .phone-only, so the desktop bar is
       unchanged. */
    #skin-wrap { display: none; }
    .me-menu button.phone-only { display: flex; }
    .top-right { gap: 2px; }
    .tbtn { padding: 8px 9px; font-size: 15px; }
    .acct-tab { padding: 10px 12px; font-size: 13.5px; }
    .dockbar .dk { width: 42px; height: 42px; font-size: 18px; }
    /* 3b — E196/E199: bigger type, and rows tall enough to hit. A touch device has no hover, so the action tray never appears — a long press opens the same menu instead. */
    body { font-size: 15px; }
    .row .acts { display: none !important; }
    .row .selbox { top: 50%; transform: translateY(-50%); }
    .row .who { font-size: 15px; }
    .row .l2 .subj { font-size: 14.5px; }
    .row .l3 .prev { font-size: 13.5px; }
    .scope { padding: 11px 12px; font-size: 14.5px; }
    /* 4 — the reading pane is the whole screen here, so it owes the status bar and the home indicator their space. Without this its toolbar sits under the clock and the ✕ cannot be tapped at all — there was no way back out of an email. */
    .pane { padding-top: var(--safe-top); padding-bottom: var(--safe-bot); }
    .pane-tools { position: sticky; top: 0; z-index: 6; background: var(--card); gap: 3px; padding: 8px 8px 7px; row-gap: 4px; flex-wrap: nowrap; overflow: hidden; }
    .pane-tools .tool { min-width: 40px; height: 38px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
    /* the way out is a button, not a glyph lost in a row of them */
    .pane-tools .tool:first-child { border: 1px solid var(--line); border-radius: var(--r, 9px); padding: 0 12px; font-weight: 700; color: var(--ink); }
    .pane-head h2 { font-size: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pane-tools .tool.hide-sm { display: none; }
    .pane-tools .tool.only-sm { display: inline-flex; margin-left: auto; }
    .pane-note.empty-note { display: inline-flex; width: auto; padding: 4px 10px; font-size: 12.5px; opacity: .75; }
    .ai-line { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ai-line.open { -webkit-line-clamp: unset; }
    .replybar { padding-bottom: calc(8px + var(--safe-bot)); gap: 6px; }
    .replybar .qbtn { padding: 8px 12px; }
    .row .l1 .chip.lbl { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    .row .hl { gap: 4px; margin-left: 0; padding-left: 0; }
    .row .hl .chip { max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
    .row .lead, .row .selbox { width: 30px; height: 30px; }
  }


  /* ================= E204: Shortwave fidelity =================
     Bart, from a dozen Shortwave screenshots: "how tight the UI is, but how
     much information is visually conveyed… the buttons and actions aren't
     obtrusive, you don't see them until you interact… a thin line dividing
     the different sections." So: no cards inside the list, sections named in
     small capitals over a hairline, three-line rows with the chips at the
     END of the preview line, line icons that appear only on hover, groups
     that are rows among the mail, and todos that read as containers. */
  .svg-ic { width: 18px; height: 18px; flex: 0 0 auto; display: block; }
  .svg-ic.sm { width: 15px; height: 15px; }
  .svg-ic.lg { width: 22px; height: 22px; }

  /* the list head: breadcrumb left, quiet tools right, ONE row (#15) */
  .list-head { flex-wrap: nowrap; padding: 12px 16px 6px; }
  .list-head .crumb { flex: 1 1 auto; margin: 0; min-width: 0; }
  .list-head .ltabs { display: none !important; }
  .list-head .crumb { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
  .list-head .crumb .cr { flex: 0 0 auto; }
  .list-head .crumb .cr.on { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .grp .gw { white-space: nowrap; flex: 0 0 auto; }
  .grp .gs b { min-width: 4ch; }
  .grp .g2 > span[title] { flex: 0 0 auto; }
  .row .selbox { box-shadow: 0 0 0 2px var(--hover); }
  .tp-bar .all-done { white-space: nowrap; flex: 0 0 auto; }
  textarea.tp-title { resize: none; overflow: hidden; font: inherit; font-size: 20px; font-weight: 600; line-height: 1.3; display: block; }
  .lh-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: auto; }
  .lh-btn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-flex;
    align-items: center; justify-content: center; position: relative; }
  .lh-btn:hover { background: var(--hover); color: var(--ink); }
  .lh-btn.on { color: var(--blue); }
  .lh-btn.pvbtn { margin: 0; padding: 0; font-size: inherit; }
  .stw-badge { width: auto; padding: 0 8px; gap: 5px; font-size: 12px; font-weight: 600; color: var(--note-head); }
  .stw-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .lh-fresh { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border-radius: 8px;
    color: var(--faint); font-size: 12px; white-space: nowrap; }
  .lh-fresh:hover { background: var(--hover); color: var(--ink); }
  .lh-fresh.stale { color: var(--amber); }
  .lh-fresh.busy .svg-ic { animation: gc-spin .9s linear infinite; }
  @keyframes gc-spin { to { transform: rotate(360deg); } }
  .new-pill { position: sticky; top: 6px; z-index: 5; display: flex; justify-content: center; height: 0; overflow: visible; }
  .new-pill button { background: var(--blue); color: #fff; border-radius: 999px; padding: 5px 14px; font-size: 12.5px;
    font-weight: 600; box-shadow: 0 4px 14px rgba(20,40,120,.25); transform: translateY(0); }
  .ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; color: var(--faint);
    font-size: 12px; transition: height .15s; }

  /* sections: small capitals over a hairline, no card, no gutter */
  .ib-wrap { padding: 0 0 28px; max-width: none; }
  .ib-card, html[data-skin] .ib-card { background: none; border: none; box-shadow: none; border-radius: 0; margin: 0 0 4px; overflow: visible; }
  .ib-card .row, .ib-card .ib-row { border-bottom: none; }
  .ib-head { padding: 14px 16px 6px; gap: 8px; border-top: 1px solid var(--line); }
  .ib-wrap > .ib-head:first-child, .ib-wrap > .new-pill + .ib-head, .ib-wrap > .ptr + .ib-head { border-top: none; }
  .ib-head .t, html[data-skin] .ib-head .t { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--faint); font-weight: 650; }
  .ib-head .ib-count { background: var(--chip-bg); color: var(--muted); border-radius: 5px; padding: 0 6px; font-size: 11px; }
  .ib-head .fold, .ib-head .ib-sweep { color: var(--faint); cursor: pointer; width: 26px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 6px; padding: 0; }
  .ib-head .fold:hover, .ib-head .ib-sweep:hover { background: var(--hover); color: var(--ink); }
  .go-all { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); font-size: 13px; padding: 6px 16px 10px;
    cursor: pointer; font-weight: 500; }
  .go-all:hover { text-decoration: underline; }

  /* the row: 40px squircle, three lines, chips at the end of line three */
  .row { --row-pad: 10px; padding: var(--row-pad) 16px; gap: 14px; border-radius: 0; }
  .row .lead { width: 40px; height: 40px; border-radius: 10px; font-size: 14px; }
  .row .selbox { left: 16px; width: 40px; height: 40px; border-radius: 10px; }
  .row.open { background: var(--sel-bg, var(--blue-soft)); box-shadow: inset 3px 0 0 var(--blue); }
  .row.kb { outline: none; box-shadow: inset 3px 0 0 var(--blue); }
  .row:not(.read)::before { left: 4px; width: 5px; height: 5px; box-shadow: none; }
  .row .who { font-size: 14px; font-weight: 700; }
  .row.read .who { font-weight: 500; color: var(--ink); }
  .row .subj { font-size: 14px; font-weight: 650; }
  .row.read .subj { color: var(--ink); font-weight: 400; }
  .row .l2 { margin-top: 1px; }
  .row .l3 { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
  .row .l3 .prev { flex: 1 1 auto; min-width: 0; font-size: 13.5px; color: var(--faint); }
  .row .when { font-size: 12.5px; }
  .row:not(.read) .when { color: var(--ink); font-weight: 650; }
  .row .meta { gap: 6px; }
  .row .l1 .meta { margin-left: auto; padding-left: 10px; }
  .row .hl { display: none; }
  .tail { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; color: var(--faint); }
  .tail .chip { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .tail .st { color: var(--amber); display: inline-flex; }
  .tail .owed { color: var(--red); font-size: 11.5px; font-weight: 600; }
  .tail .snz { color: var(--blue); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
  body.pane-open .tail .chip { max-width: 90px; }
  /* hover: the time gives way to line icons — no box, no shadow */
  .row .acts { top: var(--row-pad); transform: none; right: 10px; background: var(--hover); border: none; box-shadow: none;
    border-radius: 8px; padding: 0 2px; gap: 0; }
  .row.open .acts { background: var(--sel-bg, var(--blue-soft)); }
  .row .acts button { width: 30px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); border-radius: 6px; }
  .row .acts button:hover { background: var(--chip-bg); color: var(--ink); }
  .row .acts button.warn:hover { background: var(--red-soft); color: var(--red); }

  /* a group is a row: icon, name + count, the senders who matter by name,
     everyone else as a face */
  .grp { display: flex; align-items: flex-start; gap: 14px; padding: 10px 16px; cursor: pointer; position: relative; }
  .grp:hover { background: var(--hover); }
  .grp.open { background: var(--sel-bg, var(--blue-soft)); box-shadow: inset 3px 0 0 var(--blue); }
  .grp .gic { width: 40px; height: 40px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .grp .gb { flex: 1 1 auto; min-width: 0; }
  .grp .g1 { display: flex; align-items: center; gap: 8px; }
  .grp .gname { font-size: 14px; font-weight: 700; }
  .grp.read .gname { font-weight: 500; }

    box-shadow: 0 1px 2px rgba(60,64,67,.20), 0 1px 3px 1px rgba(60,64,67,.10); border-color: transparent;
  }
  html[data-skin="inbox"] .row { border-radius: 0; }
  html[data-skin="inbox"] .btn { background: #4285f4; border-radius: 2px; font-weight: 500; }
  html[data-skin="inbox"] .qbtn, html[data-skin="inbox"] .btn.sec2 { border-radius: 2px; }
  html[data-skin="inbox"] .sec { color: var(--muted); font-size: 12px; letter-spacing: .2px; text-transform: none; font-weight: 500; }

  /* ============ E203: the insets have the last word ============
     This is the real reason the status bar kept sitting on the nav through
     E187, E196, E199 and E200. Every fix went into the phone media block —
     but a skin's `.top { padding: 8px 16px }` is written AFTER that block at
     equal specificity, so it reset padding-top every time. Bart runs the
     Inbox skin (#4285f4), whose rule is the very last word in the file.
     These rules come after all of them, so nothing can quietly win again,
     and uitest.py forces --safe-top/--safe-bot and asserts it per skin. */
  @media (max-width: 760px) {
    html .top, html[data-skin] .top { padding-top: calc(8px + var(--safe-top)); }
    html .dockbar, html[data-skin] .dockbar { padding-bottom: calc(4px + var(--safe-bot)); }
    html .rail, html[data-skin] .rail { padding-top: calc(10px + var(--safe-top)); }
  }
  /* E208: same trap, different property. Below 980px the rail is the ☰
     drawer, floating over the list — but Shortwave's `.rail { background:
     transparent }` and Daylight's 66% frosted glass are written after the
     phone block, so the drawer went see-through and the list read through
     the menu. On the desktop the rail sits on the page ground, where those
     looks are right; as an overlay it must be solid. */
  @media (max-width: 980px) {
    html .rail, html[data-skin] .rail {
      background: var(--card);
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
  }
</style>
<script>
/* E77: apply the saved skin before first paint (default: 2049). */
document.documentElement.dataset.skin = localStorage.getItem('gc2_skin') || '2049';
/* E187: standalone (Add to Dock / Add to Home Screen) gets its own class so
   the chrome can inset itself around the notch. */
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)
  document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('app-mode'));
/* E114: apply the saved rail state (slim icon strip) before first paint. */
document.documentElement.dataset.rail = localStorage.getItem('gc2_rail') || '';
/* E203 — the app is exactly as tall as the window says it is.
   Bart's screenshot: the board painted to 100dvh and stopped ~77px short of
   the bottom, with the phone's own grey showing beneath the dock bar. iOS
   hands a standalone web app a viewport that can disagree with the screen
   after a keyboard, a rotation or a cold start, and dvh follows the wrong
   one. Measuring window.innerHeight is the only number that is always the
   truth. innerHeight, NOT visualViewport.height — the latter shrinks with
   the keyboard, which would collapse the layout mid-typing.
   scrollTo(0,0) undoes the other half of the same symptom: iOS scrolling the
   whole app up to reveal a field and never putting it back. */
function syncAppHeight(){
  const h = window.innerHeight;
  if (!h) return;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  document.documentElement.classList.add('has-apph');
  if (window.scrollY || window.pageYOffset) window.scrollTo(0, 0);
}
syncAppHeight();
['resize','orientationchange','pageshow','focusout'].forEach(
  ev => window.addEventListener(ev, () => setTimeout(syncAppHeight, 60)));
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncAppHeight(); });

/* E206 — viewport diagnostics, on demand only (?diag=1).
   The bottom gap has been fixed six times and keeps returning, because it
   only reproduces in the installed iOS app while uitest.py's headless Chrome
   passes every check. Rather than guess a seventh time, the phone reports
   what it actually measured. Reads values and draws an overlay; it never
   changes layout. Sampled repeatedly because the suspicion is that
   syncAppHeight() latches a provisional innerHeight during head parse and
   the real value only settles after first paint. */
/* The installed app always cold-starts at "/", so a ?diag=1 link can never
   reach the one environment where the bug actually happens. The flag persists
   in localStorage too, set from the avatar menu, so diagnostics can be armed
   inside the installed app and survive the relaunch that reproduces it. */
if (location.search.indexOf('diag=1') >= 0 || localStorage.getItem('gc2_diag') === '1') {
  const samples = [];
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100dvh;pointer-events:none;visibility:hidden';
  const read = (label) => {
    const cs = getComputedStyle(document.documentElement);
    const vv = window.visualViewport;
    const s = {
      at: label,
      t: Math.round(performance.now()),
      innerH: window.innerHeight,
      clientH: document.documentElement.clientHeight,
      screenH: window.screen && window.screen.height,
      availH: window.screen && window.screen.availHeight,
      vvH: vv ? Math.round(vv.height) : null,
      vvTop: vv ? Math.round(vv.offsetTop) : null,
      dvh: probe.isConnected ? Math.round(probe.getBoundingClientRect().height) : null,
      appH: cs.getPropertyValue('--app-h').trim(),
      hasApph: document.documentElement.classList.contains('has-apph'),
      safeTop: cs.getPropertyValue('--safe-top').trim(),
      safeBot: cs.getPropertyValue('--safe-bot').trim(),
      bodyH: Math.round(document.body.getBoundingClientRect().height),
      standalone: !!(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone),
      dpr: window.devicePixelRatio,
      skin: document.documentElement.dataset.skin
    };
    // the number that matters: unpainted strip under the app
    s.gapVsScreen = (s.screenH || 0) - s.bodyH;
    s.gapVsInner = s.innerH - s.bodyH;
    samples.push(s);
    return s;
  };
  const paint = () => {
    let box = document.getElementById('diag-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'diag-box';
      box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;'
        + 'background:#000;color:#0f0;font:11px/1.35 ui-monospace,Menlo,monospace;'
        + 'padding:10px;border-radius:8px;max-height:52vh;overflow:auto;white-space:pre-wrap';
      document.body.appendChild(box);
    }
    const last = samples[samples.length - 1];
    box.textContent =
      'VIEWPORT DIAG (E206)\n'
      + samples.map(s => `${s.at.padEnd(11)} t=${String(s.t).padStart(5)} inner=${s.innerH} `
          + `dvh=${s.dvh} body=${s.bodyH} --app-h=${s.appH || '-'} gap=${s.gapVsInner}`).join('\n')
      + `\n\nscreen=${last.screenH} avail=${last.availH} client=${last.clientH}`
      + `\nvisualViewport=${last.vvH} top=${last.vvTop}`
      + `\nsafe-top=${last.safeTop} safe-bot=${last.safeBot}`
      + `\nstandalone=${last.standalone} dpr=${last.dpr} skin=${last.skin}`
      + `\ngap vs screen=${last.gapVsScreen}  gap vs inner=${last.gapVsInner}`;
    let btn = document.getElementById('diag-send');
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'diag-send';
      btn.textContent = 'Send to Grand Central';
      btn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#0f0;color:#000;'
        + 'border-radius:6px;font:600 12px system-ui;width:100%';
      btn.onclick = () => {
        btn.textContent = 'sending…';
        fetch('/diag', {method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({samples: samples, ua: navigator.userAgent})})
          .then(r => r.json())
          .then(j => { btn.textContent = j.ok ? '✓ sent — tell Claude to read it' : 'failed: ' + (j.error||''); })
          .catch(e => { btn.textContent = 'failed: ' + e; });
      };
      box.appendChild(btn);
    } else { box.appendChild(btn); }
  };
  const sample = (label) => { read(label); paint(); };
  document.addEventListener('DOMContentLoaded', () => {
    document.body.appendChild(probe);
    sample('domready');
  });
  window.addEventListener('load', () => sample('load'));
  [100, 400, 1000, 2500].forEach(ms => setTimeout(() => sample('t+' + ms), ms));
  window.addEventListener('orientationchange', () => setTimeout(() => sample('rotate'), 300));
}
</script>
</head>
